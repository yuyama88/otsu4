const V=n=>({t:'v',n}), N=a=>({t:'n',a}), A=(...xs)=>({t:'a',xs}), O=(...xs)=>({t:'o',xs}), I=(a,b)=>({t:'i',a,b});
function ev(e,m){switch(e.t){case'v':return !!(m&(1<<e.n));case'n':return !ev(e.a,m);case'a':return e.xs.every(x=>ev(x,m));case'o':return e.xs.some(x=>ev(x,m));case'i':return !ev(e.a,m)||ev(e.b,m);default:throw Error('Invalid expression');}}
function models(n,conds){const r=[];for(let m=0;m<(1<<n);m++)if(conds.every(c=>ev(c,m)))r.push(m);return r;}
function entails(n,conds,e){return models(n,conds).every(m=>ev(e,m));}
function witness(n,conds,e){return models(n,conds).find(m=>!ev(e,m));}
function validQuestion(q){
 if(!q.logic)return true;
 const c=q.logic,n=c.names.length,ms=models(n,c.premises);
 if(!ms.length)throw Error(q.id+': inconsistent premises');
 let truth;
 if(c.goal){truth=c.options.map(o=>{const all=models(n,[...c.premises,o]);return all.length>0&&all.every(m=>ev(c.goal,m));});}
 else if(c.kind==='exist'){
  const witnessTypes=ms.filter(m=>ev(c.exist,m));
  if(!witnessTypes.length)throw Error(q.id+': impossible witness');
  truth=c.options.map(o=>o.t==='i'?ms.every(m=>ev(o,m)):witnessTypes.every(m=>ev(o,m)));
 }else truth=c.options.map(o=>ms.every(m=>ev(o,m)));
 const expected=truth.map((v,i)=>v?i:-1).filter(i=>i>=0);
 if(expected.length!==1||expected[0]!==q.answer)throw Error(q.id+': non-unique '+expected);
 return true;
}
function uniqueOptions(n,premises,options){let ms=models(n,premises);return options.map(o=>ms.every(m=>ev(o,m))).filter(Boolean).length===1;}
const API={V,N,A,O,I,ev,models,entails,witness,validQuestion,uniqueOptions};

function renderReview(){const st=allStats();let pool=Q.filter(q=>{const p=progressFor(q.id);return p&&(reviewFilter==='due'?p.due<=Date.now():reviewFilter==='weak'?p.weak:true);});return `<div class="hero"><div class="eyebrow">復習エンジン</div><h1>忘れる前に、もう一度。</h1><p class="lead">間違い・勘で正解・ヒント使用の問題を区別して記録。ヒントなしで安定して解けるまで復習します。</p><div class="row">${badge('期限到来 '+st.due+'問','blue')}${badge('苦手 '+st.weak+'問','orange')}</div></div><div class="row" style="margin-bottom:16px">${[['due','期限が来た問題'],['weak','苦手問題'],['allreview','解答済みすべて']].map(([k,t])=>`<button class="pillbutton ${reviewFilter===k?'active':''}" data-action="reviewFilter" data-value="${k}">${t}</button>`).join('')}</div>${pool.length?card(`<h2>${pool.length}問が対象</h2><p class="sub">問題はランダムに並びます。復習でも正解を覚えるだけでなく、解法を説明できるか確認しましょう。</p><div class="actions">${btn('startReview','10問復習する','primary',`data-count="10"`)}${btn('startReview','対象をすべて復習','',`data-count="all"`)}</div>`):card('<div class="empty"><div class="symbol">✓</div><h3>該当する復習問題はありません</h3><p class="sub">新しい問題を解くか、他の復習条件を選んでください。</p></div>')}<div class="sectionhead"><h2>復習の仕組み</h2></div>${card(`<p class="sub">ヒントなし・自信ありの正解で復習段階が進みます。復習間隔は1日→3日→7日→14日→30日。間違い、ヒント使用、勘で正解した場合は翌日が次の復習期限になります。苦手フラグは、自力で2回連続正解すると解除されます。</p><div class="callout warn">学習間隔はアプリ独自の目安であり、合格や記憶の定着を保証するものではありません。試験直前は実際の問題演習も併用してください。</div>`)}`;}
function renderSession(){const s=state.active;if(!s)return renderHome();const item=s.items[s.index],q=qmap.get(item.id),graded=s.mode==='practice'&&item.answered;const choice=item.chosen===null?null:item.order[item.chosen];const correctIndex=item.order.indexOf(q.answer);let html=`<div class="progresshead"><div><div class="eyebrow">${s.mode==='mock'?'模擬演習':'問題演習'} · ${esc(sectionName(q.section))}</div><div class="sub">問題 ${s.index+1} / ${s.items.length}　${levelName(q.level)}</div></div><div class="row"><span id="timer" class="timer">00:00</span>${s.mode==='practice'?btn('pause',s.paused?'再開':'一時停止','sm'):''}</div></div><div class="bar" style="margin-bottom:20px"><span style="width:${(s.index+1)/s.items.length*100}%"></span></div>`;
 if(s.paused)return html+card(`<div class="empty"><div class="symbol">Ⅱ</div><h2>演習を一時停止中</h2><p class="sub">一時停止中は経過時間を加算しません。</p>${btn('pause','演習を再開','primary')}</div>`);

 if(!graded){html+=`<div style="margin-top:16px">${s.mode==='practice'?`<label class="checkline"><input type="checkbox" id="unsure" data-action="unsure" ${item.unsure?'checked':''}> <span>自信がない・勘で選んだ<br><span class="sub">正解しても復習対象として記録します。</span></span></label>${item.hint?`<div class="callout warn"><strong>ヒント</strong><br>${esc(q.hint)}</div>`:btn('hint','ヒントを見る','sm')}`:''}</div><div class="actions">${btn('submitAnswer',s.mode==='mock'?'解答を記録':'回答する','primary',item.chosen===null?'disabled':'')}${s.mode==='mock'?btn('finishSession','採点して終了','') :btn('saveExit','ホームへ戻る','')}</div>`;

 }else{html+=`<div class="feedback"><div class="callout ${item.correct?'good':'bad'}"><div class="feedback-title">${item.correct?'正解！':'不正解'}</div><p>正解は ${correctIndex+1}番：${esc(q.options[q.answer])}</p></div><div class="explain"><strong>解き方</strong><br>${esc(q.why)}</div>${renderLogicDetails(q,choice)}<div class="divider"></div><label class="checkline"><input type="checkbox" data-action="unsure" ${item.unsure?'checked':''}><span>自信がない・勘で正解した<br><span class="sub">復習対象にする場合はチェックしてください。</span></span></label><div class="row">${badge(item.correct&&!item.hint&&!item.unsure?'自力で正解・復習段階が進みました':'復習対象として記録済み',item.correct&&!item.hint&&!item.unsure?'green':'orange')}</div><div class="actions">${btn('nextQuestion',s.index===s.items.length-1?'結果を見る':'次の問題へ →','primary')}${btn('saveExit','ホームへ戻る')}</div></div>`;}
 return html+'</div><p class="notice" style="margin-top:14px">演習状態と解答履歴は自動保存されます。ページを閉じても続きから再開できます。</p>';

function logicDetailsContent(q,chosen){const c=q.logic;if(!c)return '';const ms=models(c.names.length,c.premises);let allowed=ms,wrong=null,explain='';if(c.kind==='exist'){const witnessTypes=ms.filter(m=>ev(c.exist,m));if(chosen!==null&&chosen!==q.answer){const opt=c.options[chosen];wrong=(opt.t==='i'?ms:witnessTypes).find(m=>!ev(opt,m));}explain='全称条件を満たす1人分の組み合わせを列挙しています。存在命題は、少なくとも1人の「証人」が指定された領域にいることを保証します。表の○は該当、×は非該当です。';}else if(c.goal){if(chosen!==null){allowed=models(c.names.length,[...c.premises,c.options[chosen]]);wrong=allowed.find(m=>!ev(c.goal,m));}explain='選んだ追加条件を加えたとき、目標がすべての組み合わせで成立するか確認します。';}else{if(chosen!==null&&chosen!==q.answer)wrong=ms.find(m=>!ev(c.options[chosen],m));explain='前提条件を満たす組み合わせだけを残した表です。確実にいえる選択肢は、残ったすべての行で成立します。';}
 let msg='';if(wrong!==undefined&&wrong!==null){msg=`<div class="callout bad"><strong>反例：選んだ選択肢が成立しない場合</strong><br>${c.names.map((name,j)=>esc(name)+'='+((wrong&(1<<j))?'○':'×')).join('、')}<br><span class="small">○はその条件が成り立つ、×は成り立たない状態です。前提を満たしていても、選んだ結論は保証されません。</span></div>`;}else if(chosen!==null&&chosen!==q.answer&&allowed.length===0){msg='<div class="callout warn">追加した条件自体が前提と矛盾します。矛盾から何でも導けると考えるのではなく、成立可能な条件かを確認しましょう。</div>';}
 const limit=allowed.length;const headers=c.names.map(x=>`<th>${esc(x)}</th>`).join('');const rows=allowed.map(m=>`<tr>${c.names.map((_,j)=>`<td>${m&(1<<j)?'○':'×'}</td>`).join('')}</tr>`).join('');return `<p class="sub">${esc(explain)}</p>${msg}<div class="row between" style="margin:12px 0 8px"><strong class="small">成立可能な組み合わせ</strong>${badge(limit+' / '+(1<<c.names.length)+'通り')}</div><div class="tablewrap"><table><thead><tr>${headers}</tr></thead><tbody>${rows||`<tr><td colspan="${c.names.length}">成立可能な組み合わせはありません。</td></tr>`}</tbody></table></div>${c.kind==='exist'?'<p class="notice" style="margin-top:8px">この表は1人ごとの可能な属性です。存在条件は別途少なくとも1人の存在を保証します。存在する人数や、すべての属性の組み合わせが実際に存在することまでは保証しません。</p>':''}`;}
function renderLogicDetails(q,chosen){if(!q.logic)return '';return `<details class="details" ${tableOpen?'open':''}><summary>条件表・反例でさらに確認する</summary><div class="detailbody">${logicDetailsContent(q,chosen)}</div></details>`;}
function renderResults(){const r=state.runs.find(x=>x.id===state.lastRunId)||state.runs.at(-1);if(!r)return renderRecords();const pct=r.correct/r.total*100;const unanswered=r.total-r.answered;return `<div class="hero"><div class="eyebrow">演習結果</div><h1>${r.correct} / ${r.total}問 正解</h1><p class="lead">${r.mode==='mock'?'模擬演習':'通常演習'} · ${esc(sectionName(r.section))} · ${fmtTime(r.elapsed)} · 正答率 ${Math.round(pct)}%</p><div class="bar" style="height:12px"><span style="width:${pct}%"></span></div><div class="actions">${btn('repeatRun','同じ条件で再挑戦','primary')}${btn('nav','復習へ','', 'data-value="review"')}${btn('nav','ホームへ','', 'data-value="home"')}</div></div><div class="grid3"><div class="card"><div class="metric">${r.correct}</div><div class="metric-label">正解</div></div><div class="card"><div class="metric">${r.total-r.correct}</div><div class="metric-label">不正解・未回答</div></div><div class="card"><div class="metric">${fmtTime(r.elapsed)}</div><div class="metric-label">学習時間</div></div></div>${unanswered?`<div class="callout warn">未回答 ${unanswered}問は不正解として集計しています。</div>`:''}<div class="sectionhead"><h2>解答を振り返る</h2></div><div class="stack">${r.responses.map((item,j)=>{const q=qmap.get(item.id);if(!q)return '';return `<details class="details" style="margin:0;background:var(--surface)"><summary><span class="row" style="display:inline-flex">${badge(item.correct?'正解':'不正解',item.correct?'green':'red')} <strong>第${j+1}問</strong> <span class="small">${esc(sectionName(q.section))} / ${levelName(q.level)}</span></span></summary><div class="qtext" style="font-size:14px;margin:12px 0">${esc(q.stem)}</div><div class="sub">あなたの解答：${item.omitted?'未回答':esc(q.options[item.order[item.chosen]])}</div><div class="sub">正解：${esc(q.options[q.answer])}</div><div class="explain">${esc(q.why)}</div>${item.hint||item.unsure?`<p class="sub" style="margin-top:8px">${item.hint?'ヒント使用　':''}${item.unsure?'自信なし':''}</p>`:''}${renderLogicDetails(q,item.chosen===null?null:item.order[item.chosen])}</details>`}).join('')}</div>`;}
function renderRecords(){const st=allStats();const h=state.history;return `<div class="hero"><div class="eyebrow">学習記録</div><h1>得点だけでなく、定着を確認する。</h1><p class="lead">正答率と学習回数、分野ごとの到達状況を記録します。勘で正解した問題は、自力で正解した問題と区別されます。</p></div><div class="grid3"><div class="card"><div class="metric">${st.attempts}</div><div class="metric-label">累計解答数</div></div><div class="card"><div class="metric">${formatPct(st.correct,st.attempts)}</div><div class="metric-label">正答率</div></div><div class="card"><div class="metric">${st.solved}/${Q.length}</div><div class="metric-label">異なる問題の学習数</div></div></div><div class="sectionhead"><h2>分野別の正答率</h2></div>${card(LESSONS.map(s=>{const a=h.filter(x=>qmap.get(x.id)?.section===s.id),correct=a.filter(x=>x.correct).length;return `<div class="meterrow"><span class="small">${esc(s.title)}</span><div class="bar"><span style="width:${a.length?correct/a.length*100:0}%"></span></div><span class="small" style="text-align:right">${formatPct(correct,a.length)}</span></div><p class="notice" style="margin-top:12px">同じ問題の再解答も含む累計正答率です。実試験の合格判定ではありません。</p>`}).join(''))}<div class="sectionhead"><h2>学習済みの問題</h2><span class="sub">${st.solved}問</span></div>${card(`<div class="row between"><span class="sub">問題バンクの学習進度</span><strong>${st.solved}/${Q.length}</strong></div><div class="bar" style="margin-top:10px"><span style="width:${st.solved/Q.length*100}%"></span></div><div class="divider"></div><div class="grid2"><div><div class="metric">${h.filter(x=>x.clean).length}</div><div class="metric-label">ヒントなし・自信ありの正解</div></div><div><div class="metric">${st.weak}</div><div class="metric-label">復習が必要な苦手問題</div></div></div>`) }<div class="sectionhead"><h2>最近の演習</h2></div>${state.runs.length?card(state.runs.slice(-12).reverse().map(r=>`<div class="runrow"><div class="grow"><strong>${r.mode==='mock'?'模擬演習':'問題演習'}</strong><div class="sub">${esc(sectionName(r.section))} · ${fmtDate(r.finished)} · ${fmtTime(r.elapsed)}</div></div><div class="row">${badge(r.correct+'/'+r.total,'blue')}${btn('showRun','詳細','sm',`data-id="${r.id}"`)}</div></div>`).join('')):card('<div class="empty"><p class="sub">まだ演習記録がありません。</p></div>')}`;}
function renderSettings(){return `<div class="hero"><div class="eyebrow">設定とデータ管理</div><h1>学習データを、自分で守る。</h1><p class="lead">記録はこのブラウザのローカルストレージに保存されます。サーバーへの送信やアカウント登録はありません。</p></div>${card(`<h2>バックアップ・復元</h2><p class="sub">JSONファイルには学習履歴、復習段階、途中の演習が含まれます。機種変更やブラウザデータ削除に備えて、定期的に保存してください。</p><div class="actions">${btn('export','JSONバックアップを保存','primary')}${btn('import','JSONを読み込む')}</div><input id="importFile" class="sr-only" type="file" accept=".json,application/json"><div class="callout warn">復元すると、このブラウザの現在の学習データをバックアップの内容で置き換えます。復元前にもバックアップを保存することをおすすめします。</div><p class="notice">Safariのプライベートブラウズ、閲覧データの削除、アプリ内ブラウザと通常Safariの違いなどにより、保存領域が別になったり消えたりする場合があります。GitHub PagesへのHTMLの上書きだけでは、別端末の記録は同期されません。</p>`) }<div class="sectionhead"><h2>教材と収録範囲</h2></div>${card(`<h3>第1版：判断推理・論理</h3><p class="sub">参考資料：資格の大原 公務員講座『数的処理BⅠ（判断推理）』第1章 論理、教材p.3〜21。第1節「対偶と三段論法」、第2節「ド・モルガンの法則」、第3節「論理と集合」の順に構成しています。</p><div class="divider"></div><p class="sub">収録問題は学習用のオリジナル問題です。教材の過去問・解説文・図を丸ごと複製したものではありません。条件を組み合わせる応用問題は真理値の全組み合わせを使って正解の一意性を検証し、基礎問題は個別に解答と文言を校正しています。数的推理の計算分野やBⅡの図形問題は、この版にはまだ収録していません。</p><p class="notice" style="margin-top:10px">教材の出題頻度や難易度は教材独自の区分です。このアプリの難易度は学習上の目安であり、最新の各自治体の試験範囲・配点を保証するものではありません。</p>`) }<div class="sectionhead"><h2>データの初期化</h2></div>${card(`<p class="sub">すべての学習履歴、復習予定、途中の演習を削除します。元に戻せないため、必要なら先にバックアップしてください。</p><div class="actions">${btn('reset','学習データを初期化','danger')}</div>`)}`;}
function exportData(){checkpoint();const blob=new Blob([JSON.stringify({app:'koumuin-logic',exportVersion:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='koumuin-logic-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('JSONバックアップの保存を開始しました。保存先にファイルがあるか確認してください。');}
function importData(file){if(!file)return;if(file.size>15*1024*1024){notify('ファイルが大きすぎます（上限15MB）。');return;}const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);if(payload.app!=='koumuin-logic'||payload.exportVersion!==1)throw Error('このアプリのバックアップではありません。');const next=normalizeState(payload.state);if(!confirm('現在の学習データをバックアップの内容で置き換えます。よろしいですか？'))return;state=next;for(const id of new Set(state.history.map(h=>h.id)))recomputeProgress(id);if(state.active){state.active.elapsed=sessionElapsed(state.active);state.active.clockAt=null;state.active.paused=true;}save();view='home';notify('バックアップを復元しました。');render();}catch(e){notify('復元できませんでした。'+e.message);}};reader.onerror=()=>notify('ファイルを読み取れませんでした。');reader.readAsText(file);}
function resetData(){if(!confirm('すべての学習履歴と途中の演習を削除します。元に戻せません。続けますか？'))return;if(!confirm('最終確認：本当に学習データを初期化しますか？'))return;state=freshState();save();view='home';notify('学習データを初期化しました。');render();}
function openLesson(section,step){const s=LESSONS.find(x=>x.id===section)||LESSONS[0];lessonSection=s.id;lessonStep=safeInt(step,0,2,0);lessonReveal=false;state.learning={section:lessonSection,step:lessonStep};save();view='learn';render();window.scrollTo(0,0);}
function actionHandler(el){const action=el.dataset.action,s=state.active;switch(action){
 case'nav':if(s&&s.mode==='practice'&&!s.paused&&el.dataset.value!=='session'){s.elapsed=sessionElapsed(s);s.clockAt=null;s.paused=true;save();}setView(el.dataset.value);window.scrollTo(0,0);break;

 case'openLesson':openLesson(el.dataset.section,el.dataset.step);break;
 case'revealLesson':lessonReveal=true;render();break;
 case'lessonDone':state.lessonDone[lessonSection+'-'+lessonStep]=true;save();if(lessonStep<2)openLesson(lessonSection,lessonStep+1);else{chosenSection=lessonSection;chosenLevel='1';chosenCount=10;view='practice';render();window.scrollTo(0,0);}break;
 case'lessonUnsure':lessonReveal=false;notify('解説をもう一度読み、例の条件を自分の言葉で説明してみましょう。');render();break;
 case'lessonPrev':if(lessonStep>0)openLesson(lessonSection,lessonStep-1);break;
 case'lessonNext':if(lessonStep<2)openLesson(lessonSection,lessonStep+1);else{chosenSection=lessonSection;chosenLevel='1';chosenCount=10;view='practice';render();window.scrollTo(0,0);}break;
 case'expA':logicExperiment.a=el.checked;render();break;
 case'expB':logicExperiment.b=el.checked;render();break;
 case'startPractice':startSession('practice',chosenSection,chosenLevel,chosenCount);window.scrollTo(0,0);break;
 case'startMock':startSession('mock',chosenSection,chosenLevel,chosenCount);window.scrollTo(0,0);break;
 case'reviewFilter':reviewFilter=el.dataset.value;render();break;
 case'startReview':startSession('practice','all','all',el.dataset.count,reviewFilter);window.scrollTo(0,0);break;
 case'pause':pauseSession();break;
 case'pick':if(!s||s.paused)return;{const item=s.items[s.index];if(s.mode==='practice'&&item.answered)return;item.chosen=Number(el.dataset.index);save();render();}break;
 case'unsure':changeCurrentUnsure(el.checked);break;
 case'hint':if(s&&s.mode==='practice'&&!s.paused){s.items[s.index].hint=true;save();render();}break;
 case'submitAnswer':answerCurrent();break;
 case'nextQuestion':nextQuestion();window.scrollTo(0,0);break;
 case'mockPrev':selectQuestion(s.index-1);break;
 case'mockNext':selectQuestion(s.index+1);break;
 case'mockGo':selectQuestion(el.dataset.index);break;
 case'finishSession':finishSession();window.scrollTo(0,0);break;
 case'saveExit':if(s?.mode==='practice'&&!s.paused){s.elapsed=sessionElapsed(s);s.clockAt=null;s.paused=true;save();}view='home';render();window.scrollTo(0,0);break;
 case'repeatRun':{const r=state.runs.find(x=>x.id===state.lastRunId)||state.runs.at(-1);if(r)startSession(r.mode,r.section,r.level,r.total);window.scrollTo(0,0);}break;
 case'showRun':state.lastRunId=el.dataset.id;save();view='results';render();window.scrollTo(0,0);break;
 case'export':exportData();break;
 case'import':$('importFile')?.click();break;
 case'reset':resetData();break;
 default:break;
}}
function changeHandler(el){switch(el.id){case'sectionSel':chosenSection=el.value;render();break;case'levelSel':chosenLevel=el.value;render();break;case'countSel':chosenCount=el.value;render();break;case'importFile':importData(el.files?.[0]);break;}}
// Only the application shell delegates events; dynamically replaced controls retain behavior.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;if(['expA','expB','unsure'].includes(el.dataset.action))return;actionHandler(el);});
document.addEventListener('change',e=>{const el=e.target;if(['expA','expB','unsure'].includes(el.dataset.action)){actionHandler(el);return;}changeHandler(el);});
document.addEventListener('toggle',e=>{if(e.target.matches('details.details'))tableOpen=e.target.open;},true);
window.addEventListener('beforeunload',checkpoint);
window.addEventListener('pagehide',checkpoint);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')checkpoint();});
setInterval(timeTick,1000);
// A practice session is paused after a reload; a mock's wall-clock deadline is preserved.
if(state.active?.mode==='practice'){state.active.elapsed=sessionElapsed(state.active);state.active.clockAt=null;state.active.paused=true;save();}
if(state.active?.mode==='mock'&&!state.active.clockAt&&!state.active.paused)state.active.clockAt=Date.now();
if(state.learning){lessonSection=LESSONS.some(s=>s.id===state.learning.section)?state.learning.section:'s1';lessonStep=safeInt(state.learning.step,0,2,0);}
if(state.active?.mode==='mock'&&sessionElapsed(state.active)>=state.active.limitSec*1000){finishSession(true);}else render();
</script></body></html>
