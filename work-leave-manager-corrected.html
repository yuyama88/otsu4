<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤務管理">
<title>勤務・休暇管理</title>
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--card2:#f8fafc;--text:#172033;--muted:#697386;
  --line:#dbe2ec;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;
  --shadow:0 10px 34px rgba(15,23,42,.09)
}
body.dark{
  --bg:#0f172a;--card:#172033;--card2:#202b40;--text:#f8fafc;--muted:#a7b2c5;
  --line:#334155;--blue:#60a5fa;--shadow:0 10px 34px rgba(0,0,0,.3)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit}
.app{width:min(100%,1040px);margin:auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.top h1{margin:0;font-size:26px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}
.icon{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sum{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.sum span{display:block;color:var(--muted);font-size:11px}.sum strong{display:block;margin-top:4px;font-size:22px}
.sum.alert strong{color:var(--red)}.sum.good strong{color:var(--blue)}
.rule{padding:13px 15px;margin-bottom:12px;font-size:12px;line-height:1.65;color:var(--muted)}
.rule b{color:var(--text)}
.layout{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}
.calendar{overflow:hidden}.calhead{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;padding:13px}
.nav{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);font-size:22px}
.period{text-align:center}.period strong{display:block;font-size:20px}.period small{display:block;color:var(--muted);font-weight:700}
.period button{border:0;background:transparent;color:var(--blue);font-weight:800;margin-top:4px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.week{padding:0 7px;color:var(--muted);font-size:12px;font-weight:800;text-align:center}
.week div{padding:8px 2px}.week div:first-child{color:#ef4444}.week div:last-child{color:#3b82f6}
.grid{gap:1px;background:var(--line);border-top:1px solid var(--line)}
.day{position:relative;min-height:94px;border:0;background:var(--card);color:var(--text);padding:8px 5px;text-align:left;overflow:hidden}
.day.out{opacity:.25}.day.today:after{content:"";position:absolute;inset:3px;border:2px solid var(--blue);border-radius:11px;pointer-events:none}
.num{font-weight:900;font-size:14px}.sun .num,.holiday .num{color:#ef4444}.sat .num{color:#2563eb}
.status{display:block;margin-top:9px;border-radius:8px;padding:6px 3px;text-align:center;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auto{display:block;margin-top:4px;text-align:center;color:var(--muted);font-size:8px}
.dot{position:absolute;right:6px;top:7px;width:7px;height:7px;border-radius:50%;background:#f59e0b}
.side{padding:14px}.side h2{margin:0 0 10px;font-size:17px}
.box{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.box-title{color:var(--muted);font-size:12px;margin-bottom:8px}
.pair{display:flex;justify-content:space-between;gap:8px;align-items:end}.pair strong{font-size:24px;color:var(--blue)}
.mini{color:var(--muted);font-size:11px;line-height:1.65;margin-top:7px}
.fieldline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fieldline input{width:85px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);text-align:right}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:800}
.actions .primary{background:var(--blue);color:#fff;border-color:var(--blue)}.actions .danger{color:var(--red)}
.help{font-size:11px;color:var(--muted);line-height:1.65;margin:10px 2px 0}
.modalbg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:20;align-items:flex-end;justify-content:center;padding:10px}
.modalbg.show{display:flex}
.modal{width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--card);border-radius:22px;padding:17px;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 25px 80px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.hint{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;line-height:1.55;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}
select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);padding:11px}
textarea{min-height:75px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.row2 button,.fullbtn{border:0;border-radius:12px;padding:12px;font-weight:900}
.cancel{background:var(--card2);color:var(--text);border:1px solid var(--line)!important}.save{background:var(--blue);color:white}
.fullbtn{width:100%;margin-top:8px;background:transparent;color:var(--red);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,25px);opacity:0;transition:.2s;background:#111827;color:white;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:800;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.day{min-height:80px}.status{font-size:8px}.side{padding:12px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div><h1>勤務・休暇管理</h1><p>16日〜翌15日｜欠勤・補填・有休管理</p></div>
  <button class="icon" id="theme">☾</button>
</header>

<section class="card rule">
  <b>祝日が月〜金にある週の土曜は通常出勤。</b>
  それ以外の休みの土曜に補填出勤すると、欠勤残りが1日または0.5日減ります。
  有休を選んだ日は欠勤にならず、有休残数だけ減ります。
</section>

<section class="summary">
  <div class="sum"><span>有休残り</span><strong id="paidRemain">0日</strong></div>
  <div class="sum good"><span>補填出勤</span><strong id="makeupTotal">0日</strong></div>
  <div class="sum"><span>欠勤合計</span><strong id="absenceTotal">0日</strong></div>
  <div class="sum alert"><span>未補填欠勤</span><strong id="absenceRemain">0日</strong></div>
</section>

<section class="layout">
  <div class="card calendar">
    <div class="calhead">
      <button class="nav" id="prev">‹</button>
      <div class="period"><strong id="title"></strong><small id="range"></small><button id="today">今月へ戻る</button></div>
      <button class="nav" id="next">›</button>
    </div>
    <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <aside class="card side">
    <h2>表示期間の実績</h2>
    <div class="box">
      <div class="box-title">勤務</div>
      <div class="pair"><span>勤務換算</span><strong id="workTotal">0日</strong></div>
      <div class="mini" id="workDetail"></div>
    </div>
    <div class="box">
      <div class="box-title">休暇・欠勤</div>
      <div class="mini" id="leaveDetail"></div>
      <div class="mini" id="offsetDetail"></div>
    </div>
    <div class="box">
      <div class="fieldline"><span>有休付与日数</span><input id="paidAllowance" type="number" min="0" step=".5" value="0"></div>
    </div>
    <div class="actions">
      <button class="primary" id="backup">バックアップ</button>
      <button id="restore">復元</button>
      <button id="csv">CSV出力</button>
      <button class="danger" id="clear">記録削除</button>
    </div>
    <p class="help">
      平日と祝日週の土曜は自動で出勤表示、日曜・祝日・通常の土曜は休み表示です。
      実際と違う日だけ押して変更してください。
    </p>
    <input id="file" class="hidden" type="file" accept=".json,application/json">
  </aside>
</section>
</main>

<div class="modalbg" id="modalbg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="hint" id="hint"></div>
    <label for="status">この日の実績</label>
    <select id="status"></select>
    <label for="note">メモ</label>
    <textarea id="note" placeholder="例：体調不良、午前のみ、欠勤の補填など"></textarea>
    <div class="row2"><button class="cancel" id="cancel">閉じる</button><button class="save" id="save">保存</button></div>
    <button class="fullbtn" id="deleteDay">この日の変更を削除して自動表示に戻す</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const LS="workLeaveManagerV1",DBN="workLeaveManagerDB",STORE="state",KEY="main";

const STATUS={
  auto:{label:"自動表示に戻す",bg:"#e2e8f0",fg:"#334155"},
  workFull:{label:"出勤（1日）",work:1,bg:"#dcfce7",fg:"#166534"},
  workAM:{label:"午前出勤",work:.5,bg:"#dcfce7",fg:"#166534"},
  workPM:{label:"午後出勤",work:.5,bg:"#dcfce7",fg:"#166534"},
  off:{label:"公休",bg:"#dbeafe",fg:"#1e40af"},
  paidFull:{label:"有休（1日）",paid:1,bg:"#f3e8ff",fg:"#6b21a8"},
  paidAM:{label:"午前有休",paid:.5,work:.5,bg:"#fae8ff",fg:"#86198f"},
  paidPM:{label:"午後有休",paid:.5,work:.5,bg:"#fae8ff",fg:"#86198f"},
  absentFull:{label:"欠勤（1日・要補填）",absence:1,bg:"#fee2e2",fg:"#991b1b"},
  absentAM:{label:"午前欠勤（要補填0.5日）",absence:.5,work:.5,bg:"#fff1f2",fg:"#9f1239"},
  absentPM:{label:"午後欠勤（要補填0.5日）",absence:.5,work:.5,bg:"#fff1f2",fg:"#9f1239"},
  makeupFull:{label:"土曜補填出勤（1日）",makeup:1,work:1,bg:"#ffedd5",fg:"#9a3412"},
  makeupAM:{label:"午前土曜補填",makeup:.5,work:.5,bg:"#fff7ed",fg:"#9a3412"},
  makeupPM:{label:"午後土曜補填",makeup:.5,work:.5,bg:"#fff7ed",fg:"#9a3412"},
  special:{label:"特別休暇",bg:"#ede9fe",fg:"#5b21b6"},
  other:{label:"その他",bg:"#e2e8f0",fg:"#334155"}
};

let state={entries:{},company:{},paidAllowance:0,theme:"system",updatedAt:new Date().toISOString()};
let db=null,selected=null,view=periodMonth(new Date());
const $=id=>document.getElementById(id);

function d(y,m,day){return new Date(y,m,day,12)}
function key(x){return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`}
function parse(k){let [y,m,z]=k.split("-").map(Number);return d(y,m-1,z)}
function add(x,n){let q=d(x.getFullYear(),x.getMonth(),x.getDate());q.setDate(q.getDate()+n);return q}
function periodMonth(x){return x.getDate()<=15?d(x.getFullYear(),x.getMonth(),1):d(x.getFullYear(),x.getMonth()+1,1)}
function period(){return{start:d(view.getFullYear(),view.getMonth()-1,16),end:d(view.getFullYear(),view.getMonth(),15)}}
function dates(a,b){let r=[];for(let x=a;key(x)<=key(b);x=add(x,1))r.push(x);return r}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function nth(y,m,w,n){let f=d(y,m,1),delta=(w-f.getDay()+7)%7;return add(f,delta+(n-1)*7)}
function ve(y){return Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4))}
function ae(y){return Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4))}
const hc=new Map();

function holidays(y){
  if(hc.has(y))return hc.get(y);
  let m=new Map(),put=(x,n)=>m.set(key(x),n);
  put(d(y,0,1),"元日");put(nth(y,0,1,2),"成人の日");put(d(y,1,11),"建国記念の日");put(d(y,1,23),"天皇誕生日");
  put(d(y,2,ve(y)),"春分の日");put(d(y,3,29),"昭和の日");put(d(y,4,3),"憲法記念日");put(d(y,4,4),"みどりの日");
  put(d(y,4,5),"こどもの日");put(nth(y,6,1,3),"海の日");put(d(y,7,11),"山の日");put(nth(y,8,1,3),"敬老の日");
  put(d(y,8,ae(y)),"秋分の日");put(nth(y,9,1,2),"スポーツの日");put(d(y,10,3),"文化の日");put(d(y,10,23),"勤労感謝の日");
  for(let x=d(y,0,2);x<=d(y,11,30);x=add(x,1)){
    if(!m.has(key(x))&&x.getDay()!=0&&m.has(key(add(x,-1)))&&m.has(key(add(x,1))))m.set(key(x),"国民の休日")
  }
  for(const [k] of [...m]){
    let x=parse(k);
    if(x.getDay()==0){
      let s=add(x,1);
      while(m.has(key(s)))s=add(s,1);
      if(s.getFullYear()==y)m.set(key(s),"振替休日")
    }
  }
  hc.set(y,m);return m
}
function holiday(x){return holidays(x.getFullYear()).get(key(x))||""}

function holidayInWeek(sat){
  const mon=add(sat,-5);
  for(let i=0;i<5;i++)if(holiday(add(mon,i)))return true;
  return false;
}

function baseStatus(x){
  if(x.getDay()==0||holiday(x))return{status:"off",label:holiday(x)?"祝日":"日曜休み",reason:holiday(x)||"日曜日"};
  if(x.getDay()==6){
    if(holidayInWeek(x))return{status:"workFull",label:"土曜出勤",reason:"祝日がある週"};
    return{status:"off",label:"土曜休み",reason:"通常の土曜日"};
  }
  return{status:"workFull",label:"出勤",reason:"通常勤務"};
}

function currentEntry(x){
  const saved=state.entries[key(x)];
  if(saved&&saved.status&&saved.status!=="auto")return{...saved,automatic:false};
  const base=baseStatus(x);
  return{status:base.status,note:"",automatic:true,base};
}

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)
  })
}
function dbget(){return new Promise(res=>{if(!db)return res(null);let r=db.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
function dbput(v){return new Promise(res=>{if(!db)return res();let t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,KEY);t.oncomplete=()=>res();t.onerror=()=>res()})}

function migrateEntry(e){
  if(!e||!e.status)return e;
  const map={satFull:"makeupFull",satAM:"makeupAM",satPM:"makeupPM",compFull:"other",compAM:"other",compPM:"other",none:"auto"};
  return map[e.status]?{...e,status:map[e.status]}:e;
}

async function load(){
  let a=null,b=null;
  try{await openDB();a=await dbget()}catch{}
  try{b=JSON.parse(localStorage.getItem(LS)||"null")}catch{}
  const pick=Date.parse(a?.updatedAt||0)>=Date.parse(b?.updatedAt||0)?a:b;
  if(pick){
    state={...state,...pick,entries:{},company:{}};
    for(const [k,e] of Object.entries(pick.entries||{}))state.entries[k]=migrateEntry(e);
  }
  $("paidAllowance").value=state.paidAllowance||0;
  theme()
}

async function save(show=false){
  state.updatedAt=new Date().toISOString();state.company={};
  try{localStorage.setItem(LS,JSON.stringify(state))}catch{}
  await dbput(JSON.parse(JSON.stringify(state)));
  if(show)toast("保存しました")
}

function theme(){
  const dark=state.theme=="dark"||(state.theme=="system"&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.body.classList.toggle("dark",dark);$("theme").textContent=dark?"☀":"☾"
}

function render(){
  const p=period();
  $("title").textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;
  $("range").textContent=`（${p.start.getMonth()+1}/${p.start.getDate()}〜${p.end.getMonth()+1}/${p.end.getDate()}）`;

  const start=add(p.start,-p.start.getDay()),end=add(p.end,6-p.end.getDay()),g=$("grid");
  g.innerHTML="";
  for(const x of dates(start,end)){
    const k=key(x),e=currentEntry(x),s=STATUS[e.status]||STATUS.other,b=document.createElement("button");
    b.className="day";
    if(k<key(p.start)||k>key(p.end))b.classList.add("out");
    if(x.getDay()==0)b.classList.add("sun");
    if(x.getDay()==6)b.classList.add("sat");
    if(holiday(x))b.classList.add("holiday");
    if(key(new Date())==k)b.classList.add("today");
    b.innerHTML=`<span class="num">${x.getDate()}</span>${e.note?'<span class="dot"></span>':""}<span class="status" style="background:${s.bg};color:${s.fg}">${e.automatic?(e.base?.label||s.label):s.label}</span>${e.automatic?'<span class="auto">自動</span>':""}`;
    b.onclick=()=>openModal(k);g.appendChild(b)
  }
  stats()
}

function stats(){
  const p=period();
  let work=0,paid=0,abs=0,makeup=0;
  const counts={workFull:0,workAM:0,workPM:0,paidFull:0,paidAM:0,paidPM:0,absentFull:0,absentAM:0,absentPM:0,makeupFull:0,makeupAM:0,makeupPM:0,off:0};

  for(const x of dates(p.start,p.end)){
    const e=currentEntry(x),s=STATUS[e.status]||{};
    work+=s.work||0;paid+=s.paid||0;abs+=s.absence||0;makeup+=s.makeup||0;
    if(counts[e.status]!=null)counts[e.status]++
  }

  $("workTotal").textContent=fmt(work)+"日";
  $("workDetail").textContent=`通常出勤 ${counts.workFull}回／午前 ${counts.workAM}回／午後 ${counts.workPM}回／補填1日 ${counts.makeupFull}回／補填午前 ${counts.makeupAM}回／補填午後 ${counts.makeupPM}回`;
  $("leaveDetail").textContent=`有休 ${fmt(paid)}日／欠勤 ${fmt(abs)}日／公休 ${counts.off}日`;

  let allPaid=0,allAbs=0,allMakeup=0;
  for(const e of Object.values(state.entries)){
    const s=STATUS[e.status]||{};
    allPaid+=s.paid||0;allAbs+=s.absence||0;allMakeup+=s.makeup||0;
  }
  const remain=Math.max(0,allAbs-allMakeup);
  $("paidRemain").textContent=fmt(Math.max(0,(+state.paidAllowance||0)-allPaid))+"日";
  $("makeupTotal").textContent=fmt(allMakeup)+"日";
  $("absenceTotal").textContent=fmt(allAbs)+"日";
  $("absenceRemain").textContent=fmt(remain)+"日";
  $("offsetDetail").textContent=`欠勤 ${fmt(allAbs)}日 − 補填出勤 ${fmt(allMakeup)}日 ＝ 未補填 ${fmt(remain)}日`;
}

function setupOptions(){
  const groups=[
    ["基本",["auto","workFull","workAM","workPM","off"]],
    ["有休",["paidFull","paidAM","paidPM"]],
    ["欠勤",["absentFull","absentAM","absentPM"]],
    ["土曜の補填出勤",["makeupFull","makeupAM","makeupPM"]],
    ["その他",["special","other"]]
  ];
  $("status").innerHTML=groups.map(([n,ks])=>`<optgroup label="${n}">${ks.map(k=>`<option value="${k}">${STATUS[k].label}</option>`).join("")}</optgroup>`).join("")
}

function openModal(k){
  selected=k;
  const x=parse(k),saved=state.entries[k],base=baseStatus(x);
  $("modalTitle").textContent=`${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`;
  $("status").value=saved?.status||"auto";$("note").value=saved?.note||"";

  let msg=`自動表示：${base.label}（${base.reason}）`;
  if(x.getDay()==6&&base.status==="off")msg+="。欠勤を補うために出た場合は「土曜補填出勤」を選択。";
  if(x.getDay()==6&&base.status==="workFull")msg+="。この土曜は通常勤務なので、補填出勤には数えません。";
  if(x.getDay()>=1&&x.getDay()<=5)msg+="。休んだ場合は「有休」または「欠勤」を選択。";
  $("hint").textContent=msg;
  $("modalbg").classList.add("show")
}

function close(){selected=null;$("modalbg").classList.remove("show")}
function saveModal(){
  if(!selected)return;
  const x=parse(selected),base=baseStatus(x),st=$("status").value,n=$("note").value.trim();

  if(["makeupFull","makeupAM","makeupPM"].includes(st)&&!(x.getDay()==6&&base.status==="off")){
    alert("補填出勤は、通常は休みになっている土曜日だけ登録できます。祝日週の土曜出勤は通常勤務扱いです。");
    return;
  }

  if(st==="auto"&&!n)delete state.entries[selected];
  else state.entries[selected]={status:st,note:n};

  save(true);close();render()
}
function deleteDay(){if(!selected)return;delete state.entries[selected];save(true);close();render()}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),1700)}

function backup(){
  const blob=new Blob([JSON.stringify({app:"勤務・休暇管理",state},null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`勤務管理バックアップ_${key(new Date()).replaceAll("-","")}.json`;a.click();URL.revokeObjectURL(u)
}
async function restore(f){
  try{
    const j=JSON.parse(await f.text()),v=j.state||j;if(!v.entries)throw 0;
    state={...state,...v,entries:{},company:{}};
    for(const [k,e] of Object.entries(v.entries||{}))state.entries[k]=migrateEntry(e);
    $("paidAllowance").value=state.paidAllowance||0;await save();theme();render();toast("復元しました")
  }catch{alert("正しいバックアップファイルを選んでください")}
}
function csv(){
  const rows=[["日付","実績","勤務換算","有休","欠勤","補填出勤","メモ"]];
  for(const k of Object.keys(state.entries).sort()){
    const e=state.entries[k],s=STATUS[e.status]||{};
    rows.push([k,s.label||"",s.work||0,s.paid||0,s.absence||0,s.makeup||0,e.note||""])
  }
  const text="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([text],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="勤務記録.csv";a.click();URL.revokeObjectURL(u)
}
async function clearAll(){
  if(!confirm("すべての個人記録を削除します。よろしいですか？"))return;
  const th=state.theme;state={entries:{},company:{},paidAllowance:0,theme:th,updatedAt:new Date().toISOString()};
  $("paidAllowance").value=0;await save();render();toast("削除しました")
}

$("prev").onclick=()=>{view=d(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=d(view.getFullYear(),view.getMonth()+1,1);render()};
$("today").onclick=()=>{view=periodMonth(new Date());render()};
$("theme").onclick=()=>{state.theme=document.body.classList.contains("dark")?"light":"dark";theme();save()};
$("cancel").onclick=close;$("save").onclick=saveModal;$("deleteDay").onclick=deleteDay;
$("modalbg").onclick=e=>{if(e.target==$("modalbg"))close()};
$("paidAllowance").onchange=e=>{state.paidAllowance=Math.max(0,Math.round((+e.target.value||0)*2)/2);e.target.value=state.paidAllowance;save(true);stats()};
$("backup").onclick=backup;$("restore").onclick=()=>$("file").click();$("file").onchange=e=>e.target.files[0]&&restore(e.target.files[0]);
$("csv").onclick=csv;$("clear").onclick=clearAll;
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});window.addEventListener("pagehide",()=>save());

(async()=>{setupOptions();await load();render()})();
</script>
</body>
</html>
