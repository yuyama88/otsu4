function logicDistractors(s){if(s.includes('ならば')){let [a,b]=s.split('ならば');return [b+'ならば'+a,a+'でなければ'+b,a+'ならば'+(b.endsWith('ではない')?b.slice(0,-4):b+'ではない')];}if(s.includes('でなければ')){let [a,b]=s.split('でなければ');return [a+'ならば'+b,b+'ならば'+a,a+'でなければ'+(b.endsWith('ではない')?b.slice(0,-4):b+'ではない')];}return [];}
function numeric(s){s=String(s).trim().replace(/[０-９．－／]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0)).replace(/,/g,'');if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);if(/^\d+\/\d+$/.test(s)){let [a,b]=s.split('/').map(Number);return b?a/b:NaN;}return NaN;}
function equal(a,b){let x=numeric(a),y=numeric(b);return Number.isFinite(x)&&Number.isFinite(y)?Math.abs(x-y)<0.00002:String(a).trim()===String(b).trim();}

else if(tab==='topics'){out.innerHTML=`<span class="eyebrow">単元を選ぶ</span><h1>理解したいテーマから。</h1><p class="muted">最初から試験につながる文章題を使います。難度はいつでも選べます。</p>${['数的推理','判断推理','図形'].map(group=>`<h2 style="margin-top:28px">${group}</h2><div class="grid">${UNITS.filter(u=>u.group===group).map(u=>`<button class="topic" data-open="${u.id}"><span class="tag">${LV[recommendedLevel(u.id)]}</span><strong>${u.name}</strong><small>${u.goal}</small><div class="track"><i style="width:${mastered(u.id)/9*100}%"></i></div><small>異なる条件での自力正解 ${mastered(u.id)}/9</small></button>`).join('')}</div>`).join('')}`;}
else if(tab==='review'){out.innerHTML=`<span class="eyebrow">解けなかった一問を、次の一歩に。</span><h1>復習ノート</h1><div class="card"><p>間違えた問題・解説を見た問題が残ります。同じ問題を自力で解けたら翌日、その次は3日後。予定日以降に3回自力で解けたら復習を完了します。前倒しで解いた場合は、次の予定日を変えません。</p><p class="muted">今できる復習 ${due.length}問 ／ 待機中 ${state.reviews.length-due.length}問</p>${due.length?'<button class="primary" id="reviewFirst">今できる復習を始める</button>':'<button data-go="topics">別の単元を練習する</button>'}</div>${state.reviews.map((q,i)=>`<div class="card row"><div><strong>${unit(q.id).name}</strong><div class="small muted">${LV[q.l]} · ${q.due<=Date.now()?'復習できます':new Date(q.due).toLocaleDateString('ja-JP')+'ごろに復習'}</div></div><button data-review="${i}">解き直す</button></div>`).join('')}`;if($('#reviewFirst'))$('#reviewFirst').onclick=()=>{let q=due[0];start(q.id,q.l,'review',q.seed);};out.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{let q=state.reviews[+b.dataset.review];start(q.id,q.l,'review',q.seed);});}
else if(tab==='exam'){out.innerHTML=`<span class="eyebrow">実戦への橋渡し</span><h1>5問・10分。解く順番も練習。</h1><div class="card"><p>段階3の問題から、異なる5単元を出題します。途中のヒントや解説は表示しません。わからない問題は後回しにして、最後に見直せます。</p><div class="notice">これは収録した分野のオリジナル練習です。実際の採用試験の出題数・制限時間を再現する模試や、合否判定ではありません。</div><div class="actions"><button class="primary" id="newExam">${state.exam&&!state.exam.finished?'別の5問でやり直す':'10分の実戦練習を始める'}</button>${state.exam&&!state.exam.finished?'<button id="continueExam">途中の実戦を再開</button>':''}</div></div>`;$('#newExam').onclick=()=>{if(state.exam&&!state.exam.finished&&!confirm('途中の実戦練習を終了せず、別の5問でやり直しますか？'))return;beginExam();};if($('#continueExam'))$('#continueExam').onclick=resumeExam;}
else if(tab==='record'){let hist=state.history,own=hist.filter(h=>h.own&&h.mode!=='exam'),ex=hist.filter(h=>h.mode==='exam'),recent=hist.slice(-20),avg=own.length?Math.round(own.reduce((s,h)=>s+h.sec,0)/own.length):0;out.innerHTML=`<span class="eyebrow">解く力を、少しずつ。</span><h1>成長の記録</h1><div class="card"><div class="statgrid"><div><b>${UNITS.reduce((s,u)=>s+stats(u.id).tries,0)}</b><span>自力練習の回答数</span></div><div><b>${UNITS.reduce((s,u)=>s+stats(u.id).correct,0)}</b><span>ヒントなし正解</span></div><div><b>${Object.keys(state.days).length}</b><span>取り組んだ日数</span></div></div><p class="small muted">最近${recent.length}問：自力正解${recent.filter(h=>h.own).length}問。通常練習で自力正解した問題の平均${avg}秒。実戦練習は${ex.length}問回答済み。</p><p class="small muted">段階ごとに異なる問題で3回自力正解すると、次の段階をおすすめします。同じ問題の解き直しは重複加点しません。段階を自由に選んでも記録できます。</p></div><div class="card"><h2>単元ごとの進み具合</h2>${UNITS.map(u=>`<div style="margin:18px 0"><div class="row"><strong>${u.name}</strong><span class="small">${stats(u.id).passed.map((a,i)=>`${i+1}段階 ${a.length}/3`).join(' · ')}</span></div><div class="track"><i style="width:${mastered(u.id)/9*100}%"></i></div><span class="small muted">一緒に解いた問題 ${stats(u.id).guides}問</span></div>`).join('')}</div><div class="card"><h2>記録のバックアップ</h2><p class="small muted">記録はこのブラウザに保存されます。別の端末とは自動同期しません。ブラウザの履歴削除前などに保存してください。</p><div class="actions"><button id="backup">記録を保存</button><button id="restore">記録を読み込む</button><input type="file" id="file" accept=".json,application/json" hidden></div><p id="restoreMsg" role="status"></p></div><details class="card"><summary>収録範囲・教材との関係</summary>${about()}</details>`;$('#backup').onclick=exportState;$('#restore').onclick=()=>$('#file').click();$('#file').onchange=importState;}
else if(tab==='question'){renderQuestion();return;}else if(tab==='examRunning'){renderExam();return;}
out.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openUnit(b.dataset.open));out.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
function about(){return `<p>添付の大原「数的処理BⅠ・BⅡ・BⅢ」の分野と例題の考え方を参考に作成した、16単元・3段階のオリジナル練習です。教材本文や過去問の全問収録ではありません。</p><p>割合の基準の変化、停止を含む追いつき、蒸発後の混合、3人の仕事算、余事象、3集合、相似、条件付き経路などへ進みます。一部の単元は試験問題への導入段階です。</p><p>収録問題を解けるようになったら、各単元の参照先にある教材の基礎例題、標準問題へ進んでください。複雑な対応、うそつき、暗号、勝敗、方位、展開図、回転など、この版で扱わない分野もあります。教材・志望先の過去問と併用する設計です。</p><p>「3回正解」はアプリ内の進級目安で、試験の合格保証や習熟度の精密な測定ではありません。自力で理由を説明できるか、日をあけて解けるかも確かめてください。ページは冊子の印刷ページです。</p>`;}
function openUnit(id){start(id,recommendedLevel(id),'guide');}
function start(id,l,mode='guide',seed=newSeed(),usedHelp=false){clearClock();run={id,l,seed,mode,usedHelp,guideErrors:0,guideFinished:false,credited:false};stepIndex=-1;stepResponse=null;answer=null;hint=false;questionStart=Date.now();state.active={id,l,seed,mode,usedHelp};save();go('question');}
function renderQuestion(){let q=currentQuestion(),u=unit(q.id),guided=run.mode==='guide';$('#app').innerHTML=`<div class="lesson"><div class="row"><button id="back" class="quiet">単元一覧</button><span class="small muted">${guided?'一緒に解く':run.mode==='review'?'復習':'自力で解く'}</span></div><div class="card" style="margin-top:16px"><div class="row"><span class="tag">${u.group}</span><label class="small">難度 <select id="difficulty">${LV.map((v,i)=>`<option value="${i}" ${q.l===i?'selected':''}>${i+1} · ${v}</option>`).join('')}</select></label></div><h1 style="margin-top:16px">${u.name}</h1><div class="question">${esc(q.text)}</div>${q.visual?`<div class="figure">${q.visual}</div>`:''}<div id="questionBody"></div><details><summary>言葉・公式を確認する</summary><p>${u.words}</p></details><p class="foot">教材で次に進む先：${u.source}</p></div></div>`;$('#back').onclick=()=>go('topics');$('#difficulty').onchange=e=>start(q.id,+e.target.value,'guide');if(guided)renderGuide(q);else renderPractice(q);}
function renderGuide(q){let body=$('#questionBody');if(stepIndex<0){body.innerHTML=`<span class="eyebrow">まず問題文を整理</span><div class="concept"><strong>わかっていること</strong><ul>${q.givens.map(g=>`<li>${esc(g)}</li>`).join('')}</ul><strong>求めたいこと</strong><p>${q.target}</p></div><h3>どこに注目する？</h3><p>${q.plan}</p><div class="actions"><button class="primary" id="firstStep">最初の一手を考える</button><button id="skipGuide">この問題を自力で解く</button></div>`;$('#firstStep').onclick=()=>{stepIndex=0;renderQuestion();};$('#skipGuide').onclick=()=>{run.mode='practice';run.usedHelp=true;state.active.mode='practice';state.active.usedHelp=true;save();renderQuestion();};return;}
if(stepIndex>=q.steps.length){if(!run.guideFinished){stats(q.id).guides++;run.guideFinished=true;state.days[dateKey()]=(state.days[dateKey()]||0)+1;state.active=null;save();}body.innerHTML=`<div class="success"><h2>解き方を、最後までたどれた。</h2><strong>答え：${esc(q.answer)}${q.unit}</strong><p>${run.guideErrors?'迷った手順が'+run.guideErrors+'か所あった。下の振り返りでもう一度確かめよう。':'次は数字や条件の違う問題を、解説なしで解いてみよう。'}</p></div>${explanation(q)}<div class="actions"><button class="primary" id="transfer">別の問題を自力で解く</button><button id="repeatGuide">同じ問題の説明を最初から</button></div>`;$('#transfer').onclick=()=>start(q.id,q.l,'practice',differentSeed(q));$('#repeatGuide').onclick=()=>{stepIndex=-1;stepResponse=null;renderQuestion();};return;}
let s=q.steps[stepIndex];body.innerHTML=`<div class="row"><span class="eyebrow">手順 ${stepIndex+1} / ${q.steps.length}</span><span class="small muted">${stepIndex===0?'読み取る':stepIndex===q.steps.length-1?'求めるものに戻す':'式にする・計算する'}</span></div><h2 style="margin-top:10px">${s.title}</h2><div class="concept"><strong>なぜ、ここでこの考え方？</strong><p>${esc(s.why)}</p></div><h3>${esc(s.ask)}</h3><div class="options">${s.options.map((v,i)=>`<button data-step="${i}" ${stepResponse!==null?'disabled':''} class="${stepResponse!==null&&equal(v,s.answer)?'correct':stepResponse===v?'wrong':''}">${esc(v)}</button>`).join('')}</div><div aria-live="polite">${stepResponse!==null?`<div class="${equal(stepResponse,s.answer)?'success':'notice'}"><strong>${equal(stepResponse,s.answer)?'その考え方でOK。':'ここを一緒に確認しよう。'}</strong><p style="white-space:pre-line">${esc(s.calc)}</p></div><button class="primary" id="nextStep">${stepIndex===q.steps.length-1?'考え方を振り返る':'次の手順へ'}</button>`:'<div class="actions"><button id="stepUnknown" class="quiet">わからない・式を見る</button></div>'}</div><details><summary>ここまでの式を見る</summary><ol class="steps">${q.steps.slice(0,stepIndex).map(s=>`<li>${esc(s.calc)}</li>`).join('')}</ol></details>`;body.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>stepAnswer(s.options[+b.dataset.step]));if($('#stepUnknown'))$('#stepUnknown').onclick=()=>stepAnswer('__unknown__');if($('#nextStep'))$('#nextStep').onclick=()=>{stepIndex++;stepResponse=null;renderQuestion();};}
function stepAnswer(v){if(stepResponse!==null)return;let s=currentQuestion().steps[stepIndex];stepResponse=v;if(!equal(v,s.answer))run.guideErrors++;renderQuestion();}
function differentSeed(q){for(let i=0;i<80;i++){let seed=newSeed(),other=generate(q.id,q.l,seed);if(other.signature!==q.signature&&!stats(q.id).passed[q.l].includes(other.signature))return seed;}return newSeed();}
function renderPractice(q){let body=$('#questionBody'),numericAnswer=Number.isFinite(numeric(q.answer));body.innerHTML=`<span class="eyebrow">${run.mode==='review'?'日をあけて、もう一度。':'今度は、自分の力で。'}</span>${answer===null?`<p class="small muted">${numericAnswer?'答えを数字で入力してください。分数は「3/4」の形でも入力できます。':'答えを選んでください。'} 時間制限はありません。</p>${numericAnswer?`<form id="answerForm"><label for="answerInput">答え（${q.unit||'数値'}）</label><div class="actions"><input id="answerInput" type="text" inputmode="${q.answer.includes('/')?'text':'decimal'}" autocomplete="off" placeholder="答えを入力" style="min-width:0;flex:1;width:180px;padding:12px;border:1px solid var(--line);border-radius:12px"><button class="primary" type="submit">答え合わせ</button></div><p id="inputError" role="status" class="small"></p></form>`:`<div class="options">${q.options.map((v,i)=>`<button data-answer="${i}">${esc(v)}</button>`).join('')}</div>`}<div class="actions"><button id="help">解き方のヒント</button><button id="giveUp" class="quiet">わからない・解説を見る</button></div>${hint?`<div class="hint"><strong>考え方の入口</strong><p>${q.plan}</p><p>求めるもの：${q.target}</p></div>`:''}`:`<div class="${equal(answer,q.answer)?'success':'notice'}"><h2>${equal(answer,q.answer)?run.usedHelp?'ヒントを使って解けた。':'自力で解けた！':'この一問を、次につなげよう。'}</h2><p>答え：<strong>${esc(q.answer)}${q.unit}</strong></p><span class="small">${Math.round((Date.now()-questionStart)/1000)}秒で回答 · ${run.usedHelp||!equal(answer,q.answer)?'復習ノートに登録しました。':'この段階の自力正解 '+stats(q.id).passed[q.l].length+'/3（同じ問題は重複加点しません）'}</span></div>${explanation(q)}<div class="actions"><button class="primary" id="nextPractice">${stats(q.id).passed[q.l].length>=3&&q.l<2?'次の難度へ進む':'別の問題を解く'}</button><button id="guidedRetry">一手ずつ解き直す</button><button id="done">今日はここまで</button></div>`}<details><summary>計算・条件のメモ</summary><textarea aria-label="計算用メモ" placeholder="ここに式や条件を書けます。画面を離れるとメモは消えます。" style="width:100%;min-height:120px;font:inherit;padding:12px"></textarea></details>`;
if($('#answerForm'))$('#answerForm').onsubmit=e=>{e.preventDefault();let v=$('#answerInput').value.trim();if(!Number.isFinite(numeric(v))){$('#inputError').textContent='数字、または3/4のような分数で入力してください。';return;}submit(v);};body.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submit(q.options[+b.dataset.answer]));if($('#help'))$('#help').onclick=()=>{hint=true;run.usedHelp=true;state.active.usedHelp=true;save();renderQuestion();};if($('#giveUp'))$('#giveUp').onclick=()=>submit('__unknown__');if($('#nextPractice'))$('#nextPractice').onclick=()=>{if(stats(q.id).passed[q.l].length>=3&&q.l<2)start(q.id,q.l+1,'guide');else start(q.id,q.l,'practice',differentSeed(q));};if($('#guidedRetry'))$('#guidedRetry').onclick=()=>start(q.id,q.l,'guide',q.seed);if($('#done'))$('#done').onclick=()=>go('home');}
function explanation(q){return `<h3>解き方を振り返る</h3><ol class="steps">${q.steps.map(s=>`<li><strong>${s.title}</strong><br>${esc(s.why)}<div class="formula">${esc(s.calc)}</div></li>`).join('')}</ol><div class="notice"><strong>つまずきやすいところ</strong><p>${q.trap}</p></div><p class="small muted">数字を変えた問題でも、「${unit(q.id).goal}」を自分で説明してから解いてみよう。</p>`;}
function credit(q,v,help,mode,sec){let correct=equal(v,q.answer),own=correct&&!help,s=stats(q.id);s.tries++;if(own){s.correct++;let p=s.passed[q.l];if(p.length<3&&!p.includes(q.signature))p.push(q.signature);}let i=state.reviews.findIndex(x=>x.id===q.id&&x.l===q.l&&x.seed===q.seed);if(own&&i>=0&&state.reviews[i].due<=Date.now()){state.reviews[i].stage++;if(state.reviews[i].stage>=3)state.reviews.splice(i,1);else state.reviews[i].due=Date.now()+(state.reviews[i].stage===1?1:3)*86400000;}else if(!own){let item={id:q.id,l:q.l,seed:q.seed,due:Date.now(),stage:0};if(i>=0)state.reviews[i]=item;else state.reviews.push(item);}state.history.push({id:q.id,l:q.l,seed:q.seed,correct,own,mode,sec:Math.max(0,sec),date:dateKey()});state.history=state.history.slice(-1000);state.days[dateKey()]=(state.days[dateKey()]||0)+1;return{correct,own};}
function submit(v){if(answer!==null||run.credited)return;let q=currentQuestion();answer=v;run.credited=true;credit(q,v,run.usedHelp,run.mode==='review'?'review':'practice',(Date.now()-questionStart)/1000);state.active=null;save();renderQuestion();}
function beginExam(){let ids=UNITS.map(u=>u.id);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}state.exam={refs:ids.slice(0,5).map(id=>({id,l:2,seed:newSeed()})),answers:Array(5).fill(null),index:0,started:Date.now(),deadline:Date.now()+600000,finished:false};save();resumeExam();}
function resumeExam(){exam=state.exam;if(!exam||exam.finished){go('exam');return;}go('examRunning');}
function tick(){if(!exam||exam.finished)return;let sec=Math.max(0,Math.ceil((exam.deadline-Date.now())/1000));let el=$('#timer');if(el)el.textContent=`残り ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec<=0)finishExam(true);}
function renderExam(){clearClock();if(!exam||exam.finished){go('exam');return;}if(Date.now()>=exam.deadline){finishExam(true);return;}let ref=exam.refs[exam.index],q=generate(ref.id,ref.l,ref.seed);$('#app').innerHTML=`<div class="lesson"><div class="card row"><strong>実戦練習 ${exam.index+1}/5</strong><strong id="timer" role="timer"></strong></div><div class="examDots">${exam.refs.map((_,i)=>`<button data-jump="${i}" class="${i===exam.index?'primary':''}" aria-label="問題${i+1} ${exam.answers[i]===null?'未回答':'回答済み'}">${i+1}${exam.answers[i]!==null?' ✓':''}</button>`).join('')}</div><div class="card"><div class="question">${esc(q.text)}</div>${q.visual?`<div class="figure">${q.visual}</div>`:''}<div class="options">${q.options.map((v,i)=>`<button data-exam-answer="${i}" class="${exam.answers[exam.index]===v?'chosen':''}" aria-pressed="${exam.answers[exam.index]===v}"><span class="letter">${i+1}</span><span>${esc(v)}${q.unit}</span></button>`).join('')}</div><div class="actions"><button id="prevQ" ${exam.index===0?'disabled':''}>前の問題</button><button id="nextQ">${exam.index===4?'最初に戻って見直す':'次へ・後回し'}</button><button id="clearA" class="quiet">回答を取り消す</button></div><div class="actions"><button class="primary" id="endExam">採点して終了</button></div><p class="small muted">回答済み ${exam.answers.filter(v=>v!==null).length}/5問。時間切れで自動採点します。</p></div></div>`;document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{exam.index=+b.dataset.jump;save();renderExam();});document.querySelectorAll('[data-exam-answer]').forEach(b=>b.onclick=()=>{exam.answers[exam.index]=q.options[+b.dataset.examAnswer];save();renderExam();});$('#prevQ').onclick=()=>{exam.index=Math.max(0,exam.index-1);save();renderExam();};$('#nextQ').onclick=()=>{exam.index=(exam.index+1)%5;save();renderExam();};$('#clearA').onclick=()=>{exam.answers[exam.index]=null;save();renderExam();};$('#endExam').onclick=()=>{let left=exam.answers.filter(a=>a===null).length;if(left&&!confirm(`${left}問が未回答です。採点して終了しますか？`))return;finishExam(false);};tick();clock=setInterval(tick,1000);}
function finishExam(expired){if(!exam||exam.finished)return;clearClock();exam.finished=true;let elapsed=Math.min(600,Math.max(0,(Date.now()-exam.started)/1000)),results=exam.refs.map((r,i)=>{let q=generate(r.id,r.l,r.seed),v=exam.answers[i];return{q,v,...credit(q,v===null?'__blank__':v,false,'exam',0)};});save();let correct=results.filter(r=>r.correct).length,weak=results.filter(r=>!r.correct),first=weak[0];$('#app').innerHTML=`<div class="lesson"><div class="card"><span class="eyebrow">${expired?'時間終了':'実戦練習を完了'}</span><h1>${correct} / 5問 正解</h1><p>経過 ${Math.floor(elapsed/60)}分${Math.round(elapsed%60)}秒</p><p>${correct===5?'今回の5問は全て正解。次は教材の標準問題でも、同じ考え方を使えるか確かめよう。':'間違い・未回答の問題は復習ノートに残しました。まず1単元を一手ずつ解き直そう。'}</p><div class="concept"><strong>次に復習するテーマ</strong><p>${first?unit(first.q.id).name+'：'+unit(first.q.id).goal:'教材の標準問題・今回と異なる単元'}</p></div>${first?'<button class="primary" id="examGuide">このテーマを一手ずつ解き直す</button>':''}<p class="small muted">実戦では全体の所要時間のみ計測します。この結果は今回の収録5問の成績であり、採用試験の合否判定ではありません。</p></div>${results.map((r,i)=>`<details class="card"><summary>問題${i+1} · ${unit(r.q.id).name} · ${r.correct?'正解':r.v===null?'未回答':'不正解'}</summary><p class="question">${esc(r.q.text)}</p>${r.q.visual?`<div class="figure">${r.q.visual}</div>`:''}<p>あなたの回答：${r.v===null?'未回答':esc(r.v)+r.q.unit}<br>正解：<strong>${esc(r.q.answer)}${r.q.unit}</strong></p>${explanation(r.q)}</details>`).join('')}<div class="actions"><button id="againExam">別の5問に挑戦</button><button id="examHome">今日の学習に戻る</button></div></div>`;if($('#examGuide'))$('#examGuide').onclick=()=>start(first.q.id,first.q.l,'guide',first.q.seed);$('#againExam').onclick=beginExam;$('#examHome').onclick=()=>go('home');window.scrollTo(0,0);}
function exportState(){let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='ippo-exam-progress-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importState(e){let f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('サイズ');let s=validState(JSON.parse(await f.text()));if(!confirm('現在の新版の記録を、このバックアップで置き換えますか？'))return;clearClock();state=s;run=null;exam=null;storageOK=true;save();render();$('#restoreMsg').textContent='記録を読み込みました。';}catch(e){$('#restoreMsg').textContent='読み込めませんでした。新版の「記録を保存」で出したJSONを選んでください。';}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.nav));go('home');
</script></body></html>
