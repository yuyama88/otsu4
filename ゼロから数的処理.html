:root{--ink:#153943;--muted:#516970;--paper:#f3f7f8;--line:#d5e1e4;--accent:#087b77;--light:#e4f4f0;--gold:#e7ad36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:16px;line-height:1.85}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:white;color:var(--ink);font-weight:650;min-height:48px}button:hover{border-color:var(--accent);background:var(--light)}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#056763;color:white}.quiet{background:transparent}.wrap{max-width:1060px;margin:auto;padding:0 24px}header{background:var(--ink);color:white}header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:20px}.brand{font-size:23px;font-weight:850;letter-spacing:.1em}.brand small{font-size:12px;display:block;letter-spacing:.15em;color:#bddadf}.headnote{font-size:14px;color:#d1e5e8}nav{display:flex;gap:4px;padding:16px 0;overflow:auto}nav button{white-space:nowrap;border:0;background:transparent;padding:10px 18px}nav button.active{background:var(--ink);color:white}main{padding-bottom:64px}h1{font-size:clamp(25px,4vw,36px);line-height:1.5;margin:0 0 12px;letter-spacing:.02em}h2{font-size:22px;line-height:1.55;margin:0 0 14px}h3{font-size:18px;margin:0 0 10px}p{margin:8px 0 16px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.14em}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:28px;margin-bottom:20px}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;background:white;border-radius:22px;border:1px solid var(--line);overflow:hidden;margin-bottom:24px}.hero>div{padding:30px}.hero .aside{background:var(--ink);color:white;display:flex;flex-direction:column;justify-content:center}.big{font-size:46px;font-weight:800;line-height:1.3}.aside p{color:#c7dfe3}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.topic{background:white;padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px}.topic strong{font-size:18px}.topic small{font-size:13px;color:var(--muted);font-weight:400}.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;background:var(--light);color:#076460;font-weight:700}.topic .track{margin-top:auto}.track{height:6px;border-radius:5px;background:#e5ecee;overflow:hidden}.track>i{display:block;height:100%;background:var(--accent)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.lesson{max-width:780px;margin:auto}.stages{display:flex;gap:8px;margin:14px 0 24px}.stages span{flex:1;border-top:4px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted)}.stages .on{border-color:var(--accent);color:var(--accent);font-weight:800}.concept{border-left:4px solid var(--accent);padding:14px 20px;background:var(--light);border-radius:0 12px 12px 0;margin:20px 0}.question{font-size:22px;font-weight:750;line-height:1.8;white-space:pre-line;margin:24px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.options button{text-align:left;display:flex;gap:12px;align-items:center}.options .chosen{border:2px solid var(--ink)}.options .correct{border:2px solid var(--accent);background:var(--light);opacity:1}.options .wrong{border:2px solid #b84e34;background:#fff1ec;opacity:1}.letter{color:var(--muted);font-size:13px}.steps{counter-reset:step;list-style:none;padding:0;margin:16px 0}.steps li{counter-increment:step;position:relative;padding:15px 14px 15px 52px;margin:8px 0;background:#f1f6f7;border-radius:12px;white-space:pre-line}.steps li:before{content:counter(step);position:absolute;left:16px;top:15px;background:var(--ink);color:white;width:25px;height:25px;text-align:center;line-height:25px;border-radius:50%;font-size:13px}.notice{background:#fff5d9;border:1px solid #ebd48f;border-radius:12px;padding:14px 18px;margin:16px 0}.success{background:var(--light);border-radius:12px;padding:18px;margin:16px 0}.hint{padding:15px;background:#fff8e7;border-radius:12px;margin:14px 0}.small{font-size:14px}.figure{background:#f3f7f8;border-radius:14px;padding:14px;text-align:center;overflow:auto;margin:18px 0}.figure svg{max-width:100%;height:auto;max-height:210px}.cells{display:flex;gap:4px;justify-content:center}.cells b{width:30px;height:30px;background:#dbe5e7;border-radius:4px}.cells b.fill{background:var(--accent)}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:10px;border:1px solid var(--line);text-align:center}th{background:var(--light)}details{margin-top:18px}summary{cursor:pointer;color:var(--muted)}select{max-width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.statgrid>div{background:var(--paper);padding:18px;border-radius:12px}.statgrid b{font-size:26px;display:block}.foot{margin-top:30px;font-size:13px;color:var(--muted)}#alert{max-width:1012px;margin:12px auto}.hidden{display:none!important}@media(max-width:640px){.wrap{padding:0 16px}header .wrap{padding:15px 16px}.headnote{display:none}.hero{grid-template-columns:1fr;gap:0}.hero>div{padding:23px}.hero .aside{padding:18px 23px}.aside .big{font-size:32px}.aside p{margin:3px 0}.grid{grid-template-columns:1fr 1fr;gap:10px}.topic{padding:15px}.card{padding:22px 18px}.options{grid-template-columns:1fr}.question{font-size:20px}.statgrid>div{padding:12px}.statgrid{gap:7px}nav button{padding:10px 14px}.brand{font-size:21px}}
</style></head><body><header><div class="wrap"><div class="brand">いっぽずつ<small>ゼロから数的処理</small></div><div class="headnote">わからないところから、始めていい。</div></div></header><div id="alert" role="status"></div><div class="wrap"><nav aria-label="メイン"><button data-nav="home">今日の学習</button><button data-nav="topics">単元を選ぶ</button><button data-nav="review">復習</button><button data-nav="record">成長の記録</button></nav><main id="app"></main></div>
<script>
'use strict';
const TOPICS=[
['calc','計算の土台','準備','かけ算・割り算・計算の順番','教科書に入る前の準備','同じ数を何回も足すのが、かけ算。全体を同じ大きさに分けるのが、割り算。','12個を3人で同じ数ずつ分けるなら、12÷3＝4。1人4個。','割り算では「全部でいくつ」「何人で分ける」を先に探そう。'],
['fraction','分数の意味','準備','半分から分数の計算へ','教科書に入る前の準備','分数は「同じ大きさに分けたうちの、いくつ分か」。下の数が分ける数、上の数が取る数。','3/4（4分の3）は、4等分したうちの3つ分。20の3/4は20÷4×3＝15。','分母（下の数）は、足し算してもそのまま。大きさの単位だから。'],
['percent','割合・パーセント','数的推理','何％か・何％分か・値引き','BⅢ 第2章 割合と比／冊子p.23〜','％は「100個に分けたうちの何個分か」。10％＝10/100＝0.1。','200円の10％は200÷100×10＝20円。10％引きなら200−20＝180円。','「何％分」と「何％引きの値段」は別。引く金額が出たら、元の値段から引こう。'],
['ratio','比','数的推理','1つ分を見つけて分ける','BⅢ 第2章 割合と比／冊子p.23〜','2：3は「2つ分と3つ分」。実際の個数ではなく、大きさの関係を表す。','合計20個を2：3に分ける。全部で5つ分なので20÷5＝4。小さい方は4×2＝8個。','全体を分けるときは、まず比を足す。2：3なら全体は5つ分。'],
['multiple','倍数・約数','数的推理','共通の数を見つける','BⅢ 第1章 整数／冊子p.3〜','倍数は九九のように増える数。約数は、その数を余りなく割れる数。','4の倍数は4,8,12…。6の倍数は6,12,18…。最初に重なる12が最小公倍数。','周期が重なる問題は公倍数。同じ数ずつ配り切る問題は公約数。'],
['speed','速さ','数的推理','距離・時間・出会い','BⅢ 第4章 速さ／冊子p.50〜','時速4kmは、1時間で4km進む速さ。2時間なら4×2＝8km。','距離＝速さ×時間。時間＝距離÷速さ。30分は30÷60＝0.5時間。','時速なら時間を「時間」にそろえる。向かい合う2人の近づく速さは足す。'],
['mix','濃度','数的推理','食塩の量から考える','BⅢ 第2章 割合と比につながる練習','濃度は「食塩水全体のうち、食塩がどれだけか」。分母には水だけでなく食塩も含む。','食塩10g＋水90g＝食塩水100g。濃度は10÷100×100＝10％。','水だけを足しても、食塩そのものの量は変わらない。'],
['calendar','曜日と余り','数的推理','7日ごとに同じ曜日','BⅢ 第1章 整数につながる補助練習','曜日は7日で一周する。7日後は同じ曜日、8日後は1つ先の曜日。','月曜の10日後は、10＝7＋3なので3つ先。火→水→木で木曜。','「今日の○日後」は今日を0日とする。「今日を1日目として」とは数え方が違う。'],
['equation','方程式','数的推理','わからない数を□にする','BⅢ 第3章 方程式・不等式／冊子p.40〜','□は、まだわからない数の置き場所。両側に同じことをすれば、等しさは保たれる。','□＋3＝8なら両側から3を引く。□＝8−3＝5。','逆算は最後の操作から戻る。2×□＋3＝11なら、先に3を引く。'],
['work','仕事算','数的推理','1時間でできる量を考える','BⅢ 第5章 その他の文章題／冊子p.74〜','仕事の速さは「1時間で何個できるか」。2人で協力すると、1時間の作業量を足せる。','12個を3時間で作る人は1時間4個。1時間2個作る人となら、合わせて1時間6個。','完成までの時間を足してはいけない。1時間でできる仕事量を足そう。'],
['count','場合の数','数的推理','もれなく数える','BⅢ 第7章 場合の数／冊子p.100〜','選び方を、枝分かれにして数える。どれを選んでも次に同じ数の選択肢があれば、かけ算できる。','シャツ2種類×ズボン3種類＝6通り。同じ組合せを2回数えていないか確認する。','2人を選ぶとき「AとB」と「BとA」は同じ。順番を区別するかが大事。'],
['prob','確率','数的推理','当たりの数÷全部の数','BⅢ 第8章 確率／冊子p.112〜','同じ起こりやすさなら、確率＝当たりの結果の数÷全部の結果の数。','公平なサイコロで偶数は2,4,6の3個。全部6個なので3/6＝1/2。','「少なくとも1回」は「一度もない」を全体から引くと数えやすい。'],
['data','資料の読み取り','数的推理','表・差・増加率','BⅢ 第9章 資料解釈／冊子p.131〜','表は見出しと単位から読む。増加率は「増えた量÷元の量×100」。','100人から120人なら、増えたのは20人。20÷100×100＝20％増。','増加率の分母は「増えた後」ではなく「増える前」。'],
['logic','論理','判断推理','ならば・対偶・つなぐ','BⅠ 第1章 論理／冊子p.3〜','「AならばB」は、Aの人は全員Bということ。Bの人が全員Aとは限らない。','犬なら動物。でも動物なら犬、とは限らない。猫もいるから。','対偶は順番を逆にして両方否定。「犬→動物」なら「動物でない→犬でない」。'],
['sets','集合','判断推理','重なりを引く','BⅠ 第2章 集合の要素／冊子p.23〜','2つのグループを足すと、両方に入っている人を2回数える。その重なりを1回引く。','犬好き8人、猫好き7人、両方3人なら、どちらか好きは8＋7−3＝12人。','「どちらか好き」は両方好きも含む。「どちらでもない」は全体から引く。'],
['order','順序','判断推理','条件を並びにする','BⅠ 第3章 順序／冊子p.35〜','「AはBより前」は、間に誰かいてもいい。「AはBの直前」は隣どうし。','AはBより前、BはCより前なら、A→B→Cとつなげられる。','頭の中だけで抱えない。まず確定した並びや位置を書き出そう。'],
['match','対応','判断推理','○と×で候補を減らす','BⅠ 第5章 対応／冊子p.71〜','それぞれ別の担当なら、1人の担当が決まると、その担当はほかの人から消せる。','A・Bが赤・青を1つずつ持つ。Aが赤でないならAは青、残ったBは赤。','「違う」とわかった情報も大事。候補を消すと残りが答えになる。'],
['area','角度・面積','図形','数える・半分にする','BⅡ 第6章 平面図形の計量／冊子p.105〜','面積は1cm²の正方形がいくつ入るか。長方形は縦×横、三角形は底辺×高さ÷2。','横4cm・高さ3cmの長方形は12cm²。同じ底辺と高さの三角形は半分の6cm²。','三角形の高さは底辺に垂直な長さ。斜めの辺の長さではない。'],
['volume','体積','図形','積み重ねで考える','BⅡ 第7章 立体図形の計量／冊子p.153〜','体積は1cm³の小さな立方体がいくつ入るか。1段の個数×段数で考える。','縦2cm・横3cm・高さ4cmなら、1段6個が4段。2×3×4＝24cm³。','面積はcm²、体積はcm³。角すいは同じ底面積と高さの角柱の1/3。'],
['net','展開図','図形','面のつながりを見る','BⅡ 第4章 正多面体・展開図／冊子p.55〜','展開図は箱を切り開いた形。隣り合う面と向かい合う面を分けて考える。','立方体には面が6つ。上と下、左と右、前と後で向かい合う面が3組ある。','この練習の展開図では中央から2つ先の面が中央の向かい側になる。'],
['rotate','回転','図形','90度ずつ向きを変える','BⅡ 第1章 回転と軌跡への導入／冊子p.3〜','90度は一周の1/4。時計回りなら上→右→下→左と変わる。','上向きの矢印を時計回りに180度回すと下向き。90度を2回進めた結果。','時計回りと反時計回りを区別。360度回すと元の向き。'],
['path','道順','図形','交点までの行き方を足す','BⅡ 第2章 道順・一筆書き・位相／冊子p.25〜','右と上だけに進む最短経路では、その交点への道順は「左から来る数＋下から来る数」。','右に1回、上に1回なら、右→上と上→右の2通り。','曲がる位置が違えば別の道順。戻る道は最短経路に含めない。']
].map(([id,name,group,subtitle,source,idea,example,pitfall])=>({id,name,group,subtitle,source,idea,example,pitfall}));
const LEVELS=['はじめの一歩','基本を使う','一段ステップアップ'];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMPTY=()=>({version:1,stats:{},queue:[],days:{},last:null});
let state=EMPTY(),storageOK=true,view='home',session=null,phase=0,shown=0,answer=null,hinted=false;
try{const raw=localStorage.getItem('ippo-math-v1');if(raw)state=validate(JSON.parse(raw));}catch(e){storageOK=false;}
function validate(s){if(!s||s.version!==1||!s.stats||!Array.isArray(s.queue)||!s.days)throw Error('形式が違います');let out=EMPTY();for(const t of TOPICS){let v=s.stats[t.id];if(v){if(!Array.isArray(v.score)||v.score.length!==3||!v.score.every(x=>Number.isInteger(x)&&x>=0&&x<=3)||!['tries','correct'].every(k=>Number.isInteger(v[k])&&v[k]>=0&&v[k]<1e7)||v.correct>v.tries)throw Error('記録が不正です');out.stats[t.id]={score:v.score,tries:v.tries,correct:v.correct};}}for(const q of s.queue){if(!TOPICS.some(t=>t.id===q.id)||!Number.isInteger(q.level)||q.level<0||q.level>2||!Number.isInteger(q.seed)||q.seed<1||q.seed>2147483646||!Number.isFinite(q.due)||q.due<0||!Number.isInteger(q.stage)||q.stage<0||q.stage>2)throw Error('復習記録が不正です');out.queue.push({id:q.id,level:q.level,seed:q.seed,due:q.due,stage:q.stage});}for(const [k,v]of Object.entries(s.days)){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isInteger(v)&&v>=0&&v<1e7)out.days[k]=v;}if(s.last&&TOPICS.some(t=>t.id===s.last.id)&&Number.isInteger(s.last.level)&&s.last.level>=0&&s.last.level<=2&&Number.isInteger(s.last.seed)&&s.last.seed>0&&s.last.seed<=2147483646)out.last={id:s.last.id,level:s.last.level,seed:s.last.seed};return out;}
function save(){try{localStorage.setItem('ippo-math-v1',JSON.stringify(state));}catch(e){storageOK=false;}storageNotice();}
function storageNotice(){ $('#alert').innerHTML=storageOK?'':'<div class="notice">この環境では学習記録を保存できない可能性があります。「成長の記録」からバックアップを保存してください。</div>';}
function stat(id){return state.stats[id]||(state.stats[id]={score:[0,0,0],tries:0,correct:0});}
function currentLevel(id){let n=stat(id).score.findIndex(x=>x<3);return n<0?2:n;}
function dateKey(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const randSeed=()=>Math.floor(Math.random()*2147483645)+1;
function rng(seed){return ()=>{seed=seed*16807%2147483647;return(seed-1)/2147483646;};}
function gcd(a,b){while(b)[a,b]=[b,a%b];return a;}
const fmt=n=>Number.isInteger(n)?String(n):String(Number(n.toFixed(4)));
function makeQ(id,level,seed){const r=rng(seed),pick=a=>a[Math.floor(r()*a.length)],n=(a,b)=>a+Math.floor(r()*(b-a+1));let text='',correct='',steps=[],hint='',visual='',unit='',wrong=[];const l=level,a=n(2,6),b=n(2,5);let x,y,z;
function set(t,c,ss,h,u='',w=[]){text=t;correct=String(c);steps=ss;hint=h;unit=u;wrong=w.map(String);}
function rect(w,h,tri=false){return `<svg viewBox="0 0 320 170" role="img" aria-label="${tri?'直角三角形':'長方形'}。横${w}cm、高さ${h}cm。図は模式図です"><${tri?'polygon points="70,125 255,125 70,25"':'rect x="70" y="25" width="185" height="100"'} fill="#d4efea" stroke="#087b77" stroke-width="3"/><text x="160" y="152" text-anchor="middle">${w} cm</text><text x="8" y="80">${h} cm</text></svg>`;}
switch(id){
case'calc':if(l===0)set(`${a}個ずつ入った袋が${b}袋あります。全部で何個？`,a*b,[`1袋に${a}個。同じ量が${b}袋ある。`,`${Array(b).fill(a).join('＋')}＝${a*b}。`,`かけ算なら${a}×${b}＝${a*b}個。`],'同じ数を袋の数だけ足そう。','個',[a+b,a*b+a,a*b-a]);else if(l===1)set(`${a*b}個のお菓子を${b}人で同じ数ずつ分けます。1人何個？`,a,[`全部の${a*b}個を${b}人で分ける。`,`${a*b}÷${b}＝${a}。`,`${a}個×${b}人＝${a*b}個。元に戻るので確認できた。`],'全部の数÷人数。','個',[b,a*b,a+1]);else set(`${a}＋${b}×3 の答えは？`,a+b*3,[`足し算より先に、かけ算をする。`,`${b}×3＝${b*3}。`,`${a}＋${b*3}＝${a+b*3}。`],'まず「×」の部分だけ計算しよう。','',[(a+b)*3,a+b+3,a+b*2]);break;

if(phase===0){stage.innerHTML=`<h2>まず、言葉の意味から。</h2><div class="concept">${t.idea}</div><h3>たとえば、こんな考え方。</h3><p>${t.example}</p><p class="small muted">覚えきらなくて大丈夫。次は答えが出るまでを一手ずつ見よう。</p><button class="primary" id="guide">一緒に1問解いてみる</button>`;$('#guide').onclick=()=>{phase=1;shown=0;renderLesson();};}
else if(phase===1){let g=session.guide;stage.innerHTML=`<span class="eyebrow">お手本 · 答えまで一手ずつ</span><div class="question">${esc(g.text)}</div>${g.visual?`<div class="figure">${g.visual}</div>`:''}<ol class="steps">${g.steps.slice(0,shown).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${shown<g.steps.length?`<button class="primary" id="step">${shown?'次の一手を見る':'最初の一手を見る'}（${shown}/${g.steps.length}）</button>`:`<div class="success"><strong>答え：${esc(g.correct)}${g.unit}</strong><p class="small">次は自分で。迷ったらヒントを使って大丈夫。</p></div><button class="primary" id="practice">自分で解いてみる</button>`}<div class="actions"><button class="quiet" id="readAgain">説明に戻る</button></div>`;if($('#step'))$('#step').onclick=()=>{shown++;renderLesson();};if($('#practice'))$('#practice').onclick=()=>{phase=2;renderLesson();};$('#readAgain').onclick=()=>{phase=0;renderLesson();};}
else{stage.innerHTML=`<div class="row"><span class="eyebrow">${session.review?'思い出してみよう':'自分の力を試そう'}</span><span class="small muted">この段階：${stat(t.id).score[q.level]} / 3</span></div><div class="question">${esc(q.text)}</div>${q.visual?`<div class="figure">${q.visual}</div>`:''}<div class="options">${q.choices.map((v,i)=>`<button data-answer="${i}" ${answer!==null?'disabled':''} class="${answer!==null&&v===q.correct?'correct':answer===v?'wrong':''}"><span class="letter">${i+1}</span><span>${esc(v)}${q.unit}</span></button>`).join('')}</div><div id="feedback" aria-live="polite">${answer!==null?feedback():hinted?`<div class="hint"><strong>ヒント</strong><br>${q.hint}</div>`:''}</div>${answer===null?`<div class="actions"><button id="hint">${hinted?'ヒントを表示中':'ヒントを見る'}</button><button class="quiet" id="unknown">わからない・解き方を見る</button></div>`:`<div class="actions"><button class="primary" id="next">${session.count>=5?'今日のふりかえり':'次へ'}</button></div>`}<details><summary>メモを書く</summary><textarea aria-label="計算用メモ（記録には保存されません）" placeholder="式や条件を書いてみよう。メモはこの画面を離れると消えます。" style="width:100%;min-height:130px;font:inherit;padding:12px;border:1px solid #d5e1e4;border-radius:10px"></textarea></details>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submit(q.choices[+b.dataset.answer]));if($('#hint'))$('#hint').onclick=()=>{hinted=true;renderLesson();};if($('#unknown'))$('#unknown').onclick=()=>submit('__unknown__');if($('#next'))$('#next').onclick=next;}}
function feedback(){let q=session.q,correct=answer===q.correct,own=correct&&!hinted;return `<div class="${correct?'success':'notice'}"><h3>${own?'自分で解けた！':correct?'ヒントを使って解けた！':'ここから、解き方を覚えよう。'}</h3><div>答え：<strong>${esc(q.correct)}${q.unit}</strong></div><p class="small">${own?(session.promoted?'この段階で3回自力正解。次の段階へ進もう。':'考え方を確かめて、次の一問へ。'):'この問題は復習ノートに残しました。'}</p></div><h3>どうして、この答えになる？</h3><ol class="steps">${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="concept small">${TOPICS.find(t=>t.id===q.id).pitfall}</div>`;}
function submit(v){if(answer!==null)return;let q=session.q,s=stat(q.id),own=v===q.correct&&!hinted;answer=v;s.tries++;session.count++;session.seen.push(`${q.id}|${q.level}|${q.seed}`);state.days[dateKey()]=(state.days[dateKey()]||0)+1;session.promoted=false;let i=state.queue.findIndex(x=>x.id===q.id&&x.level===q.level&&x.seed===q.seed);if(own){s.correct++;session.correct++;let old=s.score[q.level];s.score[q.level]=Math.min(3,old+1);session.promoted=old===2&&q.level<2;if(i>=0){let item=state.queue[i];item.stage++;if(item.stage>=3)state.queue.splice(i,1);else item.due=Date.now()+(item.stage===1?1:3)*86400000;}}else{if(v!==q.correct)s.score[q.level]=Math.max(0,s.score[q.level]-1);let item={id:q.id,level:q.level,seed:q.seed,stage:0,due:Date.now()};if(i>=0)state.queue[i]=item;else state.queue.push(item);}state.last=null;save();renderLesson();}
function next(){if(session.count>=5){finish();return;}if(session.review){let q=state.queue.find(q=>q.due<=Date.now()&&!session.seen.includes(`${q.id}|${q.level}|${q.seed}`));if(!q){finish();return;}session.id=q.id;session.level=q.level;session.q=makeQ(q.id,q.level,q.seed);}else{if(session.promoted){session.level++;phase=1;shown=0;session.guide=makeQ(session.id,session.level,randSeed());}session.q=makeQ(session.id,session.level,randSeed());}answer=null;hinted=false;session.promoted=false;state.last={id:session.id,level:session.level,seed:session.q.seed};save();renderLesson();window.scrollTo(0,0);}
function finish(){let s=session,t=TOPICS.find(t=>t.id===s.id),nextT=progress(t.id)===9?TOPICS[TOPICS.indexOf(t)+1]||t:t;$('#app').innerHTML=`<div class="lesson card"><span class="eyebrow">今日の一歩、おつかれさま。</span><h1>${s.count}問、取り組めた。</h1><p class="big">${s.correct}<span style="font-size:18px"> / ${s.count}問 自力で正解</span></p><p>${s.correct===s.count?'よくできました。時間をあけて解き直すと、覚えたことを確かめられるよ。':'正解できなかった問題も、解説を読んだ分だけ前進。復習ノートでもう一度練習しよう。'}</p><div class="concept"><strong>今回の振り返り：${t.name}</strong><br>${t.pitfall}</div><p>次のおすすめ：<strong>${nextT.name} · ${LEVELS[currentLevel(nextT.id)]}</strong></p><div class="actions"><button class="primary" id="more">もう5問</button><button id="finishHome">今日はここまで</button><button id="finishReview">復習ノート</button></div></div>`;state.last=null;save();$('#more').onclick=()=>start(nextT.id,currentLevel(nextT.id));$('#finishHome').onclick=()=>go('home');$('#finishReview').onclick=()=>go('review');window.scrollTo(0,0);}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ippo-progress-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importData(e){let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('ファイルが大きすぎます');let s=validate(JSON.parse(await f.text()));if(!confirm('現在の学習記録を、バックアップの記録で置き換えますか？'))return;state=s;storageOK=true;session=null;save();render();$('#importStatus').textContent='記録を読み込みました。';}catch(e){$('#importStatus').textContent='読み込めませんでした。いっぽずつのバックアップJSONを選んでください。';}}
document.querySelectorAll('nav [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));go('home');
</script></body></html>
