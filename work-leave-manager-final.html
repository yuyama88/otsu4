<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤務管理">
<title>勤務・休暇管理</title>
<style>
:root{
 --bg:#f2f5fb;--card:#fff;--card2:#f8fafc;--text:#172033;--muted:#687386;
 --line:#dbe2ec;--blue:#2563eb;--blue2:#dbeafe;--red:#dc2626;--green:#16a34a;
 --orange:#ea580c;--purple:#9333ea;--cyan:#0891b2;--shadow:0 10px 35px rgba(15,23,42,.09);
}
body.dark{--bg:#0f172a;--card:#172033;--card2:#202b40;--text:#f8fafc;--muted:#a7b2c5;--line:#334155;--blue:#60a5fa;--blue2:#1e3a5f;--shadow:0 10px 35px rgba(0,0,0,.3)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit}.app{width:min(100%,1040px);margin:auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.top h1{margin:0;font-size:26px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}
.icon{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.sum{padding:11px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.sum span{display:block;color:var(--muted);font-size:11px}.sum strong{display:block;margin-top:4px;font-size:22px}.sum.big strong{color:var(--blue)}
.layout{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}.calendar{overflow:hidden}.calhead{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;padding:13px}
.nav{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);font-size:22px}.period{text-align:center}.period strong{display:block;font-size:20px}.period small{color:var(--muted);font-weight:700}.period button{border:0;background:transparent;color:var(--blue);font-weight:800;margin-top:4px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{padding:0 7px;color:var(--muted);font-size:12px;font-weight:800;text-align:center}.week div{padding:8px 2px}.week div:first-child{color:#ef4444}.week div:last-child{color:#3b82f6}
.grid{gap:1px;background:var(--line);border-top:1px solid var(--line)}.day{position:relative;min-height:98px;border:0;background:var(--card);color:var(--text);padding:7px 5px;text-align:left;overflow:hidden}
.day.out{opacity:.25}.day.today:after{content:"";position:absolute;inset:3px;border:2px solid var(--blue);border-radius:11px;pointer-events:none}.num{font-weight:900;font-size:14px}.sun .num,.holiday .num{color:#ef4444}.sat .num{color:#2563eb}
.company{display:block;margin-top:5px;border-radius:7px;padding:4px 2px;text-align:center;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record{display:block;margin-top:3px;border-radius:7px;padding:4px 2px;text-align:center;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{position:absolute;right:6px;top:7px;width:7px;height:7px;border-radius:50%;background:#f59e0b}
.side{padding:14px}.side h2{margin:0 0 10px;font-size:17px}.box{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.box-title{color:var(--muted);font-size:12px;margin-bottom:8px}
.pair{display:flex;justify-content:space-between;gap:8px;align-items:end}.pair strong{font-size:24px;color:var(--blue)}.mini{color:var(--muted);font-size:11px;line-height:1.6;margin-top:7px}
.fieldline{display:flex;justify-content:space-between;align-items:center;gap:8px}.fieldline input{width:85px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);text-align:right}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:800}.actions .primary{background:var(--blue);color:white;border-color:var(--blue)}.actions .danger{color:var(--red)}
.help{font-size:11px;color:var(--muted);line-height:1.65;margin:10px 2px 0}
.modalbg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:20;align-items:flex-end;justify-content:center;padding:10px}.modalbg.show{display:flex}
.modal{width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--card);border-radius:22px;padding:17px;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 25px 80px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}.plan{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;line-height:1.5;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px;font-weight:800}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);padding:11px}textarea{min-height:75px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.row2 button,.fullbtn{border:0;border-radius:12px;padding:12px;font-weight:900}.cancel{background:var(--card2);color:var(--text);border:1px solid var(--line)!important}.save{background:var(--blue);color:white}.fullbtn{width:100%;margin-top:8px;background:transparent;color:var(--red);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,25px);opacity:0;transition:.2s;background:#111827;color:white;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:800;z-index:40}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.day{min-height:80px}.company,.record{font-size:8px}.side{padding:12px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>勤務・休暇管理</h1><p>16日〜翌15日｜午前・午後対応｜自動保存</p></div><button class="icon" id="theme">☾</button></header>

<section class="summary">
 <div class="sum"><span>有休残り</span><strong id="paidRemain">0日</strong></div>
 <div class="sum big"><span>代休残り</span><strong id="compRemain">0日</strong></div>
 <div class="sum"><span>代休獲得</span><strong id="compEarned">0日</strong></div>
 <div class="sum"><span>欠勤合計</span><strong id="absenceTotal">0日</strong></div>
</section>

<section class="layout">
 <div class="card calendar">
  <div class="calhead"><button class="nav" id="prev">‹</button><div class="period"><strong id="title"></strong><small id="range"></small><button id="today">今月へ戻る</button></div><button class="nav" id="next">›</button></div>
  <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
  <div class="grid" id="grid"></div>
 </div>
 <aside class="card side">
  <h2>表示期間の実績</h2>
  <div class="box"><div class="box-title">出勤</div><div class="pair"><span>勤務実績</span><strong id="workTotal">0日</strong></div><div class="mini" id="workDetail"></div></div>
  <div class="box"><div class="box-title">休暇・欠勤</div><div class="mini" id="leaveDetail"></div></div>
  <div class="box"><div class="fieldline"><span>有休付与日数</span><input id="paidAllowance" type="number" min="0" step=".5" value="0"></div></div>
  <div class="box"><div class="box-title">会社予定の修正</div><div class="mini">日付を押して「会社予定」タブから、出勤日・休日を個別に変更できます。</div></div>
  <div class="actions">
   <button class="primary" id="backup">バックアップ</button>
   <button id="restore">復元</button>
   <button id="csv">CSV出力</button>
   <button class="danger" id="clear">記録削除</button>
  </div>
  <p class="help">記録はIndexedDBとlocalStorageへ二重保存します。Safariの履歴・Webサイトデータを消去すると消える可能性があるため、定期的にバックアップしてください。</p>
  <input id="file" class="hidden" type="file" accept=".json,application/json">
 </aside>
</section>
</main>

<div class="modalbg" id="modalbg"><div class="modal">
 <h3 id="modalTitle"></h3>
 <div class="plan" id="plan"></div>
 <div class="tabs"><button class="active" id="recordTab">自分の実績</button><button id="companyTab">会社予定</button></div>
 <div id="recordPane">
  <label for="status">実績を選択</label>
  <select id="status"></select>
  <label for="note">メモ</label>
  <textarea id="note" placeholder="例：午前のみ出勤、通院、振替理由など"></textarea>
 </div>
 <div id="companyPane" class="hidden">
  <label for="companyStatus">この日の会社予定</label>
  <select id="companyStatus">
   <option value="auto">自動判定に戻す</option>
   <option value="work">会社出勤日</option>
   <option value="off">会社休日</option>
  </select>
  <label for="companyNote">会社予定のメモ</label>
  <textarea id="companyNote" placeholder="例：会社カレンダー上の土曜休み、臨時出勤日"></textarea>
 </div>
 <div class="row2"><button class="cancel" id="cancel">閉じる</button><button class="save" id="save">保存</button></div>
 <button class="fullbtn" id="deleteDay">この日の個人記録と会社予定修正を削除</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const LS="workLeaveManagerV1",DBN="workLeaveManagerDB",STORE="state",KEY="main";
const STATUSES={
 none:{label:"会社予定どおり",work:0,paid:0,compUse:0,absence:0,bg:"#e2e8f0",fg:"#334155"},
 workFull:{label:"出勤（1日）",work:1,bg:"#dcfce7",fg:"#166534"},
 workAM:{label:"午前出勤",work:.5,bg:"#dcfce7",fg:"#166534"},
 workPM:{label:"午後出勤",work:.5,bg:"#dcfce7",fg:"#166534"},
 paidFull:{label:"有休（1日）",paid:1,bg:"#f3e8ff",fg:"#6b21a8"},
 paidAM:{label:"午前有休",paid:.5,bg:"#fae8ff",fg:"#86198f"},
 paidPM:{label:"午後有休",paid:.5,bg:"#fae8ff",fg:"#86198f"},
 compFull:{label:"代休（1日）",compUse:1,bg:"#cffafe",fg:"#155e75"},
 compAM:{label:"午前代休",compUse:.5,bg:"#ecfeff",fg:"#155e75"},
 compPM:{label:"午後代休",compUse:.5,bg:"#ecfeff",fg:"#155e75"},
 absentFull:{label:"欠勤（1日）",absence:1,bg:"#fee2e2",fg:"#991b1b"},
 absentAM:{label:"午前欠勤",absence:.5,bg:"#fff1f2",fg:"#9f1239"},
 absentPM:{label:"午後欠勤",absence:.5,bg:"#fff1f2",fg:"#9f1239"},
 satFull:{label:"土曜出勤（1日）",work:1,compEarn:1,bg:"#ffedd5",fg:"#9a3412"},
 satAM:{label:"午前土曜出勤",work:.5,compEarn:.5,bg:"#fff7ed",fg:"#9a3412"},
 satPM:{label:"午後土曜出勤",work:.5,compEarn:.5,bg:"#fff7ed",fg:"#9a3412"},
 special:{label:"特別休暇",bg:"#ede9fe",fg:"#5b21b6"},
 other:{label:"その他",bg:"#e2e8f0",fg:"#334155"}
};
let state={entries:{},company:{},paidAllowance:0,theme:"system",updatedAt:new Date().toISOString()},db=null,selected=null,view=periodMonth(new Date());

const $=id=>document.getElementById(id);
function d(y,m,day){return new Date(y,m,day,12)}
function key(x){return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`}
function parse(k){let [y,m,z]=k.split("-").map(Number);return d(y,m-1,z)}
function add(x,n){let q=d(x.getFullYear(),x.getMonth(),x.getDate());q.setDate(q.getDate()+n);return q}
function periodMonth(x){return x.getDate()<=15?d(x.getFullYear(),x.getMonth(),1):d(x.getFullYear(),x.getMonth()+1,1)}
function period(){return{start:d(view.getFullYear(),view.getMonth()-1,16),end:d(view.getFullYear(),view.getMonth(),15)}}
function dates(a,b){let r=[];for(let x=a;key(x)<=key(b);x=add(x,1))r.push(x);return r}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function nth(y,m,w,n){let f=d(y,m,1),delta=(w-f.getDay()+7)%7;return add(f,delta+(n-1)*7)}
function ve(y){return Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4))}
function ae(y){return Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4))}
const holidayCache=new Map();
function holidays(y){
 if(holidayCache.has(y))return holidayCache.get(y);
 let m=new Map(),put=(x,n)=>m.set(key(x),n);
 put(d(y,0,1),"元日");put(nth(y,0,1,2),"成人の日");put(d(y,1,11),"建国記念の日");put(d(y,1,23),"天皇誕生日");put(d(y,2,ve(y)),"春分の日");
 put(d(y,3,29),"昭和の日");put(d(y,4,3),"憲法記念日");put(d(y,4,4),"みどりの日");put(d(y,4,5),"こどもの日");put(nth(y,6,1,3),"海の日");
 put(d(y,7,11),"山の日");put(nth(y,8,1,3),"敬老の日");put(d(y,8,ae(y)),"秋分の日");put(nth(y,9,1,2),"スポーツの日");put(d(y,10,3),"文化の日");put(d(y,10,23),"勤労感謝の日");
 for(let x=d(y,0,2);x<=d(y,11,30);x=add(x,1)){if(!m.has(key(x))&&x.getDay()!=0&&m.has(key(add(x,-1)))&&m.has(key(add(x,1))))m.set(key(x),"国民の休日")}
 for(const [k] of [...m]){let x=parse(k);if(x.getDay()==0){let s=add(x,1);while(m.has(key(s)))s=add(s,1);if(s.getFullYear()==y)m.set(key(s),"振替休日")}}
 holidayCache.set(y,m);return m
}
function holiday(x){return holidays(x.getFullYear()).get(key(x))||""}
function special(x){let m=x.getMonth()+1,z=x.getDate();if(m==8&&[13,14,15].includes(z))return"夏季休暇";if((m==12&&[30,31].includes(z))||(m==1&&z==4))return"冬季休暇";if(m==3&&z==8)return"創立記念日";return""}
function weekHoliday(sat){let mon=add(sat,-5);for(let i=0;i<5;i++)if(holiday(add(mon,i)))return true;return false}
function autoPlan(x){
 let h=holiday(x);if(h)return{status:"off",label:"祝日",reason:h,type:"holiday"};
 if(x.getDay()==0)return{status:"off",label:"日曜休み",reason:"日曜日",type:"sun"};
 let sp=special(x);if(sp)return{status:"off",label:sp,reason:sp,type:"special"};
 if(x.getDay()==6){if(weekHoliday(x))return{status:"work",label:"土曜出勤",reason:"祝日がある週",type:"satwork"};return{status:"off",label:"土曜休み",reason:"通常土曜",type:"satoff"}}
 return{status:"work",label:"出勤",reason:"通常勤務",type:"work"}
}
function plan(x){
 let ov=state.company[key(x)],a=autoPlan(x);
 if(!ov||ov.status=="auto")return a;
 return{status:ov.status,label:ov.status=="work"?"会社出勤日":"会社休日",reason:ov.note||"手動修正",type:ov.status=="work"?"work":"satoff",override:true}
}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbget(){return new Promise(res=>{if(!db)return res(null);let r=db.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
function dbput(v){return new Promise(res=>{if(!db)return res();let t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,KEY);t.oncomplete=()=>res();t.onerror=()=>res()})}
async function load(){let a=null,b=null;try{await openDB();a=await dbget()}catch{}try{b=JSON.parse(localStorage.getItem(LS)||"null")}catch{};let pick=(Date.parse(a?.updatedAt||0)>=Date.parse(b?.updatedAt||0)?a:b);if(pick)state={...state,...pick,entries:pick.entries||{},company:pick.company||{}};$("paidAllowance").value=state.paidAllowance||0;theme()}
async function save(show=false){state.updatedAt=new Date().toISOString();try{localStorage.setItem(LS,JSON.stringify(state))}catch{}await dbput(JSON.parse(JSON.stringify(state)));if(show)toast("保存しました")}
function theme(){let dark=state.theme=="dark"||(state.theme=="system"&&matchMedia("(prefers-color-scheme:dark)").matches);document.body.classList.toggle("dark",dark);$("theme").textContent=dark?"☀":"☾"}
function render(){
 let p=period();$("title").textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;$("range").textContent=`（${p.start.getMonth()+1}/${p.start.getDate()}〜${p.end.getMonth()+1}/${p.end.getDate()}）`;
 let start=add(p.start,-p.start.getDay()),end=add(p.end,6-p.end.getDay()),g=$("grid");g.innerHTML="";
 for(let x of dates(start,end)){let k=key(x),pl=plan(x),e=state.entries[k],st=e&&STATUSES[e.status];let b=document.createElement("button");b.className="day";if(k<key(p.start)||k>key(p.end))b.classList.add("out");if(x.getDay()==0)b.classList.add("sun");if(x.getDay()==6)b.classList.add("sat");if(holiday(x))b.classList.add("holiday");if(key(new Date())==k)b.classList.add("today");
 b.innerHTML=`<span class="num">${x.getDate()}</span>${e?.note?'<span class="dot"></span>':""}<span class="company" style="background:${pl.status=="work"?"#dcfce7":"#dbeafe"};color:${pl.status=="work"?"#166534":"#1e40af"}">${pl.label}</span>${st&&e.status!="none"?`<span class="record" style="background:${st.bg};color:${st.fg}">${st.label}</span>`:""}`;
 b.onclick=()=>openModal(k);g.appendChild(b)}
 stats()
}
function effectiveWork(x,e){
 let pl=plan(x);if(!e||e.status=="none")return pl.status=="work"?1:0;
 let s=STATUSES[e.status];if(["paidFull","compFull","absentFull","special"].includes(e.status))return 0;
 if(["paidAM","paidPM","compAM","compPM","absentAM","absentPM"].includes(e.status))return .5;
 if(s.work!=null)return s.work;return pl.status=="work"?1:0
}
function stats(){
 let p=period(),work=0,paid=0,absence=0,detail={workFull:0,workAM:0,workPM:0,paidFull:0,paidAM:0,paidPM:0,compFull:0,compAM:0,compPM:0,absentFull:0,absentAM:0,absentPM:0,satFull:0,satAM:0,satPM:0};
 for(let x of dates(p.start,p.end)){let e=state.entries[key(x)];work+=effectiveWork(x,e);if(e&&detail[e.status]!=null)detail[e.status]++;let s=e&&STATUSES[e.status];paid+=s?.paid||0;absence+=s?.absence||0}
 $("workTotal").textContent=fmt(work)+"日";
 $("workDetail").textContent=`1日出勤 ${detail.workFull}回／午前 ${detail.workAM}回／午後 ${detail.workPM}回／土曜1日 ${detail.satFull}回／土曜午前 ${detail.satAM}回／土曜午後 ${detail.satPM}回`;
 $("leaveDetail").textContent=`有休 ${fmt(paid)}日（午前${detail.paidAM}・午後${detail.paidPM}）／代休 ${fmt(detail.compFull+detail.compAM*.5+detail.compPM*.5)}日／欠勤 ${fmt(absence)}日（午前${detail.absentAM}・午後${detail.absentPM}）`;
 let allPaid=0,earned=0,used=0,abs=0;
 for(const [k,e] of Object.entries(state.entries)){let s=STATUSES[e.status];allPaid+=s?.paid||0;abs+=s?.absence||0;let x=parse(k),pl=plan(x);if(x.getDay()==6&&pl.status=="off")earned+=s?.compEarn||0;if(x.getDay()>=1&&x.getDay()<=5&&pl.status=="work")used+=s?.compUse||0}
 $("paidRemain").textContent=fmt(Math.max(0,(+state.paidAllowance||0)-allPaid))+"日";$("compEarned").textContent=fmt(earned)+"日";$("compRemain").textContent=fmt(earned-used)+"日";$("absenceTotal").textContent=fmt(abs)+"日";
}
function options(){let groups=[["基本",["none","workFull","workAM","workPM"]],["有休",["paidFull","paidAM","paidPM"]],["代休",["compFull","compAM","compPM"]],["欠勤",["absentFull","absentAM","absentPM"]],["土曜出勤",["satFull","satAM","satPM"]],["その他",["special","other"]]];$("status").innerHTML=groups.map(([n,ks])=>`<optgroup label="${n}">${ks.map(k=>`<option value="${k}">${STATUSES[k].label}</option>`).join("")}</optgroup>`).join("")}
function openModal(k){selected=k;let x=parse(k),pl=plan(x),e=state.entries[k]||{status:"none",note:""},c=state.company[k]||{status:"auto",note:""};$("modalTitle").textContent=`${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`;$("plan").innerHTML=`会社予定：<b>${pl.label}</b><br>${pl.reason}${pl.override?"（手動修正）":""}`;$("status").value=e.status||"none";$("note").value=e.note||"";$("companyStatus").value=c.status||"auto";$("companyNote").value=c.note||"";tab("record");$("modalbg").classList.add("show")}
function tab(which){let r=which=="record";$("recordPane").classList.toggle("hidden",!r);$("companyPane").classList.toggle("hidden",r);$("recordTab").classList.toggle("active",r);$("companyTab").classList.toggle("active",!r)}
function close(){selected=null;$("modalbg").classList.remove("show")}
function saveModal(){if(!selected)return;let st=$("status").value,n=$("note").value.trim(),cs=$("companyStatus").value,cn=$("companyNote").value.trim();if(st=="none"&&!n)delete state.entries[selected];else state.entries[selected]={status:st,note:n};if(cs=="auto"&&!cn)delete state.company[selected];else state.company[selected]={status:cs,note:cn};save(true);close();render()}
function deleteDay(){if(!selected)return;delete state.entries[selected];delete state.company[selected];save(true);close();render()}
function toast(m){let t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),1700)}
function backup(){let blob=new Blob([JSON.stringify({app:"勤務・休暇管理",state},null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`勤務管理バックアップ_${key(new Date()).replaceAll("-","")}.json`;a.click();URL.revokeObjectURL(u)}
async function restore(f){try{let j=JSON.parse(await f.text()),v=j.state||j;if(!v.entries)throw 0;state={...state,...v,entries:v.entries||{},company:v.company||{}};$("paidAllowance").value=state.paidAllowance||0;await save();theme();render();toast("復元しました")}catch{alert("正しいバックアップファイルを選んでください")}}
function csv(){
 let rows=[["日付","会社予定","個人実績","勤務換算","有休","代休獲得","代休使用","欠勤","メモ"]];
 let keys=[...new Set([...Object.keys(state.entries),...Object.keys(state.company)])].sort();
 for(let k of keys){let x=parse(k),pl=plan(x),e=state.entries[k]||{status:"none",note:""},s=STATUSES[e.status];let earn=(x.getDay()==6&&pl.status=="off")?(s?.compEarn||0):0,use=(x.getDay()>=1&&x.getDay()<=5&&pl.status=="work")?(s?.compUse||0):0;rows.push([k,pl.label,s?.label||"",effectiveWork(x,e),s?.paid||0,earn,use,s?.absence||0,e.note||""])}
 let text="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),blob=new Blob([text],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="勤務記録.csv";a.click();URL.revokeObjectURL(u)
}
async function clearAll(){if(!confirm("個人記録と会社予定の修正をすべて削除します。よろしいですか？"))return;let th=state.theme;state={entries:{},company:{},paidAllowance:0,theme:th,updatedAt:new Date().toISOString()};$("paidAllowance").value=0;await save();render();toast("削除しました")}
$("prev").onclick=()=>{view=d(view.getFullYear(),view.getMonth()-1,1);render()};$("next").onclick=()=>{view=d(view.getFullYear(),view.getMonth()+1,1);render()};$("today").onclick=()=>{view=periodMonth(new Date());render()};
$("theme").onclick=()=>{state.theme=document.body.classList.contains("dark")?"light":"dark";theme();save()};$("recordTab").onclick=()=>tab("record");$("companyTab").onclick=()=>tab("company");$("cancel").onclick=close;$("save").onclick=saveModal;$("deleteDay").onclick=deleteDay;
$("modalbg").onclick=e=>{if(e.target==$("modalbg"))close()};$("paidAllowance").onchange=e=>{state.paidAllowance=Math.max(0,Math.round((+e.target.value||0)*2)/2);e.target.value=state.paidAllowance;save(true);stats()};
$("backup").onclick=backup;$("restore").onclick=()=>$("file").click();$("file").onchange=e=>e.target.files[0]&&restore(e.target.files[0]);$("csv").onclick=csv;$("clear").onclick=clearAll;
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});window.addEventListener("pagehide",()=>save());
(async()=>{options();await load();render()})();
</script>
</body>
</html>
