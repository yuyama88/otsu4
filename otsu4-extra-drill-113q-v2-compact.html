r-color:#6a2a2a}.row{display:flex;gap:10px}.row>*{flex:1}.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 10px}.progress>div{height:100%;background:var(--accent);transition:width .2s}.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.qtitle{font-size:18px;font-weight:950;line-height:1.52;white-space:pre-wrap;margin-bottom:10px}.source{font-size:11px;color:var(--muted);font-weight:750;margin:4px 0 10px}.figure{margin:10px 0 12px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px;text-align:center;overflow:hidden}.figure img{max-width:100%;max-height:320px;object-fit:contain;display:block;margin:auto;cursor:zoom-in}.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:16px;padding:12px 13px;margin:8px 0;font-weight:800;font-size:16px;line-height:1.4}.opt .n{flex:0 0 26px;font-size:18px;font-weight:950}.opt.selected{outline:2px solid #7fa7d8;background:var(--sel)}.opt.correct{background:var(--ok2);border-color:var(--ok);outline:none}.opt.wrong{background:var(--ng2);border-color:var(--ng);outline:none}.opt:disabled{opacity:1}.hint{font-size:12px;color:var(--muted);margin:4px 0 8px;font-weight:750}.result{margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--line);line-height:1.5}.result.ok{background:var(--ok2);border-color:var(--ok)}.result.ng{background:var(--ng2);border-color:var(--ng)}.explain{margin-top:7px;font-size:13px;white-space:pre-wrap}.next{width:100%;margin-top:10px;padding:12px;border-radius:15px;border:0;background:var(--accent);color:var(--bg);font-weight:950;font-size:16px}body.light .next{color:white;background:#111827}.theme{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:50;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 13px;font-size:14px;font-weight:900;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;text-align:center;padding:10px 5px}.stat b{font-size:19px;display:block}.stat span{font-size:10px;color:var(--muted);font-weight:800}.tiny{font-size:11px;color:var(--muted);line-height:1.45}.finishScore{font-size:40px;font-weight:950;margin:2px 0}.listitem{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal img{max-width:100%;max-height:92vh;object-fit:contain;background:#fff;border-radius:10px}.notice{padding:10px 12px;border:1px solid #765c28;background:rgba(150,105,20,.12);border-radius:12px;color:#ffd27d;font-size:12px;line-height:1.45;margin:8px 0}body.light .notice{color:#7a5100;background:#fff7dc}.split{display:flex;gap:8px;flex-wrap:wrap}.split .badge{flex:0 0 auto}

const QUESTIONS=[{"id":"extra-drill-001","subject":"物理・化学","category":"燃焼・表面積","difficulty":"","type":"選択問題","question":"粒子の燃焼は粒子表面での反応が律速となるため、比表面積が燃焼性に影響する。直径1cm（1×10⁻²m）の球体を粉砕して直径1μm（1×10⁻⁶m）の球状粒子にしたとすると、比表面積は何倍になるか。","options":["10²倍","10³倍","10⁴倍","10⁶倍","10⁸倍"],"correct":[2],"explanation":"同じ質量（体積）なら総表面積は粒径に反比例します。直径の比は10⁻²/10⁻⁶=10⁴なので、比表面積は10⁴倍です。","source":"追加問題10.pdf p.1","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":1,"originalId":"extra-20260905-001","bundle":"追加問題10"},{"id":"extra-drill-002","subject":"物理・化学","category":"燃焼形態","difficulty":"","type":"複数選択","question":"次に掲げる物質と主な燃焼の形態の組合せとして、次の1〜13のうち、誤っているものを2つ選べ。","options":["石炭……分解燃焼","ナフタレン……蒸発燃焼","エタノール……蒸発燃焼","紙……分解燃焼","灯油……蒸発燃焼","木炭……表面燃焼","木材……分解燃焼","重油……表面燃焼","硫黄……蒸発燃焼","セルロイド……内部（自己）燃焼","ガソリン……分解燃焼","固形アルコール……蒸発燃焼","ニトロセルロース……内部（自己）燃焼"],"correct":[7,10],"explanation":"重油とガソリンはいずれも液体で、主な燃焼形態は蒸発燃焼です。したがって「重油→表面燃焼」と「ガソリン→分解燃焼」が誤りです。","source":"追加問題10.pdf p.2","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":2,"originalId":"extra-20260905-002","bundle":"追加問題10"},{"id":"extra-drill-003","subject":"物理・化学","category":"燃焼形態","difficulty":"","type":"複数選択","question":"次の物質のうち、主な燃焼の方法が表面燃焼であるものを2つ選べ。","options":["プロパンガス","木炭","固形アルコール","木材","ガソリン","硫黄","コークス","アルコール","ニトロセルロース"],"correct":[1,6],"explanation":"表面燃焼の代表例は木炭・コークスです。木材は分解燃焼、液体や硫黄・固形アルコールは主に蒸発燃焼です。","source":"追加問題10.pdf p.3","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":3,"originalId":"extra-20260905-003","bundle":"追加問題10"},{"id":"extra-drill-004","subject":"物理・化学","category":"引火・発火","difficulty":"","type":"選択問題","question":"液体Aおよび液体Bについて、引火または発火する可能性があるのは、次のうちどれか。なお、液体Bは、水または液体Aとの混合により化学反応等の変化を起こさないものとする。\n\n液体A：非水溶性、引火点11℃、発火点464℃、燃焼範囲7.3〜36vol%\n液体B：水溶性、引火点13℃、発火点423℃、燃焼範囲4.3〜19vol%","options":["Aの蒸気1Lと空気100Lとの混合気体中で電気火花を飛ばす。","Aを炎その他の点火源に接触させないで20℃まで温める。","Bを500℃に熱した鉄板上にたらす。","B 1Lを水10Lに溶かした液温10℃の溶液に炎を接近させる。","AとBの混合液を50℃に温めたガラス容器に入れる。"],"correct":[2],"explanation":"液体Bの発火点は423℃なので、500℃の鉄板上では点火源なしでも発火し得ます。A蒸気1L/空気100Lは約0.99vol%で燃焼下限7.3vol%未満です。","source":"追加問題10.pdf p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":4,"originalId":"extra-20260905-004","bundle":"追加問題10"},{"id":"extra-drill-005","subject":"物理・化学","category":"電気火災","difficulty":"","type":"選択問題","question":"防爆性能の表示のない次の電気機器が使用中に可燃性蒸気と接触した場合、点火源となるおそれが最も少ないものはどれか。","options":["開閉器","熱電温度計","継電器","ハロゲンランプ","直流電動機"],"correct":[1],"explanation":"熱電温度計（熱電対）は接点の開閉や整流子のような火花発生部を通常もたず、他の選択肢より点火源となるおそれが小さいです。","source":"追加問題10.pdf p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":5,"originalId":"extra-20260905-005","bundle":"追加問題10"},{"id":"extra-drill-006","subject":"物理・化学","category":"実験結果の読み取り","difficulty":"2","type":"正しいものを選べ","question":"次の実験結果について、正しいものはどれか。\n\n「空気中で、ある化合物を−50℃から徐々に温めると、−42℃のとき液体になり始めた。そのまま温め続け、液温が20℃まで上がったとき、液面付近の蒸気濃度を測定すると1.8vol%であった。更に加熱を続けたところ、液温は115℃で一定となり、すべて気化してしまった。また、液温20℃のものを別容器にとり、液面付近に火花を飛ばすと激しく燃焼した。」","options":["この物質の分解温度は−42℃である。","この物質の沸点は115℃である。","この物質の発火点は20℃である。","この物質の融点は−50℃である。","この物質の燃焼範囲は0〜1.8vol%である。"],"correct":[1],"explanation":"正解は2。−42℃で液体になり始めるのでそこは融点、115℃で温度が一定のまま全て気化しているので115℃が沸点です。20℃で火花により燃えることから、発火点20℃とはいえません。","source":"追加問題10.pdf p.5","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":6,"originalId":"物理・化学-pc-028","bundle":"追加問題10"},{"id":"extra-drill-007","subject":"物理・化学","category":"引火性液体の性質","difficulty":"","type":"選択問題","question":"次の性状を有する引火性液体について、誤っているものはどれか。\n\n沸点64℃、引火点11℃、発火点464℃、液体の比重0.79、蒸気の比重1.11、蒸気の燃焼範囲6.7〜37vol%","options":["引火するのに十分な濃度の蒸気を液面上に発生する最低の液温は11℃である。","発生する蒸気の重さは、空気の1.11倍である。","液温が464℃に達すると、自ら燃焼を開始する。","この液体2kgの容量は1.58Lである。","液温が64℃まで加熱されると、その蒸気圧は標準大気圧と等しくなる。"],"correct":[3],"explanation":"比重0.79なら密度は約0.79kg/Lなので、2kgの体積は2/0.79≈2.53Lです。1.58Lではありません。","source":"追加問題10.pdf p.5","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":7,"originalId":"extra-20260905-006","bundle":"追加問題10"},{"id":"extra-drill-008","subject":"物理・化学","category":"引火性液体の性質","difficulty":"","type":"選択問題","question":"次の性状を有する可燃性液体について、誤っているものはどれか。\n\n引火点4.4℃、発火点480℃、沸点111℃、液体の比重0.79、蒸気比重3.10","options":["空気中で引火するのに十分な濃度の蒸気が液面上に発生する最低の液温は4.4℃である。","この液体2kgの容量は1.58Lである。","液温が480℃に達すると、自ら燃焼を開始する。","液温が111℃まで加熱されると、この蒸気圧は標準大気圧と等しくなる。","発生する蒸気の重さは、空気の重さの3.10倍である。"],"correct":[1],"explanation":"比重0.79なら2kgの体積は約2.53Lです。沸点では蒸気圧が外圧に等しくなり、発火点では点火源なしで発火し得ます。","source":"追加問題10.pdf p.6","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":8,"originalId":"extra-20260905-007","bundle":"追加問題10"},{"id":"extra-drill-009","subject":"物理・化学","category":"引火点・燃焼範囲","difficulty":"","type":"選択問題","question":"次の性状を有する可燃性液体について、正しいものはどれか。\n\n引火点28℃、発火点600℃、燃焼範囲2〜10vol%、沸点140℃","options":["液体の温度が28℃未満の時には、蒸気は発生しない。","液体の温度が28℃以上になると、発生する蒸気の濃度は2vol%以上になる。","蒸気の濃度が10vol%を超えれば、引火する。","液体の温度を140℃まで加熱すると、蒸気の濃度は10vol%になる。","600℃以上になるまで、点火源を近づけても燃焼しない。"],"correct":[1],"explanation":"引火点は、点火すれば燃える最低濃度（燃焼下限）以上の蒸気を生じる最低液温です。したがって28℃では少なくとも下限2vol%に達します。","source":"追加問題10.pdf p.6","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":9,"originalId":"extra-20260905-008","bundle":"追加問題10"},{"id":"extra-drill-010","subject":"物理・化学","category":"ヨウ素価の誤り","difficulty":"2","type":"誤っているものを選べ","question":"ヨウ素価について、次のＡ〜Ｄのうち誤っているものの組合せはどれか。\n\nＡ．油脂100gに付加するヨウ素の質量をg単位で表した数値をヨウ素価という。\nＢ．ヨウ素価の値は、油脂中の不飽和脂肪酸の含有量が多く、また、脂肪酸の不飽和度が高いほど値は小さい。\nＣ．油脂は、不乾性油、半乾性油または乾性油に分類される。\nＤ．不乾性油は、半乾性油や乾性油に比べて自然発火しやすい。","options":["ＡとＢ","ＡとＣ","ＢとＣ","ＢとＤ","ＣとＤ"],"correct":[3],"explanation":"正解は4（BとD）。ヨウ素価は不飽和度が高いほど大きくなります。また、不乾性油は乾性油より自然発火しにくいので、BとDが誤りです。","source":"追加問題10.pdf p.7","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":10,"originalId":"物理・化学-pc-029","bundle":"追加問題10"},{"id":"extra-drill-011","subject":"物理・化学","category":"電気・オームの法則","difficulty":"","type":"選択問題","question":"導体の両端に20Vの電圧を加えたとき、0.4Aの電流が流れた。この導体の抵抗として正しいものはどれか。","options":["2Ω","8Ω","50Ω","80Ω","160Ω"],"correct":[2],"explanation":"オームの法則 R=V/I=20/0.4=50Ωです。","source":"追加問題10.pdf p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":11,"originalId":"extra-20260905-009","bundle":"追加問題10"},{"id":"extra-drill-012","subject":"物理・化学","category":"電池","difficulty":"","type":"選択問題","question":"次のA〜Dに示す電池について、起電力の大きい順に並べたものはどれか。\nA. リチウムイオン電池\nB. 鉛蓄電池\nC. マンガン乾電池\nD. ニッケル・カドミウム電池","options":["A＞B＞C＞D","A＞D＞B＞C","B＞A＞C＞D","B＞C＞D＞A","D＞A＞B＞C"],"correct":[0],"explanation":"代表的な公称電圧は、リチウムイオン約3.6〜3.7V、鉛蓄電池約2V、マンガン乾電池約1.5V、ニッケル・カドミウム約1.2Vです。","source":"追加問題10.pdf p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":12,"originalId":"extra-20260905-010","bundle":"追加問題10"},{"id":"extra-drill-013","subject":"物理・化学","category":"電池","difficulty":"","type":"選択問題","question":"電池に関する次の文の（　）内のA〜Dに当てはまる語句の組合せとして、正しいものはどれか。\n\n「ナトリウム・硫黄電池は、負極に（A）を、正極に（B）を、電解質にβ・アルミナを用いた（C）である。鉛蓄電池や（D）なども、（C）にあたる。」","options":["Aナトリウム／B硫黄／C一次電池／Dニッケル・水素電池","Aナトリウム／B硫黄／C二次電池／Dマンガン乾電池","Aナトリウム／B硫黄／C二次電池／Dニッケル・水素電池","A硫黄／Bナトリウム／C一次電池／Dマンガン乾電池","A硫黄／Bナトリウム／C二次電池／Dニッケル・水素電池"],"correct":[2],"explanation":"ナトリウム・硫黄電池は負極ナトリウム、正極硫黄の二次電池です。鉛蓄電池とニッケル・水素電池も二次電池です。","source":"追加問題10.pdf p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":13,"originalId":"extra-20260905-011","bundle":"追加問題10"},{"id":"extra-drill-014","subject":"物理・化学","category":"静電気⑩コンデンサの静電エネルギー計算","difficulty":"2","type":"正しいものを選べ","question":"100Vの電圧で充電した電気容量3.0μFのコンデンサに蓄積されている静電エネルギーとして、次のうち正しいものはどれか。","options":["1.5×10⁻²J","3.0×10⁻²J","1.5×10⁻⁴J","1.5×10⁴J","3.0×10⁴J"],"correct":[0],"explanation":"正解は1。コンデンサのエネルギーは U＝1/2・CV²。C＝3.0×10⁻⁶F、V＝100Vより、U＝1.5×10⁻²Jです。","source":"追加問題10.pdf p.9","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":14,"originalId":"物理・化学-pc-062","bundle":"追加問題10"},{"id":"extra-drill-015","subject":"物理・化学","category":"静電気・箔検電器","difficulty":"","type":"選択問題","question":"帯電していない箔検電器の上部の金属板に、次のAからCの操作を行ったときの2枚の金属箔の状態として、正しいものの組合せはどれか。\n\nA. 正に帯電したアクリル棒を近づける。\nB. 近づけたアクリル棒はそのままに、金属板に指で触れる。\nC. 指で触れたまま、アクリル棒を遠ざける。","options":["A開いている／B開いている／C閉じている","A開いている／B閉じている／C開いている","A開いている／B閉じている／C閉じている","A閉じている／B開いている／C開いている","A閉じている／B閉じている／C開いている"],"correct":[2],"explanation":"正電荷を近づけると静電誘導で箔が同符号になり開きます。棒を近づけたまま接地すると箔は閉じ、接地したまま棒を遠ざければ電荷が大地へ出入りして中性となるため閉じたままです。","source":"追加問題10.pdf p.10＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":15,"originalId":"extra-20260905-012","bundle":"追加問題10","image":"electroscope"},{"id":"extra-drill-016","subject":"物理・化学","category":"物質の三態","difficulty":"","type":"選択問題","question":"物質の状態変化について、次の1〜7のうち、正しいものはどれか。","options":["一般に融点は沸点よりも高い。","固体が液体になることを凝固という。","固体が直接気体になることはない。","気体が液体になることを凝縮という。","融点が12℃の物質は20℃では固体である。","硫黄は加熱すると融解し蒸発するが、この現象を昇華という。","0℃で水と氷が共存しているのは、水の凝固点と氷の融点が異なっているためである。"],"correct":[3],"explanation":"気体→液体は凝縮（液化）です。固体→液体は融解、固体→気体の直接変化は昇華です。","source":"追加問題20 p.1","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":16,"originalId":"extra-20260905-013","bundle":"追加問題20"},{"id":"extra-drill-017","subject":"物理・化学","category":"物質の状態変化②正しいもの","difficulty":"1","type":"正しいものを選べ","question":"物質の状態の変化について、次のうち正しいものはどれか。","options":["水は１気圧において100℃で沸騰する。","二酸化炭素には気体と固体の状態があるが、いかなる条件下でも液体の状態にはならない。","硫黄は加熱すると溶解して気化する。この現象を昇華という。","可燃性液体の沸点は常に100℃より低い。","０℃で水と氷が共存するのは、水の凝固点と氷の融点が異なっているためである。"],"correct":[0],"explanation":"正解は1。1気圧では水は100℃で沸騰します。CO₂も条件により液体になります。硫黄の加熱は融解・蒸発で、昇華とは限りません。","source":"追加問題20 p.2（問4）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":17,"originalId":"物理・化学-pc-069","bundle":"追加問題20"},{"id":"extra-drill-018","subject":"物理・化学","category":"物質の状態変化③説明の正しいもの","difficulty":"1","type":"正しいものを選べ","question":"物質の状態変化の説明として、次のうち正しいものはどれか。","options":["熱が吸収されて、氷が水になることを液化という。","水が水蒸気になるとき熱を吸収するが、液体から気体への状態変化に使われるため、温度は上昇しない。","水が水蒸気になることを蒸発といい、熱が放出される。","水が氷になることを凝固といい、熱が吸収される。","水蒸気が水になることを凝固といい、熱が放出される。"],"correct":[1],"explanation":"正解は2。液体→気体では潜熱を吸収するため、沸騰中は加えた熱が状態変化に使われ、温度は上がりません。","source":"追加問題20 p.2（問5）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":18,"originalId":"物理・化学-pc-070","bundle":"追加問題20"},{"id":"extra-drill-019","subject":"物理・化学","category":"蒸気圧①誤っているもの","difficulty":"2","type":"誤っているものを選べ","question":"蒸気圧と沸点に関する記述について、次のうち誤っているものはどれか。","options":["沸点は、飽和蒸気圧と外圧が等しくなる温度をいう。","液体の温度が高くなると、蒸気圧は小さくなる。","一定温度における液体の飽和蒸気圧は、物質ごとに決まっている。","大気圧が小さくなると、沸点は低くなる。","同温で比較したとき、分子間力の小さい物質ほど、蒸気圧は大きくなる傾向が大きい。"],"correct":[1],"explanation":"正解は2。液体の温度が上がるほど蒸気圧は大きくなるので、「小さくなる」が誤りです。","source":"追加問題20 p.3","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":19,"originalId":"物理・化学-pc-071","bundle":"追加問題20"},{"id":"extra-drill-020","subject":"物理・化学","category":"化学用語","difficulty":"","type":"選択問題","question":"化学の用語に関する記述について、次のうち正しいものはどれか。","options":["物質を構成する粒子は常に不規則な運動をしており、この運動を電気泳動という。","蒸気圧が周囲の気体の圧力に等しくなる温度で液体の内部から蒸発が起こる現象を沸騰という。","蒸気圧と体積との関係をグラフに表した曲線を蒸気圧曲線という。","固体から液体を経ずに、直接気体になる現象を拡散という。","固体、液体及び気体の3つの状態が共存して、平衡状態となる点を臨界点という。"],"correct":[1],"explanation":"沸騰は、液体の蒸気圧が外圧に等しくなり液体内部でも気化が起こる現象です。三相共存点は三重点です。","source":"追加問題20 p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":20,"originalId":"extra-20260905-014","bundle":"追加問題20"},{"id":"extra-drill-021","subject":"物理・化学","category":"熱量","difficulty":"","type":"選択問題","question":"比熱がc、質量がmの物質の熱容量Cを表す式として、次のうち正しいものはどれか。","options":["C=mc²","C=m²c","C=mc","C=m/c","C=c/m"],"correct":[2],"explanation":"熱容量は「質量×比熱」なので C=mc です。","source":"追加問題20 p.5","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":21,"originalId":"extra-20260905-015","bundle":"追加問題20"},{"id":"extra-drill-022","subject":"物理・化学","category":"熱膨張","difficulty":"","type":"選択問題","question":"内容積1,000Lのタンクに満たされた液温15℃のガソリンを35℃まで温めた場合、タンク外に流出する量として正しいものはどれか。ただし、ガソリンの体膨張率を1.35×10⁻³K⁻¹とし、タンクの膨張およびガソリンの蒸発は考えないものとする。","options":["1.35L","6.75L","13.5L","27.0L","54.0L"],"correct":[3],"explanation":"ΔV=VβΔT=1000×1.35×10⁻³×20=27.0Lです。","source":"追加問題20 p.6","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":22,"originalId":"extra-20260905-016","bundle":"追加問題20"},{"id":"extra-drill-023","subject":"物理・化学","category":"潮解の説明","difficulty":"1","type":"正しいものを選べ","question":"潮解の説明について、次のうち正しいものはどれか。","options":["物質が空気中の水蒸気と反応して固化する現象","物質の中に含まれている水分が放出されて粉末になる現象","固体が水分を吸収して、その水に溶ける現象","物質が空気中の水蒸気と反応して、性質の異なった２つ以上の物質になる現象","水溶液の水分が蒸発して、溶質が析出する現象"],"correct":[2],"explanation":"正解は3。潮解は、固体が空気中の水分を吸収し、その吸収した水に溶けて液状になる現象です。","source":"追加問題20 p.7","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":23,"originalId":"物理・化学-pc-090","bundle":"追加問題20"},{"id":"extra-drill-024","subject":"物理・化学","category":"原子","difficulty":"","type":"選択問題","question":"次の原子（²⁷₁₃Al）について、陽子・中性子・質量数の数として、正しい組み合わせはどれか。","options":["陽子13／中性子14／質量数27","陽子13／中性子27／質量数27","陽子14／中性子13／質量数27","陽子14／中性子27／質量数13","陽子27／中性子14／質量数13"],"correct":[0],"explanation":"原子番号13なので陽子13。中性子は27−13=14、質量数は27です。","source":"追加問題20 p.8＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":24,"originalId":"extra-20260905-017","bundle":"追加問題20","image":"al27"},{"id":"extra-drill-025","subject":"物理・化学","category":"中性子数が7の原子","difficulty":"2","type":"正しいものを選べ","question":"中性子の数が７である原子として、次のうち正しいものはどれか。","options":["²³₁₁Na","¹⁶₈O","¹⁹₉F","¹³₆C","⁷₃Li"],"correct":[3],"explanation":"正解は4（¹³₆C）。中性子数は質量数−原子番号なので、13−6＝7です。","source":"追加問題20 p.8","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":25,"originalId":"物理・化学-pc-091","bundle":"追加問題20"},{"id":"extra-drill-026","subject":"物理・化学","category":"二硫化炭素の完全燃焼","difficulty":"2","type":"正しいものを選べ","question":"次の文の（　）内に当てはまるものは、次のうちどれか。\n\n「二硫化炭素が完全燃焼すると（　）になる。」","options":["水蒸気と二酸化炭素","二酸化炭素と二酸化硫黄","二酸化硫黄と水蒸気","一酸化炭素と二酸化硫黄","一酸化炭素と二酸化炭素"],"correct":[1],"explanation":"正解は2。二硫化炭素CS₂の完全燃焼は CS₂＋3O₂→CO₂＋2SO₂ で、二酸化炭素と二酸化硫黄が生成します。","source":"追加問題20 p.9","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":26,"originalId":"物理・化学-pc-092","bundle":"追加問題20"},{"id":"extra-drill-027","subject":"物理・化学","category":"燃焼・熱化学","difficulty":"","type":"選択問題","question":"物質の酸化反応を熱化学方程式で表したとき、発光を伴ったとしても燃焼反応に該当しないものは、次のうちどれか。","options":["C + O₂ = CO₂ + 394kJ","Al + (3/4)O₂ = (1/2)Al₂O₃ + 836kJ","C₂H₅OH + 3O₂ = 2CO₂ + 3H₂O + 1368kJ","N₂ + (1/2)O₂ = N₂O − 74kJ","C₃H₈ + 5O₂ = 3CO₂ + 4H₂O + 2220kJ"],"correct":[3],"explanation":"燃焼は通常、酸化に伴って熱を放出する発熱反応です。N₂O生成はここでは74kJの吸熱反応なので燃焼反応に該当しません。","source":"追加問題20 p.9","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":27,"originalId":"extra-20260905-018","bundle":"追加問題20"},{"id":"extra-drill-028","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"炭素が燃焼するときの熱化学方程式が C+(1/2)O₂=CO+110kJ、C+O₂=CO₂+395kJ である。この方程式から考えて、正しいものはどれか。なお、原子量はC=12、O=16とする。","options":["炭素が完全燃焼するときは前者、不完全燃焼するときは後者で表される。","二酸化炭素1molは28gである。","二酸化炭素1分子は炭素1原子と酸素2原子からなる。","炭素12gが完全燃焼すると二酸化炭素28gが生じる。","両式とも炭素は吸熱反応により酸化されている。"],"correct":[2],"explanation":"CO₂はC原子1個とO原子2個からなり、モル質量は44g/molです。完全燃焼はCO₂生成、両反応とも発熱です。","source":"追加問題20 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":28,"originalId":"extra-20260905-019","bundle":"追加問題20"},{"id":"extra-drill-029","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"標準状態で体積33.6Lの一酸化炭素の質量として正しいものはどれか。標準状態で1molの気体は22.4L、原子量はC=12、O=16とする。","options":["28.0g","33.6g","42.0g","50.4g","61.6g"],"correct":[2],"explanation":"33.6/22.4=1.5mol、COは28g/molなので1.5×28=42.0gです。","source":"追加問題20 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":29,"originalId":"extra-20260905-020","bundle":"追加問題20"},{"id":"extra-drill-030","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"標準状態でメタン1Lが完全燃焼するとき、必要な酸素量として正しいものはどれか。反応式は CH₄+2O₂→CO₂+2H₂O とする。","options":["1L","2L","3L","5L","10L"],"correct":[1],"explanation":"同温同圧の気体体積比は係数比に等しいので、CH₄ 1LにO₂ 2Lが必要です。","source":"追加問題20 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":30,"originalId":"extra-20260905-021","bundle":"追加問題20"},{"id":"extra-drill-031","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"標準状態でエタン1Lを完全燃焼させるのに必要な酸素量として最も近い値はどれか。反応式は 2C₂H₆+7O₂→4CO₂+6H₂O とする。","options":["2.0L","3.5L","4.0L","4.5L","7.0L"],"correct":[1],"explanation":"体積比は係数比なので、エタン1Lには酸素7/2=3.5Lが必要です。","source":"追加問題20 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":31,"originalId":"extra-20260905-022","bundle":"追加問題20"},{"id":"extra-drill-032","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"プロパン（C₃H₈）22gを完全燃焼させるのに必要な理論上の酸素量はどれか。原子量はC=12、H=1、O=16とする。","options":["60g","80g","100g","120g","140g"],"correct":[1],"explanation":"C₃H₈+5O₂→3CO₂+4H₂O。プロパン22g=0.5molなのでO₂は2.5mol、80gです。","source":"追加問題30 p.1＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":32,"originalId":"extra-20260905-023","bundle":"追加問題30"},{"id":"extra-drill-033","subject":"物理・化学","category":"化学反応式","difficulty":"","type":"選択問題","question":"アセチレンの完全燃焼式 (A)C₂H₂+(B)O₂→(C)CO₂+(D)H₂O を最小整数係数で表すとき、A〜Dの係数の和はどれか。係数1は省略しない。","options":["9","11","13","15","17"],"correct":[2],"explanation":"2C₂H₂+5O₂→4CO₂+2H₂O なので係数の和は2+5+4+2=13です。","source":"追加問題30 p.1＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":33,"originalId":"extra-20260905-024","bundle":"追加問題30"},{"id":"extra-drill-034","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"2CH₃OH+3O₂→2CO₂+4H₂O の反応で、メタノール2.0molが完全燃焼するとき必要な酸素の物質量はどれか。","options":["1.0mol","1.5mol","2.0mol","3.0mol","3.5mol"],"correct":[3],"explanation":"係数比よりCH₃OH 2molにO₂ 3molが必要です。","source":"追加問題30 p.1＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":34,"originalId":"extra-20260905-025","bundle":"追加問題30"},{"id":"extra-drill-035","subject":"物理・化学","category":"熱化学","difficulty":"","type":"選択問題","question":"C+(1/2)O₂=CO+110.88kJ、CO+(1/2)O₂=CO₂+284.34kJ から導かれる C+O₂→CO₂ の反応熱はどれか。","options":["173.46kJの吸熱","221.76kJの吸熱","346.92kJの吸熱","395.22kJの発熱","568.68kJの発熱"],"correct":[3],"explanation":"ヘスの法則より110.88+284.34=395.22kJを放出します。","source":"追加問題30 p.1＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":35,"originalId":"extra-20260905-026","bundle":"追加問題30"},{"id":"extra-drill-036","subject":"物理・化学","category":"熱化学","difficulty":"","type":"選択問題","question":"H₂(気)+(1/2)O₂(気)=H₂O(液)+286kJ、H₂O(液)=H₂O(気)−44kJ から、水素が燃焼して水蒸気が生成する際の反応熱として正しいものはどれか。","options":["154kJ/mol","198kJ/mol","242kJ/mol","330kJ/mol","374kJ/mol"],"correct":[2],"explanation":"液体水生成286kJから気化に必要な44kJを差し引き、286−44=242kJ/molです。","source":"追加問題30 p.1＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":36,"originalId":"extra-20260905-027","bundle":"追加問題30"},{"id":"extra-drill-037","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"炭酸水素ナトリウム42gが熱分解して炭酸ナトリウムを生成したとき、同時に生じる二酸化炭素の標準状態での体積はどれか。Na=23とする。","options":["5.6L","11.2L","16.8L","22.4L","44.8L"],"correct":[0],"explanation":"2NaHCO₃→Na₂CO₃+CO₂+H₂O。NaHCO₃は84g/molなので42g=0.5mol、CO₂は0.25mol=5.6Lです。","source":"追加問題30 p.2","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":37,"originalId":"extra-20260905-028","bundle":"追加問題30"},{"id":"extra-drill-038","subject":"物理・化学","category":"化学反応式","difficulty":"","type":"選択問題","question":"それぞれの物質が燃焼した場合の化学反応式として、誤っているものはどれか。","options":["2C₂H₂+5O₂→4CO₂+2H₂O","2H₂+O₂→2H₂O","4P+5O₂→P₄O₁₀","CS₂+3O₂→CO+2SO₃","2CO+O₂→2CO₂"],"correct":[3],"explanation":"二硫化炭素の完全燃焼は CS₂+3O₂→CO₂+2SO₂ です。","source":"追加問題30 p.2","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":38,"originalId":"extra-20260905-029","bundle":"追加問題30"},{"id":"extra-drill-039","subject":"物理・化学","category":"熱化学","difficulty":"","type":"選択問題","question":"メタンの熱化学方程式 CH₄(気)+2O₂(気)=CO₂(気)+2H₂O(液)+891kJ からいえることとして正しいものはどれか。","options":["メタン1molに対し酸素2molが生成する。","メタン1molに対し水2molが反応する。","メタンが完全燃焼したときの生成物は二酸化炭素と水である。","メタン1molの完全燃焼で891kJを吸収する。","反応後の酸素原子数は反応前より多い。"],"correct":[2],"explanation":"反応式から生成物はCO₂とH₂Oです。891kJは放出熱で、原子数は反応前後で保存されます。","source":"追加問題30 p.2","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":39,"originalId":"extra-20260905-030","bundle":"追加問題30"},{"id":"extra-drill-040","subject":"物理・化学","category":"化学量論","difficulty":"","type":"選択問題","question":"水素（原子量＝1）と酸素（原子量＝16）の混合気体に点火すると、爆発的に燃焼し水ができる。この反応を熱化学方程式で表すと次のようになる。\n\nH₂（気） + (1/2)O₂（気） ＝ H₂O（液） + 242.8kJ\n\nこのことについて、次のうち誤っているものはどれか。なお、（気）は気体の状態、（液）は液体の状態を示している。","options":["この反応は発熱を伴う酸化反応である。","水の分子量は18である。","水素1molが完全燃焼すると、242.8kJの熱が発生する。","水素3gと酸素15gが反応すると18gの水ができる。","水1分子は水素2原子と酸素1原子からなっている。"],"correct":[3],"explanation":"正解は4。水素3gは1.5mol、酸素15gは0.46875molなので酸素が不足し、生成する水は0.9375mol＝16.875gです。なお、出典の「H₂O（液）＋242.8kJ」は標準的な熱化学データとは整合しない表記ですが、この設問の正答4には影響しません。","source":"追加問題30 p.2","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":40,"originalId":"extra-20260905-031","bundle":"追加問題30","auditFlag":"出典表記注意"},{"id":"extra-drill-041","subject":"物理・化学","category":"化学反応熱","difficulty":"1","type":"正しいものを選べ","question":"化学反応にともなう反応熱は、次のうちどれか。","options":["中和熱","蒸発熱","凝固熱","凝縮熱","融解熱"],"correct":[0],"explanation":"正解は1（中和熱）。蒸発熱・凝固熱・凝縮熱・融解熱は状態変化に伴う熱で、中和熱は化学反応に伴う反応熱です。","source":"追加問題30 p.3（問18）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":41,"originalId":"物理・化学-pc-085","bundle":"追加問題30"},{"id":"extra-drill-042","subject":"物理・化学","category":"濃度計算","difficulty":"","type":"選択問題","question":"80.0%の硫酸Aと30.0%の硫酸Bを混合して、50.0%の硫酸100gをつくるのに必要な量の組合せはどれか。","options":["A12.0g／B88.0g","A20.0g／B80.0g","A40.0g／B60.0g","A44.0g／B56.0g","A50.0g／B50.0g"],"correct":[2],"explanation":"Aをxgとすると0.8x+0.3(100−x)=50。x=40gなのでB=60gです。","source":"追加問題30 p.3","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":42,"originalId":"extra-20260905-032","bundle":"追加問題30"},{"id":"extra-drill-043","subject":"物理・化学","category":"有機化合物・構造式","difficulty":"","type":"図問題","question":"図Aの化学構造式で表される化合物はどれか。","options":["ベンゼン","エチレン","アセチレン","エタノール","アセトン"],"correct":[0],"explanation":"図Aは六員環に交互の二重結合を持つベンゼン。","source":"追加問題30 p.3（図A）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":43,"originalId":"chem-struct-A","bundle":"追加問題30","image":"structA"},{"id":"extra-drill-044","subject":"物理・化学","category":"有機化合物・構造式","difficulty":"","type":"図問題","question":"図Bの化学構造式で表される化合物はどれか。","options":["エタノール","アセトン","キシレン","ベンゼン","酢酸"],"correct":[1],"explanation":"図Bは CH3-CO-CH3 でアセトン。","source":"追加問題30 p.3（図B）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":44,"originalId":"chem-struct-B","bundle":"追加問題30","image":"structB"},{"id":"extra-drill-045","subject":"物理・化学","category":"反応速度","difficulty":"","type":"選択問題","question":"一般的な物質の反応速度について、次のうち正しいものはどれか。","options":["触媒は反応速度に影響しない。","気体の濃度は分圧に反比例するので、分圧が低いほど反応速度は大きくなる。","固体では接触面積が大きいほど反応速度は小さくなる。","温度を上げれば必ず反応速度は小さくなる。","反応物の濃度が濃いほど反応速度は大きくなる。"],"correct":[4],"explanation":"一般に濃度が高いほど有効衝突の頻度が増え、反応速度は大きくなります。","source":"追加問題30 p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":45,"originalId":"extra-20260905-033","bundle":"追加問題30"},{"id":"extra-drill-046","subject":"物理・化学","category":"反応速度","difficulty":"","type":"選択問題","question":"反応速度に関する説明として、誤っているものはどれか。","options":["一般に反応物の濃度が大きいと反応速度は大きくなる。","吸熱反応では温度が高くなると反応速度は小さくなる。","反応前後で自身は変化せず反応速度を変化させる物質を触媒という。","固体が気体または液体と反応するとき、塊より粉体の方が反応速度は大きくなる。","気体どうしの反応では分圧が大きいほど反応速度は大きくなる。"],"correct":[1],"explanation":"吸熱・発熱にかかわらず、通常は温度を上げると反応速度は大きくなります。","source":"追加問題30 p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":46,"originalId":"extra-20260905-034","bundle":"追加問題30"},{"id":"extra-drill-047","subject":"物理・化学","category":"反応速度","difficulty":"","type":"選択問題","question":"ある物質の反応速度が10℃上昇するごとに3倍になるとき、10℃から50℃になった場合の反応速度は何倍か。","options":["12倍","15倍","81倍","120倍","160倍"],"correct":[2],"explanation":"10→50℃は10℃上昇が4回なので3⁴=81倍です。","source":"追加問題30 p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":47,"originalId":"extra-20260905-035","bundle":"追加問題30"},{"id":"extra-drill-048","subject":"物理・化学","category":"反応速度","difficulty":"","type":"選択問題","question":"反応速度に関する説明として、誤っているものはどれか。","options":["活性化エネルギーの大きい反応ほど反応速度は小さくなる傾向があり、その大きさは反応ごとに異なる。","化学反応には反応粒子の衝突が必要である。","粒子の衝突回数が多いほど反応速度は大きくなる。","反応の前後で自身は変化せず、反応速度を速める物質を触媒という。","触媒を用いると反応熱の値は大きくなる。"],"correct":[4],"explanation":"触媒は活性化エネルギー（反応経路）を変えますが、反応物と生成物のエネルギー差である反応熱は変えません。","source":"追加問題30 p.5","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":48,"originalId":"extra-20260905-036","bundle":"追加問題30"},{"id":"extra-drill-049","subject":"物理・化学","category":"触媒","difficulty":"","type":"選択問題","question":"触媒に関する説明として、誤っているものはどれか。","options":["反応物が気体や液体で触媒が固体の場合は不均一系触媒である。","生体内の化学反応で触媒としてはたらくタンパク質を酵素という。","触媒を用いると反応経路が変わるため、反応熱の値は変化する。","水溶液中で溶け込んだイオンが触媒作用をするとき、このイオンは均一系触媒である。","触媒とは反応の前後で自身は変化せず、反応速度を変化させる物質をいう。"],"correct":[2],"explanation":"触媒は別の反応経路を与えて速度を変えますが、反応熱（始状態と終状態の差）は変化しません。","source":"追加問題30 p.5","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":49,"originalId":"extra-20260905-037","bundle":"追加問題30"},{"id":"extra-drill-050","subject":"物理・化学","category":"化学平衡","difficulty":"","type":"選択問題","question":"可逆反応における化学平衡に関する記述について、誤っているものはどれか。","options":["正反応と逆反応の速度が等しくなり、見かけ上反応が停止したような状態が平衡状態である。","平衡状態の条件を変えると、その影響を緩和する方向に平衡が移動する。","触媒は平衡到達時間を変えるが平衡位置は移動させない。","平衡状態で温度を高くすると発熱方向に平衡が移動する。","爆発は可逆反応ではないため化学平衡は起こらない。"],"correct":[3],"explanation":"温度を上げると熱を吸収する方向（吸熱方向）へ平衡が移動します。","source":"追加問題30 p.5","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":50,"originalId":"extra-20260905-038","bundle":"追加問題30"},{"id":"extra-drill-051","subject":"物理・化学","category":"化学平衡","difficulty":"","type":"選択問題","question":"可逆反応が平衡状態にあるとき、平衡移動の条件として関係のないものはどれか。","options":["濃度","圧力","温度","触媒","体積"],"correct":[3],"explanation":"触媒は正逆両反応を同程度に速めるため平衡位置を変えません。","source":"追加問題30 p.6＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":51,"originalId":"extra-20260905-039","bundle":"追加問題30"},{"id":"extra-drill-052","subject":"物理・化学","category":"化学平衡","difficulty":"","type":"選択問題","question":"N₂+3H₂⇄2NH₃ の平衡で温度一定のとき、A〜Dの説明のうち正しいものの組合せはどれか。\nA. NH₃を減らすと右へ移動する。\nB. H₂を加えると左へ移動する。\nC. 圧力を下げると左へ移動する。\nD. 触媒を加えると右へ移動する。","options":["AとB","AとC","BとC","BとD","CとD"],"correct":[1],"explanation":"NH₃を除くと生成物を補う右方向へ、圧力を下げると気体モル数が多い左方向へ移動します。触媒は平衡位置を変えません。","source":"追加問題30 p.6＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":52,"originalId":"extra-20260905-040","bundle":"追加問題30"},{"id":"extra-drill-053","subject":"物理・化学","category":"化学平衡","difficulty":"","type":"選択問題","question":"A+B⇄C+2D+300kJ（全て気体）が平衡状態にあるとき、平衡が右に移動するのはどれか。","options":["Aを反応系外へ外す。","圧力を上げる。","触媒を加える。","温度を下げる。","Bを反応系外へ外す。"],"correct":[3],"explanation":"右向きは発熱反応なので温度を下げると右へ移動します。圧力上昇は気体モル数の少ない左へ移動します。","source":"追加問題30 p.6＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":53,"originalId":"extra-20260905-041","bundle":"追加問題30"},{"id":"extra-drill-054","subject":"物理・化学","category":"酸・塩基","difficulty":"","type":"選択問題","question":"次の文のA〜Dに当てはまる語句の組合せとして正しいものはどれか。\n「塩酸水溶液は酸のためpHは7より(A)。水酸化ナトリウム水溶液は塩基のためpHは7より(B)。両者を適量混合して食塩と水ができる反応を(C)という。同量の酸と塩基を混合してpH7となったとき(D)である。」","options":["A小さい／B大きい／C中和／D中性","A大きい／B小さい／C酸化／D酸性","A小さい／B大きい／C還元／Dアルカリ性","A大きい／B小さい／C中和／D中性","A小さい／B大きい／C酸化／D酸性"],"correct":[0],"explanation":"酸はpH<7、塩基はpH>7。酸と塩基の反応は中和で、強酸・強塩基が当量なら中性になります。","source":"追加問題30 p.7＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":54,"originalId":"extra-20260905-042","bundle":"追加問題30"},{"id":"extra-drill-055","subject":"物理・化学","category":"酸・塩基","difficulty":"","type":"選択問題","question":"ブレンステッド・ローリーの定義について、A〜Dの組合せとして正しいものはどれか。\n「(A)は水素イオンを与える物質、(B)は水素イオンを受け取る物質。アンモニアと水の反応では水は(C)、塩化水素と水の反応では水は(D)としてはたらく。」","options":["酸／塩基／酸／酸","酸／塩基／酸／塩基","酸／塩基／塩基／酸","塩基／酸／酸／塩基","塩基／酸／塩基／酸"],"correct":[1],"explanation":"酸はH⁺供与体、塩基はH⁺受容体。NH₃にH⁺を与える水は酸、HClからH⁺を受ける水は塩基です。","source":"追加問題30 p.7＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":55,"originalId":"extra-20260905-043","bundle":"追加問題30"},{"id":"extra-drill-056","subject":"物理・化学","category":"pH","difficulty":"","type":"選択問題","question":"次に示すpHについて、酸性で、かつ中性に最も近いものはどれか。","options":["2.0","5.1","6.8","7.1","11.3"],"correct":[2],"explanation":"酸性はpH<7。その中で7に最も近い6.8です。","source":"追加問題30 p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":56,"originalId":"extra-20260905-044","bundle":"追加問題30"},{"id":"extra-drill-057","subject":"物理・化学","category":"酸・塩基","difficulty":"","type":"選択問題","question":"酸と塩基の説明について、誤っているものはどれか。","options":["酸とは水に溶けてH⁺を生じる物質、または他の物質にH⁺を与える物質をいう。","酸は赤色リトマス紙を青色に変え、塩基は青色リトマス紙を赤色に変える。","塩基とは水に溶けてOH⁻を生じる物質、または他の物質からH⁺を受け取る物質をいう。","酸性・塩基性の強弱はpHで表される。","中和とは酸と塩基が反応し互いにその性質を打ち消しあうことをいう。"],"correct":[1],"explanation":"リトマス紙の変色が逆です。酸は青→赤、塩基は赤→青にします。","source":"追加問題30 p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":57,"originalId":"extra-20260905-045","bundle":"追加問題30"},{"id":"extra-drill-058","subject":"物理・化学","category":"酸","difficulty":"","type":"選択問題","question":"酸の性状について、誤っているものはどれか。","options":["酸は水溶液中で電離して水素イオン（オキソニウムイオン）を生じる。","すっぱい味がする。","酸はすべて酸素を含む化合物である。","硫酸等の酸を亜鉛と接触させると水素が発生する。","酸と塩基を中和させると塩と水を生じる。"],"correct":[2],"explanation":"塩酸HClなど、酸素を含まない酸もあります。","source":"追加問題30 p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":58,"originalId":"extra-20260905-046","bundle":"追加問題30"},{"id":"extra-drill-059","subject":"物理・化学","category":"pH","difficulty":"","type":"選択問題","question":"水素イオン指数について、誤っているものはどれか。","options":["水素イオン指数はpHで表される。","pHは酸性・中性・塩基性の程度を表す。","pH7の水素イオン濃度は1.0×10⁻⁷mol/Lである。","水素イオン濃度が高くなるとpHは大きくなる。","純水は25℃でpH7である。"],"correct":[3],"explanation":"pH=−log[H⁺]なので、水素イオン濃度が高いほどpHは小さくなります。","source":"追加問題30 p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":59,"originalId":"extra-20260905-047","bundle":"追加問題30"},{"id":"extra-drill-060","subject":"物理・化学","category":"pH","difficulty":"","type":"選択問題","question":"0.00001mol/Lの塩酸水溶液（25℃）のpHに最も近いものはどれか。","options":["1","3","5","7","9"],"correct":[2],"explanation":"0.00001=1.0×10⁻⁵mol/LなのでpH=5です。","source":"追加問題30 p.8","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":60,"originalId":"extra-20260905-048","bundle":"追加問題30"},{"id":"extra-drill-061","subject":"物理・化学","category":"酸化還元","difficulty":"","type":"選択問題","question":"Aの物質がBの物質に変化した場合、酸化反応に該当するものはどれか。","options":["炭素→一酸化炭素","黄リン→赤リン","硫黄→硫化水素","水→水蒸気","濃硫酸→希硫酸"],"correct":[0],"explanation":"炭素が酸素と結合してCOになるのは酸化です。他は同素体変化、還元、状態変化、希釈です。","source":"追加問題30 p.9","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":61,"originalId":"extra-20260905-049","bundle":"追加問題30"},{"id":"extra-drill-062","subject":"物理・化学","category":"酸化還元","difficulty":"","type":"選択問題","question":"酸化と還元の説明について、誤っているものはどれか。","options":["物質が水素を失うことを酸化という。","物質が電子を受け取ることを還元という。","酸化剤は電子を受け取りやすく還元されやすく、反応で酸化数が減少する。","相手によって酸化剤にも還元剤にもなる物質がある。","同一反応系において酸化と還元は同時に起こることはない。"],"correct":[4],"explanation":"酸化と還元は電子の授受として必ず対になって同時に起こります。","source":"追加問題30 p.9＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":62,"originalId":"extra-20260905-050","bundle":"追加問題30"},{"id":"extra-drill-063","subject":"物理・化学","category":"酸化還元","difficulty":"","type":"選択問題","question":"次のうち酸化反応ではないものはどれか。","options":["硫黄が空気中で燃える。","鉄が空気中でさびる。","黄リンを一定条件で加熱すると赤リンになる。","一酸化炭素が酸素と化合して二酸化炭素になる。","炭素と酸素が化合して一酸化炭素になる。"],"correct":[2],"explanation":"黄リン→赤リンは同素体間の変化であり、酸化数は変わりません。","source":"追加問題30 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":63,"originalId":"extra-20260905-051","bundle":"追加問題30"},{"id":"extra-drill-064","subject":"物理・化学","category":"酸化還元","difficulty":"","type":"選択問題","question":"次のうち酸化反応でないものはどれか。","options":["ガソリンが燃焼して二酸化炭素と水蒸気になる。","ドライアイスが周囲から熱を奪い気体になる。","鉄がさびる。","炭素が不完全燃焼して一酸化炭素になる。","化合物から水素が奪われる。"],"correct":[1],"explanation":"ドライアイスの昇華は状態変化であり、酸化還元反応ではありません。","source":"追加問題30 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":64,"originalId":"extra-20260905-052","bundle":"追加問題30"},{"id":"extra-drill-065","subject":"物理・化学","category":"酸化還元","difficulty":"","type":"選択問題","question":"酸化・還元反応の一般的な説明A〜Cのうち、正しいもののみを掲げた組合せはどれか。\nA. 酸素を失う反応を還元という。\nB. 水素を受け取る反応を還元という。\nC. 相手を還元させる物質を酸化剤という。","options":["A","A、B","A、C","B、C","A、B、C"],"correct":[1],"explanation":"AとBは還元の説明として正しいです。相手を還元させる物質は還元剤でなく酸化剤? いいえ、相手を還元する物質は自身が酸化される「還元剤」なのでCは誤りです。","source":"追加問題30 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":65,"originalId":"extra-20260905-053","bundle":"追加問題30"},{"id":"extra-drill-066","subject":"物理・化学","category":"酸化還元","difficulty":"","type":"選択問題","question":"次の反応のうち、【下線部】の物質が還元されているものはどれか。","options":["【木炭】が燃焼して二酸化炭素になった。","【黄リン】が燃焼して五酸化リンになった。","【エタノール】が燃焼して二酸化炭素と水になった。","【二酸化炭素】が赤熱した炭素に触れて一酸化炭素になった。","【銅】を空気中で熱したら黒く変色した。"],"correct":[3],"explanation":"CO₂中の炭素は+4、COでは+2となり酸化数が下がるため、二酸化炭素が還元されています。","source":"追加問題30 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":66,"originalId":"extra-20260905-054","bundle":"追加問題30"},{"id":"extra-drill-067","subject":"物理・化学","category":"化学用語","difficulty":"","type":"選択問題","question":"化学用語の説明として、誤っているものはどれか。","options":["塩基とは水に溶けてOH⁻を生じる物質をいう。","中和とは酸と塩基が反応して塩と水を生じることをいう。","還元剤とは他の物質を還元し、自らは酸化される物質をいう。","酸化とは、物質が酸素を失ったり、水素と化合したり、電子を取り入れたりする反応をいう。","塩の加水分解とは、塩が水に溶けてアルカリ性または酸性を示す現象をいう。"],"correct":[3],"explanation":"選択肢4は還元の特徴（酸素を失う・水素と結合・電子を受け取る）を酸化として記述しているため誤りです。","source":"追加問題30 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":67,"originalId":"extra-20260905-055","bundle":"追加問題30"},{"id":"extra-drill-068","subject":"物理・化学","category":"混合危険","difficulty":"","type":"選択問題","question":"混合危険や混合危険性物質の説明として、誤っているものはどれか。","options":["強い酸化性物質と還元性物質が混ざると混合危険のおそれがある。","空気と接触して発火する物質は混合危険性物質の一種である。","混合により直ちに発火・爆発する物質は混合危険性物質の一種である。","水と接触して発熱・発火する物質は混合危険性物質の一種である。","2種類以上の物質を混合し、点火源や衝撃・摩擦等を与えて初めて発火・爆発する場合は混合危険に該当しない。"],"correct":[4],"explanation":"混合後に点火・衝撃・摩擦で発火爆発する危険も混合危険に含まれます。","source":"追加問題40 p.1","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":68,"originalId":"extra-20260905-056","bundle":"追加問題40"},{"id":"extra-drill-069","subject":"物理・化学","category":"混合危険","difficulty":"","type":"選択問題","question":"次の化学実験時の操作において、発火・爆発のおそれが最も小さいものはどれか。","options":["使用済みの金属ナトリウムをエタノール中に投入した。","ガラス機器をアセトンで洗浄して乾燥機に入れた。","過マンガン酸カリウムと濃硫酸を混合した。","硝酸銀で汚れたビーカーをアンモニア水で洗浄し、水酸化ナトリウム水溶液を入れて放置した。","二酸化炭素を発生させるため炭酸水素ナトリウムに塩酸を加えた。"],"correct":[4],"explanation":"炭酸水素ナトリウムと塩酸はCO₂を発生する一般的な反応で、他の操作に比べ発火・爆発危険が小さいです。","source":"追加問題40 p.1","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":69,"originalId":"extra-20260905-057","bundle":"追加問題40"},{"id":"extra-drill-070","subject":"物理・化学","category":"混合危険","difficulty":"","type":"選択問題","question":"次の化学実験時の操作において、発火・爆発のおそれが最も小さいものはどれか。","options":["酸素ガスを充填したガスラインをロータリーポンプで排気した。","使用済み金属リチウムにエタノールを加えた。","過マンガン酸カリウムと濃硫酸を混合した。","二酸化炭素を発生させるため炭酸ナトリウムに塩酸を加えた。","硝酸銀水溶液に水酸化ナトリウムを加え、酸化銀沈殿にアンモニア水を加えて加熱した。"],"correct":[3],"explanation":"炭酸ナトリウム＋塩酸はCO₂発生反応で、他の選択肢のような強酸化剤・活性金属・爆発性銀化合物などの危険が小さいです。","source":"追加問題40 p.2","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":70,"originalId":"extra-20260905-058","bundle":"追加問題40"},{"id":"extra-drill-071","subject":"物理・化学","category":"金属","difficulty":"","type":"選択問題","question":"金属について、誤っているものはどれか。","options":["金属の中には水より軽いものがある。","イオンへのなりやすさは金属の種類で異なる。","希硫酸と反応しない金属もある。","金属は燃焼しない。","比重が約4以下の金属を一般に軽金属という。"],"correct":[3],"explanation":"Mgなど燃焼する金属があり、金属粉は特に燃えやすいものがあります。","source":"追加問題40 p.3","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":71,"originalId":"extra-20260905-059","bundle":"追加問題40"},{"id":"extra-drill-072","subject":"物理・化学","category":"金属","difficulty":"","type":"選択問題","question":"金属の性状として、誤っているものはどれか。","options":["すべて不燃性である。","一般に展性・延性に富み金属光沢をもつ。","銀の熱伝導率は鉄より大きい。","20℃で液体のものもある。","軽金属は一般に比重4以下で、カリウム、アルミニウム、カルシウムなどが該当する。"],"correct":[0],"explanation":"金属でもMgやAl粉など燃焼するものがあり、「すべて不燃性」は誤りです。","source":"追加問題40 p.3","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":72,"originalId":"extra-20260905-060","bundle":"追加問題40"},{"id":"extra-drill-073","subject":"物理・化学","category":"金属材料","difficulty":"","type":"選択問題","question":"金属材料に関する記述について、誤っているものはどれか。","options":["銅は展性・延性に富み電気・熱伝導性が大きく電線などに用いられる。","ステンレス鋼は鉄とクロムなどの合金で、さびにくく耐薬品性が高い。","鉄は乾燥した空気中でも還元されてさびを生じやすい。","チタンは強度・耐食性に優れ軽量で航空機材や腕時計などに用いられる。","アルミニウムは軟らかく展性・延性に富み建材や日用品に用いられる。"],"correct":[2],"explanation":"鉄のさびは酸化反応で、通常は水分と酸素の存在で進行します。「乾燥空気中でも還元されて」は誤りです。","source":"追加問題40 p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":73,"originalId":"extra-20260905-061","bundle":"追加問題40"},{"id":"extra-drill-074","subject":"物理・化学","category":"元素","difficulty":"","type":"選択問題","question":"金属元素と非金属元素に関する記述について、誤っているものはどれか。","options":["金属元素の単体は金属光沢があり熱と電気をよく通す。","金属元素は陽イオンになりやすい。","ハロゲンは非金属元素である。","遷移元素はすべて金属元素である。","非金属元素の単体は20℃ですべて気体または固体である。"],"correct":[4],"explanation":"臭素Br₂は20℃付近で液体の非金属単体なので、選択肢5が誤りです。","source":"追加問題40 p.4","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":74,"originalId":"extra-20260905-062","bundle":"追加問題40"},{"id":"extra-drill-075","subject":"物理・化学","category":"イオン化傾向","difficulty":"","type":"選択問題","question":"次の金属のうち、イオン化傾向が最も大きいものはどれか。","options":["カリウム","銅","鉄","白金","金"],"correct":[0],"explanation":"代表的な並びではKはFe、Cu、Pt、Auよりイオン化傾向が大きいです。","source":"追加問題40 p.5＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":75,"originalId":"extra-20260905-063","bundle":"追加問題40"},{"id":"extra-drill-076","subject":"物理・化学","category":"イオン化傾向","difficulty":"","type":"選択問題","question":"金属は塩酸に溶けて水素を発生するものが多いが、次のうち塩酸に溶けないものはどれか。","options":["亜鉛","ニッケル","白金","鉄","スズ"],"correct":[2],"explanation":"白金は水素よりイオン化傾向が小さく、希塩酸とは反応して水素を発生しません。","source":"追加問題40 p.5＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":76,"originalId":"extra-20260905-064","bundle":"追加問題40"},{"id":"extra-drill-077","subject":"物理・化学","category":"イオン化傾向","difficulty":"","type":"選択問題","question":"金属のイオン化傾向の説明A〜Dのうち、正しいものの組合せはどれか。\nA. 小さい金属ほど大きい金属より酸化されやすい。\nB. 大きい金属には希硫酸や希塩酸と反応し水素を発生するものがある。\nC. イオン化傾向と反応性の関係はほとんどない。\nD. イオン化傾向の異なる金属を組み合わせ、酸化還元反応を利用して電池ができる。","options":["AとB","AとC","AとD","BとC","BとD"],"correct":[4],"explanation":"BとDが正しいです。イオン化傾向が大きいほど酸化されやすく反応性も高い傾向があります。","source":"追加問題40 p.5＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":77,"originalId":"extra-20260905-065","bundle":"追加問題40"},{"id":"extra-drill-078","subject":"物理・化学","category":"腐食","difficulty":"","type":"選択問題","question":"鉄の腐食について、誤っているものはどれか。","options":["酸性域の水中では水素イオン濃度が高いほど腐食しやすい。","発煙硫酸に浸すと不動態被膜を形成する。","アルカリ性のコンクリート中では腐食は防止される。","塩分が付着すると腐食しやすい。","水中で鉄と銅が接触していると鉄の腐食は防止される。"],"correct":[4],"explanation":"鉄と銅が電解質中で接触すると、より卑な鉄が陽極となって腐食が促進されます。","source":"追加問題40 p.6","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":78,"originalId":"extra-20260905-066","bundle":"追加問題40"},{"id":"extra-drill-079","subject":"物理・化学","category":"腐食","difficulty":"","type":"選択問題","question":"鋼製の危険物配管を埋設する場合、最も腐食が起こりにくいものはどれか。","options":["土壌埋設配管がコンクリート中の鉄筋に接触している。","直流電気鉄道の軌条に近接した土壌に埋設されている。","エポキシ樹脂塗料で完全に被覆され土壌に埋設されている。","砂層と粘土層にまたがって埋設されている。","土壌中とコンクリート中にまたがって埋設されている。"],"correct":[2],"explanation":"完全な絶縁性被覆は土壌・水分との接触を遮断して腐食を抑えます。異質環境や迷走電流は腐食原因になり得ます。","source":"追加問題40 p.6","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":79,"originalId":"extra-20260905-067","bundle":"追加問題40"},{"id":"extra-drill-080","subject":"物理・化学","category":"腐食","difficulty":"","type":"選択問題","question":"炭素鋼管の腐食についての説明として、誤っているものはどれか。","options":["ステンレス鋼管とつなぎ合わせると腐食しにくくなる。","亜鉛めっきをすると腐食しにくくなる。","埋設時にマグネシウム合金を電極として接続すると腐食しにくくなる。","エポキシ樹脂塗料で塗装すると腐食しにくくなる。","ポリエチレンで被覆すると腐食しにくくなる。"],"correct":[0],"explanation":"炭素鋼をより貴なステンレスと電解質存在下で接触させると、異種金属接触腐食で炭素鋼側が腐食しやすくなります。","source":"追加問題40 p.7","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":80,"originalId":"extra-20260905-068","bundle":"追加問題40"},{"id":"extra-drill-081","subject":"物理・化学","category":"電気防食","difficulty":"","type":"選択問題","question":"地中埋設の鋼製危険物配管を電気化学的腐食から防ぐため接続する異種金属として、A〜Eのうち正しい組合せはどれか。\nA亜鉛 Bニッケル C銅 Dアルミニウム Eマグネシウム","options":["A","A、D","B、C","A、D、E","B、C、E"],"correct":[3],"explanation":"流電陽極には鉄よりイオン化傾向が大きいZn、Al、Mgを用います。","source":"追加問題40 p.8＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":81,"originalId":"extra-20260905-069","bundle":"追加問題40"},{"id":"extra-drill-082","subject":"物理・化学","category":"電気防食","difficulty":"","type":"選択問題","question":"次の文のA〜Cに当てはまる語句の組合せとして正しいものはどれか。\n「金属が水溶液中で(A)になろうとする性質をイオン化傾向という。流電陽極法では、保護する金属よりイオン化傾向の(B)金属が溶解する。鉄の腐食防止には(C)の合金を用いる。」","options":["陽イオン／大きい／アルミニウム","陽イオン／小さい／銅","陽イオン／大きい／水銀","陰イオン／小さい／アルミニウム","陰イオン／大きい／銅"],"correct":[0],"explanation":"金属は陽イオンになろうとし、鉄よりイオン化傾向の大きいAl・Mg・Zn系材料を犠牲陽極として用います。","source":"追加問題40 p.8＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":82,"originalId":"extra-20260905-070","bundle":"追加問題40"},{"id":"extra-drill-083","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"アルコールを酸化剤で酸化すると、第1級アルコールは(A)になり、さらに酸化すると(B)になる。第2級アルコールは(C)になる。正しい組合せはどれか。","options":["アルデヒド／カルボン酸／ケトン","アルデヒド／カルボン酸／エーテル","カルボン酸／アルデヒド／エステル","カルボン酸／アルデヒド／エーテル","エーテル／エステル／ケトン"],"correct":[0],"explanation":"第1級アルコール→アルデヒド→カルボン酸、第2級アルコール→ケトンです。","source":"追加問題40 p.9＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":83,"originalId":"extra-20260905-071","bundle":"追加問題40"},{"id":"extra-drill-084","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"不飽和炭化水素について、(A)は分子中に炭素間の三重結合C≡Cを含む。炭素数2の(A)は(B)とよばれ、炭化カルシウムと水から生成できる。正しい組合せはどれか。","options":["アルカン／アセチレン","アルキン／エチレン","アルキン／アセチレン","アルケン／エチレン","アルケン／アセチレン"],"correct":[2],"explanation":"三重結合を持つ炭化水素はアルキン、炭素数2はアセチレンです。","source":"追加問題40 p.9＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":84,"originalId":"extra-20260905-072","bundle":"追加問題40"},{"id":"extra-drill-085","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"次の化合物のうち、エステルに該当しないものはどれか。","options":["酢酸エチル CH₃COOC₂H₅","酢酸アンモニウム CH₃COONH₄","酢酸ブチル CH₃COOC₄H₉","酪酸エチル C₃H₇COOC₂H₅","ギ酸メチル HCOOCH₃"],"correct":[1],"explanation":"酢酸アンモニウムはカルボン酸のアンモニウム塩で、エステルではありません。","source":"追加問題40 p.9＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":85,"originalId":"extra-20260905-073","bundle":"追加問題40"},{"id":"extra-drill-086","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"炭素と水素からなる有機化合物を完全燃焼させたとき、生成する物質のみを掲げたものはどれか。","options":["有機過酸化物と二酸化炭素","過酸化水素と二酸化炭素","飽和炭化水素と水","二酸化炭素と水","有機過酸化物と水"],"correct":[3],"explanation":"炭化水素の完全燃焼では炭素はCO₂、水素はH₂Oになります。","source":"追加問題40 p.10","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":86,"originalId":"extra-20260905-074","bundle":"追加問題40"},{"id":"extra-drill-087","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"有機化合物に関する説明として、誤っているものはどれか。","options":["主な成分元素はC,H,Oで、N,S,P,ハロゲンを含むものもある。","炭素原子が共有結合でつながり鎖状や環状構造をつくる。","水に溶けにくく有機溶媒に溶けやすいものが多い。","無機化合物より融点・沸点の低いものが多い。","燃えるものが多く、完全燃焼すると主に一酸化炭素と水を生成する。"],"correct":[4],"explanation":"完全燃焼では主に二酸化炭素と水を生成します。一酸化炭素は不完全燃焼で生じます。","source":"追加問題50 1枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":87,"originalId":"extra-20260905-075","bundle":"追加問題50"},{"id":"extra-drill-088","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"有機化合物に関する説明のうち、誤っているものはどれか。","options":["第一級アルコールを酸化するとアルデヒドができる。","アルデヒドを酸化するとカルボン酸ができる。","アルコールとカルボン酸が結合するとエステルができる。","アルコールのヒドロキシ基の水素原子を炭化水素基に置換するとケトンができる。","アンモニアの水素原子を炭化水素基で置換するとアミンができる。"],"correct":[3],"explanation":"アルコールの−OHのHを炭化水素基で置換するとR−O−R型のエーテルになります。","source":"追加問題50 1枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":88,"originalId":"extra-20260905-076","bundle":"追加問題50"},{"id":"extra-drill-089","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"アルコールとエーテルについて、誤っているものはどれか。","options":["ジエチルエーテルはエタノールより水に溶けにくく反応性に乏しい。","ジメチルエーテルはエタノールの構造異性体である。","エタノールを脱水反応させるとジエチルエーテルが生成する。","ジエチルエーテルは有機化合物をよく溶かす。","ナトリウムはエタノールおよびジエチルエーテル双方と反応し水素を発生する。"],"correct":[4],"explanation":"Naはエタノールの−OHのHと反応してH₂を発生しますが、ジエチルエーテルにはその水素がなく同様の反応はしません。","source":"追加問題50 2枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":89,"originalId":"extra-20260905-077","bundle":"追加問題50"},{"id":"extra-drill-090","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"ベンゼン（C₆H₆）の構造について、正しいものはどれか。","options":["C−C結合長はエタンのC−C結合長と等しい。","C−C結合長はエチレンのC=C結合長より短い。","C−C結合長は2種類ある。","C−H結合長はどのC−C結合長より長い。","付加反応より置換反応が起こりやすい構造である。"],"correct":[4],"explanation":"ベンゼン環は共鳴によりC−C結合が等価で、芳香族性を保つ置換反応が付加反応より起こりやすいです。","source":"追加問題50 2枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":90,"originalId":"extra-20260905-078","bundle":"追加問題50"},{"id":"extra-drill-091","subject":"物理・化学","category":"有機化学","difficulty":"","type":"選択問題","question":"次の物質のうち、官能基がヒドロキシ基（−OH）であるものはどれか。","options":["ジエチルエーテル C₂H₅OC₂H₅","メタノール CH₃OH","アセトン CH₃COCH₃","酢酸エチル CH₃COOC₂H₅","アセトアルデヒド CH₃CHO"],"correct":[1],"explanation":"メタノールはアルコールでヒドロキシ基−OHをもちます。","source":"追加問題50 2枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":91,"originalId":"extra-20260905-079","bundle":"追加問題50"},{"id":"extra-drill-092","subject":"物理・化学","category":"高分子","difficulty":"","type":"選択問題","question":"「高分子化合物とは(A)が約10,000以上の化合物をいい、構成単位となる物質を(B)という。ポリエチレンは(C)が(D)した高分子化合物である。」正しい組合せはどれか。","options":["質量／単量体／プロピレン／縮合重合","分子量／重合体／プロピレン／付加重合","分子量／重合体／エチレン／縮合重合","分子量／単量体／エチレン／付加重合","質量／単量体／エチレン／縮合重合"],"correct":[3],"explanation":"高分子は大きな分子量をもち、モノマー＝単量体が重合します。ポリエチレンはエチレンの付加重合体です。","source":"追加問題50 3枚目＋スクショ","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":92,"originalId":"extra-20260905-080","bundle":"追加問題50"},{"id":"extra-drill-093","subject":"物理・化学","category":"高分子","difficulty":"","type":"選択問題","question":"プラスチックの熱に対する分類の組合せとして、誤っているものはどれか。","options":["メラミン樹脂……熱硬化性","ポリエチレン……熱可塑性","塩化ビニル樹脂……熱硬化性","ポリプロピレン……熱可塑性","フェノール樹脂……熱硬化性"],"correct":[2],"explanation":"塩化ビニル樹脂（PVC）は熱可塑性樹脂です。","source":"追加問題50 4枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":93,"originalId":"extra-20260905-081","bundle":"追加問題50"},{"id":"extra-drill-094","subject":"物理・化学","category":"高分子","difficulty":"","type":"選択問題","question":"石油からつくられるプラスチックの一般的な特徴について、誤っているものはどれか。","options":["腐食しにくい。","酸や塩基に侵されにくい。","成形・加工が容易である。","電気を通しやすい。","密度が小さく軽い。"],"correct":[3],"explanation":"一般的なプラスチックは電気を通しにくい絶縁体です。","source":"追加問題50 4枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":94,"originalId":"extra-20260905-082","bundle":"追加問題50"},{"id":"extra-drill-095","subject":"物理・化学","category":"主な気体","difficulty":"","type":"選択問題","question":"酸素について、誤っているものはどれか。","options":["20℃、1気圧では無色無臭の気体である。","空気中には約21vol%含まれる。","非常に燃えやすい物質である。","一般に酸素濃度が高くなると可燃物の燃焼は激しくなる。","過酸化水素などの分解によっても得られる。"],"correct":[2],"explanation":"酸素は支燃性（他物質の燃焼を助ける）ですが、酸素自体が可燃物として「非常に燃えやすい」わけではありません。","source":"追加問題50 5枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":95,"originalId":"extra-20260905-083","bundle":"追加問題50"},{"id":"extra-drill-096","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"酸素について、次のうち誤っているものはどれか。","options":["貴ガス（希ガス）元素とは反応しない。","窒素とは激しく反応する。","液体酸素は淡青色である。","20℃では、いくら加圧しても液体にはならない。","鉄、亜鉛およびアルミニウムと直接反応して酸化物をつくる。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"追加問題50 6枚目（問2）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":96,"originalId":"chem-gas-p331-q2","bundle":"追加問題50"},{"id":"extra-drill-097","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"次の文の（　）内のA〜Dに当てはまる語句の組合せとして、正しいものはどれか。\n「二酸化炭素は、炭素または（A）の（B）燃焼の他、生物の呼吸や糖類の発酵によっても生成する。二酸化炭素は、空気より（C）気体で、水に溶け、弱い（D）性を示す。」","options":["A：無機化合物／B：不完全／C：重い／D：アルカリ","A：炭素化合物／B：完全／C：重い／D：酸","A：酸素化合物／B：不完全／C：軽い／D：アルカリ","A：無機化合物／B：完全／C：軽い／D：酸","A：炭素化合物／B：不完全／C：軽い／D：アルカリ"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"追加問題50 6枚目（問3）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":97,"originalId":"chem-gas-p331-q3","bundle":"追加問題50"},{"id":"extra-drill-098","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"20℃、1気圧（1.013×10⁵Pa）において、二酸化炭素が燃えない理由として、次のうち正しいものはどれか。","options":["酸素と結合するが、吸熱反応であるから","酸化反応を起こすが、燃焼が継続しないから","酸化反応を起こすが、発熱量が小さいから","二酸化炭素の熱伝導率が大きいから","酸素と結合しないから"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"追加問題50 6枚目（問4）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":98,"originalId":"chem-gas-p331-q4","bundle":"追加問題50"},{"id":"extra-drill-099","subject":"物理・化学","category":"主な気体","difficulty":"","type":"選択問題","question":"一酸化炭素と二酸化炭素の性質A〜Eのうち、二酸化炭素にのみ該当する組合せはどれか。\nA無色無臭 B人体に極めて有毒 C石灰水を白濁 D空気中で青白い炎で燃焼 E生物の呼吸で生成","options":["AとD","AとE","BとC","BとD","CとE"],"correct":[4],"explanation":"CO₂に特有なのは石灰水を白濁させることと、生物の呼吸で生成することです。無色無臭はCOにも共通します。","source":"追加問題50 6枚目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":99,"originalId":"extra-20260905-084","bundle":"追加問題50"},{"id":"extra-drill-100","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"一酸化炭素の性状について、次のうち誤っているものはどれか。","options":["無色無臭の気体である。","毒性がある。","青白い炎をあげて燃焼する。","炭化水素の完全燃焼により発生する。","還元作用がある。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"追加問題50 7枚目（問6）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":100,"originalId":"chem-gas-p332-q6","bundle":"追加問題50"},{"id":"extra-drill-101","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"水素について、次のうち誤っているものはどれか。","options":["物質中最も軽く、非常に拡散しやすい可燃性気体である。","水に溶けにくい。","純粋なものは、特有の臭いを有する青白色の気体である。","見えにくい炎をあげて燃え、水を生成する。","燃焼範囲は、非常に広い。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"追加問題50 7枚目（問7）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":101,"originalId":"chem-gas-p332-q7","bundle":"追加問題50"},{"id":"extra-drill-102","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"次のガス又は水蒸気のうち、空気より軽いものはどれか。","options":["ガソリン","エタノール","水素","ベンゼン","灯油"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"追加問題50 7枚目（問8）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":102,"originalId":"chem-gas-p332-q8","bundle":"追加問題50"},{"id":"extra-drill-103","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"窒素について、次のうち誤っているものはどれか。","options":["空気の成分では最も多く、約78vol％含まれている。","アンモニウム塩、硝酸塩、タンパク質などとして、生体中に存在する。","高温、高圧では、他の元素と直接化合して、アンモニア、酸化窒素など多くの窒化物を作る。","液体窒素は、無色透明で流動性が大きい。","窒素は、水によく溶けて消火の際に有効な作用をする。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"追加問題50 7枚目（問9）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":103,"originalId":"chem-gas-p332-q9","bundle":"追加問題50"},{"id":"extra-drill-104","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"空気の一般的性状について、次のうち誤っているものはどれか。","options":["乾燥した空気の組成は、ほぼ一定である。","空気中の水蒸気量は、可燃物の燃焼の難易に影響する。","ろうそくの炎には、空気中の酸素が拡散によって運ばれる。","空気中の窒素は、可燃物の急激な燃焼を抑制している。","空気中で酸素濃度が19.7％以下になると、燃焼反応は継続できない。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"追加問題50 7枚目（問10）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":104,"originalId":"chem-gas-p332-q10","bundle":"追加問題50"},{"id":"extra-drill-105","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の類ごとに共通する性状として、次のうち妥当でないものはどれか。","options":["第1類の危険物は、水との反応性はなく、酸素を自ら含む可燃性の固体または液体である。","第2類の危険物には、非水溶性の固体で、酸化剤と混合すると発火・爆発するものがある。","第3類の危険物には、水と反応して、水素を生じるものがある。","第5類の危険物は、比重が1より大きく、燃焼速度の大きい、自己反応性の固体または液体である。","第6類の危険物には、不燃性の液体で、引火性液体と混合すると発火・爆発するものがある。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"追加問題50 8・9枚目（問6）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":105,"originalId":"nature-a-p338-q6","bundle":"追加問題50"},{"id":"extra-drill-106","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"次に掲げた危険物のうち、両方とも水に溶けないものはどれか。","options":["二硫化炭素／メタノール","クレオソート油／アセトン","エチレングリコール／アニリン","酸化プロピレン／ピリジン","トルエン／軽油"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"追加問題50 10枚目（問9）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":106,"originalId":"nature-a-p345-q9","bundle":"追加問題50"},{"id":"extra-drill-107","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"ジエチルエーテルの貯蔵、取扱いの方法として、次のうち妥当でないものはどれか。","options":["直射日光を避け冷所に貯蔵する。","容器は、密栓する。","火気および高温体の接近を避ける。","建物の内部に滞留した蒸気は、屋外の高所に排出する。","水より重く水に溶けにくいので、容器等に水を張って蒸気の発生を抑制する。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"追加問題60 1ページ目（問4）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":107,"originalId":"nature-a-p367-q4","bundle":"追加問題60"},{"id":"extra-drill-108","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"ジエチルエーテルの性状について、次のうち妥当でないものはどれか。","options":["沸点が極めて低い。","電気の良導体であり、流動等によっても静電気が発生しにくい。","蒸気比重は1より大きい。","比重は1より小さく、水にわずかしか溶けない。","引火点が極めて低く、かつ、燃焼範囲も極めて広い。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"追加問題60 1ページ目（問5）","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":108,"originalId":"nature-a-p367-q5","bundle":"追加問題60"},{"id":"extra-drill-109","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"危険物の性状について、次のうち誤っているものはどれか。","options":["二硫化炭素の比重は1より小さく、水によく溶ける。","二硫化炭素は燃焼すると、有毒な二酸化硫黄を発生する。","ジエチルエーテルは空気中で徐々に酸化して、爆発性の過酸化物を生成することがある。","アセトアルデヒドは加圧下で空気に接触させると、爆発性の過酸化物を生成することがある。","アセトアルデヒドは、アルコールを酸化させると生成される。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"追加問題60 2ページ目","verified":"audited-2026-08-13","answerAudit":"2026-09-05","no":109,"originalId":"nature-a-p368-q10","bundle":"追加問題60"},{"id":"extra-drill-110","subject":"法令","category":"強化｜屋外貯蔵所③貯蔵できる危険物","difficulty":"2","type":"正しいものを選べ","question":"法令上、屋外貯蔵所において貯蔵し、または取り扱うことができる危険物の組み合わせとして、次のうち正しいものはどれか。","options":["炭化カルシウム／鉄粉／灯油","硫黄／灯油／重油","アセトン／エタノール／ギヤー油","黄リン／カリウム／シリンダー油","過酸化水素／クレオソート油／赤リン"],"correct":[1],"explanation":"正解は2。現行の危険物規制では、屋外貯蔵所の対象に硫黄、灯油（第2石油類）、重油（第3石油類）は含まれます。アセトンは第1石油類ですが引火点が0℃未満のため、この屋外貯蔵所の対象から外れます。","source":"追加問題60 3ページ目","verified":"reinforcement-audit-2026-08-21","answerAudit":"2026-09-05","no":110,"originalId":"reinforce-law-123","bundle":"追加問題60","auditFlag":"現行法確認済み"},{"id":"extra-drill-111","subject":"法令","category":"標識・掲示板","difficulty":"","type":"選択問題","question":"法令上、製造所等に設置する標識及び掲示板について、次のうち誤っているものはどれか。","options":["アルカリ金属の過酸化物を除く第1類の危険物を貯蔵する屋内貯蔵所には、青地に白文字で「禁水」と記した掲示板を設置する。","引火性固体を除く第2類の危険物を貯蔵する屋内貯蔵所には、赤地に白文字で「火気注意」と記した掲示板を設置する。","給油取扱所には、黄赤地に黒文字で「給油中エンジン停止」と記した掲示板を設置する。","製造所には、白地に黒文字で製造所である旨を表示した標識を見やすい箇所に設置する。","移動タンク貯蔵所には、黒地の板に黄色の反射塗料で「危」と記した標識を車両の前後の見やすい箇所に掲げる。"],"correct":[0],"explanation":"正解は1。「禁水」は第1類のうちアルカリ金属の過酸化物若しくはこれを含有するもの、または禁水性物品に表示します。「それらを除く第1類」に一律で表示する、という記述が誤りです。2・3・4・5は現行法の表示基準に合致します。","source":"追加問題60 4ページ目","verified":"追加問題監査-2026-09-05","answerAudit":"2026-09-05","no":111,"originalId":"extra-20260905-085","bundle":"追加問題60","auditFlag":"現行法確認済み"},{"id":"extra-drill-112","subject":"法令","category":"強化｜警報設備①穴埋め","difficulty":"1","type":"当てはまる数値を選べ","question":"法令上、警報設備の設置義務について、次の文の（　）内にあてはまる数値は、次のうちどれか。\n\n「指定数量の倍数が（　）以上の危険物を取り扱う製造所等（移動タンク貯蔵所を除く）では、警報設備の設置が義務付けられている。」","options":["5","10","20","30","50"],"correct":[1],"explanation":"正解は2（10）。危険物の規制に関する政令第21条は指定数量の倍数10以上を基準とし、規則第36条の2で移動タンク貯蔵所を対象外としています。","source":"追加問題60 5ページ目","verified":"reinforcement-audit-2026-08-21","answerAudit":"2026-09-05","no":112,"originalId":"reinforce-law-182","bundle":"追加問題60","auditFlag":"現行法確認済み"},{"id":"extra-drill-113","subject":"法令","category":"強化｜警報設備②設置義務から除かれるもの","difficulty":"1","type":"正しいものを選べ","question":"法令上、指定数量の倍数が10以上の製造所等で、警報設備を設置しなければならないものから除かれているのは、次のうちどれか。","options":["一般取扱所","屋内貯蔵所","簡易タンク貯蔵所","移動タンク貯蔵所","給油取扱所"],"correct":[3],"explanation":"正解は4（移動タンク貯蔵所）。危険物の規制に関する規則第36条の2で、警報設備を設ける対象は製造所等のうち移動タンク貯蔵所以外とされています。","source":"追加問題60 5ページ目","verified":"reinforcement-audit-2026-08-21","answerAudit":"2026-09-05","no":113,"originalId":"reinforce-law-183","bundle":"追加問題60","auditFlag":"現行法確認済み"}];

const BLOCKS=[{"id":"1-15","label":"1〜15問","start":1,"end":15},{"id":"16-30","label":"16〜30問","start":16,"end":30},{"id":"31-45","label":"31〜45問","start":31,"end":45},{"id":"46-60","label":"46〜60問","start":46,"end":60},{"id":"61-75","label":"61〜75問","start":61,"end":75},{"id":"76-90","label":"76〜90問","start":76,"end":90},{"id":"91-105","label":"91〜105問","start":91,"end":105},{"id":"106-113","label":"106〜113問","start":106,"end":113}];
const KEY='otsu4_extra_drill_113q_v1';
function defaults(){const laps={};BLOCKS.forEach(b=>laps[b.id]=0);return {version:1,laps,last:{},stats:{},wrong:{},history:[],session:null,theme:'dark'}}
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));const d=defaults();if(!x)return d;return Object.assign(d,x,{laps:Object.assign(d.laps,x.laps||{}),last:x.last||{},stats:x.stats||{},wrong:x.wrong||{},history:x.history||[]})}catch(e){return defaults()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qByNo(n){return QUESTIONS[n-1]}
function blockById(id){return BLOCKS.find(b=>b.id===id)}
function applyTheme(){document.body.classList.toggle('light',db.theme==='light');document.getElementById('themeBtn').textContent=db.theme==='light'?'🌙 ナイト':'☀️ ライト';document.querySelector('meta[name="theme-color"]').setAttribute('content',db.theme==='light'?'#f4f6f8':'#0b0f14')}
function toggleTheme(){db.theme=db.theme==='light'?'dark':'light';save();applyTheme()}
function wrongCount(){return Object.keys(db.wrong).length}
function lastText(id){const x=db.last[id];return x?` / 前回 ${x.score}/${x.total}（${Math.round(x.score/x.total*100)}%）`:''}
function blockButton(b){return `<button class="mode" onclick="startBlock('${b.id}')">📚 ${b.label}<small>${db.laps[b.id]||0}周完了${lastText(b.id)}</small></button>`}
function home(){const s=db.session;const resume=s?`<button class="mode primary" onclick="renderQuestion()">▶ 続きから<small>${esc(sessionLabel(s))}｜${s.pos+1}/${s.order.length}問</small></button>`:'';document.getElementById('app').innerHTML=`
<div class="top"><div><div class="brand">乙四 追加問題113問</div><div class="sub">追加問題10〜60＋対応スクショ</div></div></div>
<section class="card hero"><h1>15問ずつ周回</h1><div class="badges"><span class="badge ok">✓ 113問 正答監査</span><span class="badge">即判定</span><span class="badge">途中再開</span><span class="badge">図拡大</span></div><div class="stats"><div class="stat"><b>113</b><span>問題</span></div><div class="stat"><b>${BLOCKS.reduce((a,b)=>a+(db.laps[b.id]||0),0)}</b><span>周回</span></div><div class="stat"><b>${wrongCount()}</b><span>未克服</span></div></div></section>
${resume}<section class="card"><div class="grid">${BLOCKS.map(blockButton).join('')}</div>${wrongCount()?`<button class="mode primary" onclick="startWrong()">🧠 間違い問題<small>${wrongCount()}問 / 2連続正解で克服</small></button>`:''}</section>
<section class="card"><div class="row"><button class="btn secondary" onclick="records()">学習記録</button><button class="btn danger" onclick="resetData()">記録リセット</button></div><p class="tiny" style="margin-bottom:0">ブロック内は毎周シャッフル。複数選択は必要数で自動判定。</p></section>`}
function sessionLabel(s){if(s.mode==='wrong')return '間違い問題';const b=blockById(s.block);return b?b.label:'追加問題'}
function startBlock(id){const b=blockById(id);const nos=[];for(let n=b.start;n<=b.end;n++)nos.push(n);db.session={mode:'block',block:id,order:shuffle(nos),pos:0,score:0,pending:null,selected:[],started:Date.now()};save();renderQuestion()}
function startWrong(){const nos=Object.keys(db.wrong).map(x=>Number(x)).filter(n=>n>=1&&n<=QUESTIONS.length);if(!nos.length){alert('間違い問題はありません。');return home()}db.session={mode:'wrong',order:shuffle(nos).slice(0,15),pos:0,score:0,pending:null,selected:[],started:Date.now()};save();renderQuestion()}
function renderQuestion(){const s=db.session;if(!s)return home();const q=qByNo(s.order[s.pos]);if(!q){db.session=null;save();return home()}const answered=!!s.pending;const progress=Math.round((s.pos+(answered?1:0))/s.order.length*100);const need=q.correct.length;document.getElementById('app').innerHTML=`<div class="top"><button class="btn secondary" onclick="home()">← ホーム</button><div style="text-align:right"><div class="brand" style="font-size:15px">${esc(sessionLabel(s))}${s.mode==='block'?` ${db.laps[s.block]+1}周目`:''}</div><div class="sub">${s.pos+1}/${s.order.length}</div></div></div><div class="progress"><div style="width:${progress}%"></div></div><section class="qcard"><div class="qmeta"><span class="badge">No.${q.no}</span><span class="badge">${esc(q.subject)}</span><span class="badge">${esc(q.bundle)}</span>${q.auditFlag?`<span class="badge ${q.auditFlag.includes('注意')?'warn':'ok'}">${esc(q.auditFlag)}</span>`:''}</div><div class="qtitle">${esc(q.question)}</div>${q.image?`<div class="figure"><img src="${IMAGES[q.image]}" alt="問題図" onclick="openImage('${q.image}')"></div>`:''}<div class="source">出典：${esc(q.source||q.bundle)}</div>${need>1&&!answered?`<div class="hint">複数選択：${need}個選ぶと自動判定</div>`:''}${q.options.map((o,i)=>`<button id="opt${i}" class="opt ${(s.selected||[]).includes(i)&&!answered?'selected':''}" onclick="choose(${i})" ${answered?'disabled':''}><span class="n">${i+1}</span><span>${esc(o)}</span></button>`).join('')}<div id="resultbox"></div></section>`;if(answered)paintResult(q,s.pending)}
function choose(i){const s=db.session;if(!s||s.pending)return;const q=qByNo(s.order[s.pos]);const need=q.correct.length;if(need===1)return submit([i]);s.selected=s.selected||[];const at=s.selected.indexOf(i);if(at>=0)s.selected.splice(at,1);else if(s.selected.length<need)s.selected.push(i);save();if(s.selected.length===need)submit([...s.selected]);else renderQuestion()}
function submit(selected){const s=db.session;if(!s||s.pending)return;const q=qByNo(s.order[s.pos]);const a=[...selected].sort((x,y)=>x-y),c=[...q.correct].sort((x,y)=>x-y);const ok=a.length===c.length&&a.every((x,j)=>x===c[j]);const st=db.stats[q.no]||{attempts:0,correct:0,wrong:0};st.attempts++;if(ok)st.correct++;else st.wrong++;db.stats[q.no]=st;if(ok)s.score++;if(s.mode==='wrong'){if(ok){const w=db.wrong[q.no]||{streak:0};w.streak=(w.streak||0)+1;if(w.streak>=2)delete db.wrong[q.no];else db.wrong[q.no]=w}else db.wrong[q.no]={streak:0}}else{if(!ok)db.wrong[q.no]={streak:0};else if(db.wrong[q.no]){db.wrong[q.no].streak=0}}s.pending={selected:a,ok};save();renderQuestion()}
function paintResult(q,p){q.options.forEach((_,i)=>{const el=document.getElementById('opt'+i);if(q.correct.includes(i))el.classList.add('correct');if(p.selected.includes(i)&&!q.correct.includes(i))el.classList.add('wrong')});const nos=q.correct.map(x=>x+1).join('・');const extra=q.auditFlag==='出典表記注意'?`<div class="notice">⚠️ 出典の数値・状態表記に内部不整合があります。問題文は原文どおり残し、正答に影響しないことを確認しています。</div>`:'';document.getElementById('resultbox').innerHTML=`<div class="result ${p.ok?'ok':'ng'}"><b>${p.ok?'○ 正解':'× 不正解'}　正解：${nos}</b>${extra}<div class="explain">${esc(q.explanation||'')}</div></div><button class="next" onclick="nextQuestion()">${db.session.pos+1>=db.session.order.length?'結果を見る':'次の問題へ'}</button>`}
function nextQuestion(){const s=db.session;if(!s)return home();s.pos++;s.pending=null;s.selected=[];save();if(s.pos>=s.order.length)finish();else renderQuestion()}
function finish(){const s=db.session;if(!s)return home();const total=s.order.length,score=s.score,label=sessionLabel(s),mode=s.mode,block=s.block;if(mode==='block'){db.laps[block]=(db.laps[block]||0)+1;db.last[block]={score,total,date:Date.now()}}db.history.unshift({mode,block,label,score,total,date:Date.now()});db.history=db.history.slice(0,60);db.session=null;save();document.getElementById('app').innerHTML=`<div class="top"><div class="brand">${esc(label)} 完了！</div></div><section class="card hero"><div class="finishScore">${score}/${total}</div><p>正答率 ${Math.round(score/total*100)}%</p><div class="stats"><div class="stat"><b>${mode==='block'?db.laps[block]:'—'}</b><span>${mode==='block'?'周回数':'復習'}</span></div><div class="stat"><b>${total-score}</b><span>今回ミス</span></div><div class="stat"><b>${wrongCount()}</b><span>未克服</span></div></div></section><div class="row"><button class="btn secondary" onclick="home()">ホーム</button><button class="btn" onclick="${mode==='block'?`startBlock('${block}')`:'startWrong()'}">もう1周</button></div>`}
function records(){const blocks=BLOCKS.map(b=>`<div class="listitem"><div><b>${b.label}</b><div class="tiny">${lastText(b.id)||'まだ未実施'}</div></div><b>${db.laps[b.id]||0}周</b></div>`).join('');const qrows=QUESTIONS.map(q=>{const st=db.stats[q.no]||{attempts:0,wrong:0};return `<div class="listitem"><div><b>No.${q.no} ${esc(q.bundle)}</b><div class="tiny">${esc(q.category||q.subject)}</div></div><div style="text-align:right"><b>${st.wrong||0}ミス</b><div class="tiny">${st.attempts||0}回答</div></div></div>`}).join('');const h=db.history.slice(0,12).map(x=>`<div class="listitem"><div>${esc(x.label)}<div class="tiny">${new Date(x.date).toLocaleString()}</div></div><b>${x.score}/${x.total}</b></div>`).join('');document.getElementById('app').innerHTML=`<div class="top"><button class="btn secondary" onclick="home()">← ホーム</button><div class="brand">学習記録</div></div><section class="card"><h3>ブロック周回</h3>${blocks}</section><section class="card"><h3>最近の結果</h3>${h||'<p class="tiny">まだ記録がありません。</p>'}</section><section class="card"><h3>問題別ミス回数</h3>${qrows}</section>`}
function resetData(){if(!confirm('周回数・回答記録・間違い問題をすべてリセットしますか？'))return;const theme=db.theme;db=defaults();db.theme=theme;save();home()}
function openImage(key){document.getElementById('modalImg').src=IMAGES[key];document.getElementById('modal').classList.add('show')}
function closeImage(){document.getElementById('modal').classList.remove('show')}
applyTheme();home();
</script></body></html>
