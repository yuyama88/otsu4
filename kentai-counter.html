<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="検体数">
<title>検体数カウンター</title>
<style>
:root{
--bg:#f2f4f7;--surface:#ffffff;--surface-2:#f5f6f9;--sunken:#eef0f4;
--line:#dde1e8;--line-strong:#c6cdd8;
--text:#111722;--muted:#5d6675;--faint:#8b94a3;
--accent:#1f44d6;--accent-ink:#ffffff;--accent-soft:#e9eeff;--accent-line:#b8c5fb;
--danger:#cf2e43;--danger-soft:#fdecef;
--shadow:0 1px 2px rgba(17,23,34,.05),0 6px 18px rgba(17,23,34,.05);
color-scheme:light;
}
@media (prefers-color-scheme:dark){
:root{
--bg:#0e1117;--surface:#171b23;--surface-2:#1d222c;--sunken:#12151c;
--line:#282f3b;--line-strong:#394354;
--text:#eef1f6;--muted:#a4adbb;--faint:#737d8d;
--accent:#8ba3ff;--accent-ink:#0e1117;--accent-soft:#1d2644;--accent-line:#36457c;
--danger:#ff7c8b;--danger-soft:#3a1d24;
--shadow:none;
color-scheme:dark;
}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{width:min(100%,760px);margin:0 auto}

/* header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}
.save-status{color:var(--muted);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.save-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.toolbar{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar input,.toolbar button{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;white-space:nowrap;font-size:14px;font-weight:600}
.toolbar input{min-width:148px}
.toolbar .danger{color:var(--danger)}

main{padding:14px}
.view{display:none}
.view.active{display:block}

/* top summary */
.top-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.hero{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 16px 12px}
.hero .label{font-size:13px;font-weight:700;opacity:.85}
.hero .value{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.summary-card{display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0;box-shadow:var(--shadow)}
.summary-card .label{font-size:11px;color:var(--muted);font-weight:700;line-height:1.3}
.summary-card .label small{display:block;font-weight:500;color:var(--faint);font-size:10px}
.summary-card .value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.01em}
.summary-card.primary .value{color:var(--accent)}

.section{margin-top:18px}
.section:first-child{margin-top:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.section-head h2{margin:0;font-size:15px;font-weight:800}
.section-head small{color:var(--faint);font-size:12px}

/* category */
.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.category-button{min-height:64px;padding:9px 6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:center;box-shadow:var(--shadow)}
.category-button .name{font-size:13px;font-weight:700;color:var(--muted)}
.category-button .total{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.category-button.active{background:var(--accent-soft);border:2px solid var(--accent);padding:8px 5px}
.category-button.active .name,.category-button.active .total{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.active-summary{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:6px}
.active-summary .box{background:var(--sunken);border-radius:10px;padding:8px 9px;min-width:0}
.active-summary .box .label{font-size:10px;color:var(--muted);font-weight:700}
.active-summary .box .value{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.active-summary .category-name .value{color:var(--accent);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.negative{color:var(--danger)!important}

/* count rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.count-row{display:grid;grid-template-columns:minmax(90px,1fr) 50px 86px 50px;gap:6px;align-items:center;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line)}
.count-row:last-child{border-bottom:0}
.count-row .item-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count-row .mini-total{font-size:11px;color:var(--faint);display:block;margin-top:1px;font-weight:500;font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;vertical-align:2px}
.count-row button,.metric-row button{height:46px;border-radius:11px;font-size:22px;font-weight:700}
.minus{background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.plus{background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink)}
.count-row .value-button,.metric-row .value{background:var(--sunken);border:1px solid transparent;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.count-row .value-button.zero-value,.metric-row .value.zero-value{color:var(--faint);font-weight:600}

/* specimen view */
.select-large{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:17px;font-weight:700;outline:none}
.specimen-header{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.metric-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.metric-row{display:grid;grid-template-columns:minmax(100px,1fr) 48px 80px 48px;gap:6px;align-items:center;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line)}
.metric-row:last-child{border-bottom:0}
.metric-row .name{font-weight:700}
.metric-row .sub{font-size:11px;color:var(--faint);margin-top:1px;font-weight:500}
.condition-box{display:grid;grid-template-columns:1fr 1.2fr;gap:9px;align-items:center}
.condition-box label{color:var(--muted);font-size:13px;font-weight:600}

/* summary view */
.summary-category-list,.specimen-total-list{display:grid;gap:8px}
.category.summary-card{display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.category-summary-card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.category-summary-card .head strong{font-size:15px}
.category-summary-card .head b{font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.category-summary-card .details{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.category-summary-card .detail{background:var(--sunken);border-radius:9px;padding:7px 8px}
.category-summary-card .detail span{display:block;font-size:10px;color:var(--muted);font-weight:700}
.category-summary-card .detail b{display:block;font-size:19px;margin-top:1px;font-variant-numeric:tabular-nums}
.specimen-total-list{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.specimen-total-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.specimen-total-row:last-child{border-bottom:0}
.specimen-total-row strong{font-size:15px;font-weight:600}
.specimen-total-row b{font-size:20px;font-variant-numeric:tabular-nums}
.specimen-total-row.is-zero b{color:var(--faint);font-weight:600}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.check-card label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}
.check-card input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);font-size:22px;font-weight:800;text-align:center;outline:none}
textarea{width:100%;min-height:94px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:11px;resize:vertical;outline:none;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent)!important}

/* table */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:68vh;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
th,td{height:42px;padding:4px 8px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:5;background:var(--surface-2);color:var(--muted);font-size:12px}
th:first-child,td:first-child{position:sticky;left:0;z-index:4;background:var(--surface-2);text-align:left;font-weight:700}
thead th:first-child{z-index:7}
td.na{color:var(--faint);background:var(--sunken)}
.table-cell-button{min-width:52px;height:32px;border:0;border-radius:7px;background:transparent;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.table-cell-button.zero-value{color:var(--faint);font-weight:500}
.net-row td,.net-row th{background:var(--accent-soft);color:var(--accent);font-weight:800}
tfoot td,tfoot th{background:var(--surface-2);font-weight:800;border-bottom:0}

/* bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-grid{width:min(100%,760px);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav-button{height:54px;border:0;border-radius:12px;background:transparent;color:var(--faint);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav-button svg{width:22px;height:22px}
.nav-button.active{color:var(--accent);background:var(--accent-soft)}

/* modal */
.modal-backdrop,.confirm-backdrop{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.5);display:none;align-items:flex-end;justify-content:center;padding:10px}
.modal-backdrop.open,.confirm-backdrop.open{display:flex}
.counter-modal,.confirm-box{width:min(100%,520px);background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 16px 16px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:4px 4px 0}
.modal-title{font-size:14px;color:var(--muted);font-weight:700}
.modal-value{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.step-grid,.key-grid,.modal-nav,.confirm-actions{display:grid;gap:7px}
.step-grid{grid-template-columns:repeat(5,1fr);margin-bottom:8px}
.key-grid{grid-template-columns:repeat(3,1fr)}
.modal-nav{grid-template-columns:1fr 1fr;margin-top:8px}
.modal-nav .done{grid-column:1/-1}
.modal-nav button:disabled{opacity:.35;cursor:not-allowed}
.counter-modal button,.confirm-box button{min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:19px;font-weight:700}
.counter-modal .step-grid .plus{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.counter-modal .step-grid .minus{color:var(--muted)}
.counter-modal .modal-nav button{font-size:15px}
.counter-modal .zero{grid-column:span 2}
.counter-modal .done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px!important}
.confirm-box{border-radius:20px;padding:18px}
.confirm-box h3{margin:0 0 7px;font-size:17px}
.confirm-box p{margin:0 0 14px;color:var(--muted);line-height:1.55;font-size:13px}
.confirm-actions{grid-template-columns:1fr 1fr}
.confirm-box button{font-size:16px}
.confirm-actions .confirm{background:var(--danger);border-color:var(--danger);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);z-index:100;background:var(--text);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes flash{from{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}to{}}
.flash{animation:flash .45s ease-out}
.reset-row{margin-top:22px}
.reset-row button{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--danger);font-size:15px;font-weight:700}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.flash{animation:none}}

@media(max-width:430px){
main{padding:12px}
.hero .value{font-size:40px}
.summary-card .value{font-size:22px}
.active-summary{grid-template-columns:1.15fr repeat(3,1fr)}
.active-summary .box{padding:7px 6px}
.active-summary .box .value{font-size:18px}
.count-row{grid-template-columns:minmax(76px,1fr) 46px 76px 46px;gap:5px;padding-left:10px}
.metric-row{grid-template-columns:minmax(92px,1fr) 46px 70px 46px;gap:5px}
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="title-row">
<h1>検体数カウンター</h1>
<div id="saveStatus" class="save-status">自動保存</div>
</div>
<div class="toolbar">
<input id="workDate" type="date" aria-label="集計日">
<button id="todayButton" type="button">今日</button>
<button id="undoButton" type="button">↩ 戻す</button>
<button id="csvButton" type="button">CSV</button>
</div>
</header>
<main>
<div class="top-summary">
<div class="hero"><div class="label">総検体数</div><div id="topGrand" class="value">0</div></div>
<div class="summary-card"><div class="label">血清合計</div><div id="topSerum" class="value">0</div></div>
<div class="summary-card"><div class="label">PCR合計</div><div id="topPcr" class="value">0</div></div>
<div class="summary-card primary"><div class="label">差引血清<small>血清−PCR</small></div><div id="topNetSerum" class="value">0</div></div>
</div>
<section id="viewInput" class="view active">
<div class="section">
<div class="section-head"><h2>区分を選択</h2></div>
<div id="categoryGrid" class="category-grid"></div>
</div>
<div class="section panel">
<div id="activeCategorySummary" class="active-summary"></div>
</div>
<div class="section">
<div class="section-head"><h2 id="inputHeading">検体を入力</h2><small>数字をタップで直接入力・＋長押しで連続</small></div>
<div id="categorySpecimenList" class="list"></div>
</div>
</section>
<section id="viewSpecimen" class="view">
<div class="section">
<div class="section-head"><h2>検体別に確認・入力</h2></div>
<select id="specimenSelect" class="select-large" aria-label="検体を選択"></select>
</div>
<div id="specimenSummary" class="specimen-header"></div>
<div class="section">
<div id="specimenCategoryList" class="metric-list"></div>
</div>
<div class="section panel condition-box">
<label for="conditionSelect">この検体の保存条件</label>
<select id="conditionSelect" class="select-large">
<option value="">未設定</option>
<option value="cold">冷蔵</option>
<option value="room">常温</option>
<option value="frozen">凍結</option>
<option value="other">その他</option>
</select>
</div>
</section>
<section id="viewSummary" class="view">
<div class="section">
<div class="section-head"><h2>区分別集計</h2><small>差引血清＝血清−PCR</small></div>
<div id="categorySummaryList" class="summary-category-list"></div>
</div>
<div class="section">
<div class="section-head"><h2>検体別合計</h2></div>
<div id="specimenTotalList" class="specimen-total-list"></div>
</div>
<div class="section">
<div class="section-head"><h2>確認項目</h2></div>
<div class="check-grid">
<div class="check-card"><label for="noSerum">血清なし</label><input id="noSerum" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
<div class="check-card"><label for="notThree">3本以外</label><input id="notThree" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
</div>
</div>
<div class="section">
<div class="section-head"><h2>メモ</h2></div>
<textarea id="memo" placeholder="引継ぎ・注意点など"></textarea>
</div>
<div class="reset-row"><button id="resetButton" type="button">この日の入力をリセット</button></div>
</section>
<section id="viewTable" class="view">
<div class="section-head"><h2>一覧表</h2><small>横にスクロールできます</small></div>
<div class="table-wrap"><table id="overviewTable"></table></div>
</section>
</main>
</div>
<nav class="bottom-nav" aria-label="画面切替">
<div class="nav-grid">
<button class="nav-button active" type="button" data-view="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>入力</button>
<button class="nav-button" type="button" data-view="specimen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v14a2 2 0 0 0 4 0V3M10 11h4"/></svg>検体別</button>
<button class="nav-button" type="button" data-view="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5H7l6 7-6 7h10"/></svg>集計</button>
<button class="nav-button" type="button" data-view="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg>一覧</button>
</div>
</nav>
<div id="counterBackdrop" class="modal-backdrop" aria-hidden="true">
<div class="counter-modal" role="dialog" aria-modal="true" aria-labelledby="counterTitle">
<div class="modal-head"><div id="counterTitle" class="modal-title">検体数を入力</div><div id="counterValue" class="modal-value">0</div></div>
<div class="step-grid">
<button type="button" class="minus" data-modal-delta="-10">−10</button>
<button type="button" class="minus" data-modal-delta="-1">−1</button>
<button type="button" class="plus" data-modal-delta="1">＋1</button>
<button type="button" class="plus" data-modal-delta="5">＋5</button>
<button type="button" class="plus" data-modal-delta="10">＋10</button>
</div>
<div class="key-grid">
<button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
<button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
<button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
<button type="button" class="zero" data-digit="0">0</button><button type="button" data-modal-action="backspace" aria-label="1文字消す">⌫</button>
</div>
<div class="modal-nav">
<button id="modalColumnPrevious" type="button" data-modal-action="column-previous">← 区分</button>
<button id="modalColumnNext" type="button" data-modal-action="column-next">区分 →</button>
<button id="modalSpecimenPrevious" type="button" data-modal-action="specimen-previous">↑ 検体</button>
<button id="modalSpecimenNext" type="button" data-modal-action="specimen-next">検体 ↓</button>
<button type="button" class="done" data-modal-action="done">完了</button>
</div>
</div>
</div>
<div id="resetBackdrop" class="confirm-backdrop">
<div class="confirm-box" role="dialog" aria-modal="true">
<h3>この日の入力をリセットしますか？</h3>
<p>選択している日付の検体数・確認項目・メモだけを削除します。</p>
<div class="confirm-actions"><button id="cancelReset" type="button">キャンセル</button><button id="confirmReset" class="confirm" type="button">リセット</button></div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const columns = [
{key:'inside',label:'所内'},
{key:'outpatient',label:'外来'},
{key:'trip1',label:'出張'},
{key:'trip2',label:'出張②'},
{key:'sunday',label:'日曜'},
{key:'sundayOutpatient',label:'日曜外来'}
];
// only: その区分でだけ入力できる検体
const specimens = [
{key:'serum',label:'血清'},
{key:'glucose',label:'血糖'},
{key:'bloodCells',label:'血球'},
{key:'stool',label:'便'},
{key:'urine',label:'尿'},
{key:'testedSerum',label:'検査済血清',only:['inside']},
{key:'pathology',label:'病理'},
{key:'renin',label:'レニン'},
{key:'breathBag',label:'呼気バッグ'},
{key:'sputum',label:'喀痰'},
{key:'lead',label:'鉛'},
{key:'coagulation',label:'凝固'},
{key:'esr',label:'血沈'},
{key:'freshStool',label:'生便'},
{key:'pcr',label:'PCR'},
{key:'lox',label:'LOX'},
{key:'amino',label:'アミノ'}
];
const STORAGE_PREFIX='kentai-counter-v1:';
const CONDITION_KEY='kentai-counter-v1:conditions';
const MAX_COUNT=99999;
const $=id=>document.getElementById(id);
const els={
workDate:$('workDate'),saveStatus:$('saveStatus'),topGrand:$('topGrand'),topSerum:$('topSerum'),topPcr:$('topPcr'),topNetSerum:$('topNetSerum'),
categoryGrid:$('categoryGrid'),activeCategorySummary:$('activeCategorySummary'),categorySpecimenList:$('categorySpecimenList'),
specimenSelect:$('specimenSelect'),specimenSummary:$('specimenSummary'),specimenCategoryList:$('specimenCategoryList'),conditionSelect:$('conditionSelect'),
categorySummaryList:$('categorySummaryList'),specimenTotalList:$('specimenTotalList'),overviewTable:$('overviewTable'),
noSerum:$('noSerum'),notThree:$('notThree'),memo:$('memo'),counterBackdrop:$('counterBackdrop'),counterTitle:$('counterTitle'),counterValue:$('counterValue'),
modalColumnPrevious:$('modalColumnPrevious'),modalColumnNext:$('modalColumnNext'),modalSpecimenPrevious:$('modalSpecimenPrevious'),modalSpecimenNext:$('modalSpecimenNext'),
resetBackdrop:$('resetBackdrop'),toast:$('toast')
};
let currentRecord=emptyRecord();
let activeColumn='inside';
let activeSpecimen='serum';
let activeView='input';
let modalTarget=null;
let modalTypingFresh=true;
let saveTimer=null;
let undoStack=[];
let holdTimer=null;
let holdInterval=null;
let holdTriggered=false;
let lastChanged=null;
let followToday=true; // 今日を表示中なら、日付が変わった時に自動で切り替える
function localDateString(date=new Date()){
return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function normalize(value){const n=Number(value);return Number.isFinite(n)&&n>0?Math.min(MAX_COUNT,Math.floor(n)):0}
function isAllowed(specimenKey,columnKey){const s=specimens.find(x=>x.key===specimenKey);return !s||!s.only||s.only.includes(columnKey)}
function specimensIn(columnKey){return specimens.filter(s=>isAllowed(s.key,columnKey))}
function columnsFor(specimenKey){return columns.filter(c=>isAllowed(specimenKey,c.key))}
function emptyRecord(){
const counts={};
specimens.forEach(s=>{counts[s.key]={};columns.forEach(c=>counts[s.key][c.key]=0)});
return {counts,noSerum:0,notThree:0,memo:''};
}
function cloneRecord(record){return JSON.parse(JSON.stringify(record))}
function getConditions(){try{const x=JSON.parse(localStorage.getItem(CONDITION_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch{return {}}}
function getRecord(date){
const fallback=emptyRecord();
try{
const parsed=JSON.parse(localStorage.getItem(STORAGE_PREFIX+date)||'null');
if(!parsed||typeof parsed!=='object')return fallback;
specimens.forEach(s=>columns.forEach(c=>fallback.counts[s.key][c.key]=isAllowed(s.key,c.key)?normalize(parsed.counts?.[s.key]?.[c.key]):0));
fallback.noSerum=normalize(parsed.noSerum);fallback.notThree=normalize(parsed.notThree);fallback.memo=typeof parsed.memo==='string'?parsed.memo:'';
return fallback;
}catch{return fallback}
}
function count(specimenKey,columnKey){return isAllowed(specimenKey,columnKey)?normalize(currentRecord.counts?.[specimenKey]?.[columnKey]):0}
function specimenTotal(specimenKey){return columns.reduce((sum,c)=>sum+count(specimenKey,c.key),0)}
// 血清の数はPCR込みで入力するため、合計ではPCRを足さない（二重カウント防止）
function columnTotal(columnKey){return specimens.reduce((sum,s)=>s.key==='pcr'?sum:sum+count(s.key,columnKey),0)}
function netSerum(columnKey){return count('serum',columnKey)-count('pcr',columnKey)}
function overallTotal(){return specimens.reduce((sum,s)=>s.key==='pcr'?sum:sum+specimenTotal(s.key),0)}
function overallNetSerum(){return specimenTotal('serum')-specimenTotal('pcr')}
function specimenLabel(key){return specimens.find(s=>s.key===key)?.label||key}
function columnLabel(key){return columns.find(c=>c.key===key)?.label||key}
function negativeClass(n){return n<0?' negative':''}
function zeroClass(n){return n===0?' zero-value':''}
function onlyBadge(s){return s.only?`<span class="badge">${s.only.map(columnLabel).join('・')}のみ</span>`:''}
function pushUndo(){undoStack.push(cloneRecord(currentRecord));if(undoStack.length>30)undoStack.shift()}
function setCount(specimenKey,columnKey,value,{remember=true}={}){
if(!isAllowed(specimenKey,columnKey))return;
const next=Math.max(0,Math.min(MAX_COUNT,normalize(value)));
if(next===count(specimenKey,columnKey))return;
if(remember)pushUndo();
currentRecord.counts[specimenKey][columnKey]=next;
lastChanged={specimenKey,columnKey};
renderAll();scheduleSave();
}
function addCount(specimenKey,columnKey,delta,{remember=true}={}){setCount(specimenKey,columnKey,count(specimenKey,columnKey)+delta,{remember})}
function undo(){
const previous=undoStack.pop();
if(!previous){showToast('戻せる操作がありません');return}
let detail='';
for(const s of specimens){for(const c of columns){const before=normalize(currentRecord.counts[s.key][c.key]),after=normalize(previous.counts[s.key][c.key]);if(before!==after){detail=`${s.label}（${c.label}）${before}→${after}`;lastChanged={specimenKey:s.key,columnKey:c.key};break}}if(detail)break}
currentRecord=previous;renderAll();scheduleSave();showToast(detail?`戻しました：${detail}`:'1つ前に戻しました');
}
function renderAll(){
renderTopSummary();renderCategoryGrid();renderActiveCategory();renderCategorySpecimenList();renderSpecimenView();renderSummaryView();renderTable();renderAuxiliary();updateModal();flashChanged();
}
function flashChanged(){
if(!lastChanged)return;
document.querySelectorAll(`[data-count-action="open"][data-specimen="${lastChanged.specimenKey}"][data-column="${lastChanged.columnKey}"]`).forEach(el=>el.classList.add('flash'));
if(els.counterBackdrop.classList.contains('open'))els.counterValue.classList.remove('flash'),void els.counterValue.offsetWidth,els.counterValue.classList.add('flash');
lastChanged=null;
}
function renderTopSummary(){
const net=overallNetSerum();
els.topGrand.textContent=overallTotal();els.topSerum.textContent=specimenTotal('serum');els.topPcr.textContent=specimenTotal('pcr');els.topNetSerum.textContent=net;
els.topNetSerum.classList.toggle('negative',net<0);
}
function renderCategoryGrid(){
els.categoryGrid.innerHTML=columns.map(c=>`<button type="button" class="category-button${c.key===activeColumn?' active':''}" data-select-column="${c.key}"><div class="name">${c.label}</div><div class="total">${columnTotal(c.key)}</div></button>`).join('');
}
function renderActiveCategory(){
const total=columnTotal(activeColumn),pcr=count('pcr',activeColumn),net=netSerum(activeColumn);
els.activeCategorySummary.innerHTML=`
<div class="box category-name"><div class="label">選択中</div><div class="value">${columnLabel(activeColumn)}</div></div>
<div class="box"><div class="label">区分合計</div><div class="value">${total}</div></div>
<div class="box"><div class="label">PCR</div><div class="value">${pcr}</div></div>
<div class="box"><div class="label">差引血清</div><div class="value${negativeClass(net)}">${net}</div></div>`;
}
function renderCategorySpecimenList(){
$('inputHeading').textContent=`${columnLabel(activeColumn)}の検体を入力`;
els.categorySpecimenList.innerHTML=specimensIn(activeColumn).map(s=>{
const value=count(s.key,activeColumn);const total=specimenTotal(s.key);
return `<div class="count-row">
<div class="item-name">${s.label}${onlyBadge(s)}<span class="mini-total">全区分 ${total}</span></div>
<button type="button" class="minus" data-count-action="delta" data-specimen="${s.key}" data-column="${activeColumn}" data-delta="-1" aria-label="${s.label}を1減らす">−</button>
<button type="button" class="value-button${zeroClass(value)}" data-count-action="open" data-specimen="${s.key}" data-column="${activeColumn}">${value}</button>
<button type="button" class="plus" data-count-action="delta" data-specimen="${s.key}" data-column="${activeColumn}" data-delta="1" aria-label="${s.label}を1増やす">＋</button>
</div>`;
}).join('');
}
function renderSpecimenView(){
if(!els.specimenSelect.options.length){els.specimenSelect.innerHTML=specimens.map(s=>`<option value="${s.key}">${s.label}${s.only?`（${s.only.map(columnLabel).join('・')}のみ）`:''}</option>`).join('')}
els.specimenSelect.value=activeSpecimen;
const total=specimenTotal(activeSpecimen);
if(activeSpecimen==='serum'){
const pcr=specimenTotal('pcr'),net=overallNetSerum();
els.specimenSummary.innerHTML=`
<div class="summary-card"><div class="label">血清合計</div><div class="value">${total}</div></div>
<div class="summary-card"><div class="label">PCR合計</div><div class="value">${pcr}</div></div>
<div class="summary-card primary"><div class="label">差引血清</div><div class="value${negativeClass(net)}">${net}</div></div>`;
}else{
els.specimenSummary.innerHTML=`<div class="summary-card primary" style="grid-column:1/-1"><div class="label">${specimenLabel(activeSpecimen)} 合計</div><div class="value">${total}</div></div>`;
}
els.specimenCategoryList.innerHTML=columnsFor(activeSpecimen).map(c=>{
const value=count(activeSpecimen,c.key);const sub=activeSpecimen==='serum'?`PCR ${count('pcr',c.key)} ／ 差引 ${netSerum(c.key)}`:`区分合計 ${columnTotal(c.key)}`;
return `<div class="metric-row">
<div class="name">${c.label}<div class="sub">${sub}</div></div>
<button type="button" class="minus" data-count-action="delta" data-specimen="${activeSpecimen}" data-column="${c.key}" data-delta="-1" aria-label="1減らす">−</button>
<button type="button" class="value${zeroClass(value)}" data-count-action="open" data-specimen="${activeSpecimen}" data-column="${c.key}">${value}</button>
<button type="button" class="plus" data-count-action="delta" data-specimen="${activeSpecimen}" data-column="${c.key}" data-delta="1" aria-label="1増やす">＋</button>
</div>`;
}).join('');
els.conditionSelect.value=getConditions()[activeSpecimen]||'';
}
function renderSummaryView(){
els.categorySummaryList.innerHTML=columns.map(c=>{
const total=columnTotal(c.key),serum=count('serum',c.key),pcr=count('pcr',c.key),net=netSerum(c.key);
return `<div class="category-summary-card">
<div class="head"><strong>${c.label}</strong><b>${total}</b></div>
<div class="details">
<div class="detail"><span>血清</span><b>${serum}</b></div>
<div class="detail"><span>PCR</span><b>${pcr}</b></div>
<div class="detail"><span>差引血清</span><b class="${net<0?'negative':''}">${net}</b></div>
</div>
</div>`;
}).join('');
els.specimenTotalList.innerHTML=specimens.map(s=>{const t=specimenTotal(s.key);return `<div class="specimen-total-row${t===0?' is-zero':''}"><strong>${s.label}</strong><b>${t}</b></div>`}).join('');
}
function renderTable(){
const head=`<thead><tr><th>検体項目</th>${columns.map(c=>`<th>${c.label}</th>`).join('')}<th>合計</th></tr></thead>`;
const rows=specimens.map(s=>`<tr><th>${s.label}</th>${columns.map(c=>isAllowed(s.key,c.key)?`<td><button type="button" class="table-cell-button${zeroClass(count(s.key,c.key))}" data-count-action="open" data-specimen="${s.key}" data-column="${c.key}">${count(s.key,c.key)}</button></td>`:`<td class="na">—</td>`).join('')}<td><b>${specimenTotal(s.key)}</b></td></tr>`).join('');
const netRow=`<tr class="net-row"><th>差引血清</th>${columns.map(c=>`<td class="${netSerum(c.key)<0?'negative':''}">${netSerum(c.key)}</td>`).join('')}<td class="${overallNetSerum()<0?'negative':''}">${overallNetSerum()}</td></tr>`;
const foot=`<tfoot><tr><th>区分合計</th>${columns.map(c=>`<td>${columnTotal(c.key)}</td>`).join('')}<td>${overallTotal()}</td></tr></tfoot>`;
els.overviewTable.innerHTML=head+`<tbody>${rows}${netRow}</tbody>`+foot;
}
function renderAuxiliary(){
els.noSerum.value=currentRecord.noSerum||'';els.notThree.value=currentRecord.notThree||'';els.memo.value=currentRecord.memo||'';
}
function openCounter(specimenKey,columnKey){if(!isAllowed(specimenKey,columnKey))return;modalTarget={specimenKey,columnKey};modalTypingFresh=true;updateModal();els.counterBackdrop.classList.add('open');els.counterBackdrop.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeCounter(){els.counterBackdrop.classList.remove('open');els.counterBackdrop.setAttribute('aria-hidden','true');document.body.style.overflow='';modalTarget=null}
function modalNeighbors(){
const colList=columnsFor(modalTarget.specimenKey);
const spList=specimensIn(modalTarget.columnKey);
const ci=colList.findIndex(c=>c.key===modalTarget.columnKey);
const si=spList.findIndex(s=>s.key===modalTarget.specimenKey);
return {previousColumn:colList[ci-1],nextColumn:colList[ci+1],previousSpecimen:spList[si-1],nextSpecimen:spList[si+1]};
}
function updateModal(){
if(!modalTarget)return;
const {previousColumn,nextColumn,previousSpecimen,nextSpecimen}=modalNeighbors();
els.counterTitle.textContent=`${specimenLabel(modalTarget.specimenKey)} ／ ${columnLabel(modalTarget.columnKey)}`;
els.counterValue.textContent=count(modalTarget.specimenKey,modalTarget.columnKey);
els.modalColumnPrevious.disabled=!previousColumn;
els.modalColumnPrevious.textContent=previousColumn?`← ${previousColumn.label}`:'← 区分';
els.modalColumnNext.disabled=!nextColumn;
els.modalColumnNext.textContent=nextColumn?`${nextColumn.label} →`:'区分 →';
els.modalSpecimenPrevious.disabled=!previousSpecimen;
els.modalSpecimenPrevious.textContent=previousSpecimen?`↑ ${previousSpecimen.label}`:'↑ 検体';
els.modalSpecimenNext.disabled=!nextSpecimen;
els.modalSpecimenNext.textContent=nextSpecimen?`${nextSpecimen.label} ↓`:'検体 ↓';
}
function modalMove(axis,direction){
if(!modalTarget)return;
const n=modalNeighbors();
if(axis==='column'){
const next=direction<0?n.previousColumn:n.nextColumn;
if(!next)return;
modalTarget={...modalTarget,columnKey:next.key};
}else if(axis==='specimen'){
const next=direction<0?n.previousSpecimen:n.nextSpecimen;
if(!next)return;
modalTarget={...modalTarget,specimenKey:next.key};
}
modalTypingFresh=true;
updateModal();
}
function modalDigit(digit){
if(!modalTarget)return;
const current=String(count(modalTarget.specimenKey,modalTarget.columnKey));
const next=modalTypingFresh?digit:(current==='0'?digit:current+digit);
modalTypingFresh=false;
setCount(modalTarget.specimenKey,modalTarget.columnKey,Number(next));
}
function saveCurrent(){if(!els.workDate.value)return;try{localStorage.setItem(STORAGE_PREFIX+els.workDate.value,JSON.stringify(currentRecord));els.saveStatus.textContent='保存済み'}catch{els.saveStatus.textContent='保存できません'}}
function scheduleSave(){els.saveStatus.textContent='保存中…';clearTimeout(saveTimer);saveTimer=setTimeout(saveCurrent,220)}
function loadDate(date){currentRecord=getRecord(date);undoStack=[];renderAll();els.saveStatus.textContent='保存済み'}
function resetDate(){localStorage.removeItem(STORAGE_PREFIX+els.workDate.value);currentRecord=emptyRecord();undoStack=[];renderAll();scheduleSave();els.resetBackdrop.classList.remove('open');showToast('この日の入力をリセットしました')}
function showToast(message){els.toast.textContent=message;els.toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>els.toast.classList.remove('show'),1700)}
function switchView(view){activeView=view;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view${view[0].toUpperCase()+view.slice(1)}`));document.querySelectorAll('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));window.scrollTo({top:0,behavior:'smooth'})}
function csvEscape(value){const t=String(value??'');return `"${t.replaceAll('"','""')}"`}
function exportCsv(){
const rows=[['集計日',els.workDate.value],[],['検体項目',...columns.map(c=>c.label),'合計']];
specimens.forEach(s=>rows.push([s.label,...columns.map(c=>isAllowed(s.key,c.key)?count(s.key,c.key):''),specimenTotal(s.key)]));
rows.push(['差引血清',...columns.map(c=>netSerum(c.key)),overallNetSerum()]);
rows.push(['区分合計',...columns.map(c=>columnTotal(c.key)),overallTotal()]);
rows.push([],['血清合計',specimenTotal('serum')],['PCR合計',specimenTotal('pcr')],['差引血清合計',overallNetSerum()],['検査済血清',specimenTotal('testedSerum')],['血清なし',currentRecord.noSerum],['3本以外',currentRecord.notThree],['メモ',currentRecord.memo]);
const csv='\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`検体数_${els.workDate.value}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('CSVを出力しました');
}
function handleCountAction(target){
const specimenKey=target.dataset.specimen,columnKey=target.dataset.column;
if(target.dataset.countAction==='open'){openCounter(specimenKey,columnKey);return}
if(target.dataset.countAction==='delta')addCount(specimenKey,columnKey,Number(target.dataset.delta));
}
document.addEventListener('click',event=>{
const columnButton=event.target.closest('[data-select-column]');if(columnButton){activeColumn=columnButton.dataset.selectColumn;renderCategoryGrid();renderActiveCategory();renderCategorySpecimenList();return}
const countButton=event.target.closest('[data-count-action]');if(countButton){if(holdTriggered){holdTriggered=false;return}handleCountAction(countButton);return}
const nav=event.target.closest('[data-view]');if(nav){switchView(nav.dataset.view)}
});
document.addEventListener('pointerdown',event=>{
// 長押し後にクリックが発生しなかった場合でも、次のタップが無視されないよう毎回リセット
holdTriggered=false;
const btn=event.target.closest('[data-count-action="delta"]');
if(!btn||Number(btn.dataset.delta)!==1)return;
const specimenKey=btn.dataset.specimen,columnKey=btn.dataset.column;
stopHold();
holdTimer=setTimeout(()=>{holdTriggered=true;addCount(specimenKey,columnKey,1);holdInterval=setInterval(()=>addCount(specimenKey,columnKey,1),125)},430);
});
function stopHold(){clearTimeout(holdTimer);clearInterval(holdInterval);holdTimer=null;holdInterval=null}
document.addEventListener('pointerup',stopHold);document.addEventListener('pointercancel',stopHold);document.addEventListener('pointerleave',event=>{if(event.pointerType==='mouse')stopHold()});
els.specimenSelect.addEventListener('change',()=>{activeSpecimen=els.specimenSelect.value;renderSpecimenView()});
els.conditionSelect.addEventListener('change',()=>{const conditions=getConditions();conditions[activeSpecimen]=els.conditionSelect.value;localStorage.setItem(CONDITION_KEY,JSON.stringify(conditions));showToast('保存条件を保存しました')});
els.noSerum.addEventListener('input',()=>{currentRecord.noSerum=normalize(els.noSerum.value);scheduleSave()});
els.notThree.addEventListener('input',()=>{currentRecord.notThree=normalize(els.notThree.value);scheduleSave()});
els.memo.addEventListener('input',()=>{currentRecord.memo=els.memo.value;scheduleSave()});
els.workDate.addEventListener('change',()=>{followToday=els.workDate.value===localDateString();loadDate(els.workDate.value)});
$('todayButton').addEventListener('click',()=>{followToday=true;els.workDate.value=localDateString();loadDate(els.workDate.value)});
$('undoButton').addEventListener('click',undo);$('csvButton').addEventListener('click',exportCsv);$('resetButton').addEventListener('click',()=>els.resetBackdrop.classList.add('open'));
$('cancelReset').addEventListener('click',()=>els.resetBackdrop.classList.remove('open'));$('confirmReset').addEventListener('click',resetDate);
els.resetBackdrop.addEventListener('click',e=>{if(e.target===els.resetBackdrop)els.resetBackdrop.classList.remove('open')});
els.counterBackdrop.addEventListener('click',e=>{if(e.target===els.counterBackdrop)closeCounter()});
document.querySelectorAll('[data-modal-delta]').forEach(btn=>btn.addEventListener('click',()=>{if(modalTarget){modalTypingFresh=true;addCount(modalTarget.specimenKey,modalTarget.columnKey,Number(btn.dataset.modalDelta))}}));
document.querySelectorAll('[data-digit]').forEach(btn=>btn.addEventListener('click',()=>modalDigit(btn.dataset.digit)));
document.querySelectorAll('[data-modal-action]').forEach(btn=>btn.addEventListener('click',()=>{
if(!modalTarget)return;const action=btn.dataset.modalAction;
if(action==='backspace'){modalTypingFresh=false;const current=String(count(modalTarget.specimenKey,modalTarget.columnKey));setCount(modalTarget.specimenKey,modalTarget.columnKey,current.length>1?Number(current.slice(0,-1)):0)}
else if(action==='column-previous')modalMove('column',-1);
else if(action==='column-next')modalMove('column',1);
else if(action==='specimen-previous')modalMove('specimen',-1);
else if(action==='specimen-next')modalMove('specimen',1);
else if(action==='done')closeCounter();
}));
window.addEventListener('beforeunload',saveCurrent);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveCurrent()});
function checkDayChange(){
const today=localDateString();
if(!followToday||els.workDate.value===today)return;
clearTimeout(saveTimer);saveCurrent();
els.workDate.value=today;loadDate(today);closeCounter();
showToast('日付が変わったので今日に切り替えました');
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkDayChange()});
window.addEventListener('pageshow',checkDayChange);window.addEventListener('focus',checkDayChange);
setInterval(checkDayChange,30000);
els.workDate.value=localDateString();loadDate(els.workDate.value);switchView('input');
