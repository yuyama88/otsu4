引火の危険性を生じる。","乾性油は、ぼろ布等に染み込ませ積み重ねておくと自然発火することがある。","水に溶けない。","容器の中で燃焼しているものに注水すると、燃えている油が飛散する。","引火点は、300℃程度である。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.404","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p404-q2","subject":"性質・消火","category":"動植物油類","difficulty":"","type":"選択問題","question":"動植物油類の性状について、次のうち正しいものはどれか。","options":["比重は1より大きい。","不飽和脂肪酸で構成された油脂に水素を付加して作られた油脂は、硬化油と呼ばれ、マーガリンなどの食用に用いられる。","オリーブ油やツバキ油は、塗料や印刷インクなどに用いられる。","ヨウ素価の大きい油脂は、炭素の二重結合（C=C）が多く含まれた油脂で、空気中では酸化されにくく、固化しにくい。","油脂の融点は、油脂を構成する脂肪酸の炭素原子の数が少ないほど高い。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.404","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p404-q3","subject":"性質・消火","category":"動植物油類","difficulty":"","type":"選択問題","question":"次の危険物のうち、ぼろ布等の繊維に染み込ませて放置すると、状況によって自然発火を起こす可能性のあるものはどれか。","options":["エタノール","軽油","灯油","ベンゼン","動植物油"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.404","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p404-q4","subject":"性質・消火","category":"動植物油類","difficulty":"","type":"選択問題","question":"動植物油の中で乾性油などは、自然発火することがあるが、次のうち最も自然発火を起こしやすい状態にあるものはどれか。","options":["金属製容器に入ったものが長期間、倉庫に貯蔵されている。","ぼろ布等に染み込んだものが長期間、通風の悪い所に積んである。","ガラス製容器に入ったものが長時間、直射日光にさらされている。","水が混入したものが屋外に貯蔵されている。","種々の動植物油が同一場所に大量に貯蔵されている。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.404","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p405-q5","subject":"性質・消火","category":"動植物油類","difficulty":"","type":"選択問題","question":"布や紙等に染み込んで大量に放置されていると自然発火する危険性が最も高い危険物は、次のうちどれか。","options":["第4石油類のうちギヤー油","動植物油類のうち半乾性油","動植物油類のうち不乾性油","動植物油類のうち乾性油","第3石油類のうちクレオソート油"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.405","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p405-q6","subject":"性質・消火","category":"動植物油類","difficulty":"","type":"選択問題","question":"アマニ油などの乾性油の一般的性状について、次のうち妥当でないものはどれか。","options":["比重は、1より大きい。","水に溶けない。","ぼろ布に染み込ませて放置すると自然発火することがある。","薄く延ばして空気中に放置すると、樹脂状に固化する。","空気中で酸化されやすい。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.405","render":"text","verified":"audited-2026-08-13"},{"id":"chem-diag-circuit","subject":"物理・化学","category":"電気の計算","difficulty":"","type":"図問題","question":"電気と抵抗を図のように接続した場合、電流計Aに流れる電流として、次のうち最も近いものはどれか。ただし、電源E₁＝2V、E₂＝4V、抵抗R₁＝R₂＝3Ωとし、電源の内部抵抗と導体の抵抗は無視できるものとする。","options":["0.3A","0.7A","1A","2A","4A"],"correct":[4],"explanation":"R1=R2=3Ωの並列合成抵抗は1.5Ω。電源は2V+4V=6Vなので I=6/1.5=4A。正解は5。","source":"化学2.pdf 書籍p.230","render":"image","verified":"audited-2026-08-13","imageKey":"img41"},{"id":"chem-diag-phase","subject":"物理・化学","category":"物質の三態","difficulty":"","type":"図問題","question":"次の水の状態図について、正しいものはどれか。","options":["Aの領域は液体である。","Bの領域は固体である。","曲線③は融解曲線である。","点①は三重点である。","曲線②は蒸気圧曲線である。"],"correct":[3],"explanation":"点①は固体・液体・気体の3相が共存する三重点。正解は4。","source":"化学2.pdf 書籍p.250","render":"image","verified":"audited-2026-08-13","imageKey":"img42"},{"id":"chem-diag-vapor","subject":"物理・化学","category":"沸点と蒸気圧","difficulty":"","type":"図問題","question":"液体A、液体B、水の蒸気圧曲線をそれぞれ右図に示す。この図からいえることとして、次のうち正しいものはどれか。なお、「沸点」とは1気圧（1.013×10⁵Pa）の外圧における標準沸点を表す。","options":["Aは、水よりも蒸発しにくい。","Bの沸点は水より高い。","1気圧の2分の1の外圧下において、水は約50℃で沸騰する。","1気圧の5分の1の外圧下において、Bは約40℃で沸騰する。","水は、一定の温度では、外圧を高くした方が飽和蒸気圧が高くなる。"],"correct":[3],"explanation":"外圧0.2×10^5Pa付近で液体Bの蒸気圧曲線と交わる温度は約40℃。正解は4。","source":"化学2.pdf 書籍p.254","render":"image","verified":"audited-2026-08-13","imageKey":"img43"},{"id":"chem-struct-A","subject":"物理・化学","category":"有機化合物・構造式","difficulty":"","type":"図問題","question":"図Aの化学構造式で表される化合物はどれか。","options":["ベンゼン","エチレン","アセチレン","エタノール","アセトン"],"correct":[0],"explanation":"図Aは六員環に交互の二重結合を持つベンゼン。","source":"化学3.pdf 書籍p.282-283","render":"image","verified":"audited-2026-08-13","imageKey":"img44"},{"id":"chem-struct-B","subject":"物理・化学","category":"有機化合物・構造式","difficulty":"","type":"図問題","question":"図Bの化学構造式で表される化合物はどれか。","options":["エタノール","アセトン","キシレン","ベンゼン","酢酸"],"correct":[1],"explanation":"図Bは CH3-CO-CH3 でアセトン。","source":"化学3.pdf 書籍p.282-283","render":"image","verified":"audited-2026-08-13","imageKey":"img44"},{"id":"chem-struct-C","subject":"物理・化学","category":"有機化合物・構造式","difficulty":"","type":"図問題","question":"図Cの化学構造式で表される化合物はどれか。","options":["エタノール","酢酸","キシレン","ベンゼン","アセトン"],"correct":[1],"explanation":"図Cは CH3-COOH で酢酸。","source":"化学3.pdf 書籍p.282-283","render":"image","verified":"audited-2026-08-13","imageKey":"img44"},{"id":"chem-struct-D","subject":"物理・化学","category":"有機化合物・構造式","difficulty":"","type":"図問題","question":"図Dの化学構造式で表される化合物はどれか。","options":["キシレン","エタノール","酢酸","ベンゼン","アセトン"],"correct":[1],"explanation":"図Dは CH3-CH2-OH でエタノール。","source":"化学3.pdf 書籍p.282-283","render":"image","verified":"audited-2026-08-13","imageKey":"img44"},{"id":"chem-gas-p331-q2","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"酸素について、次のうち誤っているものはどれか。","options":["貴ガス（希ガス）元素とは反応しない。","窒素とは激しく反応する。","液体酸素は淡青色である。","20℃では、いくら加圧しても液体にはならない。","鉄、亜鉛およびアルミニウムと直接反応して酸化物をつくる。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.331","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p331-q3","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"次の文の（　）内のA〜Dに当てはまる語句の組合せとして、正しいものはどれか。\n「二酸化炭素は、炭素または（A）の（B）燃焼の他、生物の呼吸や糖類の発酵によっても生成する。二酸化炭素は、空気より（C）気体で、水に溶け、弱い（D）性を示す。」","options":["A：無機化合物／B：不完全／C：重い／D：アルカリ","A：炭素化合物／B：完全／C：重い／D：酸","A：酸素化合物／B：不完全／C：軽い／D：アルカリ","A：無機化合物／B：完全／C：軽い／D：酸","A：炭素化合物／B：不完全／C：軽い／D：アルカリ"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.331","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p331-q4","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"20℃、1気圧（1.013×10⁵Pa）において、二酸化炭素が燃えない理由として、次のうち正しいものはどれか。","options":["酸素と結合するが、吸熱反応であるから","酸化反応を起こすが、燃焼が継続しないから","酸化反応を起こすが、発熱量が小さいから","二酸化炭素の熱伝導率が大きいから","酸素と結合しないから"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.331","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p331-q5","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"一酸化炭素と二酸化炭素の性質について述べた次のA〜Eのうち、一酸化炭素にのみ該当する組合せはどれか。\n\nA. 無色、無臭である。\nB. 人体に極めて有毒である。\nC. 石灰水を通すと白濁する。\nD. 空気中で青白い炎をあげて燃焼する。\nE. 生物の呼吸で生成する。","options":["AとD","AとE","BとC","BとD","CとE"],"correct":[3],"explanation":"一酸化炭素にのみ該当するのはB（人体に極めて有毒）とD（空気中で青白い炎をあげて燃える）です。Aの「無色・無臭」は二酸化炭素にも当てはまり、Cの「石灰水を白濁させる」とEの「生物の呼吸で生成する」は二酸化炭素の性質です。したがって正解は4です。","source":"化学4.pdf 書籍p.331","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p332-q6","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"一酸化炭素の性状について、次のうち誤っているものはどれか。","options":["無色無臭の気体である。","毒性がある。","青白い炎をあげて燃焼する。","炭化水素の完全燃焼により発生する。","還元作用がある。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.332","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p332-q7","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"水素について、次のうち誤っているものはどれか。","options":["物質中最も軽く、非常に拡散しやすい可燃性気体である。","水に溶けにくい。","純粋なものは、特有の臭いを有する青白色の気体である。","見えにくい炎をあげて燃え、水を生成する。","燃焼範囲は、非常に広い。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.332","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p332-q8","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"次のガス又は水蒸気のうち、空気より軽いものはどれか。","options":["ガソリン","エタノール","水素","ベンゼン","灯油"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.332","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p332-q9","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"窒素について、次のうち誤っているものはどれか。","options":["空気の成分では最も多く、約78vol％含まれている。","アンモニウム塩、硝酸塩、タンパク質などとして、生体中に存在する。","高温、高圧では、他の元素と直接化合して、アンモニア、酸化窒素など多くの窒化物を作る。","液体窒素は、無色透明で流動性が大きい。","窒素は、水によく溶けて消火の際に有効な作用をする。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.332","render":"text","verified":"audited-2026-08-13"},{"id":"chem-gas-p332-q10","subject":"物理・化学","category":"主な気体の性質","difficulty":"","type":"選択問題","question":"空気の一般的性状について、次のうち誤っているものはどれか。","options":["乾燥した空気の組成は、ほぼ一定である。","空気中の水蒸気量は、可燃物の燃焼の難易に影響する。","ろうそくの炎には、空気中の酸素が拡散によって運ばれる。","空気中の窒素は、可燃物の急激な燃焼を抑制している。","空気中で酸素濃度が19.7％以下になると、燃焼反応は継続できない。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"化学4.pdf 書籍p.332","render":"text","verified":"audited-2026-08-13"}];

 const queue=ensureQueue(key).filter(id=>byId(id));
 db.drawQueues[key]=queue;
 const pool=queue.slice(0,20).map(byId).filter(Boolean);
 if(!pool.length){alert('対象の問題がありません。');return}
 db.session={mode:sub,reviewSubject:null,rangeKey:key,rangeStart:start,rangeEnd:last,rangeLabel:`${sub} ${start}〜${last}問`,ids:pool.map(q=>q.id),pos:0,score:0,pending:null,started:Date.now(),queueMode:key};
 save();renderQuestion();
}
function startRound(mode, reviewSubject=null){let pool,queueMode=null;
 if(mode==='wrong'){
  pool=Object.keys(db.wrong).map(byId).filter(Boolean).filter(q=>!reviewSubject||q.subject===reviewSubject);
  pool=shuffle(pool).slice(0,20);
 }else{
  queueMode=mode;
  const queue=ensureQueue(mode).filter(id=>byId(id));
  db.drawQueues[mode]=queue;
  pool=queue.slice(0,20).map(byId).filter(Boolean);
 }
 if(!pool.length){alert('対象の問題がありません。');return}
 db.session={mode,reviewSubject,ids:pool.map(q=>q.id),pos:0,score:0,pending:null,started:Date.now(),queueMode};save();renderQuestion()}
function resumeRound(){renderQuestion()}
function renderQuestion(){const s=db.session;if(!s){home();return}if(s.pos>=s.ids.length){finishRound();return}const q=byId(s.ids[s.pos]);if(!q){s.pos++;save();return renderQuestion()}
 runtime.selected=new Set();runtime.pending=s.pending||null; if(runtime.pending) runtime.selected=new Set(runtime.pending.selected);
 const multi=q.correct.length>1;
 let img=q.render==='image'?`<div class="imgwrap" onclick="zoom('${q.id}')"><img class="qimg" src="${imageFor(q)}" alt="問題画像"><div class="zoomhint">タップで拡大 ${q.focus?'・'+esc(q.focus):''}</div></div>`:'';
 let revision=q.lawRevision?`<div class="badge warn">2026改正注意</div>`:'';
 const lapLabel=s.mode==='wrong'?`間違い：${s.reviewSubject||'全科目'}`:(s.rangeLabel||s.mode);
 const lapNo=(db.rounds[lapLabel]||0)+1;
 document.getElementById('app').innerHTML=`<div class="qhead"><div class="top" style="margin-bottom:7px"><button class="btn secondary" style="width:auto;padding:8px 11px" onclick="home()">← ホーム</button><div style="display:flex;align-items:center;gap:8px"><b>${esc(lapLabel)} ${s.queueMode&&!s.rangeKey&&['法令','物理・化学','性質・消火'].includes(s.mode)?`${fullCycleCount(s.mode)+1}周目 ｜ `:s.rangeKey?`${fullCycleCount(s.rangeKey)+1}周目 ｜ `:''}20問回 ${lapNo}回目 ｜ ${s.pos+1} / ${s.ids.length}${s.queueMode?` ｜ 全問残り ${Math.max(0,queueRemaining(s.queueMode)-s.ids.length)}問＋今回`:''}</b>${themeButton()}</div></div><div class="progress"><div class="bar" style="width:${(s.pos/s.ids.length)*100}%"></div></div></div>
 <section class="card"><div class="badges"><span class="badge">${esc(q.subject)}</span><span class="badge">${esc(q.category)}</span>${multi?`<span class="badge">${q.correct.length}つ選択</span>`:''}${revision}</div>
 <div class="qtitle">${esc(q.question)}</div>${img}<div class="source">出典：${esc(q.source)}</div>${q.revisionNote?`<div class="tiny" style="margin-top:8px;color:#92400e">${esc(q.revisionNote)}</div>`:''}
 <div class="opts">${q.options.map((o,i)=>`<button id="opt${i}" class="opt" onclick="toggleOpt(${i})" ${runtime.pending?'disabled':''}><span class="num">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
 <div id="resultbox"></div>
 ${runtime.pending?`<div class="stickybtn"><button id="action" class="btn" onclick="nextQuestion()">${s.pos===s.ids.length-1?'結果を見る':'次の問題へ'}</button></div>`:`<div class="tiny" style="margin-top:10px;color:#746d63">${multi?`${q.correct.length}つそろうと自動で判定されます。`:'選択肢をタップすると自動で判定されます。'}</div>`}</section>`;
 if(runtime.pending) paintResult(q,runtime.pending); else paintSelection();}
function toggleOpt(i){
 if(runtime.pending)return;
 const q=byId(db.session.ids[db.session.pos]);
 if(q.correct.length===1){
  runtime.selected=new Set([i]);
  paintSelection();
  submitAnswer(true);
  return;
 }
 if(runtime.selected.has(i)) runtime.selected.delete(i); else runtime.selected.add(i);
 if(runtime.selected.size>q.correct.length){
  runtime.selected.delete([...runtime.selected][0]);
 }
 paintSelection();
 if(runtime.selected.size===q.correct.length){
  submitAnswer(true);
 }
}
function paintSelection(){document.querySelectorAll('.opt').forEach((el,i)=>el.classList.toggle('sel',runtime.selected.has(i)))}
function equalSet(a,b){a=[...a].sort((x,y)=>x-y);b=[...b].sort((x,y)=>x-y);return a.length===b.length&&a.every((x,i)=>x===b[i])}
function submitAnswer(auto=false){const s=db.session,q=byId(s.ids[s.pos]);if(!runtime.selected.size){if(!auto)alert('選択肢を選んでください。');return}if(runtime.selected.size!==q.correct.length){if(!auto)alert(`${q.correct.length}つ選んでください。`);return}
 const ok=equalSet(runtime.selected,q.correct);const st=db.stats[q.id]||{attempts:0,correct:0};st.attempts++;if(ok)st.correct++;db.stats[q.id]=st;
 if(ok){if(db.wrong[q.id]){db.wrong[q.id].streak=(db.wrong[q.id].streak||0)+1;if(db.wrong[q.id].streak>=2){delete db.wrong[q.id];db.mastered[q.id]={at:Date.now()}}}}else{db.wrong[q.id]={streak:0,last:Date.now()};delete db.mastered[q.id]}
 if(ok)s.score++;s.pending={selected:[...runtime.selected],ok};runtime.pending=s.pending;save();renderQuestion()}
function paintResult(q,p){q.options.forEach((_,i)=>{let el=document.getElementById('opt'+i);if(q.correct.includes(i))el.classList.add('correct');if(p.selected.includes(i)&&!q.correct.includes(i))el.classList.add('wrong')});
 const correctNos=q.correct.map(x=>x+1).join('・');document.getElementById('resultbox').innerHTML=`<div class="result ${p.ok?'ok':'ng'}"><b>${p.ok?'○ 正解':'× 不正解'}</b>　正解：${correctNos}<div class="explain" style="margin-top:7px">${esc(q.explanation)}</div>${db.wrong[q.id]?`<div class="tiny" style="margin-top:7px">間違いリスト：連続正解 ${db.wrong[q.id].streak||0}/2</div>`:(db.mastered[q.id]?`<div class="tiny" style="margin-top:7px">✓ 克服済み</div>`:'')}</div>`}
function nextQuestion(){const s=db.session;s.pos++;s.pending=null;save();if(s.pos>=s.ids.length)finishRound();else renderQuestion()}
function finishRound(){const s=db.session;if(!s)return home();const total=s.ids.length,score=s.score;const label=s.mode==='wrong'?`間違い：${s.reviewSubject||'全科目'}`:(s.rangeLabel||s.mode);
 let setCompleted=false,remaining=null;
 if(s.queueMode&&s.mode!=='wrong'){
  if(!db.drawQueues)db.drawQueues={};
  const used=new Set(s.ids);
  const current=Array.isArray(db.drawQueues[s.queueMode])?db.drawQueues[s.queueMode]:[];
  db.drawQueues[s.queueMode]=current.filter(id=>!used.has(id)&&byId(id));
  remaining=db.drawQueues[s.queueMode].length;
  if(remaining===0){
   if(!db.fullCycles)db.fullCycles={};
   db.fullCycles[s.queueMode]=(db.fullCycles[s.queueMode]||0)+1;
   setCompleted=true;
  }
 }
 db.rounds[label]=(db.rounds[label]||0)+1;
 db.history.unshift({date:Date.now(),label,score,total});
 db.history=db.history.slice(0,80);db.session=null;save();

 const rangeCycleComplete=setCompleted&&!!s.rangeKey;
 const subjectCycleComplete=setCompleted&&!s.rangeKey&&['法令','物理・化学','性質・消火'].includes(s.mode);
 const title=rangeCycleComplete?`${esc(s.rangeLabel)} ${fullCycleCount(s.rangeKey)}周達成！`:subjectCycleComplete?`${esc(s.mode)} ${fullCycleCount(s.mode)}周達成！`:(setCompleted?'全問セット完走！':'20問回 完了');
 const detail=rangeCycleComplete
   ?`${esc(s.rangeLabel)}を全部解き切ったので、この範囲は${fullCycleCount(s.rangeKey)}周になりました。次は${fullCycleCount(s.rangeKey)+1}周目です。`
   :subjectCycleComplete
     ?`${esc(s.mode)}の全問題を重複なしで全部解き切ったので、科目全体が${fullCycleCount(s.mode)}周になりました。`
     :s.mode!=='wrong'
       ?`今の周 残り ${remaining}問。残りを消化するまで同じ問題は出ません。`
       :'';

 document.getElementById('app').innerHTML=`<div class="top"><div class="brand">${title}</div></div><section class="card hero"><h1>${score} / ${total}</h1><p>正答率 ${Math.round(score/total*100)}%</p>${detail?`<p class="tiny">${detail}</p>`:''}<div class="statrow">${s.rangeKey?`<div class="stat"><b>${fullCycleCount(s.rangeKey)}</b><span>この範囲 周回</span></div><div class="stat"><b>${fullCycleCount(s.mode)}</b><span>${esc(s.mode)} 全体</span></div><div class="stat"><b>${wrongCount(s.mode)}</b><span>未克服</span></div>`:['法令','物理・化学','性質・消火'].map(sub=>`<div class="stat"><b>${fullCycleCount(sub)}</b><span>${sub==='物理・化学'?'化学':sub==='性質・消火'?'性質':sub} 周</span></div>`).join('')}</div><div class="tiny" style="margin-top:10px">${esc(label)} の実施回数：${db.rounds[label]}回</div></section><div class="row"><button class="btn secondary" onclick="${s.rangeKey?`subjectMenu('${s.mode}')`:'home()'}">${s.rangeKey?'範囲選択':'ホーム'}</button><button class="btn" onclick="${s.mode==='wrong'?`startRound('wrong','${s.reviewSubject||''}')`:s.rangeKey?`startRange('${s.mode}',${s.rangeStart},${s.rangeEnd})`:`startRound('${s.mode}')`}">もう1回</button></div>`}
function wrongMenu(){document.getElementById('app').innerHTML=`<div class="top"><button class="btn secondary" style="width:auto" onclick="home()">←</button><div class="brand">間違い問題</div>${themeButton()}</div><section class="card"><div class="grid">${['法令','物理・化学','性質・消火'].map(s=>`<button class="mode" onclick="startRound('wrong','${s}')">${s}<small>20問回 ${roundCount('間違い：'+s)}回 / 未克服 ${wrongCount(s)}問</small></button>`).join('')}<button class="mode full" onclick="startRound('wrong')">全科目ミックス<small>20問回 ${roundCount('間違い：全科目')}回 / 未克服 ${wrongCount()}問</small></button></div></section><section class="card"><b>克服のルール</b><p class="tiny" style="line-height:1.6">間違えた問題は専用リストへ。以後2回連続で正解すると克服済みになります。通常周回で再び間違えると自動で戻ります。</p></section>`}
function subjectStats(sub){let qs=QUESTIONS.filter(q=>q.subject===sub),a=0,c=0;qs.forEach(q=>{let s=db.stats[q.id];if(s){a+=s.attempts;c+=s.correct}});return {a,c,p:a?Math.round(c/a*100):0}}
function records(){const rows=['法令','物理・化学','性質・消火'].map(sub=>{let x=subjectStats(sub);return `<div class="listitem"><div><b>${sub}</b><div class="tiny">${x.a}回答 / 今の周 残り ${queueRemaining(sub)}/${qCount(sub)}問</div></div><div style="text-align:right"><b>${fullCycleCount(sub)}周</b><div class="tiny">正答率 ${x.p}% / 未克服 ${wrongCount(sub)}</div></div></div>`}).join('');
 const rangeRows=['法令','物理・化学','性質・消火'].map(sub=>`<div class="listitem"><div><b>${sub}</b><div class="tiny">${rangeSpecs(sub).map(r=>`${r.start}〜${r.end}: ${fullCycleCount(rangeKey(sub,r.start,r.end))}周`).join(' / ')}</div></div></div>`).join('');
 document.getElementById('app').innerHTML=`<div class="top"><button class="btn secondary" style="width:auto" onclick="home()">←</button><div class="brand">学習記録</div>${themeButton()}</div><section class="card"><h3>科目別 周回数</h3>${rows}</section><section class="card"><h3>範囲別 周回数</h3>${rangeRows}</section><section class="card record"><h3>最近の20問回</h3>${db.history.length?db.history.slice(0,15).map(h=>`<div class="listitem"><div>${esc(h.label)}<div class="tiny">${new Date(h.date).toLocaleString()}</div></div><b>${h.score}/${h.total}</b></div>`).join(''):'<p>まだ記録がありません。</p>'}</section><section class="card"><h3>データ保護</h3><p class="tiny">Safariのサイトデータ削除などに備えて、学習履歴をJSONでバックアップできます。</p><div class="row"><button class="btn secondary" onclick="exportData()">バックアップ</button><button class="btn secondary" onclick="importPrompt()">復元</button></div><div style="height:8px"></div><button class="btn danger" onclick="resetAll()">学習記録を初期化</button></section><section class="card"><h3>問題監査</h3><p class="tiny">問題数：法令 ${AUDIT.lawCount} / 物理・化学 ${AUDIT.chemCount} / 性質・消火 ${AUDIT.natureCount}（計 ${AUDIT.total}）</p><p class="tiny">法令基準：${esc(AUDIT.lawBasis)}</p><p class="tiny">${esc(AUDIT.note)}</p></section>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='otsu4-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importPrompt(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let f=inp.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);db=Object.assign(fresh(),x);save();alert('復元しました');records()}catch(e){alert('復元できませんでした')}};r.readAsText(f)};inp.click()}
function resetAll(){if(confirm('周回数・間違い履歴・学習記録をすべて消しますか？')){db=fresh();save();home()}}
function imageFor(q){return q&&q.imageKey?IMAGES[q.imageKey]||'':''}
function zoom(id){let q=byId(id),src=imageFor(q);if(!src)return;document.getElementById('zoomimg').src=src;document.getElementById('overlay').classList.remove('hidden')}
function closeZoom(){document.getElementById('overlay').classList.add('hidden')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeZoom()});
home();
</script></body></html>
