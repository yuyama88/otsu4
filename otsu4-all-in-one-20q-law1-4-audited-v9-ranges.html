部（自己）燃焼です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-012","subject":"物理・化学","category":"引火性液体の燃焼","difficulty":"2","type":"正しいものを選べ","question":"引火性液体の通常の燃焼について、次のうち正しいものはどれか。","options":["液体の表面から発生する蒸気が空気と混合して燃焼する。","液体が蒸発しないで、液体そのものが空気と接触しながら燃焼する。","液体の内部で燃焼が起こり、その燃焼生成物が炎となって液面上に現れる。","液体が熱によって分解し、その際に発生する可燃性ガスが燃焼する。","液体の内部に空気を吸収しながら燃焼する。"],"correct":[0],"explanation":"引火性液体（第４類危険物）は液体表面から蒸発した可燃性蒸気が空気と混合して燃焼します（蒸発燃焼）。液体そのものが燃えるのではなく、蒸気が燃焼します。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-013","subject":"物理・化学","category":"燃えやすい条件","difficulty":"3","type":"正しいものを選べ","question":"次の組合せのうち、一般に可燃物が最も燃えやすい条件はどれか。\n（発熱量　酸化　空気との接触面積　周囲の温度　熱伝導率）","options":["小さい　されやすい　大きい　高い　大きい","大きい　されやすい　大きい　高い　小さい","小さい　されやすい　大きい　高い　小さい","大きい　されにくい　小さい　低い　小さい","大きい　されにくい　小さい　低い　大きい"],"correct":[1],"explanation":"可燃物が最も燃えやすい条件：発熱量が大きい、酸化されやすい、空気との接触面積が大きい、周囲の温度が高い、熱伝導率が小さい（保温効果が高く熱が蓄積されやすい）。熱伝導率が小さいと熱が逃げにくく燃えやすくなります。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-014","subject":"物理・化学","category":"燃焼の難易と無関係なもの","difficulty":"3","type":"誤っているものを選べ","question":"燃焼の難易と直接関係のないものは、次のうちどれか。","options":["体膨張率","空気との接触面積","含水量","熱伝導率","発熱量"],"correct":[0],"explanation":"体膨張率は燃焼の難易に関係ありません。燃焼の難易に関係するのは：空気との接触面積、含水量、熱伝導率、発熱量などです。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-015","subject":"物理・化学","category":"燃焼の難易③一般的な誤り","difficulty":"1","type":"誤っているものを選べ","question":"可燃物の一般的な燃焼の難易として、次のうち誤っているものはどれか。","options":["水分の含有量が少ないほど燃焼しやすい。","空気との接触面積が大きいほど燃焼しやすい。","周囲の温度が高いほど燃焼しやすい。","熱伝導率の大きい物質ほど燃焼しやすい。","蒸発しやすいものほど燃焼しやすい。"],"correct":[3],"explanation":"熱伝導率が大きいほど熱が逃げやすく、燃焼しにくくなります。燃えやすいのは熱伝導率が「小さい」物質（熱が蓄積されやすく保温効果が高い）です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-016","subject":"物理・化学","category":"二酸化炭素が燃焼しない理由","difficulty":"3","type":"正しいものを選べ","question":"20℃、1気圧（1.013×10⁵Pa）において二酸化炭素が燃焼しない理由として、次のうち正しいものはどれか。","options":["酸素と結合するが、吸熱反応であるから","酸化反応を起こすが、燃焼が継続しないから","酸化反応を起こすが、発熱量が小さいから","二酸化炭素の熱伝導率が大きいから","酸素と結合しないから"],"correct":[4],"explanation":"二酸化炭素（CO₂）は炭素がすでに完全に酸化された安定な物質です。20℃・1気圧の通常条件ではCO₂はこれ以上酸化反応を起こさず、酸素と結合しないため燃焼しません。乙4の試験では「酸素と結合しないから」が正解とされています。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-017","subject":"物理・化学","category":"数値が大きいほど危険なもの","difficulty":"2","type":"正しいものを選べ","question":"可燃性液体の危険性は、その物性の数値の大小で判断できる。次のうち数値が大きいほど危険が大きいものはどれか。","options":["燃焼範囲の下限界","最小着火（発火）エネルギー","導電率","引火点","火炎伝播速度"],"correct":[4],"explanation":"火炎伝播速度は大きいほど火災が急速に広がり危険です。燃焼範囲の下限界・最小着火エネルギー・引火点は数値が小さいほど危険です。導電率（電気伝導率）は静電気蓄積に関係し、小さいほど危険です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-018","subject":"物理・化学","category":"燃焼及び発火の一般的説明","difficulty":"2","type":"正しいものを選べ","question":"燃焼及び発火等に関する一般的説明として、次のうち正しいものはどれか。","options":["ハロゲン元素を混合した気体の炭化水素は、20℃で発火する。","高引火点の可燃性液体でも、綿糸に染み込ませると容易に着火する。","静電気の発生しやすい物質ほど、燃焼が激しい。","水溶性の可燃性液体は、非水溶性のそれより燃焼点は低い。","気化熱の大きい物質ほど、燃焼温度が高い。"],"correct":[1],"explanation":"高引火点の可燃性液体でも綿糸等の繊維に染み込ませると、表面積が大幅に増大して蒸発が促進されるため、容易に着火します。ハロゲン添加は難燃化、静電気は点火源になり得るが燃焼の激しさと直接関係しません。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-019","subject":"物理・化学","category":"引火点の説明","difficulty":"2","type":"正しいものを選べ","question":"引火点の説明として、次のうち正しいものはどれか。","options":["可燃性液体を空気中で燃焼させるのに必要な熱源の温度をいう。","可燃物から、その蒸気を発生させるのに必要な最低の気温をいう。","可燃物を空気中で加熱したとき、他から点火されなくても燃え出すときの温度をいう。","可燃性液体が空気中で点火したとき燃え出すのに必要な濃度の蒸気を液面上に発生する最低の液温をいう。","発火点と同じもので、その可燃物が気体または液体の場合に引火点といい、固体の場合には発火点という。"],"correct":[3],"explanation":"引火点とは、可燃性液体が液面上に燃焼範囲の下限値の濃度の蒸気を発生するときの最低液温をいいます。着火源があれば引火できる最低の液温です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-020","subject":"物理・化学","category":"引火・発火の説明の誤り","difficulty":"1","type":"誤っているものを選べ","question":"引火及び発火等の説明について、次のうち誤っているものはどれか。","options":["同一の可燃性物質においては、一般的に発火点の方が引火点より高い数値を示す。","発火点とは、可燃性物質を空気中で加熱したときに火源なしに自ら燃焼し始める最低の温度をいう。","燃焼点とは、燃焼を継続させるのに必要な可燃性蒸気が、可燃性液体の液面上に供給される温度をいう。","引火点とは、可燃性液体が燃焼範囲の上限値の濃度の蒸気を発生するときの液体の温度をいう。","同一の可燃性物質においては、一般的に燃焼点の方が引火点より高い数値を示す。"],"correct":[3],"explanation":"引火点とは燃焼範囲の「下限値」の濃度の蒸気を発生するときの液温です。「上限値」という記述が誤りです。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-021","subject":"物理・化学","category":"引火点の誤り","difficulty":"1","type":"誤っているものを選べ","question":"引火点について、次のうち誤っているものはどれか。","options":["可燃性液体が、燃焼下限界の濃度の蒸気を発生するときの液体の温度を引火点という。","液体の温度が引火点より低い場合は、燃焼に必要な濃度の可燃性蒸気は発生しない。","引火点は、物質によって異なる値を示す。","可燃性液体の温度がその引火点より高いときは、火源により引火する危険がある。","引火点に達すると、液体表面からの蒸気のほか、液体内部からも気化が起こり始める。"],"correct":[4],"explanation":"液体内部から気化（沸騰）が起こり始めるのは引火点ではなく「沸点」に達したときです。引火点は液面からの蒸気発生に関する温度です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-022","subject":"物理・化学","category":"燃焼に関する記述の誤り","difficulty":"2","type":"誤っているものを選べ","question":"燃焼に関する記述として、次のうち誤っているものはどれか。","options":["可燃性液体の液面上の蒸気に着火源を近づけたとき、蒸気に火がつく液体の最低温度を引火点という。","可燃性液体を空気中で加熱したとき、着火源により火がつき、継続して燃え続ける液体の最低温度を燃焼点という。","物質１gの温度を１℃上げるのに必要な熱量を燃焼熱という。","可燃性蒸気が空気と混合し、特定の濃度範囲にあるとき、着火源があると燃焼する。この濃度範囲を燃焼範囲という。","可燃性物質を空気中で加熱したとき、着火源なしで燃焼がはじまる最低温度を発火点という。"],"correct":[2],"explanation":"物質１gの温度を１℃上げるのに必要な熱量は「比熱（熱容量）」です。燃焼熱とは可燃物が完全燃焼するときに発生する熱量のことです。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-023","subject":"物理・化学","category":"燃焼範囲の説明","difficulty":"1","type":"正しいものを選べ","question":"可燃性蒸気の燃焼範囲の説明として、次のうち正しいものはどれか。","options":["燃焼するのに必要な酸素量の範囲のことである。","燃焼によって被害を受ける範囲のことである。","空気中において燃焼することができる可燃性蒸気の濃度範囲のことである。","可燃性蒸気が燃焼を開始するのに必要な熱源の温度範囲のことである。","燃焼によって発生するガスの濃度範囲のことである。"],"correct":[2],"explanation":"燃焼範囲（爆発範囲）とは、空気中において可燃性蒸気が燃焼（爆発）することができる濃度範囲（vol%）のことです。この範囲内でのみ着火源があると燃焼します。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-024","subject":"物理・化学","category":"燃焼範囲が最も広いもの","difficulty":"2","type":"正しいものを選べ","question":"燃焼範囲が一番広いものは、次のうちどれか。","options":["ジエチルエーテル","ガソリン","ベンゼン","酢酸エチル","エタノール"],"correct":[0],"explanation":"ジエチルエーテルの燃焼範囲は1.9〜36vol%で非常に広く、特殊引火物に分類されます。ガソリン：1.4〜7.6vol%、ベンゼン：1.2〜7.8vol%、酢酸エチル：2.0〜11.5vol%、エタノール：3.3〜19vol%。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-025","subject":"物理・化学","category":"燃焼範囲1.4〜7.6vol%の説明","difficulty":"2","type":"正しいものを選べ","question":"「ある可燃性液体の燃焼範囲は、1.4〜7.6vol%である。」このことを正しく説明しているものは、次のうちどれか。","options":["100Lの容器中に空気92.4〜98.6Lと可燃性蒸気7.6〜1.4Lとの混合気体が入っている場合は、点火すると燃焼する。","100Lの容器中に可燃性蒸気92.4〜98.6Lと空気7.6〜1.4Lとの混合気体が入っている場合は、点火すると燃焼する。","100Lの容器中に空気92.4〜98.6Lと可燃性蒸気7.6〜1.4Lとの混合気体が入っている場合は、長期間放置すれば自然発火する。","空気100Lと可燃性蒸気1.4〜7.6Lとの混合気体は、点火すると燃焼する。","空気100Lに可燃性蒸気1.4〜7.6Lを混合したものは、長時間放置すれば自然発火する。"],"correct":[0],"explanation":"燃焼範囲1.4〜7.6vol%とは、全体（空気＋蒸気）に対して蒸気が1.4〜7.6%を占める場合に燃焼します。100L容器では蒸気が1.4〜7.6L、残り空気が92.4〜98.6Lのとき点火すると燃焼します。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-026","subject":"物理・化学","category":"燃焼範囲の計算①","difficulty":"1","type":"正しいものを選べ","question":"次の燃焼範囲の危険物を100Lの空気と混合させて、その均一な混合気体に電気火花を発したとき、燃焼可能な蒸気量はどれか。\n・燃焼下限界 1.3vol%\n・燃焼上限界 7.1vol%","options":["1L","5L","10L","15L","20L"],"correct":[1],"explanation":"蒸気濃度＝蒸気/(空気+蒸気)×100で計算します。蒸気1L：1/101×100≒0.99vol%（下限界1.3%未満→燃焼しない）。蒸気5L：5/105×100≒4.76vol%（1.3〜7.1%の範囲内→燃焼する ✓）。蒸気10L：10/110×100≒9.1vol%（上限界7.1%超→燃焼しない）。よって燃焼可能な蒸気量は5Lです。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-027","subject":"物理・化学","category":"燃焼範囲の計算②","difficulty":"1","type":"正しいものを選べ","question":"危険物の蒸気を100Lの空気と混合させて、その均一な混合気体に電気火花を発したとき、燃焼可能な蒸気量はどれか。ただし、危険物の燃焼範囲は6.0vol%〜14vol%とする。","options":["1L","5L","15L","40L","50L"],"correct":[2],"explanation":"蒸気濃度＝蒸気/(空気+蒸気)×100で計算します。蒸気1L：1/101×100≒0.99vol%（範囲外）。蒸気5L：5/105×100≒4.76vol%（範囲外）。蒸気15L：15/115×100≒13.0vol%（6.0〜14%の範囲内→燃焼する ✓）。蒸気40L：40/140×100≒28.6vol%（範囲外）。よって燃焼可能な蒸気量は15Lです。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-028","subject":"物理・化学","category":"実験結果の読み取り","difficulty":"2","type":"正しいものを選べ","question":"次の実験結果について、正しいものはどれか。\n\n「空気中で、ある化合物を−50℃から徐々に温めると、−42℃のとき液体になり始めた。そのまま温め続け、液温が20℃まで上がったとき、液面付近の蒸気濃度を測定すると1.8vol%であった。更に加熱を続けたところ、液温は115℃で一定となり、すべて気化してしまった。また、液温20℃のものを別容器にとり、液面付近に火花を飛ばすと激しく燃焼した。」","options":["この物質の分解温度は−42℃である。","この物質の沸点は115℃である。","この物質の発火点は20℃である。","この物質の融点は−50℃である。","この物質の燃焼範囲は0〜1.8vol%である。"],"correct":[1],"explanation":"液温が115℃で一定となりすべて気化したのは「沸点」の特徴です。−42℃は凝固点（融点）、−50℃は実験開始温度。20℃で1.8vol%の蒸気濃度で着火したことから、引火点は20℃以下であることがわかります。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-029","subject":"物理・化学","category":"ヨウ素価の誤り","difficulty":"2","type":"誤っているものを選べ","question":"ヨウ素価について、次のＡ〜Ｄのうち誤っているものの組合せはどれか。\n\nＡ．油脂100gに付加するヨウ素の質量をg単位で表した数値をヨウ素価という。\nＢ．ヨウ素価の値は、油脂中の不飽和脂肪酸の含有量が多く、また、脂肪酸の不飽和度が高いほど値は小さい。\nＣ．油脂は、不乾性油、半乾性油または乾性油に分類される。\nＤ．不乾性油は、半乾性油や乾性油に比べて自然発火しやすい。","options":["ＡとＢ","ＡとＣ","ＢとＣ","ＢとＤ","ＣとＤ"],"correct":[3],"explanation":"乾性油は不飽和度が高く、一般にヨウ素価130以上で、空気中の酸素と反応して酸化熱を生じます。ぼろ布などに染み込んだ状態で積み重ねると熱がこもり、自然発火することがあります。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-030","subject":"物理・化学","category":"蓄熱自然発火のメカニズム","difficulty":"3","type":"正しいものを選べ","question":"蓄熱して自然発火が起こることについて、次の文の（　）内のＡ〜Ｃに当てはまる語句の組合せとして、正しいものはどれか。\n\n「ある物質が空気中で20℃において自然に発熱し、発火する場合の発熱機構は、分解熱、（Ａ）、吸着熱などによるものがある。分解熱による例には、（Ｂ）などがあり、（Ａ）による例の多くは不飽和結合を有するアマニ油、キリ油などの（Ｃ）がある。」","options":["Ａ：酸化熱　Ｂ：セルロイド　Ｃ：乾性油","Ａ：燃焼熱　Ｂ：石炭　Ｃ：半乾性油","Ａ：生成熱　Ｂ：硝化綿　Ｃ：不乾性油","Ａ：反応熱　Ｂ：ウレタンフォーム　Ｃ：不乾性油","Ａ：中和熱　Ｂ：炭素粉末類　Ｃ：乾性油"],"correct":[0],"explanation":"（Ａ）酸化熱：油脂の酸化による発熱。（Ｂ）セルロイド：分解熱で自然発火する物質の例。（Ｃ）乾性油：アマニ油・キリ油など不飽和結合を有し、酸化熱で自然発火しやすい油脂。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-031","subject":"物理・化学","category":"酸化による自然発火","difficulty":"1","type":"正しいものを選べ","question":"次のうち、主に酸化による発熱で自然発火することがあるものはどれか。","options":["ニトロセルロース","硫黄","クレオソート油","活性炭","アマニ油"],"correct":[4],"explanation":"アマニ油は乾性油（ヨウ素価130以上）で、空気中の酸素と反応して酸化熱を発生し自然発火することがあります。ニトロセルロースは分解熱による自然発火、活性炭は吸着熱による自然発火です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-032","subject":"物理・化学","category":"動植物油類の自然発火の誤り","difficulty":"1","type":"誤っているものを選べ","question":"動植物油類の自然発火について、次の文の下線部分Ａ〜Ｅのうち誤っている箇所はどれか。\n\n「動植物油類の自然発火は、油が空気中で酸化され、この反応で発生した酸化熱が蓄積され、（Ａ）発火点に達すると起こる。自然発火は一般に乾きやすい乾性油ほど（Ｂ）起こりやすく、この乾きやすさを（Ｃ）油脂100gが吸収するヨウ素のグラム数で表したものをヨウ素価といい、脂肪酸の不飽和度が高いほど（Ｄ）ヨウ素価が小さく、ヨウ素価が大きいほど（Ｅ）自然発火しやすくなる。」","options":["Ａ","Ｂ","Ｃ","Ｄ","Ｅ"],"correct":[3],"explanation":"脂肪酸の不飽和度が高いほどヨウ素価は「大きく」なります（「小さい」が誤り）。ヨウ素価は不飽和結合の数に比例して増加し、ヨウ素価が大きいほど酸化されやすく自然発火しやすくなります。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-033","subject":"物理・化学","category":"自然発火を起こしにくい条件","difficulty":"1","type":"誤っているものを選べ","question":"動植物油類の乾性油の他、原綿、石炭、ゴム粉、金属紛等は、空気中で酸素と化合することによって自然発火を起こすが、次のうち、自然発火を起こしにくいものはどれか。","options":["気温が高く、堆積物内の温度が高いとき。","湿度が高く、気温が高いとき。","物質の表面積が広く、酸素との接触面積が広いとき。","通風が良いところで、乾燥しているとき。","物質の熱伝導率が小さく、保温効果が良いとき。"],"correct":[3],"explanation":"通風が良く乾燥しているときは、酸化で発生した熱が放散されやすく、また乾性油の酸化反応に必要な適度な湿度も不足するため、自然発火が起こりにくくなります。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-034","subject":"物理・化学","category":"消火方法①適切でないもの","difficulty":"1","type":"適切でないものを選べ","question":"消火方法の一般的な説明として、次のうち最も適切でないものはどれか。","options":["油配管のバルブを閉めて、燃焼している油の供給を止める。","窒素ガス消火剤を放射して、燃焼物周囲の酸素濃度を低下させる。","リン酸塩類の粉末消火剤を放射して、燃焼の連鎖反応を抑制、阻止する。","ハロゲン化物の消火剤を放射して、燃焼物を冷却し、可燃性気体の発生を減少させる。","泡消火剤を放射して、燃焼物表面を覆い、酸素を遮断する。"],"correct":[3],"explanation":"ハロゲン化物消火剤の主な消火作用は「負触媒効果（抑制効果）」による燃焼の連鎖反応の遮断です。冷却して可燃性気体の発生を減少させるというのは誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-035","subject":"物理・化学","category":"消火方法②各消火法の誤り","difficulty":"2","type":"誤っているものを選べ","question":"消火の方法には、除去消火、窒息消火、冷却消火、抑制作用による消火があるが、次のそれぞれの説明のうち、誤っているものはどれか。","options":["除去消火は、燃焼に必要な可燃物を取り去ることによる消火をいい、ガスの元栓を閉めて消火するのがこれにあたる。","窒息消火は、燃焼に必要な酸素の供給を遮断することによる消火をいい、窒素消火剤で酸素濃度を下げて消火するのがこれにあたる。","窒息消火は、物質中に含まれている酸素により燃焼している場合には、効果がない。","冷却消火は、燃焼物の温度を下げることによる消火をいい、一般的なものはロウソクの炎などの吹き消しのように冷風を送風して消火するものがこれにあたる。","抑制作用による消火は、可燃物の分子が次々と活性化されて連鎖的な酸化反応が進行するのを抑制することによる消火をいい、ハロゲン化物消火剤の放射による消火がこれにあたる。"],"correct":[3],"explanation":"ろうそくを吹き消す操作では、燃焼部を冷やすとともに可燃性蒸気や高温の気体を吹き飛ばします。「冷却消火」の代表例として扱うのは不適切で、冷却消火の典型は水による消火です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-036","subject":"物理・化学","category":"消火剤全般の誤り①","difficulty":"2","type":"誤っているものを選べ","question":"消火剤に関する説明として、次のうち誤っているものはどれか。","options":["強化液消火剤は、凝固点が０℃のため、寒冷地では使用できない。","粉末消火剤は、粉末の粒子が小さいほど消火効果が高い。","水は熱エネルギーを取り除く冷却効果が大きい。","二酸化炭素消火剤は、電気絶縁性に優れている。","ハロゲン化物消火剤は、燃焼を抑制する効果を有する。"],"correct":[0],"explanation":"強化液消火剤はアルカリ金属塩類等の濃厚な水溶液で、凝固点が０℃より低く（約−20℃）、寒冷地でも使用できます。「凝固点が０℃のため寒冷地では使用できない」という記述が誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-037","subject":"物理・化学","category":"消火剤全般の誤り②","difficulty":"2","type":"誤っているものを選べ","question":"消火剤について、次のうち誤っているものはどれか。","options":["ハロゲン化物は、負触媒効果による燃焼抑制作用を有する。","水は気化熱と比熱がともに大きいため、冷却効果が大きい。","リン酸塩類を主成分とする消火粉末は、油火災および電気火災には適応するが、木材等の火災には適応しない。","二酸化炭素は、安定な不燃性ガスで、空気より重いため窒息効果が大きい。","強化液は炭酸カリウム等の水溶液であるが、これを霧状に放射する場合は電気火災にも適応する。"],"correct":[2],"explanation":"リン酸塩類（ABC粉末）を主成分とする消火粉末は、普通火災（木材等）・油火災・電気火災の全てに適応します（「木材等の火災には適応しない」は誤り）。炭酸水素塩類（BC粉末）は油火災・電気火災のみ適応です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-038","subject":"物理・化学","category":"金属火災の誤り","difficulty":"2","type":"誤っているものを選べ","question":"金属火災に関する一般的な説明として、次のうち誤っているものはどれか。","options":["金属火災とは、ナトリウム、カリウム、マグネシウムなどの火災をいう。","金属火災の消火には、勢いよく消火剤を放射する。","金属ナトリウムは、アルカリ金属で、ハロゲンと激しく反応する。","乾燥砂や膨張ひる石は、金属火災の消火に適している。","水による消火は、金属火災に適さない。"],"correct":[1],"explanation":"金属火災の消火には、勢いよく消火剤を放射してはいけません。粉末を飛散させると燃焼が激しくなるためです。乾燥砂等を静かにかぶせて窒息消火するのが正しい方法です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-039","subject":"物理・化学","category":"抑制効果の消火剤","difficulty":"1","type":"正しいものを選べ","question":"次のＡ〜Ｅの消火剤のうち、主な消火作用が抑制効果であるものの組み合わせはどれか。\n\nＡ．水蒸気　Ｂ．たん白泡消火剤　Ｃ．二酸化炭素消火剤\nＤ．ハロゲン化物消火剤　Ｅ．粉末消火剤（炭酸水素ナトリウム）","options":["ＡとＢ","ＡとＤ","ＢとＣ","ＣとＥ","ＤとＥ"],"correct":[4],"explanation":"抑制効果（負触媒効果）は燃焼の連鎖反応を遮断する消火作用です。ハロゲン化物消火剤（Ｄ）と粉末消火剤（Ｅ）が主に抑制効果を持ちます。水蒸気・泡は窒息効果、CO₂は窒息・冷却効果が主です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-040","subject":"物理・化学","category":"水の消火効果の穴埋め","difficulty":"1","type":"正しいものを選べ","question":"次の文の（　）に当てはまる語句として、次のうち正しいものはどれか。\n\n「水は、（　）と比熱が大きいため、消火剤として使用すると冷却効果が大きい。」","options":["熱伝導率","比重","気化熱","分子量","表面張力"],"correct":[2],"explanation":"水は「気化熱」と比熱がともに大きいため、燃焼物から大量の熱を奪う冷却効果が非常に高い消火剤です。気化熱：蒸発する際に周囲から熱を奪う熱量。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-041","subject":"物理・化学","category":"水が消火剤として優れている理由の誤り","difficulty":"1","type":"誤っているものを選べ","question":"水が消火剤として優れている理由として、次のうち誤っているものはどれか。","options":["比熱と蒸発熱が大きいことから","容易に入手できることから","凝固点が高いことから","液体であることから","水蒸気が酸素濃度を薄めることから"],"correct":[2],"explanation":"水の凝固点は０℃で、これは消火剤として「優れている理由」ではなく、むしろ寒冷地では使いにくいという欠点になります。水が優れている理由は比熱・蒸発熱が大きい、入手容易、液体で浸透性がある、水蒸気による窒息効果などです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-042","subject":"物理・化学","category":"動植物油類への注水が危険な理由","difficulty":"1","type":"正しいものを選べ","question":"容器内で燃焼している動植物油類に、注水すると危険な理由として、最も適切なものは次のうちどれか。","options":["水が容器の底に沈み、徐々に油面を押し上げるから。","高温の油と水の混合物は、単独の油よりも燃焼点が低くなるから。","注水が空気を巻き込み、火炎及び油面に酸素を供給するから。","油面をかき混ぜ、油の蒸発を容易にするから。","水が沸騰し、高温の油を飛散させるから。"],"correct":[4],"explanation":"高温の油に水を注ぐと、水が瞬時に沸騰・急激に気化して体積が約1700倍に膨張し、高温の燃焼中の油を飛散させます（スロップオーバー）。これが最も危険な理由です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-043","subject":"物理・化学","category":"水消火剤の誤り","difficulty":"2","type":"誤っているものを選べ","question":"水消火剤について、次のうち誤っているものはどれか。","options":["油火災に用いると、炎を拡大させるおそれがある。","水は流動性がよく、表面を流れてしまうため、木材等の深部が燃えていると冷却効率が悪い。","燃焼に必要な熱エネルギーを取り去る冷却効果が小さい。","電気設備の火災に用いると、人体に対する感電危険や設備が絶縁不良となる危険がある。","金属火災に用いると、通常燃焼の温度が高いため、水が水素と酸素に分解し、爆発するおそれがある。"],"correct":[2],"explanation":"水は気化熱・比熱がともに大きく、冷却効果は非常に大きい消火剤です。「冷却効果が小さい」という記述が誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-044","subject":"物理・化学","category":"強化液消火剤の誤り","difficulty":"1","type":"誤っているものを選べ","question":"強化液消火剤について、次のうち誤っているものはどれか。","options":["アルカリ金属塩類等の濃厚な水溶液である。","油火災に対しては、霧状にして放射しても適応性がない。","−20℃でも凍結しないので、寒冷地での使用にも適する。","電気火災に対しては、霧状にして放射すれば適応性がある。","木材などの火災の消火後、再び出火するのを防止する効果がある。"],"correct":[1],"explanation":"強化液消火剤は油火災に対して「霧状にして放射すると適応性がある」とされています。「適応性がない」という記述が誤りです。棒状放射では油火災に不適ですが、霧状放射なら油火災にも対応できます。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-045","subject":"物理・化学","category":"二酸化炭素消火剤の正しいもの","difficulty":"1","type":"正しいものを選べ","question":"二酸化炭素消火剤について、次のうち正しいものはどれか。","options":["化学的に不安定である。……二酸化炭素は火炎に熱せられると一酸化炭素となり、消火中、突然爆発することがある。","消火後の汚損が少ない。……粉末および泡消火剤のように機器等を汚損させることはない。","電気絶縁性が悪い。……電気絶縁性が悪いので電気火災には使用できない。","長期貯蔵ができない。……固体や液体で貯蔵できないため、ガスの状態で貯蔵するが、経年で変質しやすいため長期貯蔵ができない。","人体への影響はほとんどない。……化学的に分解して有害ガスを発生することはなく、また二酸化炭素そのものは無害であることから、密閉された場所で使用しても人体に対する影響はほとんどない。"],"correct":[1],"explanation":"CO₂消火剤は消火後の汚損がほとんどなく、精密機器の火災に適しています（正しい）。選択肢1：CO₂は化学的に安定した不燃性ガスで爆発しません（誤り）。選択肢3：電気絶縁性に優れ電気火災に使用できます（誤り）。選択肢4：液化して高圧容器に長期貯蔵可能です（誤り）。選択肢5：密閉空間では酸素濃度が低下し窒息の危険があります（誤り）。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-046","subject":"物理・化学","category":"電気火災に適応する消火器の組み合わせ","difficulty":"2","type":"正しいものを選べ","question":"次のＡ〜Ｅの消火器のうち、電気設備の火災に適応するもののみの組み合わせはどれか。\n\nＡ．棒状の水を放射する消火器\nＢ．棒状の強化液を放射する消火器\nＣ．ハロゲン化物を放射する消火器\nＤ．二酸化炭素を放射する消火器\nＥ．泡を放射する消火器","options":["ＡとＢ","ＡとＣ","ＢとＥ","ＣとＤ","ＤとＥ"],"correct":[3],"explanation":"電気設備の火災に適応するのは電気絶縁性のある消火剤のみです。ハロゲン化物（Ｃ）と二酸化炭素（Ｄ）は電気絶縁性に優れ、電気火災に適応します。水・強化液（棒状）・泡は電気を通すため感電の危険があり、電気火災には不適です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-047","subject":"物理・化学","category":"二酸化炭素消火剤の穴埋め","difficulty":"1","type":"正しいものを選べ","question":"二酸化炭素消火剤に関する、次の文の（　）内のＡ〜Ｃに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「消火の原理は、酸素の希釈による（Ａ）効果である。また、（Ｂ）することで容易に液化するため、高圧ガス容器に充填して設置できる。さらに、消火剤による機器の汚損がほとんどなく、電気（Ｃ）に優れているので、電気設備用としても用いられている。」","options":["Ａ：抑制　Ｂ：圧縮　Ｃ：伝導性","Ａ：窒息　Ｂ：冷却　Ｃ：伝導性","Ａ：窒息　Ｂ：圧縮　Ｃ：伝導性","Ａ：抑制　Ｂ：冷却　Ｃ：絶縁性","Ａ：窒息　Ｂ：圧縮　Ｃ：絶縁性"],"correct":[4],"explanation":"Ａ：CO₂は酸素濃度を下げる「窒息」効果。Ｂ：CO₂は「圧縮」することで液化し高圧容器に貯蔵。Ｃ：電気を通さない「絶縁性」に優れるため電気設備火災に使用できます。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-048","subject":"物理・化学","category":"粉末消火剤の正しいもの","difficulty":"1","type":"正しいものを選べ","question":"粉末消火剤に関する記述について、次のうち正しいものはどれか。","options":["消火剤として用いられる炭酸水素塩類には、炭酸カリウムがある。","主な消火作用は、冷却効果と窒息効果である。","粒子が大きいものほど、燃焼抑制効果が大きい。","リン酸塩類を主成分とするものは、淡青色に着色されている。","炭酸水素塩類を主成分とするものは、油火災および電気火災に適応する。"],"correct":[4],"explanation":"炭酸水素塩類（BC粉末）は油火災・電気火災に適応します（正しい）。炭酸水素塩類には炭酸水素ナトリウム（重曹）や炭酸水素カリウムがあります（炭酸カリウムは誤り）。主な消火作用は負触媒（抑制）効果と窒息効果。粒子は小さいほど効果大。リン酸塩類は淡紅色です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-049","subject":"物理・化学","category":"粉末消火剤の誤り","difficulty":"1","type":"誤っているものを選べ","question":"粉末消火剤について、次のうち誤っているものはどれか。","options":["ナトリウム、カリウムの重炭酸塩その他の塩類またはリン酸塩類、硫酸塩類などを主成分として構成されている。","主成分の種類により着色されている。","吸湿固化を防止するため、粉末の表面にシリコン樹脂等により防湿処理がなされている。","消火剤の主成分に関係なく、あらゆる火災に消火効果がある。","負触媒効果（抑制効果）と窒息効果がある。"],"correct":[3],"explanation":"粉末消火剤は主成分によって適応できる火災が異なります。炭酸水素塩類（BC粉末）は普通火災（木材等）には適応せず、リン酸塩類（ABC粉末）は全火災に適応します。「あらゆる火災に消火効果がある」という記述が誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-050","subject":"物理・化学","category":"粉じん爆発①誤り","difficulty":"2","type":"誤っているものを選べ","question":"粉じん爆発について、次のうち誤っているものはどれか。","options":["可燃性固体の微粉が空気中に浮遊しているときに、何らかの火源により爆発する現象をいう。","開放空間では爆発の危険性は低い。","粉じんが空気とよく混合している浮遊状態が必要である。","粉じんが大きい粒子の場合は、簡単に浮遊しないので爆発の危険性は低い。","有機化合物の粉じん爆発では、燃焼が完全になるので一酸化炭素が発生することはない。"],"correct":[4],"explanation":"粉じん雲は可燃性ガスのように分子レベルで均一に混合するわけではなく、粒子周囲への酸素供給が不均一になりやすいため、不完全燃焼して一酸化炭素を生じることがあります。したがって「完全燃焼して一酸化炭素が発生しない」という記述は誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-051","subject":"物理・化学","category":"粉じん爆発②特性の誤り","difficulty":"2","type":"誤っているものを選べ","question":"粉じん爆発の特性について、次のうち誤っているものはどれか。","options":["粉じん爆発とは、空間に遊離、分散した燃焼範囲の粉じん雲中で何らかの原因で着火し、火炎が伝播する際の急激な体積膨張、圧力上昇により周囲への被害が及ぶ爆発現象をいう。","堆積粉が広く存在する場合は、１次の爆発が堆積粉を舞い上げて、２次の爆発を起こし、次々にこの過程を繰り返し遠方に伝播することがある。","気体と比べて、粉体はその種類や環境条件などによって静電気が発生しやすく、その放電は粉じん爆発の着火源になる場合がある。","可燃性粉じんと空気との混合気は、可燃性ガスと空気との混合気に比べて比重が大きく、一般的に爆発時の発生熱量が大きい。","可燃性粉じんは空気中に漂い、酸素分子と均一に混合され燃焼するので完全燃焼しやすい。"],"correct":[4],"explanation":"粉じんは気体や蒸気と異なり、粒径が大きいため酸素と均一に混合しにくく、不完全燃焼を起こしやすいです。「完全燃焼しやすい」という記述が誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-052","subject":"物理・化学","category":"粉じん爆発③特徴の誤り","difficulty":"2","type":"誤っているものを選べ","question":"粉じん爆発の特徴について、次のうち誤っているものはどれか。","options":["有機物の粉じん爆発の場合、不完全燃焼を起こしやすく、生成ガス中に一酸化炭素が多量に含まれていることがあるので、中毒を起こしやすい。","爆発の際、粒子が燃えながら飛散するので、周囲の可燃物は局部的にひどく炭化したり着火する可能性がある。","一般にガス爆発に比較して、発生するエネルギーが小さい。","最初の部分的な爆発により、たい積している可燃性粉じんが舞い上がり、次々に爆発的な燃焼が持続し、被害が大きくなる。","一般にガス爆発に比較して、最小着火エネルギーが大きい。"],"correct":[2],"explanation":"粉じん爆発はガス爆発に比べて発生するエネルギーが数倍「大きい」です。「小さい」という記述が誤りです。最小着火エネルギーはガス爆発より大きい（着火しにくい）のは正しい。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-053","subject":"物理・化学","category":"静電気①帯電防止方法の不適切なもの","difficulty":"1","type":"適切でないものを選べ","question":"非導電性液体の帯電防止方法として、次のうち適切でないものはどれか。","options":["配管内の流速を制限し、静電気の発生をできる限り防止する。","ノズルからの噴出速度を制限し、帯電電位の上昇を抑制する。","タンク、容器、ノズル等は、できる限り導電性のものを使用し、これらの導体部分を接地する。","タンクへの充填時は、ノズルの先端が直接液体に接触しないよう液面より上部に接地する。","液体に溶解しない空気、水は混入しないように取り扱う。"],"correct":[3],"explanation":"タンクへの充填時はノズルの先端を液面より上部（液面上）に保つのではなく、「タンクの底部近くまで延ばして液中に挿入する」ことが正しい方法です。液面上から注入すると液体が飛散・霧化して静電気が大量に発生します。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-054","subject":"物理・化学","category":"静電気②帯電しやすい条件の誤り","difficulty":"2","type":"誤っているものを選べ","question":"液体危険物が静電気を帯電しやすい条件について、次のうち誤っているものはどれか。","options":["加圧された液体がノズル、亀裂等、断面積の小さな開口部から噴出するとき。","液体が液滴となって空気中に放出されるとき。","導電率の低い液体が配管を流れるとき。","液体相互または液体と粉体等を混合・かくはんするとき。","直射日光に長時間さらされたとき。"],"correct":[4],"explanation":"直射日光に長時間さらされることは静電気の帯電とは直接関係ありません。静電気が帯電しやすい条件は、噴出・飛散・配管内流動（導電率低い）・混合かくはんなど、液体が動く・摩擦が生じる状況です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-055","subject":"物理・化学","category":"静電気③帯電しにくいもの","difficulty":"2","type":"正しいものを選べ","question":"流動などによって、静電気を最も帯電しにくいのは、次のうちどれか。","options":["トルエン","ベンゼン","軽油","ガソリン","エタノール"],"correct":[4],"explanation":"エタノールは導電率が高く（水と混合しやすい極性物質）、静電気が蓄積しにくいです。トルエン・ベンゼン・軽油・ガソリンは導電率が低い非極性物質で静電気を帯電しやすいです。導電率が高いほど電荷が逃げやすく帯電しにくくなります。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-056","subject":"物理・化学","category":"静電気④摩擦時の発生防止対策","difficulty":"2","type":"正しいものを選べ","question":"物質の摩擦時における静電気発生の防止および抑制は、材料の特性・性能および工程上の制約等から現実的には困難な場合が多いが、一般的な対策として、次のうち正しいものはどれか。","options":["接触面積を大きくする。","接触回数を増やす。","不純物等異物を混入させる。","接触状態にあるものをゆっくりはがす。","接触圧力を大きくする。"],"correct":[3],"explanation":"接触状態にあるものを「ゆっくりはがす」と静電気の発生を抑制できます。急速にはがすと大きな摩擦が生じ静電気が多く発生します。接触面積・回数・圧力を大きくするとむしろ静電気が増えます。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-057","subject":"物理・化学","category":"静電気⑤誤っているもの","difficulty":"1","type":"誤っているものを選べ","question":"静電気について、次のうち誤っているものはどれか。","options":["静電気は人体にも帯電する。","静電気は電気の不良導体に帯電しやすい。","静電気は固体だけでなく、液体にも帯電する。","物質に静電気が蓄積すると電気分解が起こり、引火しやすくなる。","一般的に合成繊維の衣類は木綿のものより静電気が発生しやすい。"],"correct":[3],"explanation":"物質に静電気が蓄積すると「放電（火花）」が起こり引火しやすくなります。「電気分解」が起こるという記述が誤りです。電気分解は直流電流を流して化合物を分解する現象で、静電気の蓄積とは別の現象です。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-058","subject":"物理・化学","category":"静電気⑥災害予防対策の正しい組み合わせ","difficulty":"1","type":"正しいものを選べ","question":"静電気による災害を予防する一般的な対策として、次のＡ〜Ｅのうち、正しいものの組み合わせはどれか。\n\nＡ．床面へ散水する。\nＢ．作業服、靴、手袋は絶縁性材料のものを使用する。\nＣ．可燃性蒸気が滞留するおそれのある場所で、作業服等の着脱を行わない。\nＤ．絶縁性材料のパイプやホースを使用する。\nＥ．パイプ内の液体の流速を大きくする。","options":["ＡとＢ","ＡとＣ","ＢとＤ","ＣとＥ","ＤとＥ"],"correct":[1],"explanation":"Ａ（床面へ散水）：湿度を上げて電荷を逃がす効果があり正しい対策です。Ｃ（可燃性蒸気滞留場所で着脱しない）：着脱時の摩擦で静電気が発生し引火の危険があるため正しい対策です。Ｂ（絶縁性材料の作業服）：絶縁性だと電荷が逃げず誤り→導電性が正しい。Ｄ（絶縁性パイプ）：誤り→接地可能な導電性が正しい。Ｅ（流速を大きく）：誤り→流速を小さくするのが正しい。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-059","subject":"物理・化学","category":"静電気⑦記述の誤り","difficulty":"1","type":"誤っているものを選べ","question":"静電気に関する記述として、次のうち誤っているものはどれか。","options":["物体が電気を帯びることを帯電といい、帯電した物体に分布している流れのない電気を静電気という。","異なる物体をこすり合わせると、電子の一部が一方から他方へ移り、一方は正に他方は負に帯電する。","電子が不足した物体は、負に帯電する。","物体間で電荷のやりとりがあっても、電気量の総和は変わらない。","電荷には正電荷と負電荷があり、異種の電荷の間には引力がはたらく。"],"correct":[2],"explanation":"電子が不足した物体は「正（＋）」に帯電します。電子はマイナスの電荷を持っているため、電子が不足すると正電荷が多くなり正に帯電します。「負に帯電する」という記述が誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-060","subject":"物理・化学","category":"静電気⑧誤っているもの","difficulty":"2","type":"誤っているものを選べ","question":"静電気について、次のうち誤っているものはどれか。","options":["帯電防止靴を着用しても、絶縁性の床上では帯電を防止することができない。","絶縁体は、環境下の湿度が高いと、帯電しにくくなる。","空気中に浮遊する液滴や粉体が導体の場合、帯電しない。","抵抗率が10⁶Ω・m以上の物体は、接地しても帯電防止の効果はない。","液化ガスは、ボンベから気相で放出される場合より、気液混合状態で放出される場合の方が、静電気が多く発生する。"],"correct":[2],"explanation":"空気中に浮遊する液滴や粉体が導体であっても、空気（絶縁体）に囲まれているため電荷が逃げず帯電します。「帯電しない」という記述が誤りです。接地されていない導体は帯電します。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-061","subject":"物理・化学","category":"静電気⑨発生に関する誤り","difficulty":"1","type":"誤っているものを選べ","question":"静電気の発生に関する説明として、次のうち誤っているものはどれか。","options":["２つの固体の摩擦、はく離、衝突などの過程で発生する。","液体をフィルタでろ過する際、イオンの吸着現象により発生する。","固体の破砕などの破壊過程で発生する。","静電誘導や帯電粒子、イオンの付着などにより発生する。","溶解しない粉体と液体を混合してかくはんする場合、かくはん槽の壁面でのみ発生する。"],"correct":[4],"explanation":"粉体と液体を混合・かくはんする場合、静電気はかくはん槽の壁面だけでなく、粉体と液体の界面全体・かくはん翼と液体の接触面など広範囲で発生します。「壁面でのみ」という記述が誤りです。","source":"物理化学2 / 基礎化学②","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-062","subject":"物理・化学","category":"静電気⑩コンデンサの静電エネルギー計算","difficulty":"2","type":"正しいものを選べ","question":"100Vの電圧で充電した電気容量3.0μFのコンデンサに蓄積されている静電エネルギーとして、次のうち正しいものはどれか。","options":["1.5×10⁻²J","3.0×10⁻²J","1.5×10⁻⁴J","1.5×10⁴J","3.0×10⁴J"],"correct":[0],"explanation":"静電エネルギーの公式：E = ½CV²。C = 3.0μF = 3.0×10⁻⁶F、V = 100V。E = ½ × 3.0×10⁻⁶ × 100² = ½ × 3.0×10⁻⁶ × 10000 = ½ × 3.0×10⁻² = 1.5×10⁻²J。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-063","subject":"物理・化学","category":"静電気⑪電気のしくみ・誤りの組合せ","difficulty":"2","type":"誤っているものの組合せを選べ","question":"電気のしくみについて、次の文の下線部分Ａ〜Ｅのうち、誤っているもののみの組合せはどれか。\n\n「原子は（Ａ）陽子を放出したり取り込んだりすることで、電気を帯びることがある。このように電気を帯びることを帯電といい、帯電した粒子を（Ｂ）イオンという。（Ａ）陽子を放出し、正に帯電した粒子を（Ｃ）陽イオンといい、（Ａ）陽子を取り込んで、負に帯電した粒子を（Ｄ）陰イオンという。2つの物体が電子をやりとりした後、電気量の総和は（Ｅ）増加する。」","options":["ＡとＢ","ＡとＥ","ＢとＣ","ＣとＥ","ＤとＥ"],"correct":[1],"explanation":"Ａ（陽子）→誤り：原子は「電子」を放出・取り込むことでイオンになります。陽子は原子核内に固定されています。Ｅ（増加する）→誤り：電荷保存の法則により、電気量の総和は変化しません（一定に保たれます）。ＢＣＤは正しい記述です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-064","subject":"物理・化学","category":"電気分解①硫酸銅水溶液","difficulty":"2","type":"正しいものを選べ","question":"硫酸銅（Ⅱ）（CuSO₄）の水溶液を電気分解したとき、電極から発生・析出する物質の組み合わせとして、正しいものは次のうちどれか。なお、電極は両極とも白金を使用する。","options":["酸素と銅","酸素と水素","水素と銅","硫黄と酸素","硫黄と水素"],"correct":[0],"explanation":"CuSO₄水溶液の電気分解：陽極（＋）では水が酸化されて酸素（O₂）が発生。陰極（－）ではCu²⁺が還元されて銅（Cu）が析出。反応式：陽極 2H₂O→O₂＋4H⁺＋4e⁻、陰極 Cu²⁺＋2e⁻→Cu。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-065","subject":"物理・化学","category":"電気分解②硝酸銀水溶液","difficulty":"2","type":"正しいものを選べ","question":"硝酸銀（AgNO₃）の水溶液を電気分解したとき、電極から発生・析出する物質の組み合わせとして、正しいものは次のうちどれか。なお、電極は両極とも白金を使用する。","options":["酸素と銀","酸素と水素","水素と銀","窒素と酸素","窒素と水素"],"correct":[0],"explanation":"AgNO₃水溶液の電気分解：陽極（＋）では水が酸化されて酸素（O₂）が発生。陰極（－）ではAg⁺が還元されて銀（Ag）が析出。CuSO₄と同様のパターンで、金属イオン（Ag⁺）が陰極に析出します。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-066","subject":"物理・化学","category":"沸点上昇・穴埋め","difficulty":"2","type":"正しいものを選べ","question":"次の文の（　）内のＡ〜Ｃに当てはまる語句の組合せとして、正しいものはどれか。\n\n「溶液の沸点が純粋な（Ａ）よりも高くなる現象を沸点上昇といい、溶液と純粋な（Ａ）のそれぞれの沸点の差を沸点上昇度という。希薄溶液の沸点上昇度は溶質の種類に（Ｂ）、溶液中の溶質の質量モル濃度に（Ｃ）する。」","options":["Ａ：溶質　Ｂ：関係し　Ｃ：反比例","Ａ：溶媒　Ｂ：無関係で　Ｃ：比例","Ａ：溶媒　Ｂ：関係し　Ｃ：比例","Ａ：溶質　Ｂ：無関係で　Ｃ：比例","Ａ：溶媒　Ｂ：関係し　Ｃ：反比例"],"correct":[1],"explanation":"沸点上昇は純粋な「溶媒（Ａ）」と比較した現象です。希薄溶液の沸点上昇度は溶質の種類に「無関係で（Ｂ）」、溶質の質量モル濃度に「比例（Ｃ）」します（ラウールの法則）。溶質の種類ではなく粒子数（モル数）のみに依存します。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-067","subject":"物理・化学","category":"物質の状態変化①誤っているもの","difficulty":"1","type":"誤っているものを選べ","question":"物質の状態変化について、次のうち誤っているものはどれか。","options":["一般に融点は沸点よりも低い。","固体が液体になることを融解という。","固体が直接気体になることを昇華という。","気体が液体になることを凝縮という。","融点が12℃の物質は20℃では固体である。"],"correct":[4],"explanation":"選択肢5「融点が12℃の物質は20℃では固体である」が誤りです。融点12℃を超えた20℃では液体として存在します。選択肢1〜4（融点は沸点より低い・融解・昇華・凝縮）はすべて正しい記述です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-068","subject":"物理・化学","category":"物質の三態変化・気体から液体","difficulty":"1","type":"正しいものを選べ","question":"物質の三態の変化のうち、気体から液体に変化することはどれか。","options":["凝固","融解","蒸発","昇華","凝縮"],"correct":[4],"explanation":"気体→液体の変化は「凝縮（液化）」です。凝固は液体→固体、融解は固体→液体、蒸発は液体→気体、昇華は固体→気体（または気体→固体）の変化です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-069","subject":"物理・化学","category":"物質の状態変化②正しいもの","difficulty":"1","type":"正しいものを選べ","question":"物質の状態の変化について、次のうち正しいものはどれか。","options":["水は１気圧において100℃で沸騰する。","二酸化炭素には気体と固体の状態があるが、いかなる条件下でも液体の状態にはならない。","硫黄は加熱すると溶解して気化する。この現象を昇華という。","可燃性液体の沸点は常に100℃より低い。","０℃で水と氷が共存するのは、水の凝固点と氷の融点が異なっているためである。"],"correct":[0],"explanation":"水は１気圧（標準大気圧）において100℃で沸騰します（正しい）。選択肢2：CO₂は高圧下（5.1気圧以上）で液体になります（誤り）。選択肢3：硫黄は加熱すると融解・蒸発しますが、これは昇華ではありません（誤り）。選択肢4：沸点が100℃以上の可燃性液体もあります（誤り）。選択肢5：水の凝固点と氷の融点はともに0℃で同一です（誤り）。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-070","subject":"物理・化学","category":"物質の状態変化③説明の正しいもの","difficulty":"1","type":"正しいものを選べ","question":"物質の状態変化の説明として、次のうち正しいものはどれか。","options":["熱が吸収されて、氷が水になることを液化という。","水が水蒸気になるとき熱を吸収するが、液体から気体への状態変化に使われるため、温度は上昇しない。","水が水蒸気になることを蒸発といい、熱が放出される。","水が氷になることを凝固といい、熱が吸収される。","水蒸気が水になることを凝固といい、熱が放出される。"],"correct":[1],"explanation":"水が水蒸気になるとき気化熱（蒸発熱）を吸収しますが、この熱は状態変化に使われるため温度は上昇しません（正しい）。選択肢1：氷が水になるのは「融解」（液化は気体→液体）（誤り）。選択肢3：蒸発では熱が吸収されます（誤り）。選択肢4：凝固では熱が放出されます（誤り）。選択肢5：水蒸気が水になるのは「凝縮」（凝固は液体→固体）（誤り）。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-071","subject":"物理・化学","category":"蒸気圧①誤っているもの","difficulty":"2","type":"誤っているものを選べ","question":"蒸気圧と沸点に関する記述について、次のうち誤っているものはどれか。","options":["沸点は、飽和蒸気圧と外圧が等しくなる温度をいう。","液体の温度が高くなると、蒸気圧は小さくなる。","一定温度における液体の飽和蒸気圧は、物質ごとに決まっている。","大気圧が小さくなると、沸点は低くなる。","同温で比較したとき、分子間力の小さい物質ほど、蒸気圧は大きくなる傾向が大きい。"],"correct":[1],"explanation":"液体の温度が高くなると蒸気圧は「大きく」なります。温度が上がると分子の運動エネルギーが増して蒸発しやすくなるため、蒸気圧は上昇します。「小さくなる」という記述が誤りです。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-072","subject":"物理・化学","category":"蒸気圧②穴埋め","difficulty":"1","type":"正しいものを選べ","question":"次の文の（　）内のＡ〜Ｃに当てはまる語句の組合せとして、正しいものはどれか。\n\n「液体の飽和蒸気圧は、温度の上昇とともに（Ａ）する。その圧力が大気の圧力に等しくなるときの（Ｂ）が沸点である。したがって、大気の（Ｃ）が低いと沸点も低くなる。」","options":["Ａ：減少　Ｂ：温度　Ｃ：圧力","Ａ：増大　Ｂ：湿度　Ｃ：温度","Ａ：減少　Ｂ：圧力　Ｃ：温度","Ａ：増大　Ｂ：温度　Ｃ：圧力","Ａ：減少　Ｂ：圧力　Ｃ：湿度"],"correct":[3],"explanation":"飽和蒸気圧は温度の上昇とともに「増大（Ａ）」します。その圧力が大気圧に等しくなるときの「温度（Ｂ）」が沸点です。大気の「圧力（Ｃ）」が低いと沸点も低くなります（高山では水が100℃未満で沸騰するのはこのため）。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-073","subject":"物理・化学","category":"物質の性質①最も妥当なもの","difficulty":"1","type":"妥当なものを選べ","question":"次のうち最も妥当なものはどれか。","options":["２つの物質の分子式が同じであれば、化学的性質は全く同じである。","黄リンと赤リンは、同素体であるから、化学的性質は全く同じである。","比重が同じであれば、同一体積の物体の質量は同じである。","２つの物質の体積が同じであれば、その質量は同じである。","沸点が同じであれば、必ず同一物質である。"],"correct":[2],"explanation":"比重が同じであれば、同一体積の物体の質量は同じです（比重＝質量/体積の比率なので正しい）。選択肢1：分子式が同じでも構造異性体など化学的性質が異なる場合があります。選択肢2：同素体は同じ元素でも構造が異なるため化学的性質は異なります（黄リンは猛毒・自然発火性、赤リンは安定）。選択肢4：体積が同じでも比重（密度）が違えば質量は異なります。選択肢5：異なる物質でも沸点が同じ場合があります。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-074","subject":"物理・化学","category":"比熱①説明の正しいもの","difficulty":"1","type":"正しいものを選べ","question":"比熱の説明として、次のうち正しいものはどれか。","options":["物質１gの温度を１Kだけ高めるのに必要な熱量である。","物質が水を含んだとき発生する熱量である。","物質１gが液体から気体に変化するのに必要な熱量である。","物質に１J（ジュール）の熱を加えたときの温度上昇の割合である。","物質を圧縮したとき発生する熱量である。"],"correct":[0],"explanation":"比熱とは物質１gの温度を１K（または１℃）だけ高めるのに必要な熱量です。選択肢3は「気化熱（蒸発熱）」の説明です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-075","subject":"物理・化学","category":"熱の移動①対流の数","difficulty":"1","type":"正しいものを選べ","question":"熱の移動の仕方には伝導、対流および放射の３つがあるが、次のＡ〜Ｅのうち主として対流が原因であるものはいくつあるか。\n\nＡ．天気のよい日に屋外で日光浴をしたら身体が温まった。\nＢ．ストーブで灯油を燃焼していたら、床面よりも天井近くの温度が高くなった。\nＣ．鉄棒を持って、その先端を火の中に入れたら手元の方まで次第に熱くなった。\nＤ．ガスコンロで水を沸かしたところ、水の表面から温かくなった。\nＥ．アイロンをかけたら、その衣類が熱くなった。","options":["１つ","２つ","３つ","４つ","５つ"],"correct":[1],"explanation":"対流はＢ（暖気が上昇）とＤ（水の対流）の２つです。Ａは放射（太陽からの輻射熱）、Ｃは伝導（鉄棒を通じた熱伝導）、Ｅは伝導（アイロンから衣類への直接接触）です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-076","subject":"物理・化学","category":"熱の移動②対流・放射穴埋め","difficulty":"1","type":"正しいものを選べ","question":"次の文の（　）内のＡ及びＢに当てはまる語句の組合せとして、正しいものはどれか。\n\n「物体と熱源との間に液体が存在するときには、液体は一般に温度が高くなると比重が小さくなるので上方に移動し、それによって物体に熱が伝わる。これが（Ａ）による熱の伝わり方である。しかし、熱源と物体との間に何もなく真空である場合にも熱は伝わる。太陽により地上の物体が温められて温度が上がるのはこの例であって、このような熱の伝わり方を（Ｂ）と呼ぶ。」","options":["Ａ：対流　Ｂ：伝導","Ａ：伝導　Ｂ：放射","Ａ：伝導　Ｂ：対流","Ａ：対流　Ｂ：放射","Ａ：放射　Ｂ：伝導"],"correct":[3],"explanation":"液体の温度差による上昇・循環は「対流（Ａ）」。真空中でも伝わる熱（太陽からの熱）は「放射（輻射）（Ｂ）」です。伝導は固体・液体・気体の接触による熱移動です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-077","subject":"物理・化学","category":"熱の移動③誤っているもの","difficulty":"1","type":"誤っているものを選べ","question":"熱の移動について、次のうち誤っているものはどれか。","options":["ストーブに近づくと、ストーブに向いた方が熱くなるのは放射熱によるものである。","ガスこんろで水を沸かすと、水が表面から温かくなるのは熱の伝導によるものである。","コップにお湯を入れると、コップが熱くなるのは、熱の伝導によるものである。","冷却装置で冷やされた空気により、室内全体が冷やされるのは、熱の対流によるものである。","太陽で地上の物が温められて温度が上昇するのは、放射熱によるものである。"],"correct":[1],"explanation":"水が表面から温かくなる主因は対流です。伝導は物質内部で粒子間の相互作用によって熱が移る現象で、固体で典型的ですが液体・気体でも起こります。この場合は液体の循環による対流が支配的です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-078","subject":"物理・化学","category":"熱に関する一般的説明の誤り","difficulty":"1","type":"誤っているものを選べ","question":"熱に関する一般的な説明について、次のうち誤っているものはどれか。","options":["比熱とは、物質１gの温度を１K（ケルビン）上昇させるのに必要な熱量をいう。","熱伝導率の大きな物質は、熱を伝えやすい。","比熱が小さい物質は、温まりにくく冷めにくい。","体膨張率は、固体が最も小さく、気体が最も大きい。","理想気体の体積は、圧力が一定で温度が１℃上昇すると、０℃のときの体積の約273分の１膨張する。"],"correct":[2],"explanation":"比熱が小さい物質は少ない熱量で温度が上がるため「温まりやすく冷めやすい」です。「温まりにくく冷めにくい」は比熱が大きい物質の説明です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-079","subject":"物理・化学","category":"物理変化②正しいもの","difficulty":"2","type":"正しいものを選べ","question":"物質の物理変化について、次のうち正しいものはどれか。","options":["気体の体膨張率は、圧力に関係するが温度の変化には関係しない。","固体または液体は、１℃上がるごとに約273分の１体積が増える。","固体の体膨張率は、気体の体膨張率の３倍である。","水の密度は、約４℃のとき最大である。","液体の体膨張率は、気体の体膨張率よりはるかに大きい。"],"correct":[3],"explanation":"水は約４℃のとき密度が最大（約1g/cm³）になります。０℃や100℃では密度がやや小さくなります。選択肢1：気体の体膨張率は温度変化と深く関係します（誤り）。選択肢2：約273分の１膨張するのは「気体」（シャルルの法則）です（誤り）。選択肢3：固体の体膨張率は気体より「はるかに小さい」です（誤り）。選択肢5：液体の体膨張率は気体よりはるかに「小さい」です（誤り）。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-080","subject":"物理・化学","category":"熱伝導率が最も小さいもの","difficulty":"1","type":"正しいものを選べ","question":"熱伝導率がもっとも小さいものは、次のうちどれか。","options":["アルミニウム","水","木材","銅","空気"],"correct":[4],"explanation":"熱伝導率（大きい順）：銅＞アルミニウム＞水＞木材＞空気。空気は熱伝導率が極めて小さく、断熱材として利用されます。金属は一般に熱伝導率が大きく、気体は小さいです。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-081","subject":"物理・化学","category":"熱の一般的説明②正しいもの","difficulty":"2","type":"正しいものを選べ","question":"次のうち正しいものはどれか。","options":["エタノールの比熱は、水より大きい。","銀の熱伝導率は、水より小さい。","ニッケルの線膨張率は、体膨張率より大きい。","熱の対流は、液体および固体だけに起こる現象である。","外気圧が高くなれば、沸点も高くなる。"],"correct":[4],"explanation":"外気圧（大気圧）が高くなると沸点も高くなります（圧力鍋の原理）。選択肢1：水の比熱（約4.2J/g・K）はエタノール（約2.4J/g・K）より大きいです（誤り）。選択肢2：銀の熱伝導率は金属の中でも高く、水より大きいです（誤り）。選択肢3：体膨張率は線膨張率の約３倍で、体膨張率の方が大きいです（誤り）。選択肢4：対流は液体と気体に起こる現象で、固体では起こりません（誤り）。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-082","subject":"物理・化学","category":"液体が気体になるときの熱量","difficulty":"1","type":"正しいものを選べ","question":"液体が気体になるときの熱量として、次のうち正しいものはどれか。","options":["燃焼熱","昇華熱","融解熱","比熱","蒸発熱"],"correct":[4],"explanation":"液体が気体になるときに必要な熱量は「蒸発熱（気化熱）」です。融解熱は固体→液体、昇華熱は固体→気体の変化に必要な熱量です。燃焼熱は燃焼反応による発熱量、比熱は温度を上げるのに必要な熱量です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-083","subject":"物理・化学","category":"空間容積と体膨張","difficulty":"1","type":"正しいものを選べ","question":"タンクや容器に液体の危険物を入れる場合、空間容積を必要とするのは、次のどの現象と関係があるか。","options":["酸化","還元","蒸発","熱伝導","体膨張"],"correct":[4],"explanation":"液体危険物は温度が上がると体膨張（熱膨張）により体積が増加します。空間容積を設けないと、温度上昇時にタンクや容器が破損・爆発する危険があります。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-084","subject":"物理・化学","category":"体膨張率の計算","difficulty":"2","type":"正しいものを選べ","question":"容器に入った液温０℃のガソリン1,000Lを温めていくと1,020Lになった。このとき、ガソリンの液温として最も近いものは次のうちどれか。なお、ガソリンの体膨張率は1.35×10⁻³K⁻¹とし、蒸発による減少はないものとする。","options":["５℃","10℃","15℃","20℃","25℃"],"correct":[2],"explanation":"体膨張の公式：ΔV = V₀ × β × ΔT。ΔV = 1020 - 1000 = 20L、V₀ = 1000L、β = 1.35×10⁻³K⁻¹。ΔT = ΔV ÷ (V₀ × β) = 20 ÷ (1000 × 1.35×10⁻³) = 20 ÷ 1.35 ≒ 14.8℃ ≒ 15℃。０℃から約15℃上昇したので液温は約15℃です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-085","subject":"物理・化学","category":"化学反応熱","difficulty":"1","type":"正しいものを選べ","question":"化学反応にともなう反応熱は、次のうちどれか。","options":["中和熱","蒸発熱","凝固熱","凝縮熱","融解熱"],"correct":[0],"explanation":"中和熱は酸と塩基が反応（中和反応）するときに発生する熱量で、化学反応にともなう反応熱です。蒸発熱・凝固熱・凝縮熱・融解熱はいずれも状態変化にともなう熱量（物理変化）です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-086","subject":"物理・化学","category":"物理変化・化学変化①誤り","difficulty":"1","type":"誤っているものを選べ","question":"物理変化および化学変化に関する説明として、次のうち誤っているものはどれか。","options":["炭素が燃焼して、二酸化炭素になる反応は化合である。","結晶性の物質が、空気中で粉末状態になる変化を潮解という。","酸素と他の物質との間に行われる化合を酸化という。","他の物質と作用して酸化を起こさせる物質を、一般に酸化剤という。","酸化物が酸素を失ったり、物質が水素を化合することを還元という。"],"correct":[1],"explanation":"結晶性の物質が空気中の水分を吸収して溶解する現象は「潮解」です。「空気中で粉末状態になる」のは「風解（ふうかい）」の説明です。潮解と風解を混同しないよう注意が必要です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-087","subject":"物理・化学","category":"化学変化①正しいもの","difficulty":"1","type":"正しいものを選べ","question":"化学変化の説明として、次のうち正しいものはどれか。","options":["鉄が空気中でさびる。","氷が溶けて水になる。","水が沸騰して水蒸気になる。","砂糖が水に溶ける。","ばねが伸びる。"],"correct":[0],"explanation":"鉄がさびる（酸化鉄になる）のは化学変化（酸化反応）です。氷が溶ける・水が沸騰・砂糖が溶ける・ばねが伸びるはすべて物理変化（物質の種類は変わらない）です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-088","subject":"物理・化学","category":"物理変化と化学変化②誤り","difficulty":"1","type":"誤っているものを選べ","question":"物理変化と化学変化について、次のうち誤っているものはどれか。","options":["ドライアイスが二酸化炭素（気体）に変化するのは、化学変化である。","氷が水になるのは、物理変化である。","鉄がさびるのは、化学変化である。","ニクロム線に電気を通すと発熱するのは、物理変化である。","鉛を加熱すると溶けるのは、物理変化である。"],"correct":[0],"explanation":"ドライアイス（固体CO₂）が気体CO₂になるのは「昇華」という物理変化で、化学変化ではありません。物質の種類（CO₂）は変わらず、状態だけが変化します。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-089","subject":"物理・化学","category":"化学変化②穴埋め","difficulty":"1","type":"正しいものを選べ","question":"次の文の（　）内のＡ〜Ｃに当てはまる語句の組合せとして、正しいものはどれか。\n\n「物質と物質とが作用し、その結果、新しい物質ができる変化が（Ａ）である。また、２種類あるいはそれ以上の物質から別の物質ができることを（Ｂ）といい、その結果できた物質を（Ｃ）という。」","options":["Ａ：物理変化　Ｂ：化合　Ｃ：化合物","Ａ：化学変化　Ｂ：混合　Ｃ：混合物","Ａ：化学変化　Ｂ：重合　Ｃ：化合物","Ａ：物理変化　Ｂ：混合　Ｃ：混合物","Ａ：化学変化　Ｂ：化合　Ｃ：化合物"],"correct":[4],"explanation":"新しい物質ができる変化は「化学変化（Ａ）」。２種類以上の物質から別の物質ができることを「化合（Ｂ）」といい、その結果できた物質を「化合物（Ｃ）」といいます。混合は物質を混ぜるだけで新物質は生じません。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-090","subject":"物理・化学","category":"潮解の説明","difficulty":"1","type":"正しいものを選べ","question":"潮解の説明について、次のうち正しいものはどれか。","options":["物質が空気中の水蒸気と反応して固化する現象","物質の中に含まれている水分が放出されて粉末になる現象","固体が水分を吸収して、その水に溶ける現象","物質が空気中の水蒸気と反応して、性質の異なった２つ以上の物質になる現象","水溶液の水分が蒸発して、溶質が析出する現象"],"correct":[2],"explanation":"潮解とは固体が空気中の水蒸気（水分）を吸収して溶解する現象です。例：塩化カルシウム、水酸化ナトリウムなど。選択肢2は「風解」の説明（結晶水を失って粉末になる）です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-091","subject":"物理・化学","category":"中性子数が7の原子","difficulty":"2","type":"正しいものを選べ","question":"中性子の数が７である原子として、次のうち正しいものはどれか。","options":["²³₁₁Na","¹⁶₈O","¹⁹₉F","¹³₆C","⁷₃Li"],"correct":[3],"explanation":"中性子数＝質量数－原子番号（陽子数）。¹³₆C：中性子数＝13－6＝7 ✓。²³₁₁Na：23－11＝12。¹⁶₈O：16－8＝8。¹⁹₉F：19－9＝10。⁷₃Li：7－3＝4。中性子数が7なのは¹³₆C（炭素13）です。","source":"物理化学3 / 基礎化学③","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-092","subject":"物理・化学","category":"二硫化炭素の完全燃焼","difficulty":"2","type":"正しいものを選べ","question":"次の文の（　）内に当てはまるものは、次のうちどれか。\n\n「二硫化炭素が完全燃焼すると（　）になる。」","options":["水蒸気と二酸化炭素","二酸化炭素と二酸化硫黄","二酸化硫黄と水蒸気","一酸化炭素と二酸化硫黄","一酸化炭素と二酸化炭素"],"correct":[1],"explanation":"二硫化炭素（CS₂）の完全燃焼反応：CS₂ ＋ 3O₂ → CO₂ ＋ 2SO₂。炭素（C）は二酸化炭素（CO₂）に、硫黄（S）は二酸化硫黄（SO₂）になります。水素を含まないため水蒸気は生じません。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-093","subject":"物理・化学","category":"単体・化合物・混合物①正しいもの","difficulty":"1","type":"正しいものを選べ","question":"単体、化合物および混合物について、次のうち正しいものはどれか。","options":["空気は、酸素と窒素からなる化合物で、その成分の約２分の１は酸素である。","水は、酸素と水素の混合物である。","二酸化炭素は、炭素と酸素の混合物である。","ガソリンは種々の炭化水素の混合物である。","鉄のさびは、単体である。"],"correct":[3],"explanation":"ガソリンは様々な炭化水素（ペンタン・ヘキサン・オクタンなど）の混合物です（正しい）。空気は混合物（化合物ではない）、水はH₂Oという化合物（混合物ではない）、CO₂は化合物（混合物ではない）、鉄のさびはFe₂O₃という化合物（単体ではない）です。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-094","subject":"物理・化学","category":"単体・化合物・混合物②誤り","difficulty":"1","type":"誤っているものを選べ","question":"単体、化合物および混合物について、次のうち誤っているものはどれか。","options":["水は、酸素と水素に分解できるので化合物である。","硫黄やアルミニウムは、１種類の元素からできているので単体である。","赤リンと黄リンは、単体である。","食塩水は、食塩と水の化合物である。","ガソリンは種々の炭化水素の混合物である。"],"correct":[3],"explanation":"食塩水は食塩（NaCl）と水（H₂O）が混合した「混合物」です。「化合物」ではありません（食塩自体はNaとClの化合物ですが、食塩水は混合物）。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-095","subject":"物理・化学","category":"単体・化合物・混合物③組み合わせ","difficulty":"2","type":"正しいものを選べ","question":"単体、化合物および混合物について、次の組み合わせのうち正しいものはどれか。","options":["単体：空気　化合物：水　混合物：水蒸気","単体：水素　化合物：ガソリン　混合物：石油","単体：塩酸　化合物：塩素　混合物：海水","単体：窒素　化合物：アンモニア　混合物：岩石","単体：亜鉛　化合物：塩化ナトリウム　混合物：ドライアイス"],"correct":[3],"explanation":"窒素（N₂）は単体、アンモニア（NH₃）はNとHの化合物、岩石は複数の鉱物からなる混合物です（正しい）。空気は混合物、水蒸気はH₂Oで化合物。ガソリンは混合物。塩酸はHClの水溶液で混合物、塩素は単体。ドライアイスはCO₂の固体で化合物です。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-096","subject":"物理・化学","category":"同素体の誤り","difficulty":"1","type":"誤っているものを選べ","question":"同素体の組合せとして、次のうち誤っているものはどれか。","options":["ダイヤモンドと黒鉛（グラファイト）","黄リンと赤リン","酸素とオゾン","斜方硫黄と単斜硫黄","銀と水銀"],"correct":[4],"explanation":"銀（Ag）と水銀（Hg）は異なる元素なので同素体ではありません。同素体は同じ元素からなる異なる単体です。ダイヤモンドと黒鉛（炭素）、黄リンと赤リン（リン）、酸素とオゾン（酸素）、斜方硫黄と単斜硫黄（硫黄）はすべて正しい同素体の組み合わせです。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-097","subject":"物理・化学","category":"構造異性体","difficulty":"2","type":"正しいものを選べ","question":"次に示す物質の組み合わせのうち、互いに構造異性体であるものはどれか。","options":["エタノールとジメチルエーテル","赤リンと黄リン","単斜硫黄と斜方硫黄","酸素とオゾン","シス－２－ブテンとトランス－２－ブテン"],"correct":[0],"explanation":"エタノール（C₂H₅OH）とジメチルエーテル（CH₃OCH₃）は分子式がどちらもC₂H₆Oで同じですが、原子の結合順序（構造）が異なる構造異性体です。選択肢2・3・4は同素体。選択肢5は幾何異性体（シス・トランス異性体）です。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-098","subject":"物理・化学","category":"混合物の分離操作の誤り","difficulty":"1","type":"誤っているものを選べ","question":"混合物を分離する操作として、次のうち誤っているものはどれか。","options":["ろ過","希釈","蒸留","遠心分離","抽出"],"correct":[1],"explanation":"希釈は混合物に溶媒を加えて濃度を薄める操作で、「分離」ではありません。ろ過・蒸留・遠心分離・抽出はいずれも混合物を成分ごとに分離する操作です。","source":"物理化学4 / 基礎化学④","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p337-q1","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の類ごとに共通する性状として、次のうち妥当でないものはどれか。","options":["第1類の危険物は、加熱、衝撃、摩擦などにより分解し、容易に酸素を放出して可燃物の燃焼を助けるものが多い。","第2類の危険物は、微粉状にすると、空気中で粉じん爆発を起こすものが多い。","第3類の危険物は、空気または水と接触することにより発熱し、可燃性ガスを発生して発火するものが多い。","第5類の危険物は、自ら酸素を含む自己燃焼性のものが多い。","第6類の危険物は、加熱、衝撃、摩擦などにより、発火・爆発するものが多い。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.337","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p337-q2","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"各類の危険物の一般的な性状について、次のうち正しいものはどれか。","options":["第1類の危険物は可燃性であり、他の物質により容易に酸化されやすい固体である。","第2類の危険物は、火炎により着火しやすい液体または引火しやすい固体である。","第3類の危険物は、空気中で自然に発火しやすい気体または水に接触して発火しやすい液体である。","第5類の危険物は、燃焼速度が比較的緩慢で、比重は1より小さい固体である。","第6類の危険物は不燃性であり、混在する他の可燃物の燃焼を促進する液体である。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.337","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p338-q3","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の類ごとの性状について、次のうち妥当でないものはどれか。","options":["第1類の危険物は、酸化性の液体で、周囲の可燃物の燃焼を促進する。","第2類の危険物は、可燃性の固体で、低温で引火するものがある。","第3類の危険物は、固体または液体で、空気中で自然に発火するものがある。","第5類の危険物は、自己反応性の固体または液体で、燃焼速度が大きい。","第6類の危険物は、不燃性の液体であるが、有機物と混ざると着火することがある。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.338","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p338-q4","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"次の性状を有する危険物の類別として、正しいものはどれか。\n「この類の危険物は、すべて比較的低温で着火する可燃性の固体である。比重は1より大きく、水に溶けない。酸化剤と混合したものは衝撃等により発火・爆発の危険性がある。」","options":["第1類","第2類","第3類","第5類","第6類"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.338","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p338-q5","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の性状について、次のうち妥当でないものはどれか。","options":["同一の物質であっても、形状や粒度により危険物になるものとならないものがある。","不燃性の液体又は固体で、酸素を分離し他の燃焼を助けるものがある。","液体の危険物の比重は1より小さいが、固体の危険物の比重はすべて1より大きい。","危険物には単体、化合物および混合物の3種類がある。","多量の酸素を含んでおり、他からの酸素の供給がなくても燃焼するものがある。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.338","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p338-q6","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の類ごとに共通する性状として、次のうち妥当でないものはどれか。","options":["第1類の危険物は、水との反応性はなく、酸素を自ら含む可燃性の固体または液体である。","第2類の危険物には、非水溶性の固体で、酸化剤と混合すると発火・爆発するものがある。","第3類の危険物には、水と反応して、水素を生じるものがある。","第5類の危険物は、比重が1より大きく、燃焼速度の大きい、自己反応性の固体または液体である。","第6類の危険物には、不燃性の液体で、引火性液体と混合すると発火・爆発するものがある。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.338","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p339-q7","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の類ごとに共通する性状として、次のうち妥当でないものはどれか。","options":["第1類の危険物を溶解したものが木材や布に染み込むと、衝撃や摩擦により発火・爆発のおそれがある。","第2類の危険物と酸化剤の混合物は、衝撃によって発火・爆発のおそれがある。","第3類の危険物は、空気または水と接触することにより発熱し、発火・爆発のおそれがある。","第5類の危険物は自らは不燃性であるが、分解して酸素を放出する。","第6類の危険物は、酸化力の強い無機化合物の液体である。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.339","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p339-q8","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"危険物の性状について、次のうち妥当なものはどれか。","options":["危険物には、気体、液体および固体のものがある。","引火性液体の燃焼は蒸発燃焼であるが、引火性固体の燃焼は分解燃焼である。","水と接触することにより発熱し、可燃性ガスを発生するものがある。","保護液として、水、二硫化炭素およびメタノールを使用するものがある。","同一の類の危険物に対する適応消火剤および消火方法は同じである。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.339","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p339-q9","subject":"性質・消火","category":"危険物の分類","difficulty":"","type":"選択問題","question":"法令に定める危険物について、次のうち正しいものはどれか。","options":["1気圧において、20℃で引火するものは、気体でも危険物である。","危険物にはすべて引火点がある。","危険物は、必ず燃焼する。","すべての危険物は、分子内に炭素、酸素または水素のいずれかを含有している。","危険物は、1気圧において、20℃で液体または固体である。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.339","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p343-q1","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の一般的な性状として、次のA〜Eのうち妥当でないものはどれか。\n\nA. 比重が1より大きいものが多い。\nB. 流動性が高く、火災がおきたとき拡大する危険がある。\nC. 蒸気比重が1より小さい。\nD. 引火点が高い物質ほど引火の危険性が大きい。\nE. 可燃性蒸気は低所に滞留しやすく、また遠方まで流れることがある。","options":["A","B、D","B、E","C、E","A、C、D"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.343","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p343-q2","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"次の危険物のうち、水より重いものはどれか。","options":["軽油","二硫化炭素","トルエン","メタノール","エチルメチルケトン"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.343","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p344-q3","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の一般的な性状について、次のうち妥当でないものはどれか。","options":["危険物の蒸気に火源を近づけると、必ず燃焼する。","比重は1より小さいものが多い。","蒸気比重は1より大きい。","危険物を貯蔵する容器は密封し保存する。","電気の不良導体で、静電気が蓄積されやすい。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.344","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p344-q4","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の一般的性状について、次の文の（　）内のA〜Dに当てはまる語句の組合せとして、正しいものはどれか。\n「第4類の危険物は、引火点を有する（A）であり、その比重は1より（B）ものが多く、蒸気比重は1より（C）ものが多い。また、電気の（D）であるものが多く、静電気が蓄積されやすい。」","options":["A：液体／B：大きい／C：小さい／D：不導体","A：液体または固体／B：大きい／C：小さい／D：不導体","A：液体／B：小さい／C：大きい／D：不導体","A：液体または固体／B：小さい／C：大きい／D：導体","A：液体／B：小さい／C：大きい／D：導体"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.344","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p344-q5","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の性状について、次のうち妥当でないものはどれか。","options":["非水溶性のものは、流動、かくはんなどにより静電気が発生し、蓄積しやすい。","水溶性のものは、水で薄めると引火点が低くなる。","20℃で、ほとんどのものが液状である。","蒸気比重は1より大きく、低所に滞留しやすい。","比重は1より小さいものが多い。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.344","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p344-q6","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の一般的な性状について、次のうち誤っているものはどれか。","options":["沸点が水より高いものがある。","蒸気比重は1より小さく、可燃性の蒸気は広がりやすい。","多くのものは20℃で液体であるが、10℃のとき固体のものが存在する。","可燃性蒸気と空気の混合気は、一定範囲の混合割合でなければ燃焼しない。","電気の不良導体であり、静電気が蓄積されやすく、静電気の火花によって引火することもある。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.344","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p345-q7","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の一般的性状について、次のうち妥当でないものはどれか。","options":["水に溶けるものが多い。","引火の危険性は、引火点の低い物質ほど高い。","電気の不良導体であるものが多く、静電気を蓄積しやすい。","燃焼範囲の上限界は60vol％以下のものが多い。","発火点は650℃以下である。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.345","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p345-q8","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"第4類の危険物の一般的な火災の危険性について、次のうち誤っているものはどれか。","options":["沸点が低い物質は、引火の危険性が大である。","燃焼範囲の下限界の小さい物質ほど危険性は大である。","燃焼範囲の下限界が等しい物質の場合は、燃焼範囲の上限界の大きい物質ほど危険性は大である。","燃焼範囲の上限界と下限界との差が等しい物質の場合は、下限界の小さい物質ほど危険性は大である。","液体の比重の大きな物質ほど蒸気密度が小さくなるので、危険性は大である。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.345","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p345-q9","subject":"性質・消火","category":"第4類の一般性状","difficulty":"","type":"選択問題","question":"次に掲げた危険物のうち、両方とも水に溶けないものはどれか。","options":["二硫化炭素／メタノール","クレオソート油／アセトン","エチレングリコール／アニリン","酸化プロピレン／ピリジン","トルエン／軽油"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.345","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p347-q1","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"ベンゼンやトルエンの火災に使用する消火器として、次のうち適切でないものはどれか。","options":["消火粉末を放射する消火器","棒状の強化液を放射する消火器","二酸化炭素を放射する消火器","霧状の強化液を放射する消火器","泡を放射する消火器"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.347","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p347-q2","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"ガソリンの火災の消火方法として、次のうち妥当でないものはどれか。","options":["注水する。","泡消火剤を放射する。","二酸化炭素消火剤を放射する。","ハロゲン化物消火剤を放射する。","消火粉末を放射する。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.347","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p348-q3","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"ガソリンや灯油の火災に対する消火について、次のうち誤っているものはどれか。","options":["粉末消火剤は効果的である。","二酸化炭素消火剤は効果的である。","泡消火剤は効果的である。","霧状に放射する強化液消火剤は効果的である。","ハロゲン化物消火剤は効果がない。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.348","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p348-q4","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"第4類の危険物の消火に際しての注意点として、次のうち適切でないものはどれか。","options":["二硫化炭素は燃焼により有毒ガスが発生する。","ガソリンの消火に水を使用すると、火災が拡大することがある。","メタノールの火炎の色は淡く認識しにくい。","灯油の消火に水を使用するときは霧状にする。","容器内で燃焼している重油に水をかけると、水が沸騰し高温の重油を飛散させる。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.348","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p348-q5","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"軽油に関する火災の初期消火に使用する消火器として、次のうち誤っているものはどれか。","options":["棒状の水を放射する消火器","二酸化炭素を放射する消火器","粉末（りん酸塩類）を放射する消火器","ハロゲン化物を放射する消火器","泡を放射する消火器"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.348","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p348-q6","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"舗装面または舗装道路に漏れたガソリンの火災に噴霧注水を行うことは、不適応な消火方法とされている。次のA〜Eのうち、その主な理由に当たるものの組合せはどれか。\n\nA. ガソリンが水に浮き、燃焼面積を拡大させる。\nB. 水滴がガソリンをかき乱し、燃焼を激しくする。\nC. 水滴の衝撃でガソリンをはね飛ばす。\nD. 水が側溝等を伝わり、ガソリンを遠方まで押し流す。\nE. 水が激しく沸騰し、ガソリンを飛散させる。","options":["AとB","AとD","BとC","CとE","DとE"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.348","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p349-q7","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"エタノールの火災に、水溶性液体用泡消火剤以外の泡消火剤を使用しても効果的でない理由として、次のうち妥当なものはどれか。","options":["消火剤と化合するから","燃焼温度が非常に高いから","揮発性が大きいから","燃焼速度が大きいから","泡を消泡するから"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.349","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p349-q8","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"アセトンおよびエタノールなどの火災に、水溶性液体用泡消火剤以外の一般的な泡消火剤を使用した場合は効果的でない。その理由として、次のうち正しいものはどれか。","options":["泡が重いため沈むから","泡が燃えるから","泡が乾いて飛ぶから","泡が固まるから","泡が消えるから"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.349","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p349-q9","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"エタノールやアセトンが大量に燃えているときの消火方法として、次のうち最も適切なものはどれか。","options":["乾燥砂を散布する。","水溶性液体用の泡消火剤を放射する。","膨張ひる石を散布する。","棒状の水を放射する。","一般のたん白泡消火剤を放射する。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.349","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p349-q10","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"火災に際し、水溶性液体用泡消火剤の使用が適切である危険物の組合せとして、正しいものは次のうちどれか。","options":["ベンゼン／ジエチルエーテル","ガソリン／アセトアルデヒド","ベンゼン／メタノール","アセトン／メタノール","軽油／酢酸エチル"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.349","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p350-q11","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"泡消火剤の中には、水溶性液体用泡消火剤とその他一般の泡消火剤がある。次の危険物が火災になった場合、水溶性液体用泡消火剤でなければ効果的に消火できないものの組み合わせとして正しいものは次のうちどれか。\n\nA. アクリル酸、アセトン\nB. 酢酸、メタノール\nC. アセトアルデヒド、ガソリン\nD. エタノール、トルエン\nE. キシレン、酸化プロピレン","options":["AとB","AとC","BとD","CとE","DとE"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.350","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p350-q12","subject":"性質・消火","category":"第4類の消火","difficulty":"","type":"選択問題","question":"第4類の危険物と適応消火剤等の組み合わせとして、妥当なものは次のうちどれか。","options":["アセトン・エチルメチルケトン：水溶性液体用泡消火剤が適する","アセトアルデヒド・エタノール：霧状の強化液では効果がない","ガソリン・アセトン：水による冷却が適する","ジエチルエーテル・ピリジン：二酸化炭素では効果がない","ベンゼン・トルエン：棒状の水で消火できる"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.350","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p354-q1","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"第4類の危険物の貯蔵、取扱いの方法として、次のA〜Dのうち、誤っているものの組み合わせはどれか。\n\nA. 貯蔵し、または取り扱う場所は、必ずその危険物の引火点以下の温度に保つ。\nB. 可燃性蒸気の排出はできるだけ低所で、かつ地表に向けて行う。\nC. 引火点の低いものを屋内で取り扱う場合には、特に換気に注意する。\nD. 蒸気が滞留するおそれのある場所で使用する電気設備は防爆構造のものとする。","options":["AとB","AとC","BとC","BとD","CとD"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.354","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p354-q2","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"第1石油類を屋内で取り扱う場合、次のうち誤っているものはどれか。","options":["危険物を取り扱う設備や配管のフランジなどから、危険物のにじみがないか確認する。","危険物を露出して取り扱う場合にのみ、静電気の蓄積防止や電気設備の防爆などの対策を行う。","危険物の蒸気を排出する設備の吸気口の位置は、床面近くとし、排気口は屋外の高所とする。","危険物が塗布されたものを乾燥する場合は、蒸気や温水を利用した温風乾燥機を使用する。","危険物を取り扱う設備の周囲に溝を設け、流出した危険物を安全な位置に設置された処理槽まで導く。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.354","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p355-q3","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"灯油を貯蔵し、取り扱うときの注意事項として、次のうち妥当なものはどれか。","options":["蒸気比重は1より小さいので、換気口は室内の上部に設ける。","静電気を発生しやすいので、激しい動揺または流動を避ける。","20℃で容易に分解し、発熱するので、冷所に貯蔵する。","直射日光により過酸化物を生成するおそれがあるので、容器に日覆いをする。","空気中の湿気を吸収して、爆発するので、容器に不活性ガスを封入する。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.355","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p355-q4","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"ガソリンが入った容器の貯蔵、取扱いについて、次のうち適切でないものはどれか。","options":["容器は、金属製等でガソリンの貯蔵に適したものを使用する。","金属製の容器は地面に直接置くなどして、静電気の蓄積を防ぐ。","容器は、火気や高温部から離し、直射日光を避け、通風、換気の良い場所に置く。","容器を開口する前は、圧力調整弁の操作等を行い、漏れやあふれがないようにする。","容器に入れ保管するときは、空間を有しないように満たしておく。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.355","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p355-q5","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"引火性液体の危険物を取り扱う場合、静電気による火災を防止するための措置として、次のうち妥当でないものはどれか。","options":["容器等に小分け作業をする場合は、蒸気及びミストを発散させないようにする。","水を散水するなどして周囲の湿度を上げる。","タンク、容器、配管、ノズル等は、できる限り導電性のものを使用し、導体部分は接地する。","取扱い作業に従事する作業者の靴及び着衣は、絶縁性のある合成繊維のものを着用する。","取扱う場所は、十分な通風と換気を行い、可燃性蒸気の滞留を抑制する。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.355","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p355-q6","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"第4類の危険物の貯蔵、取扱い方法について、次のうち妥当でないものはどれか。","options":["容器は密封して、冷所に貯蔵する。","換気をして、発生する蒸気を燃焼下限界の1/4以下とする。","可燃性蒸気が滞留する恐れがある場所で使用する電気設備は、防爆構造のものとする。","静電気が蓄積しやすいので、絶縁性の高い化学繊維のものを着用して作業する。","引火する場合を考慮して、粉末消火器を準備しておく。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.355","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p356-q7","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"第1石油類の危険物を取り扱う場合の火災予防について、次のうち妥当でないものはどれか。","options":["液体から発生する蒸気は、地上をはって離れた低いところにたまることがあるので、周囲の火気に気をつける。","取扱作業をする場合は、鉄びょうのついた靴は使用しない。","取扱場所に設けるモーター、制御器、スイッチ、電灯などの電気設備はすべて防爆構造のものとする。","取扱作業時の服装は、電気絶縁性を有する靴やナイロンその他の化学繊維などの衣類を着用する。","床上に少量こぼれた場合は、ぼろ布などできれいにふき取り、通風を良くし、換気を十分に行う。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.356","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p356-q8","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"第4類の危険物の火災予防の方法について、次のうち誤っているものはどれか。","options":["火気、加熱をさけて貯蔵し取り扱うこと。","酸化性の物質とは同一の室に貯蔵しないこと。","可燃性蒸気が発生し内圧が上昇しやすいので、容器にはガス抜き口を設けること。","静電気が発生するおそれがある場合は、接地して静電気を除去すること。","発生する蒸気の濃度が、燃焼範囲の下限値より十分低くなるよう換気すること。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.356","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p356-q9","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"静電気により引火するおそれのある危険物を取り扱う場合の火災予防対策として、次のA〜Dのうち妥当なものはどれか。\n\nA. 作業者は、絶縁性の高い手袋や靴を着用する。\nB. 危険物を取り扱う機器を接地する。\nC. 取り扱う危険物の流速を大きくして、短時間で作業を終わらせる。\nD. 床への散水等により湿度を高める。","options":["AとB","AとC","BとC","BとD","CとD"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.356","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p357-q10","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"静電気により引火するおそれのある危険物を取り扱う場合の火災予防対策として、次のうち妥当でないものはどれか。","options":["金属製の容器を使用する。","危険物を取り扱う機器を接地する。","取り扱う危険物の流速を小さくする。","床への散水等により湿度を高める。","作業者は、絶縁性の高い手袋や靴を着用する。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.357","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p357-q11","subject":"性質・消火","category":"貯蔵・取扱い","difficulty":"","type":"選択問題","question":"製造所または一般取扱所において、一般に行われている防火対策とそれにかかわる用語の組み合わせとして、次のうち関連のないものはどれか。","options":["反応槽内を窒素ガスで置換する ― 燃焼範囲","電動機を防爆構造とする ― 引火","反応後の温度を制御する ― 反応速度","反応させる物質の注入速度を調整する ― 燃焼範囲","作業時床面に散水する ― 静電気"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.357","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p359-q1","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"次の事故事例を教訓とした今後の危険物の運搬対策として、次のうち妥当でないものはどれか。\n「危険物を運搬していたトラックが急停車したため、積載していた金属製ドラムが転倒して一緒に積んでいた鋼材にぶつかり、金属製ドラムの下部に亀裂が生じて危険物が漏えいした。」","options":["金属製ドラムのすきまに緩衝材をはさみ、かつ、荷台上を動かないように固定する。","運搬容器を破損させるおそれのある物品を同時に積載しない。","金属製ドラムは転倒防止のため横積みにして積載する。","運転手は道路、交通状況に応じて安全運転を励行し、車両のハンドル、ブレーキ等の確実な操作を行う。","運搬する危険物の性質及び流出等の事故が発生した際の応急措置をよく知っておく。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.359","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p359-q2","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"ガソリンを貯蔵していた移動貯蔵タンクに灯油を注入しているとき、火災が起きることがあるが、その主な原因として次のうち妥当なものはどれか。","options":["流入によって発生する灯油の蒸気にガソリンの蒸気が吸収され、そのとき発生する吸収熱により発火するため","流入によって発生する灯油の蒸気とガソリンの蒸気との摩擦熱により発火するため","充満していたガソリンの蒸気がある程度灯油に吸収されて燃焼範囲内の濃度になり、灯油の流入によって発生した静電気の放電火花で引火するため","灯油の流入によってガソリンの蒸気がかくはんされ、そのときの摩擦熱により発火するため","ガソリンの蒸気によって爆発性混合気が形成されているところに、灯油の蒸気が加わり、混合気が圧縮され、その圧縮熱と蒸気の摩擦熱とにより発火するため"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.359","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p360-q3","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"移動貯蔵タンクから給油取扱所の地下専用タンク（計量口を有するもの）に危険物を注入する場合に行う安全対策として、次のうち適切でないものはどれか。","options":["移動タンク貯蔵所に設置された接地導線を給油取扱所に設置された接地端子に取り付ける。","消火器を、注入口の近くの風上となる場所を選んで配置する。","地下専用タンクの残油量を計量口を開けて確認し、注入が終了するまで計量口のふたは閉めないようにする。","注入中は緊急事態にすぐ対応できるように、移動タンク貯蔵所付近から離れないようにする。","給油取扱所の責任者と地下専用タンクに注入する危険物の品名、数量等を確認してから作業を開始する。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.360","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p360-q4","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"次の文の下線部分A〜Dのうち、事故の発生要因になると考えられるものすべてを掲げているのはどれか。\n「ガソリンを貯蔵していた移動タンク貯蔵所のタンクにガソリンを注入するため、（A）導電性の小さい作業服と靴を着用し、（B）タンク内を不活性ガスで置換した。タンク上部の注入口から注入管を入れ、（C）注入管の先端をタンク底部から十分に離し、（D）注入速度をできるだけ大きくしてガソリンを注入している際、タンク内から突然炎が上がった。」","options":["A、B","A、B、C","A、C、D","B、D","C、D"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.360","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p360-q5","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"次の事故事例を教訓とした今後の対策として、誤っているものはどれか。\n「給油取扱所の固定給油設備から軽油が漏れて地下に浸透したため、地下専用タンクの外面保護材の一部が溶解した。また、周囲の地下水も汚染され、油臭くなった。」","options":["給油中は吐出状況を監視し、ノズルから空気（気泡）を吐き出していないかどうか注意すること。","固定給油設備は、定期的に前面カバーを取り外し、ポンプおよび配管等に漏れがないか点検すること。","固定給油設備のポンプ周囲および下部ピット内は点検を容易にするため常に清掃しておくこと。","固定給油設備のポンプおよび配管等の一部に著しく油、ごみ等が付着する場合は、その付近に漏れの疑いがあるので、重点的に点検すること。","固定給油設備の下部ピットは、油が漏れても地下に浸透しないように、内側をアスファルトで被覆しておくこと。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.360","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p361-q6","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"「顧客に自ら給油等をさせる給油取扱所（セルフスタンド）において、給油を行おうとして自動車の燃料タンクの給油口キャップを緩めた際に、噴出したガソリンの蒸気に静電気放電により引火して火災となった。」このような静電気事故を防止するための給油取扱所における静電気対策として、次のうち妥当でないものはどれか。","options":["固定給油設備等のホースおよびノズルについて、電気の導通を良好に保つ。","ガソリン蒸気への静電気放電が起きないようにするため、給油口キャップを開放する前には金属等に触れないようにする。","顧客用固定給油設備のホース機器等の直近その他見やすい箇所に「静電気除去」に関する事項を表示する。","給油取扱所の従業員等は、帯電防止服および帯電防止靴の着用を励行する。","地盤面への散水を適時行い、人体等に帯電している静電気が漏えいしやすいような環境を作る。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.361","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p361-q7","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"第1石油類を貯蔵する屋内貯蔵所で、危険物の流出事故が発生した場合の処置として、適切でないものは次のA〜Eのうちいくつあるか。\n\nA. 電気設備からの引火を防止するため、照明および蒸気を屋根上に排出する設備のスイッチを切った。\nB. 流出事故が発生したことを従業員や施設内の人たちに知らせるとともに、消防機関に通報した。\nC. 消火の準備をするとともに、床面に流出した危険物に乾燥砂をかけ吸い取った。\nD. 危険物を移動させるため、危険物の入っている金属製ドラムを引きずって屋外に運び出した。\nE. 貯留設備にたまった危険物をくみ上げ、ふたのある金属容器に収納した。","options":["1つ","2つ","3つ","4つ","5つ"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.361","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p362-q8","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"横転した移動タンク貯蔵所からガソリンが流出し、火災のおそれがある場合の対応として、次のうち適切でないものはどれか。","options":["火災になった場合は除去消火や窒息消火が困難なので、冷却効果の高い消火剤を準備する。","ガソリンは水に溶けずに水面を広がっていくので、土のう等により排水溝や下水道への流入を防ぐ。","ガソリンの引火点は20℃より低く、可燃性混合気を形成するので、周囲の火気の使用を制限する。","ガソリンの蒸気は空気より重く、周囲のくぼみや排水溝に溜まりやすいので留意する。","移動貯蔵タンク内に残存したガソリンを抜き取る際は、防爆型のポンプを使用する。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.362","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p362-q9","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"危険物を取り扱う地下埋設配管（炭素鋼管）が腐食して危険物が漏えいする事故が発生している。この腐食の原因として最も考えにくいものは次のうちどれか。","options":["電気器具のアースをとるため地中に打ち込んだ銅の棒と配管が接触していた。","配管をコンクリート中に埋設した。","配管を埋設した場所の近くの電気設備から直流の迷走電流が流れた。","配管を通気性の異なる2種の土壌にまたがって埋設した。","配管を埋設する際、工具が落下し、配管の被覆がはがれたのに気づかず埋設した。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.362","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p362-q10","subject":"性質・消火","category":"事故事例・対策","difficulty":"","type":"選択問題","question":"危険物を取り扱う地下埋設配管（炭素鋼管）が腐食して危険物が漏えいする事故が発生している。この腐食の原因として妥当でないものは次のうちどれか。","options":["配管を通気性の異なった2種の土壌にまたがって埋設した。","配管を埋設する際、海砂を使用した。","配管にタールエポキシ樹脂をコーティングした。","電気器具のアースをとるため銅の棒を地中に打ち込んだ際に、配管と銅の棒が接触した。","配管を埋設した場所の近くに直流の電気設備を設置したため、迷走電流の影響が大きくなった。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.362","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p366-q1","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"特殊引火物の性状について、次のうち妥当でないものはどれか。","options":["アセトアルデヒドは空気中で加圧すると、爆発性の過酸化物を生成するおそれがある。","ジエチルエーテルはアルコールによく溶ける。","二硫化炭素は、比重が1より小さい。","酸化プロピレンは、水、エタノールに溶ける。","二硫化炭素の発火点は100℃より低い。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.366","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p367-q2","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"特殊引火物の性状等について、次のうち妥当なものはどれか。","options":["アセトアルデヒドは、酸化されるとアルコールを生じる。","ジエチルエーテルは、揮発しやすく、刺激臭がある。","二硫化炭素は、比重が1より小さい。","酸化プロピレンは、水に溶けにくい。","イソプレンは、オレンジ色の揮発性液体である。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.367","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p367-q3","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"次のうち妥当でないものはどれか。","options":["二硫化炭素は沸点及び発火点が低いので、容器やタンクに貯蔵するときは、通常水を張って蒸気の発生を抑制する。","酸化プロピレンの火災には、水溶性液体用泡消火剤以外の一般の泡消火剤の使用は不適切である。","ガソリンを収納していた容器は、空き缶といえども危険性があるため、火災予防上安全な場所に保管する。","アセトアルデヒドの引火点は非常に低いが、爆発範囲が狭いのでガソリンと比べると火災の危険性は少ない。","動植物油で乾性油の染み込んだぼろ布等は、通風の悪い場所にたい積しておくと、自然発火することがある。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.367","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p367-q4","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"ジエチルエーテルの貯蔵、取扱いの方法として、次のうち妥当でないものはどれか。","options":["直射日光を避け冷所に貯蔵する。","容器は、密栓する。","火気および高温体の接近を避ける。","建物の内部に滞留した蒸気は、屋外の高所に排出する。","水より重く水に溶けにくいので、容器等に水を張って蒸気の発生を抑制する。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.367","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p367-q5","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"ジエチルエーテルの性状について、次のうち妥当でないものはどれか。","options":["沸点が極めて低い。","電気の良導体であり、流動等によっても静電気が発生しにくい。","蒸気比重は1より大きい。","比重は1より小さく、水にわずかしか溶けない。","引火点が極めて低く、かつ、燃焼範囲も極めて広い。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.367","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p368-q6","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"空気との接触や日光の下で、激しい爆発性の過酸化物を生じやすいものは次のうちどれか。","options":["ジエチルエーテル","二硫化炭素","ベンゼン","ピリジン","エチルメチルケトン"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.368","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p368-q7","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"容器またはタンクに危険物を収納する場合、可燃性蒸気の発生を抑制するため、液面に水を張って貯蔵する危険物は、次のうちどれか。","options":["アセトアルデヒド","酸化プロピレン","二硫化炭素","酢酸エチル","クレオソート油"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.368","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p368-q8","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"次の危険物のうち、発火点が最も低いものはどれか。","options":["アセトアルデヒド","アセトン","ジエチルエーテル","トルエン","二硫化炭素"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.368","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p368-q9","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"二硫化炭素の性状について、次のA〜Eのうち妥当なものの組み合わせはどれか。\n\nA. 発火点は90℃と低く、高温の配管等との接触により、容易に発火する。\nB. 青色の炎をあげて燃える。\nC. 比重は1より小さい。\nD. 水によく溶ける。\nE. 純品は無色であるが、市販品はオレンジ色に着色している。","options":["AとB","AとE","BとC","CとD","DとE"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.368","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p368-q10","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"危険物の性状について、次のうち誤っているものはどれか。","options":["二硫化炭素の比重は1より小さく、水によく溶ける。","二硫化炭素は燃焼すると、有毒な二酸化硫黄を発生する。","ジエチルエーテルは空気中で徐々に酸化して、爆発性の過酸化物を生成することがある。","アセトアルデヒドは加圧下で空気に接触させると、爆発性の過酸化物を生成することがある。","アセトアルデヒドは、アルコールを酸化させると生成される。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.368","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p369-q11","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"二硫化炭素の性状等について、次のうち妥当でないものはどれか。","options":["純品は無臭だが、一般流通品は特有の不快臭がある。","比重は1より小さく、ほとんど水に溶けない。","燃焼すると有毒ガスを発生する。","発火点が90℃と低く、高温の蒸気配管などに接触するだけで、発火することがある。","蒸気は毒性がある。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.369","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p369-q12","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"二硫化炭素の性状について、次のうち妥当なものはどれか。","options":["燃焼範囲はおおむね1〜25vol％である。","比重は1より小さい。","発火点は50℃より低い。","水によく溶ける。","燃焼すると有毒な二酸化硫黄を発生する。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.369","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p369-q13","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"二硫化炭素の屋外貯蔵タンクを水槽に入れ、水没しておく理由として、次のうち妥当なものはどれか。","options":["可燃物との接触を避けるため","水と反応して安定な物質ができるため","可燃性蒸気が発生するのを防ぐため","不純物の混入を防ぐため","空気と接触して爆発性の物質ができるのを防ぐため"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.369","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p369-q14","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"ジエチルエーテルと二硫化炭素について、次のうち誤っているものはどれか。","options":["どちらもガソリンより燃焼範囲は広い。","どちらもガソリンより発火点が低い。","どちらも比重は1より大きい。","ジエチルエーテルの蒸気には麻酔性があり、二硫化炭素の蒸気には毒性がある。","どちらも二酸化炭素、ハロゲン化物などが消火剤として有効である。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.369","render":"text","verified":"audited-2026-08-13"},{"id":"nature-a-p369-q15","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"アセトアルデヒドの性状について、妥当でないものはどれか。","options":["刺激臭のある無色の液体である。","有機溶媒にはよく溶けるが、水には溶けない。","燃焼範囲はガソリンよりも広い。","常温（20℃）で引火の危険性がある。","酸化すると、酢酸になる。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火.pdf 書籍p.369","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p370-q16","subject":"性質・消火","category":"特殊引火物","difficulty":"","type":"選択問題","question":"アセトアルデヒドの貯蔵または取扱いについて、次のうち妥当なものはどれか。","options":["蒸気の発生を抑制するため、水を張って取り扱う。","毒性があるため、直接手指で触らないように取り扱う。","静電気の蓄積を避けるため、乾燥した場所で取り扱う。","安定剤として、少量の酸化剤を加えて貯蔵する。","通気孔のある容器で貯蔵する。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.382","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p383-q3","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"メタノールの性状について、次のA〜Eのうち誤っているものの組み合わせはどれか。\n\nA. 20℃で無色透明の液体である。\nB. ナトリウムと反応して酸素を発生する。\nC. 燃焼範囲はガソリンより狭い。\nD. 燃焼しても火炎の色が淡く気づきにくい。\nE. 酸化剤と混合すると、発火・爆発することがある。","options":["A、B","A、E","B、C","C、D","D、E"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.383","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p383-q4","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"エタノールの性状について、妥当でないものはどれか。","options":["沸点は、100℃より低い。","引火点は、0℃以下である。","蒸気の比重は、空気より重い。","無色透明で芳香がある。","水とどんな割合にも溶け合う。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.383","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p383-q5","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"エタノールの性状について、次のうち妥当でないものはどれか。","options":["揮発性の高い無色の液体で、特有の芳香を有する。","水、エーテル類と任意の割合で混ざる。","燃焼範囲は、ガソリンより狭く、引火点は20℃より高い。","メタノールのような毒性はなく、医薬品等の製造、消毒剤、防腐剤等に使用される。","比重は1より小さく、蒸気比重は1より大きい。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.383","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p383-q6","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"エタノールの性状等について、次のA〜Eのうち、正しいもののみをすべて掲げているものはどれか。\n\nA. 凝固点は5.5℃である。\nB. 工業用のものには、飲料用に転用するのを防ぐために、毒性の強いメタノールが混入されているものがある。\nC. 燃焼範囲は3.3〜19.0vol％である。\nD. ナトリウムと反応して酸素を発生する。\nE. 酸化によりアセトアルデヒドを経て酢酸となる。","options":["A、C","A、D","B、C、E","B、D、E","B、C、D、E"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.383","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p384-q7","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"メタノールとエタノールに共通する性状について、次のうち誤っているものはどれか。","options":["硝酸と混触すると、発火・爆発のおそれがある。","引火点は約20℃で、発火点は約400℃以上である。","OH基（ヒドロキシ基）を1つもつ、飽和1価アルコールである。","比重は水より小さく、沸点は水より低い。","燃焼したとき炎が見えにくいところがあり、注意が必要である。"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.384","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p384-q8","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"エタノールとメタノールに共通する性状について、次のうち正しいものはどれか。","options":["水より沸点は低い。","水に溶けにくい。","毒性はない。","引火点は0℃以下である。","淡い褐色の液体である。"],"correct":[0],"explanation":"正解は 1。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.384","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p384-q9","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"アセトン、二硫化炭素、エタノールの性状について、次のうち誤っているものはどれか。","options":["燃焼範囲が一番広いのは二硫化炭素である。","発火点が一番高いのはアセトンである。","引火点が一番高いのはエタノールである。","比重が一番重いのは二硫化炭素である。","水溶性のものはエタノールのみである。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.384","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p384-q10","subject":"性質・消火","category":"アルコール類","difficulty":"","type":"選択問題","question":"自動車ガソリンとメタノールの比較について、次のうち妥当でないものはどれか。","options":["自動車用ガソリンはメタノールに比べ静電気が発生しやすいので、容器やタンクに注入する場合は、メタノールよりも流速を遅くするなどの処置が必要となる。","自動車ガソリンは非水溶性であるがメタノールは水溶性なので、メタノールの火災の消火には水溶性液体用の泡消火剤が有効である。","発生する蒸気の比重は、自動車ガソリンの方が大きいので、メタノールよりも低所に滞留しやすい。","メタノールは自動車ガソリンより燃焼範囲が狭いので、窒息による消火の効果が大きい。","メタノールは燃焼したときの炎が青白く、自動車ガソリンの炎に比べ明るい場所では見えにくいので、消火などの作業の際は注意しなければならない。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.384","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p389-q1","subject":"性質・消火","category":"第2石油類","difficulty":"","type":"選択問題","question":"第2石油類の性状について、次のうち妥当でないものはどれか。","options":["引火点が20℃以下のものはない。","比重が1より大きく、水の下層に沈むものがある。","水に溶けるものがある。","蒸気比重は1より大きい。","発火点はすべて第1石油類より高く、第3石油類より低い。"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.389","render":"text","verified":"audited-2026-08-13"},{" 妥当でないものはどれか。","options":["褐色または暗褐色の液体である。","種々の炭化水素の混合物である。","発火点は70〜150℃である。","種類により引火点は若干異なる。","不純物として含まれている硫黄は、燃えると亜硫酸ガスになる。"],"correct":[2],"explanation":"正解は 3。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.396","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p396-q2","subject":"性質・消火","category":"第3石油類","difficulty":"","type":"選択問題","question":"重油の性状として、次のうち妥当でないものはどれか。","options":["沸点は100℃より高い。","水に溶けない。","日本産業規格では、1種（A重油）、2種（B重油）および3種（C重油）に分類される。","比重は1より大きい。","引火点は60℃以上である。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.396","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p397-q3","subject":"性質・消火","category":"第3石油類","difficulty":"","type":"選択問題","question":"次の記述の下線部分A〜Eのうち、適切でないものはどれか。\n「C重油は、（A）褐色または暗褐色の液体で、（B）引火点は70℃以上と高く、（C）20℃で取り扱う場合は引火の危険は少ないが、いったん燃え始めると（D）液温が高くなるので消火が困難になる場合がある。大量に燃えている火災の消火には（E）棒状注水が適する。」","options":["A","B","C","D","E"],"correct":[4],"explanation":"正解は 5。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.397","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p397-q4","subject":"性質・消火","category":"第3石油類","difficulty":"","type":"選択問題","question":"灯油、軽油および重油について、次のうち誤っているものはどれか。","options":["引火点を比較すると一般に灯油が最も低く、次に軽油、重油の順となる。","いずれも原油の分留によって得られる。","蒸気は、いずれも空気より重い。","灯油と軽油は水より軽いが、重油は水より重い。","灯油と軽油は、第2石油類、重油は第3石油類に属する。"],"correct":[3],"explanation":"正解は 4。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.397","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p397-q5","subject":"性質・消火","category":"第3石油類","difficulty":"","type":"選択問題","question":"灯油、軽油および重油について、次のA〜Eのうち誤っているもののみを掲げているものはどれか。\n\nA. いずれも引火点は20℃より高い。\nB. いずれも原油から分留されたもので、種々の炭化水素の混合物である。\nC. いずれも静電気の発生のおそれはない。\nD. いずれも霧状になると火がつきやすくなる。\nE. いずれも水に不溶であり、灯油と軽油は水より軽いが、重油は水より重い。","options":["AとB","CとE","DとE","AとC","BとE"],"correct":[1],"explanation":"正解は 2。出典の該当問題を文章化して登録しています。","source":"性質火災消火2.pdf 書籍p.397","render":"text","verified":"audited-2026-08-13"},{"id":"nature-b-p397-q6","
