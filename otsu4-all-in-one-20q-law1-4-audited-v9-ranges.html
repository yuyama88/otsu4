<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}button,input{font:inherit}button{touch-action:manipulation}
#app{max-width:720px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-weight:900;font-size:22px}.tiny{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.hero h1{font-size:28px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{min-height:94px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;padding:14px;font-weight:800}.mode small{display:block;color:var(--muted);font-weight:500;margin-top:6px}.mode.full{grid-column:1/-1}.mode:active{transform:scale(.99)}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:12px;border-radius:999px;padding:4px 8px;background:#eef0f3;color:#434852}.badge.warn{background:#fff7ed;color:var(--warn)}.badge.bad{background:#fef2f2;color:var(--ng)}.badge.good{background:#f0fdf4;color:var(--ok)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f7f7f8;border-radius:12px;padding:10px;text-align:center}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:var(--muted)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:13px 16px;font-weight:800;width:100%}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--ng);border:1px solid #fecaca}.row{display:flex;gap:8px}.row>.btn{flex:1}
.qhead{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);padding:8px 0 10px}.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827}.qtitle{font-size:18px;font-weight:900;margin:14px 0 8px;line-height:1.55;white-space:pre-wrap}.source{font-size:12px;color:var(--muted);margin-top:6px}.imgwrap{background:#eee;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:10px 0}.qimg{display:block;width:100%;height:auto}.zoomhint{text-align:center;color:var(--muted);font-size:11px;padding:6px}.opts{display:grid;gap:9px;margin:14px 0}.opt{display:flex;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;line-height:1.45}.opt .num{font-weight:900;min-width:23px}.opt.sel{border-color:#111827;background:#f3f4f6}.opt.correct{border-color:#86efac;background:#f0fdf4}.opt.wrong{border-color:#fecaca;background:#fef2f2}.opt:disabled{color:inherit;opacity:1}
.result{border-radius:13px;padding:13px;margin:12px 0;line-height:1.55}.result.ok{background:#f0fdf4;color:#14532d}.result.ng{background:#fef2f2;color:#7f1d1d}.explain{font-size:14px;white-space:pre-wrap}.stickybtn{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 8px);padding-top:10px;background:linear-gradient(transparent,var(--bg) 25%)}
.listitem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.record h3{margin:6px 0}.record p{margin:3px 0;color:var(--muted);font-size:13px}.selectline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.overlay img{max-width:100%;max-height:92dvh;object-fit:contain}.overlay button{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);border:0;background:#fff;border-radius:999px;width:42px;height:42px;font-size:22px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;background:var(--card);color:var(--text)}
.themebtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 11px;font-weight:800;white-space:nowrap}
.global-theme{
  position:fixed;
  right:14px;
  bottom:calc(env(safe-area-inset-bottom) + 14px);

  border-radius:999px;
  padding:10px 14px;
  font-weight:900;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
  touch-action:manipulation;
}

<script>
const QUESTIONS=[{"id":"法令-law1-001","subject":"法令","category":"危険物の品名","difficulty":"2","type":"誤っているものを選べ","question":"法別表第1に危険物の品名として掲げられていないものは、次のうちどれか。","options":["過酸化水素","硫黄","赤りん","ナトリウム","プロパン"],"correct":[4],"explanation":"法別表第1に定める危険物は、原則として固体と液体です。気体のプロパンは消防法で定める危険物には該当しません。過酸化水素は第6類、硫黄・赤りんは第2類、ナトリウムは第3類です。","source":"法令1.pdf p.1-3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-002","subject":"法令","category":"類別・性質・品名","difficulty":"2","type":"誤っているものを選べ","question":"法別表第1に掲げる危険物の類別、性質及び品名の組み合わせとして、次のうち誤っているものはどれか。","options":["第1類｜酸化性固体｜過塩素酸塩類","第3類｜可燃性固体｜マグネシウム","第4類｜引火性液体｜動植物油類","第5類｜自己反応性物質｜硝酸エステル類","第6類｜酸化性液体｜過酸化水素"],"correct":[1],"explanation":"第3類の性質は「自然発火性物質及び禁水性物質」です。マグネシウムは第2類の可燃性固体に該当します。","source":"法令1.pdf p.1-3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-003","subject":"法令","category":"危険物の定義","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物に関する記述について、次のうち誤っているものはどれか。","options":["危険物とは、法別表第1の品名欄に掲げる物品で、同表に定める区分に応じ同表の性質欄に掲げる性状を有するものをいう。","液化石油ガスは、危険物に該当する。","危険物に該当するか否かを判断するための試験の1つに、火炎による着火の危険性を判断するための試験がある。","危険物は、酸化性固体、可燃性固体、自然発火性物質及び禁水性物質、引火性液体、自己反応性物質、酸化性液体の性質ごとに分類されている。","指定数量とは、危険物の危険性を勘案して政令で定める数量である。"],"correct":[1],"explanation":"液化石油ガスは常温常圧で気体であるため、消防法で定める危険物には該当しません。","source":"法令1.pdf p.1-3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-004","subject":"法令","category":"危険物の説明","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物に関する説明について、次のうち誤っているものはどれか。","options":["危険物とは、法別表第1の品名欄に掲げる物品で、同表に定める区分に応じ同表の性質欄に掲げる性状を有するものをいう。","危険物の状態は、20℃、1気圧において固体又は液体である。","危険物を含有する物品であっても、政令で定める試験において政令で定める性状を示さなければ危険物に該当しない。","危険物の区分として、第1類から第6類までの6つの類に分けられている。","不燃性又は難燃性でない固体の合成樹脂製品は、危険物に該当する。"],"correct":[4],"explanation":"不燃性又は難燃性でない固体の合成樹脂製品は、数量等に応じて指定可燃物に該当する場合がありますが、消防法別表第1の危険物とは異なります。","source":"法令1.pdf p.2-3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-005","subject":"法令","category":"複数性状物品","difficulty":"2","type":"正しいものを選べ","question":"法令上、次の文の（　）内に当てはまる語句として、正しいものはどれか。\n\n「法別表第1の性質欄に掲げる性状の2以上を有する物品（複数性状物品）の属する品名は、規則で定められている。複数性状物品が、酸化性固体の性状及び自己反応性物質の性状を有する場合は、法別表第1（　）の項第11号に掲げる品名とされる。」","options":["第1類","第2類","第3類","第5類","第6類"],"correct":[3],"explanation":"酸化性固体（第1類）と自己反応性物質（第5類）の複数性状物品は、第5類に属するとされます。","source":"法令1.pdf p.3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-006","subject":"法令","category":"第4類品名","difficulty":"2","type":"誤っているものを選べ","question":"法に定める危険物の品名について、次のうち誤っているものはどれか。","options":["二酸化硫黄は、特殊引火物に該当する。","アセトンは、第1石油類に該当する。","灯油は、第2石油類に該当する。","クレオソート油は、第3石油類に該当する。","ギヤー油は、第4石油類に該当する。"],"correct":[0],"explanation":"二酸化硫黄は特殊引火物ではありません。特殊引火物の代表例は、ジエチルエーテル、二硫化炭素などです。","source":"法令1.pdf p.4","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-007","subject":"法令","category":"第4類品名","difficulty":"2","type":"誤っているものを選べ","question":"法別表第1に定める第4類の危険物の品名について、次のうち誤っているものはどれか。","options":["特殊引火物……二硫化炭素","第1石油類……ガソリン","第2石油類……軽油","アルコール類……ジエチルエーテル","第3石油類……重油"],"correct":[3],"explanation":"ジエチルエーテルはアルコール類ではなく、特殊引火物に分類されます。","source":"法令1.pdf p.4","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-008","subject":"法令","category":"特殊引火物","difficulty":"2","type":"当てはまるものを選べ","question":"法令上、次の文の（　）内に当てはまる語句はどれか。\n\n「特殊引火物とは、ジエチルエーテル、二硫化炭素その他1気圧において、発火点が100℃以下のもの又は（　）のものをいう。」","options":["引火点が－40℃以下","引火点が－40℃以下で沸点が40℃以下","引火点が－20℃以下","引火点が－20℃以下で沸点が40℃以下","沸点が40℃以下"],"correct":[3],"explanation":"特殊引火物は、発火点が100℃以下のもの、又は引火点が－20℃以下かつ沸点が40℃以下のものをいいます。","source":"法令1.pdf p.4","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-009","subject":"法令","category":"アルコール類","difficulty":"2","type":"当てはまるものを選べ","question":"アルコール類については法別表第1備考において、組成等を勘案して規則で定めるものを除くとされている。次の文の（　）内に当てはまる規則で定められている数値はどれか。\n\n「アルコール類から除かれるものは、1分子を構成する炭素の原子の数が1個から3個までの飽和1価アルコールの含有量が（　）未満の水溶液である。」","options":["50%","60%","70%","80%","90%"],"correct":[1],"explanation":"炭素数1〜3の飽和1価アルコールの含有量が60%未満の水溶液は、アルコール類から除かれます。","source":"法令1.pdf p.5-6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-010","subject":"法令","category":"動植物油類","difficulty":"2","type":"正しいものを選べ","question":"法別表第1で定める動植物油類について、次の文の（　）内のA及びBに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「動植物油類とは、動物の脂肉等又は植物の種子若しくは果肉から抽出したものであって、1気圧において（A）が（B）未満のものをいい、総務省令で定めるところにより貯蔵保管されているものを除く。」","options":["A：引火点　B：200℃","A：引火点　B：250℃","A：引火点　B：300℃","A：発火点　B：250℃","A：発火点　B：300℃"],"correct":[1],"explanation":"動植物油類は、1気圧において引火点が250℃未満のものです。発火点ではなく引火点で判定します。","source":"法令1.pdf p.5-6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-011","subject":"法令","category":"品名の説明","difficulty":"2","type":"誤っているものを選べ","question":"法別表第1備考に掲げる品名の説明として、次のうち誤っているものはどれか。","options":["特殊引火物とは、1気圧において、発火点が100℃以下のもの、または引火点が－20℃以下で沸点が40℃以下のものをいう。","第一石油類とは、1気圧において引火点が21℃未満のものをいう。","第二石油類とは、1気圧において引火点が21℃以上70℃未満のものをいう。","第三石油類とは、1気圧において引火点が70℃以上200℃未満のものをいう。","第四石油類とは、1気圧において引火点が200℃以上のものをいう。"],"correct":[4],"explanation":"第四石油類は、1気圧において引火点が200℃以上250℃未満のものです。「200℃以上」だけでは不完全です。","source":"法令1.pdf p.6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-012","subject":"法令","category":"品名判定","difficulty":"2","type":"正しいものを選べ","question":"屋外貯蔵タンクに第4類の危険物が貯蔵されている。この危険物の性状は、非水溶性液体、1気圧において引火点24.5℃、沸点136.2℃、発火点432℃である。法令上、この危険物に該当する品名は次のうちどれか。","options":["特殊引火物","第1石油類","アルコール類","第2石油類","第3石油類"],"correct":[3],"explanation":"引火点24.5℃は21℃以上70℃未満なので、第2石油類に該当します。","source":"法令1.pdf p.7","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-013","subject":"法令","category":"指定数量未満","difficulty":"2","type":"正しいものを選べ","question":"法令上、指定数量未満の危険物について、次のうち正しいものはどれか。ただし、法第17条第1項の消防用設備等については除くものとする。","options":["指定数量未満の危険物を貯蔵し、又は取り扱う場所の位置、構造及び設備の技術上の基準は、市町村条例により定めることとされている。","指定数量未満の危険物の運搬容器の基準は、市町村条例により定めることとされている。","指定数量未満の危険物とは、市町村条例で定める数量未満の危険物をいう。","指定数量未満の危険物を車両で運搬する場合の技術上の基準は、市町村条例により定めることとされている。","製造所等に設置する、指定数量未満の液体の危険物を貯蔵するタンクの技術上の基準は、市町村条例により定めることとされている。"],"correct":[0],"explanation":"指定数量未満の危険物の貯蔵・取扱い場所の位置、構造、設備の基準は市町村条例で定めます。運搬容器や運搬の基準は政令で定めます。","source":"法令1.pdf p.7","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-014","subject":"法令","category":"指定数量","difficulty":"2","type":"誤っているものを選べ","question":"法令に定める第4類の危険物の指定数量について、次のうち誤っているものはどれか。","options":["特殊引火物の指定数量は、第4類の危険物の中で最も少ない量である。","第1石油類の水溶性液体と、アルコール類の指定数量は同じである。","第2石油類の水溶性液体と、第3石油類の非水溶性液体の指定数量は同じである。","第1石油類、第2石油類及び第3石油類の指定数量は、各類とも水溶性液体の数量が非水溶性液体の2倍となっている。","第3石油類の水溶性液体と、第4石油類の指定数量は同じである。"],"correct":[4],"explanation":"第3石油類の水溶性液体は4,000L、第4石油類は6,000Lなので同じではありません。","source":"法令1.pdf p.7","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-015","subject":"法令","category":"指定数量計算","difficulty":"2","type":"正しいものを選べ","question":"法令上、次の危険物を同一の場所で貯蔵する場合、貯蔵量は指定数量の何倍になるか。\n\n・軽油……3,000L\n・ガソリン……1,000L\n・エタノール……2,000L","options":["10","11","12","13","14"],"correct":[3],"explanation":"軽油は第2石油類（非水溶性）で1,000L、ガソリンは第1石油類（非水溶性）で200L、エタノールはアルコール類で400Lです。3,000/1,000=3、1,000/200=5、2,000/400=5、合計13倍です。","source":"法令1.pdf p.8","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-016","subject":"法令","category":"指定数量計算","difficulty":"2","type":"正しいものを選べ","question":"ある製造所において、第4類の危険物A及びBを同一場所に貯蔵している。指定数量の倍数の合計として、次のうち正しいものはどれか。\n\n危険物A：非水溶性、発火点220℃、引火点45℃、貯蔵量2,000L\n危険物B：非水溶性、発火点480℃、引火点5℃、貯蔵量1,000L","options":["3","5","7","22","30"],"correct":[2],"explanation":"Aは引火点45℃なので第2石油類（非水溶性）で指定数量1,000L、2倍です。Bは引火点5℃なので第1石油類（非水溶性）で指定数量200L、5倍です。合計7倍です。","source":"法令1.pdf p.8-9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-017","subject":"法令","category":"指定数量計算","difficulty":"2","type":"正しいものを選べ","question":"次に掲げる危険物の品名と数量の組み合わせのうち、指定数量の倍数が1以上となるものはどれか。","options":["ガソリン100L ＋ 灯油400L","灯油500L ＋ 軽油400L","軽油400L ＋ 重油1,000L","メタノール200L ＋ ガソリン100L","エタノール200L ＋ 灯油400L"],"correct":[3],"explanation":"メタノールはアルコール類で400L、ガソリンは第1石油類（非水溶性）で200Lです。200/400=0.5、100/200=0.5、合計1.0となります。","source":"法令1.pdf p.8-9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-018","subject":"法令","category":"指定数量計算","difficulty":"2","type":"正しいものを選べ","question":"屋内貯蔵所に灯油2,000Lと軽油4,000Lを貯蔵している。これらと同時に貯蔵するとき、指定数量の倍数が10となるものは、次のうちどれか。","options":["ガソリン……1,000L","二硫化炭素……300L","ベンゼン……1,200L","アセトン……800L","エタノール……1,600L"],"correct":[4],"explanation":"灯油2,000Lは2倍、軽油4,000Lは4倍で、すでに合計6倍です。エタノール1,600Lはアルコール類400Lが指定数量なので4倍となり、合計10倍です。","source":"法令1.pdf p.9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-019","subject":"法令","category":"製造所等の区分","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の区分の一般的説明として、次のうち正しいものはどれか。","options":["屋外貯蔵所……屋外で特殊引火物及びナトリウムを貯蔵し、又は取り扱う貯蔵所","給油取扱所……自動車の燃料タンクのみにガソリンを給油する取扱所","移動タンク貯蔵所……鉄道の車両に固定されたタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所","地下タンク貯蔵所……地盤面下に埋没されているタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所","屋内貯蔵所……屋内にあるタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所"],"correct":[3],"explanation":"地下タンク貯蔵所は、地盤面下に埋没されているタンクで危険物を貯蔵し、又は取り扱う貯蔵所です。","source":"法令1.pdf p.10","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-020","subject":"法令","category":"貯蔵所・取扱所","difficulty":"2","type":"誤っているものを選べ","question":"法令上、貯蔵所及び取扱所の区分について、次のうち誤っているものはどれか。","options":["屋外貯蔵所とは、屋外の場所において危険物を貯蔵し、又は取り扱う貯蔵所をいう。","地下タンク貯蔵所とは、地盤面下に埋没されているタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所をいう。","屋外タンク貯蔵所とは、屋外にあるタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所をいう。","第一種販売取扱所とは、店舗において容器入りのままで販売するため、指定数量の倍数が15以下の危険物を取り扱う取扱所をいう。","一般取扱所とは、屋内取扱所、屋外取扱所又は移送取扱所以外の取扱所をいう。"],"correct":[4],"explanation":"一般取扱所とは、給油取扱所、販売取扱所、移送取扱所以外の取扱所です。「屋内取扱所」「屋外取扱所」という区分ではありません。","source":"法令1.pdf p.10-11","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-021","subject":"法令","category":"貯蔵所・取扱所","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、貯蔵所及び取扱所の区分について、次のA〜Dのうち、正しいものの組合せはどれか。\n\nA. 第二種販売取扱所とは、店舗において容器入りのままで販売するため危険物を取り扱う取扱所で、指定数量の倍数が15を超え40以下のものをいう。\nB. 移動タンク貯蔵所とは、車両、鉄道の貨車又は船舶に固定されたタンクにおいて危険物を貯蔵し、又は取り扱う。\nC. 給油取扱所とは、金属製ドラム等のみに直接給油するためガソリンを取り扱う施設。\nD. 屋内タンク貯蔵所とは、屋内にあるタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所をいう。","options":["A、B","A、C","A、D","B、C","B、D"],"correct":[2],"explanation":"AとDが正しいです。Bは移動タンク貯蔵所の説明に鉄道貨車・船舶を含めている点が誤りです。Cは給油取扱所の説明として不適切です。","source":"法令1.pdf p.11","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-022","subject":"法令","category":"貯蔵所・取扱所","difficulty":"2","type":"誤っているものを選べ","question":"法令上、貯蔵所及び取扱所の区分について、次のうち誤っているものはどれか。","options":["屋内貯蔵所とは、屋内の場所において容器入りの危険物を貯蔵し、又は取り扱う貯蔵所をいう。","屋内タンク貯蔵所とは、屋内にあるタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所をいう。","屋外タンク貯蔵所とは、屋外にあるタンクにおいて危険物を貯蔵し、又は取り扱う貯蔵所をいう。","第二種販売取扱所とは、店舗において容器入りのままで販売するため危険物を取り扱う取扱所で、指定数量の倍数が15を超え40以下のものをいう。","一般取扱所とは、配管及びポンプ並びにこれらに付属する設備によって危険物の移送の取扱いを行う取扱所をいう。"],"correct":[4],"explanation":"選択肢5は移送取扱所の説明です。一般取扱所は、給油取扱所、販売取扱所、移送取扱所以外の取扱所です。","source":"法令1.pdf p.12","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-023","subject":"法令","category":"製造所等の区分","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の区分について、次のうち正しいものはどれか。","options":["屋外にあるタンクで危険物を貯蔵し、又は取り扱う貯蔵所を屋外貯蔵所という。","屋内にあるタンクで危険物を貯蔵し、又は取り扱う貯蔵所を屋内貯蔵所という。","店舗において容器入りのままで販売するため、指定数量の倍数が15以下の危険物を取り扱う取扱所を第一種販売取扱所という。","ボイラーで重油等を消費する施設を製造所という。","金属製ドラム等のみに直接給油するためガソリンを取り扱う施設を給油取扱所という。"],"correct":[2],"explanation":"指定数量の倍数が15以下の危険物を、店舗で容器入りのまま販売する取扱所は第一種販売取扱所です。","source":"法令1.pdf p.12-13","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-024","subject":"法令","category":"設置・変更","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の位置、構造又は設備を変更する場合の手続きとして、次のうち正しいものはどれか。","options":["変更工事完了後、速やかに市町村長等に届け出なければならない。","変更工事完了の10日前までに市町村長等に届け出なければならない。","変更の計画を市町村長等に届け出てから変更工事を開始しなければならない。","市町村長等の変更許可を受けてから変更工事を開始しなければならない。","変更工事を開始しようとする日の10日前までに市町村長等に届け出なければならない。"],"correct":[3],"explanation":"製造所等の位置、構造又は設備を変更する場合は、あらかじめ市町村長等の変更許可を受けてから工事を開始します。","source":"法令1.pdf p.14","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-025","subject":"法令","category":"設置許可・完成検査","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次の文の（　）内のA〜Cに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「製造所等（移送取扱所を除く。）を設置するためには、消防本部及び消防署を置く市町村の区域では当該（A）、その他の区域では当該区域を管轄する（B）の許可を受けなければならない。また、工事完了後には技術上の基準に適合しているかどうか（C）を受けなければならない。」","options":["A：消防長又は消防署長　B：市町村長　C：機能検査","A：市町村長　B：都道府県知事　C：完成検査","A：市町村長　B：都道府県知事　C：機能検査","A：消防長　B：市町村長　C：完成検査","A：消防署長　B：都道府県知事　C：機能検査"],"correct":[1],"explanation":"消防本部及び消防署を置く市町村の区域では市町村長、その他の区域では都道府県知事の許可を受けます。工事完了後は完成検査を受けます。","source":"法令1.pdf p.14-15","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-026","subject":"法令","category":"各種手続き","difficulty":"2","type":"誤っているものを選べ","question":"法令上、各種手続きについて、次のうち誤っているものはどれか。","options":["製造所等以外の場所で指定数量以上の危険物を10日以内の期間、仮に貯蔵し、又は取り扱う場合は、所轄消防長又は消防署長の承認を受けなければならない。","製造所等の譲渡又は引渡しを受けた場合は、市町村長等に届け出なければならない。","製造所等の位置、構造又は設備を変更する場合は、所轄消防長又は消防署長に届け出なければならない。","製造所等において、予防規程を定めた場合は、市町村長等の認可を受けなければならない。","製造所等を設置したときは、使用する前に市町村長等の検査を受けなければならない。"],"correct":[2],"explanation":"製造所等の位置、構造又は設備を変更する場合は、届出ではなく市町村長等の許可が必要です。","source":"法令1.pdf p.15-16","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-027","subject":"法令","category":"設置場所と許可権者","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所等を設置する場合の設置場所と許可権者の組合せとして、次のうち誤っているものはどれか。","options":["消防本部及び消防署を設置している市町村の区域に設置される製造所等（移送取扱所を除く。）｜当該市町村長","消防本部及び消防署を設置していない市町村の区域に設置される製造所等（移送取扱所を除く。）｜当該区域を管轄する都道府県知事","消防本部及び消防署を設置している1の市町村の区域内に設置される移送取扱所｜当該市町村長","2以上の市町村の区域にわたって設置される移送取扱所｜消防庁長官","2以上の都道府県の区域にわたって設置される移送取扱所｜総務大臣"],"correct":[3],"explanation":"2以上の市町村の区域にわたる移送取扱所は、原則として都道府県知事が許可権者です。消防庁長官ではありません。","source":"法令1.pdf p.16-17","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law1-028","subject":"法令","category":"仮使用","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の仮使用について、次のうち正しいものはどれか。","options":["市町村長等の承認を受ける前に、貯蔵し、又は取り扱う危険物の品名、数量又は指定数量の倍数を変更し、仮に使用すること。","製造所等を変更する場合に、変更工事が終了した一部について、順次、市町村長等の承認を受けて、仮に使用すること。","製造所等を変更する場合に、変更工事に係る部分以外の部分で、指定数量以上の危険物を10日以内の期間、仮に使用すること。","製造所等を変更する場合に、変更工事に係る部分以外の部分の全部又は一部について市町村長等の承認を受け、完成検査を受ける前に、仮に使用すること。","製造所等の譲渡又は引渡しがある場合に、市町村長等の承認を受ける前に、仮に使用すること。"],"correct":[3],"explanation":"仮使用は、変更工事に係る部分以外の全部又は一部について、市町村長等の承認を受けることで、完成検査前でも使用できる制度です。","source":"法令1.pdf p.16-17","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-001","subject":"法令","category":"仮使用","difficulty":"2","type":"誤っている箇所を選べ","question":"法令上、製造所等の仮使用に関する次の文の下線部分A〜Eのうち、誤っている箇所はどれか。\n\n「製造所、貯蔵所又は取扱所の位置、構造又は設備を変更する場合において、当該製造所、貯蔵所又は取扱所のうち当該変更の（A）工事に係る部分以外の部分の（B）全部又は一部について（C）所轄消防長又は消防署長の（D）承認を受けたときは（E）完成検査を受ける前においても、仮に、当該承認を受けた部分を使用することができる。」","options":["A","B","C","D","E"],"correct":[2],"explanation":"仮使用の承認権者は「所轄消防長又は消防署長」ではなく「市町村長等」です。したがってCが誤りです。","source":"法令2.pdf p.1","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-002","subject":"法令","category":"仮使用","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次の文の（　）内のA及びBに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「製造所、貯蔵所又は取扱所の位置、構造又は設備を変更する場合において、当該製造所、貯蔵所又は取扱所のうち当該変更の（A）の全部又は一部について（B）の承認を受けたときは、完成検査を受ける前においても、仮に当該承認を受けた部分を使用することができる。」","options":["A：工事に係る部分以外の部分　B：市町村長等","A：工事に係る部分以外の部分　B：消防長又は消防署長","A：工事に係る部分　B：市町村長等","A：工事に係る部分　B：消防長又は消防署長","A：工事に係る部分　B：消防庁長官"],"correct":[0],"explanation":"仮使用は、変更工事に係る部分以外の全部又は一部について、市町村長等の承認を受けた場合に認められます。","source":"法令2.pdf p.1-2","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-003","subject":"法令","category":"完成検査前検査","difficulty":"2","type":"誤っているものを選べ","question":"法令上、完成検査前検査に関する記述について、次のうち誤っているものはどれか。","options":["容量が指定数量以上の液体危険物タンクを有しない製造所は、完成検査前検査を受けなくてもよい。","液体危険物タンクの基礎及び地盤に関する事項についての完成検査前検査に、基礎・地盤検査がある。","液体危険物タンクの外面の保護に関する事項についての完成検査前検査に、膜厚検査がある。","液体危険物タンクの溶接部に関する事項についての完成検査前検査に、溶接部検査がある。","完成検査前検査において、技術上の基準に適合すると認められた事項については、完成検査を受けなくてもよい。"],"correct":[4],"explanation":"完成検査前検査で適合していても、完成検査そのものを省略できるわけではありません。完成検査は別に受ける必要があります。","source":"法令2.pdf p.2","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-004","subject":"法令","category":"製造所の設置等","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所の設置等について、次のうち誤っているものはどれか。","options":["製造所の保有空地を変更するときは、市町村長等の変更の許可が必要である。","製造所を設置するときは、工事期間の中間で、完成検査時に目視できない地下埋設配管の完成検査前検査を行った後でなければ、完成検査は実施できない。","製造所の構造を変更するときは、市町村長等の変更の許可を受けなければ、工事に着手できない。","設置工事が終了し、市町村長等から完成検査済証を交付された場合は、製造所を使用できる。","市町村長等に変更の許可を申請する場合は、変更の内容に関する図面その他規則で定める書類を添付しなければならない。"],"correct":[1],"explanation":"「工事期間の中間で」という記述が不適切です。完成検査前検査と完成検査は別の手続きです。","source":"法令2.pdf p.3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-005","subject":"法令","category":"届出の種類と時期","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所等に関する届出の種類と時期の組み合わせとして、次のうち誤っているものはどれか。","options":["製造所等の譲渡又は引渡しの届出｜製造所等の譲渡又は引渡しをした後、遅滞なく","危険物の品名、数量、指定数量の倍数の変更の届出｜変更する日の10日前まで","製造所等の用途の廃止の届出｜製造所等を廃止した後、遅滞なく","危険物保安監督者の選任又は解任の届出｜選任又は解任した後、遅滞なく","危険物施設保安員の選任又は解任の届出｜選任又は解任する日の10日前まで"],"correct":[4],"explanation":"危険物施設保安員の選任又は解任の届出は、事前10日前ではなく、選任又は解任した後、遅滞なく行います。","source":"法令2.pdf p.4-5","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-006","subject":"法令","category":"各種規制・手続き","difficulty":"2","type":"誤っているものを選べ","question":"法令上、次のうち誤っているものはどれか。","options":["指定数量未満の危険物の貯蔵又は取扱いの技術上の基準は、市町村条例で定められている。","製造所等の位置、構造又は設備を変更しないで、貯蔵し、又は取り扱う危険物の種類又は数量を変更したときは、速やかに所轄消防署長の認可を受けなければならない。","製造所等を廃止したときは、遅滞なくその旨を市町村長等に届け出なければならない。","消防職員が市町村長の定める証票を示して、指定数量以上の危険物を貯蔵し、又は取り扱っている場所に立ち入り、検査や質問をしたときは、関係者は、これに応じなければならない。","製造所等の所有者等は、危険物保安監督者を定めたとき、又はこれを解任したときは、遅滞なくその旨を市町村長等に届け出なければならない。"],"correct":[1],"explanation":"危険物の品名、数量、指定数量の倍数を変更しようとする場合は、変更する日の10日前までに市町村長等に届け出ます。認可ではありません。","source":"法令2.pdf p.4-5","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-007","subject":"法令","category":"品名・数量変更の届出","difficulty":"2","type":"誤っている箇所を選べ","question":"法令上、次の文の下線部分A〜Eのうち、誤っている箇所はどれか。\n\n「製造所等の位置、構造又は設備を変更しないで、当該製造所等において貯蔵し、又は取り扱う危険物の（A）品名、（B）数量又は指定数量の倍数を変更しようとする者は、（C）遅滞なくその旨を（D）市町村長等に（E）届け出なければならない。」","options":["A","C","A、B","B、C","A、B、C"],"correct":[1],"explanation":"品名・数量・指定数量の倍数を変更しようとする場合は、「遅滞なく」ではなく、変更する日の10日前までに届け出ます。","source":"法令2.pdf p.5","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-008","subject":"法令","category":"事前届出","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の所有者等があらかじめ市町村長等に届出をしなければならないのは、次のうちどれか。","options":["製造所等の譲渡又は引渡しを受ける場合","製造所等の位置、構造又は設備を変更しないで、製造所等で貯蔵し、又は取り扱う危険物の品名、数量を変更する場合","製造所等を廃止する場合","危険物保安監督者を定めなければならない製造所等において、危険物保安監督者を定める場合","危険物施設保安員を定めなければならない製造所等において、危険物施設保安員を定める場合"],"correct":[1],"explanation":"危険物の品名、数量、指定数量の倍数を変更する場合は、変更する日の10日前までに届け出ます。","source":"法令2.pdf p.6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-009","subject":"法令","category":"届出が必要な場合","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所等の所有者等が市町村長等に届け出なければならない場合として、次のうち誤っているものはどれか。","options":["製造所等の譲渡又は引渡しを受けたとき。","製造所等の定期点検を実施したとき。","危険物保安統括管理者を定めたとき。","危険物保安監督者を解任したとき。","製造所等の用途を廃止したとき。"],"correct":[1],"explanation":"定期点検を実施したことは届出事項ではありません。点検記録の保存義務はあります。","source":"法令2.pdf p.6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-010","subject":"法令","category":"廃止の届出","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次の文の（　）内のA〜Cに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「製造所、貯蔵所又は取扱所の所有者、管理者又は占有者は、当該製造所、貯蔵所又は取扱所の用途を廃止したときは、（A）その旨を（B）に（C）なければならない。」","options":["A：遅滞なく　B：市町村長等　C：届け出","A：遅滞なく　B：市町村長等　C：承認を受け","A：遅滞なく　B：所轄消防長又は消防署長　C：届け出","A：10日以内に　B：市町村長等　C：承認を受け","A：10日以内に　B：所轄消防長又は消防署長　C：承認を受け"],"correct":[0],"explanation":"製造所等の用途を廃止したときは、遅滞なく市町村長等に届け出なければなりません。","source":"法令2.pdf p.6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-011","subject":"法令","category":"仮貯蔵・仮取扱い","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次の文の（　）内のA〜Cに当てはまるものの組み合わせとして、正しいものはどれか。\n\n「指定数量以上の危険物は、貯蔵所以外の場所でこれを貯蔵し、又は製造所等以外の場所でこれを取り扱ってはならない。ただし、（A）の（B）を受けて指定数量以上の危険物を、（C）以内の期間、仮に貯蔵し、又は取り扱う場合は、この限りではない。」","options":["A：市町村長等　B：承認　C：10日","A：市町村長等　B：許可　C：10日","A：市町村長等　B：許可　C：14日","A：所轄消防長又は消防署長　B：承認　C：10日","A：所轄消防長又は消防署長　B：許可　C：14日"],"correct":[3],"explanation":"仮貯蔵・仮取扱いは、所轄消防長又は消防署長の承認を受けて、10日以内の期間に限って認められます。","source":"法令2.pdf p.7","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-012","subject":"法令","category":"仮貯蔵の基準","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等以外の場所において、指定数量以上の危険物を仮に貯蔵する場合の基準について、次のうち正しいものはどれか。","options":["貯蔵する期間は20日以内としなければならない。","貯蔵しようとする日から10日以内に市町村長等に申し出なければならない。","市町村条例で定める基準に従って、貯蔵しなければならない。","貯蔵する危険物の数量は、指定数量の倍数が2以下としなければならない。","貯蔵する場合、所轄消防長または消防署長の承認を得なければならない。"],"correct":[4],"explanation":"指定数量以上の危険物を製造所等以外で仮に貯蔵するには、所轄消防長又は消防署長の承認が必要です。期間は10日以内です。","source":"法令2.pdf p.7","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-013","subject":"法令","category":"仮貯蔵・仮取扱い","difficulty":"2","type":"正しいものを選べ","question":"法令上、指定数量以上の危険物を製造所等以外の場所で仮に貯蔵し、又は取り扱う場合について、次のうち正しいものはどれか。","options":["市町村長等に届け出れば、危険物を貯蔵し、又は取り扱うことができる。","危険物を貯蔵し、又は取り扱う場合には、危険物保安監督者の選任が必要である。","危険物を貯蔵し、又は取り扱うことができる期間に制限はない。","貯蔵し、又は取り扱うことのできる危険物の指定数量の倍数は10以下である。","所轄消防長又は消防署長の承認を受けないで指定数量以上の危険物を貯蔵し、又は取り扱っている者は、危険物の除去を命ぜられることがある。"],"correct":[4],"explanation":"承認を受けずに仮貯蔵・仮取扱いをしている場合、危険物の除去その他災害防止のための措置を命ぜられることがあります。","source":"法令2.pdf p.8-9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-014","subject":"法令","category":"仮貯蔵の手続き","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等以外の場所で指定数量以上の危険物を仮に貯蔵し、又は取り扱う場合の手続きとして、次のうち正しいものはどれか。","options":["管轄の市町村長等に届け出る。","管轄の都道府県知事の認可を受ける。","所轄消防長又は消防署長に届け出る。","管轄の市町村長等の認可を受ける。","所轄消防長又は消防署長の承認を受ける。"],"correct":[4],"explanation":"仮貯蔵・仮取扱いは、所轄消防長又は消防署長の承認を受けます。届出や認可ではありません。","source":"法令2.pdf p.8-9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-015","subject":"法令","category":"仮貯蔵の基準","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、製造所等以外の場所において、指定数量以上の危険物を仮に貯蔵する場合の基準について、次のA〜Dのうち正しいものの組合せはどれか。\n\nA. 貯蔵する場合、所轄消防長または消防署長の承認を得なければならない。\nB. 貯蔵する危険物の量は、指定数量の10倍以下としなければならない。\nC. 危険物保安監督者を定めなければならない。\nD. 貯蔵する期間は10日以内としなければならない。","options":["AとB","AとC","AとD","BとC","CとD"],"correct":[2],"explanation":"正しいのはAとDです。仮貯蔵・仮取扱いには承認が必要で、期間は10日以内です。数量10倍以下や保安監督者選任の規定ではありません。","source":"法令2.pdf p.9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-016","subject":"法令","category":"危険物取扱者の責務","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、危険物取扱者の責務に関する条文について、次の文の（　）内のA及びBに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「危険物取扱者は、危険物の取扱作業に従事するときは、法第10条第3項の（A）の技術上の基準を遵守するとともに、当該危険物の（B）について細心の注意を払わなければならない。」","options":["A：位置、構造及び設備　B：保安の確保","A：位置、構造及び設備　B：安全の確保","A：貯蔵または取扱い　B：貯蔵や取扱い","A：位置、構造及び設備　B：貯蔵や取扱い","A：貯蔵または取扱い　B：保安の確保"],"correct":[4],"explanation":"法第10条第3項は、危険物の貯蔵又は取扱いの技術上の基準です。危険物取扱者は保安の確保に細心の注意を払います。","source":"法令2.pdf p.10","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-017","subject":"法令","category":"危険物取扱者の立会い","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等における危険物取り扱い時の危険物取扱者の立会いについて、次のうち正しいものはどれか。","options":["危険物施設保安員が危険物を取り扱う場合は、すべて立会いを必要としない。","乙種危険物取扱者が取り扱うことができる危険物以外の危険物を取り扱う場合は、甲種又は当該危険物を取り扱うことができる乙種危険物取扱者の立会いが必要である。","危険物取扱者以外の従業員が危険物を取り扱う場合は、所有者の指示があれば、立会いを必要としない。","丙種危険物取扱者は、取り扱うことができる危険物の取扱作業についてのみ立ち会うことができる。","危険物取扱作業に立ち会うことができる危険物取扱者は、6か月以上の実務経験が必要である。"],"correct":[1],"explanation":"乙種が取り扱える危険物以外を扱う場合は、甲種又は当該危険物を扱える乙種危険物取扱者の立会いが必要です。丙種は立会いができません。","source":"法令2.pdf p.10-11","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-018","subject":"法令","category":"危険物取扱者","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物取扱者について、次のうち誤っているものはどれか。","options":["危険物取扱者とは、危険物取扱者試験に合格し、免状の交付を受けている者をいう。","危険物の取扱作業に従事するときは、貯蔵または取扱いの技術上の基準を遵守するとともに、当該危険物の保安の確保について細心の注意を払わなければならない。","丙種危険物取扱者は、危険物保安監督者になることができない。","甲種危険物取扱者又は乙種危険物取扱者は、危険物の取扱作業の立会いをする場合は、取扱作業に従事する者が危険物の貯蔵又は取扱いの技術上の基準を遵守するように監督しなければならない。","危険物取扱者であれば、危険物取扱者以外の者による危険物の取扱作業に立ち会うことができる。"],"correct":[4],"explanation":"立会いができるのは甲種又は乙種危険物取扱者です。丙種危険物取扱者は、他者の危険物取扱作業に立ち会うことはできません。","source":"法令2.pdf p.11-12","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-019","subject":"法令","category":"丙種の取扱対象","difficulty":"2","type":"定められていないものを選べ","question":"製造所等において、丙種危険物取扱者が取り扱うことができる危険物として、規則に定められていないものはどれか。","options":["重油","第3石油類の潤滑油","固形アルコール","第3石油類のうち、引火点が130℃以上のもの","第4石油類のすべて"],"correct":[2],"explanation":"固形アルコールは、丙種危険物取扱者が取り扱うことができる危険物として定められていません。","source":"法令2.pdf p.12-13","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-020","subject":"法令","category":"危険物取扱者以外の取扱い","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物取扱者以外の者が行う危険物の取り扱いについて、次のうち誤っているものはどれか。","options":["製造所等では、甲種危険物取扱者が立ち会えば、すべての危険物を取り扱うことができる。","製造所等では、第1類の免状を有する危険物取扱者が立会いをしても、第2類の危険物を取り扱うことはできない。","製造所等では、丙種危険物取扱者が立会いをしても、危険物を取り扱うことはできない。","製造所等以外の場所では、危険物取扱者の立会いがなくても、指定数量未満の危険物であれば市町村条例に基づいて取り扱うことができる。","製造所等では、危険物取扱者の立会いがなくても、指定数量未満の危険物であれば取り扱いができる。"],"correct":[4],"explanation":"製造所等では、指定数量未満であっても、危険物取扱者以外の者が取り扱う場合は甲種又は乙種の立会いが必要です。","source":"法令2.pdf p.12-13","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-021","subject":"法令","category":"危険物取扱者","difficulty":"2","type":"正しいものを選べ","question":"法令上、危険物取扱者に関する記述について、次のうち正しいものはどれか。","options":["給油取扱所において、乙種危険物取扱者が急用で不在となったため、業務内容に詳しい丙種危険物取扱者が立会い、免状を有していない従業員に給油を行わせた。","重油を貯蔵する屋外タンク貯蔵所において、危険物保安監督者が退職したので、丙種危険物取扱者を危険物保安監督者として選任した。","移動タンク貯蔵所に丙種危険物取扱者を乗車させて、エタノールの移送を行った。","屋内貯蔵所で貯蔵する危険物をガソリンからアセトンに変更したが、法別表第1の品名が同じのため、従前のまま丙種危険物取扱者が危険物の取り扱いを行った。","一般取扱所で、丙種危険物取扱者が灯油を容器に詰め替えた。"],"correct":[4],"explanation":"灯油は丙種危険物取扱者が取り扱うことができる危険物に含まれます。丙種は立会い不可、保安監督者不可、エタノールやアセトンは取扱対象外です。","source":"法令2.pdf p.13","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-022","subject":"法令","category":"免状の交付・書換・再交付","difficulty":"2","type":"誤っているものを選べ","question":"法令上、免状の交付、書換え又は再交付の手続きについて、次のうち誤っているものはどれか。","options":["危険物取扱者試験に合格したので、試験を行った都道府県知事に免状の交付を申請した。","免状を亡失したので、以前免状の書換えをした都道府県知事に免状の再交付を申請した。","本籍地は変わらないが居住地が変わったので新たに居住地を管轄する都道府県知事に免状の書換えを申請した。","氏名が変わったので、勤務地を管轄する都道府県知事に免状の書換えを申請した。","亡失により免状の再交付を受けたが、亡失した免状を発見したので、再交付を受けた都道府県知事に亡失した免状を提出した。"],"correct":[2],"explanation":"居住地の変更だけでは免状の書換えは不要です。書換えが必要なのは氏名、本籍地の属する都道府県、写真などです。","source":"法令2.pdf p.14","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-023","subject":"法令","category":"免状の再交付","difficulty":"2","type":"誤っているものを選べ","question":"法令上、免状を亡失・滅失・汚損・破損した場合の再交付の申請について、次のうち誤っているものはどれか。","options":["当該免状を交付した都道府県知事に申請することができる。","当該免状の書換えをした都道府県知事に申請することができる。","居住地を管轄する都道府県知事に申請することができる。","汚損または破損により免状の再交付を申請する場合は、当該免状を添えて申請しなければならない。","免状を亡失してその再交付を受けた者は、亡失した免状を発見した場合は、これを10日以内に免状の再交付を受けた都道府県知事に提出しなければならない。"],"correct":[2],"explanation":"再交付の申請先は、交付した都道府県知事又は書換えをした都道府県知事です。居住地を管轄する都道府県知事ではありません。","source":"法令2.pdf p.14","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-024","subject":"法令","category":"免状の記載事項","difficulty":"2","type":"定められていないものを選べ","question":"法令上、免状の記載事項として定められていないものは、次のうちどれか。","options":["氏名及び生年月日","過去10年以内に撮影した写真","居住地の属する都道府県","免状の交付年月日及び交付番号","免状の種類"],"correct":[2],"explanation":"免状には本籍地の属する都道府県は記載されますが、居住地の属する都道府県は記載事項ではありません。","source":"法令2.pdf p.15","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-025","subject":"法令","category":"免状の返納命令","difficulty":"2","type":"正しいものを選べ","question":"法令上、免状の返納を命じることができるのは、次のうちどれか。","options":["消防長","都道府県知事","消防庁長官","消防署長","市町村長"],"correct":[1],"explanation":"危険物取扱者が法令違反等をした場合、免状の返納を命じることができるのは都道府県知事です。","source":"法令2.pdf p.15","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-026","subject":"法令","category":"免状","difficulty":"2","type":"正しいものを選べ","question":"法令上、危険物取扱者の免状に関する記述について、次のうち正しいものはどれか。","options":["危険物取扱者が法又は法に基づく命令の規定に違反しているときは、所轄消防署長から免状の返納を命ぜられることがある。","免状を汚損したとき、再交付の申請をすることができる。","居住地を変更したとき、免状の書換えをしなければならない。","免状の返納を命じられた者は、その日から起算して2年を経過しないと免状の交付を受けることができない。","再交付は、居住地又は勤務地を管轄する都道府県知事に申請しなければならない。"],"correct":[1],"explanation":"免状を汚損したときは再交付申請ができます。返納命令は都道府県知事、交付制限は1年、居住地変更だけでは書換え不要です。","source":"法令2.pdf p.15-16","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-027","subject":"法令","category":"免状の申請先","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、危険物取扱者免状の書換え及び再交付の申請先について、次のうち正しい組合せはどれか。","options":["書換え：居住地を管轄する知事｜再交付：交付した知事又は居住地若しくは勤務地を管轄する知事","書換え：交付した知事又は勤務地を管轄する知事｜再交付：交付した知事若しくは書換えした知事又は居住地を管轄する知事","書換え：居住地又は勤務地を管轄する知事｜再交付：交付した知事又は居住地を管轄する知事","書換え：交付した知事又は居住地を管轄する知事｜再交付：居住地又は勤務地を管轄する知事","書換え：交付した知事又は居住地若しくは勤務地を管轄する知事｜再交付：交付した知事又は書換えした知事"],"correct":[4],"explanation":"書換えは、交付した知事・居住地を管轄する知事・勤務地を管轄する知事に申請できます。再交付は、交付した知事又は書換えした知事に申請します。","source":"法令2.pdf p.16","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-028","subject":"法令","category":"免状の書換え","difficulty":"2","type":"誤っているものをすべて選べ","question":"法令上、免状の書換えについて、次のA〜Eのうち誤っているもののみをすべて掲げているものはどれか。\n\nA. 保安に関する講習を受けたとき。\nB. 現住所を変更したとき。\nC. 氏名が変わったとき。\nD. 免状の写真が撮影から10年を超えたとき。\nE. 本籍地の属する都道府県が変更したとき。","options":["AとB","AとE","BとC","CとD","DとE"],"correct":[0],"explanation":"書換えが必要なのは、氏名変更、本籍地の属する都道府県変更、写真が撮影から10年を超えたときなどです。講習受講と現住所変更は書換え事由ではありません。","source":"法令2.pdf p.17","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law2-029","subject":"法令","category":"免状の不交付","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、免状の交付について、次の文の（　）内のA〜Cに当てはまる語句の組み合わせとして、正しいものはどれか。\n\n「法令に違反して（A）から免状の返納を命じられた者は、（B）から起算して（C）が経過しないと免状の交付を受けることができない。」","options":["A：市町村長　B：返納を命ぜられた日　C：2年","A：市町村長　B：返納した日　C：2年","A：都道府県知事　B：返納を命ぜられた日　C：1年","A：都道府県知事　B：返納を命ぜられた日　C：2年","A：都道府県知事　B：返納した日　C：1年"],"correct":[2],"explanation":"免状の返納命令は都道府県知事が行います。返納を命ぜられた日から起算して1年を経過しない者には、免状の交付が制限されます。","source":"法令2.pdf p.17","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-001","subject":"法令","category":"危険物取扱者","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物取扱者について、次のうち誤っているものはどれか。","options":["危険物取扱者でなければ、危険物保安統括管理者になることはできない。","危険物取扱者でなくても、危険物施設保安員になることができる。","丙種危険物取扱者は、危険物取扱者以外の者による危険物の取扱作業に立ち会うことはできない。","移動タンク貯蔵所で危険物を移送する場合、移送者として危険物取扱者が乗車していれば、運転する者は危険物取扱者でなくてもよい。","甲種危険物取扱者は、すべての危険物を取り扱うことができる。"],"correct":[0],"explanation":"危険物保安統括管理者は、必ずしも危険物取扱者である必要はありません。","source":"法令3.pdf p.1","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-002","subject":"法令","category":"危険物保安統括管理者","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次のA〜Dの危険物保安統括管理者に関する記述のうち、正しいもののみをすべて掲げているものはどれか。\n\nA. 危険物保安統括管理者は、免状の交付を受けていなくても、製造所等において、危険物取扱者の立会いなしに危険物を取り扱うことができる。\nB. 危険物施設保安員が50人を超える事業所にあっては、危険物保安統括管理者を選任しなければならない。\nC. 危険物保安統括管理者を定めなければならない製造所等において、危険物保安統括管理者を定めていない場合は、市町村長等から施設の使用停止命令を受けることがある。\nD. 危険物保安統括管理者は、事業所においてその事業の実施を統括管理する者をもって充てなければならない。","options":["A","A、B","C、D","A、C、D","B、C、D"],"correct":[2],"explanation":"Aは免状なしで立会いなしに危険物を取り扱えるという内容が誤りです。Bも危険物施設保安員の人数で選任義務が決まるわけではありません。C、Dが正しいです。","source":"法令3.pdf p.1","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-003","subject":"法令","category":"危険物保安統括管理者","difficulty":"2","type":"正しいものを選べ","question":"法令上、一定数量以上の第4類の危険物を貯蔵し、又は取り扱う製造所等で、危険物保安統括管理者を選任しなければならない旨の規定が設けられているものは、次のうちどれか。","options":["製造所","給油取扱所","屋外タンク貯蔵所","第二種販売取扱所","屋内貯蔵所"],"correct":[0],"explanation":"一定数量以上の第4類危険物を扱う製造所等では、危険物保安統括管理者の選任義務が設けられる場合があります。この選択肢では製造所が該当します。","source":"法令3.pdf p.1","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-004","subject":"法令","category":"保安員・保安監督者・統括管理者","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物施設保安員、危険物保安監督者及び危険物保安統括管理者の選任について、次のうち誤っているものはどれか。","options":["危険物施設保安員は、危険物取扱者でなくてもよい。","危険物保安監督者は、甲種危険物取扱者又は乙種危険物取扱者でなければならない。","危険物保安統括管理者は、危険物取扱者でなくてもよい。","危険物保安監督者は、製造所等において、6か月以上の危険物取扱いの実務経験が必要である。","危険物施設保安員は、製造所等において、6か月以上の危険物取扱いの実務経験が必要である。"],"correct":[4],"explanation":"危険物施設保安員は、危険物取扱者である必要も、6か月以上の危険物取扱い実務経験がある必要もありません。","source":"法令3.pdf p.2","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-005","subject":"法令","category":"危険物施設保安員","difficulty":"2","type":"正しいものを選べ","question":"法令上、危険物施設保安員について、次のうち正しいものはどれか。","options":["指定数量の倍数が100の屋内貯蔵所には、危険物施設保安員を定めなければならない。","危険物施設保安員は、甲種又は乙種危険物取扱者でなければならない。","製造所等の所有者は、危険物施設保安員を定めたときは、遅滞なくその旨を市町村長等に届け出なければならない。","危険物施設保安員は、製造所等の構造及び設備に係る保安のための業務を行う。","危険物施設保安員は、危険物保安監督者が旅行、疾病その他の事故によってその業務を行うことができない場合にその業務を代行しなければならない。"],"correct":[3],"explanation":"危険物施設保安員は、製造所等の構造及び設備に係る保安のための業務を行います。","source":"法令3.pdf p.2","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-006","subject":"法令","category":"危険物施設保安員","difficulty":"2","type":"正しいものを選べ","question":"法令上、一定数量以上の危険物を貯蔵し、又は取り扱うようになると危険物施設保安員を選任しなければならない旨の規定が設けられている製造所等は、次のうちどれか。","options":["製造所","屋内貯蔵所","給油取扱所","第二種販売取扱所","屋外タンク貯蔵所"],"correct":[0],"explanation":"危険物施設保安員の選任義務は、指定数量の倍数が一定以上の製造所や一般取扱所、移送取扱所などに設けられます。この選択肢では製造所が該当します。","source":"法令3.pdf p.2","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-007","subject":"法令","category":"危険物施設保安員の業務","difficulty":"2","type":"2つ選べ","question":"危険物施設保安員に関する記述について、法令上、定められていないものを次から2つ答えなさい。","options":["危険物施設保安員は、製造所等の計測装置、制御装置、安全装置等の機能が適正に保持されるようにこれを保安管理しなければならない。","危険物施設保安員は、危険物の取扱作業にあたり、危険物取扱者に対して必要な指示を与えなければならない。","製造所等の所有者等は、危険物取扱者以外の者から危険物施設保安員を選任することができる。","危険物施設保安員は、施設の異常を発見したときは、危険物保安監督者その他関係のある者に連絡するとともに、状況を判断して適当な措置を講ずること。","危険物施設保安員は、火災が発生したとき又は火災発生の危険が著しいときは、危険物保安監督者と協力して、応急措置を講じなければならない。","危険物施設保安員は、定期及び臨時の点検を行ったときは、記録し、保存しなければならない。また、3年に1回は所轄消防長又は消防署長に報告をしなければならない。"],"correct":[1,5],"explanation":"危険物取扱者に対して必要な指示を与えるという形では定められていません。また、点検記録を3年に1回所轄消防長又は消防署長へ報告するという規定もありません。","source":"法令3.pdf p.3","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-008","subject":"法令","category":"予防規程","difficulty":"2","type":"正しいものを選べ","question":"法令上、予防規程に関する記述について、次のうち正しいものはどれか。","options":["製造所等の危険物保安監督者は、予防規程を定めなければならない。","危険物取扱者が不在時の危険物の取り扱いについて、予防規程に定めなければならない。","予防規程を定めたときは、遅滞なく市町村長等に届け出なければならない。","製造所等の所有者等のほか、その従業者も予防規程を守らなければならない。","火災の予防のため必要とされる場合、所轄消防署長から予防規程の変更を命ぜられることがある。"],"correct":[3],"explanation":"予防規程は所有者等だけでなく、その従業者も守らなければなりません。予防規程は届出ではなく、市町村長等の認可が必要です。","source":"法令3.pdf p.4","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-009","subject":"法令","category":"予防規程対象施設","difficulty":"2","type":"正しいものを選べ","question":"法令上、予防規程を定めなければならない製造所等として、定められているものは次のうちどれか。ただし、鉱山保安法による保安規程又は火薬類取締法による危害予防規程を定めているものを除く。","options":["指定数量の倍数が100の屋内貯蔵所","指定数量の倍数が100の屋外貯蔵所","指定数量の倍数が100の屋外タンク貯蔵所","指定数量の倍数が5の製造所","屋外の自家用の給油取扱所"],"correct":[1],"explanation":"屋外貯蔵所は、指定数量の倍数が100以上の場合、予防規程を定めなければなりません。","source":"法令3.pdf p.4","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-010","subject":"法令","category":"予防規程対象施設","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次のA〜Eに掲げる製造所等のうち、指定数量の倍数により予防規程を定めなければならないものの組み合わせはどれか。\n\nA. 製造所\nB. 地下タンク貯蔵所\nC. 移動タンク貯蔵所\nD. 販売取扱所\nE. 屋外タンク貯蔵所","options":["AとB","BとC","CとD","DとE","AとE"],"correct":[4],"explanation":"製造所と屋外タンク貯蔵所は、指定数量の倍数により予防規程の作成義務が生じます。","source":"法令3.pdf p.4","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-011","subject":"法令","category":"予防規程対象施設","difficulty":"2","type":"正しいものを選べ","question":"法令上、危険物の品名及び数量にかかわらず予防規程を定めなければならない製造所等は、次のうちどれか。","options":["一般取扱所","屋内貯蔵所","屋外貯蔵所","移動タンク貯蔵所","屋外タンク貯蔵所","地下タンク貯蔵所","移送取扱所"],"correct":[6],"explanation":"移送取扱所は、危険物の品名及び数量にかかわらず予防規程を定めなければならない製造所等に該当します。","source":"法令3.pdf p.5-6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-012","subject":"法令","category":"予防規程","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所等において定めなければならない予防規程について、次のうち誤っているものはどれか。","options":["予防規程を定める場合及び変更する場合は、市町村長等の認可を受けなければならない。","予防規程は、当該製造所等の危険物保安監督者が作成し、認可を受けなければならない。","予防規程に関して、火災予防のため必要があるときは、市町村長等から変更を命ぜられることがある。","予防規程には、地震発生時における施設及び設備に対する点検、応急措置等に関することを定めなければならない。","予防規程には、災害その他の非常の場合に取るべき措置に関することを定めなければならない。"],"correct":[1],"explanation":"予防規程を定めるのは危険物保安監督者ではなく、製造所等の所有者、管理者又は占有者です。","source":"法令3.pdf p.5-6","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-013","subject":"法令","category":"予防規程","difficulty":"2","type":"誤っているものを選べ","question":"法令上、予防規程について、次のうち誤っているものはどれか。","options":["予防規程を定めたときは、市町村長等の認可を受けなければならない。","予防規程を定めなければならない製造所等において、これを定めずに危険物を貯蔵し、又は取り扱った場合は、罰せられることがある。","予防規程は、指定数量の倍数が100以上の製造所等において定めなければならない。","予防規程を変更したときは、市町村長等の認可を受けなければならない。","予防規程は、製造所等の火災予防のために所有者等が定める保安基準で、自主的な意義を有する。"],"correct":[2],"explanation":"予防規程の作成義務は、指定数量の倍数100以上だけで一律に決まるものではありません。製造所は10以上、屋外貯蔵所は100以上など、施設区分ごとに条件が異なります。","source":"法令3.pdf p.6-7","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-014","subject":"法令","category":"予防規程・セルフ給油","difficulty":"2","type":"正しいものを選べ","question":"法令上、営業用給油取扱所の予防規程のうち、顧客に自ら給油等をさせる給油取扱所のみが定めなければならない事項は、次のうちどれか。","options":["顧客に対する従業員の接遇教育に関すること。","顧客の車両に対する誘導に関すること。","顧客に対する価格の表示に関すること。","顧客に対する監視その他保安のための措置に関すること。","顧客の車両に対する点検、検査に関すること。"],"correct":[3],"explanation":"セルフ式給油取扱所では、顧客に対する監視その他保安のための措置に関する事項を予防規程に定めます。","source":"法令3.pdf p.8","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-015","subject":"法令","category":"予防規程","difficulty":"2","type":"該当しないものを選べ","question":"法令上、予防規程に定めなければならない事項に該当しないものは、次のうちどれか。","options":["危険物施設の運転又は操作に関すること。","危険物の取扱作業の基準に関すること。","補修等の方法に関すること。","地震発生時における施設及び設備に対する点検、応急措置等に関すること。","製造所等において火災が発生した場合、当該施設が火災及び消火で受けた損害調査に関すること。"],"correct":[4],"explanation":"損害調査に関する事項は、予防規程に定めなければならない事項ではありません。","source":"法令3.pdf p.8","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-016","subject":"法令","category":"予防規程","difficulty":"2","type":"該当しないものを選べ","question":"法令上、予防規程に定めなければならない事項として、該当しないものは次のうちどれか。","options":["危険物の在庫の管理と発注に関すること。","危険物の保安に関する業務を管理する者の職務及び組織に関すること。","危険物の取扱作業の基準に関すること。","災害その他の非常の場合に取るべき措置に関すること。","危険物の保安に係る作業に従事する者に対する保安教育に関すること。"],"correct":[0],"explanation":"在庫管理や発注に関することは、予防規程に定めなければならない事項ではありません。","source":"法令3.pdf p.8","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-017","subject":"法令","category":"維持命令","difficulty":"2","type":"誤っている箇所を選べ","question":"法令上、次の下線部分A〜Dのうち、誤っているもののみをすべて掲げているものはどれか。\n\n「製造所等の（A）所有者等は、製造所等の位置、構造及び設備が技術上の基準に適合するように維持しなければならない。（B）市町村長等は、製造所等の位置、構造及び設備が技術上の基準に適合していないと認めるときは、製造所等の（C）危険物取扱者免状を有する者に対し、技術上の基準に適合するように、これらを（D）修理し、改造し、又は移転すべきことを命ずることができる。」","options":["A","B","C","A、B","B、D"],"correct":[2],"explanation":"命令の対象は危険物取扱者免状を有する者ではなく、所有者、管理者又は占有者で権原を有する者です。","source":"法令3.pdf p.9","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-018","subject":"法令","category":"維持命令","difficulty":"2","type":"正しいものを選べ","question":"消防法に定める、製造所等の位置、構造及び設備の技術上の基準について、次の文の（　）内に当てはまる語句として、正しいものはどれか。\n\n「市町村長等は、製造所、貯蔵所又は取扱所の位置、構造及び設備が第10条第4項の技術上の基準に適合していないと認めるときは、製造所、貯蔵所又は取扱所の（　）に対し、同項の技術上の基準に適合するように、これらを修理し、改造し、又は移転すべきことを命ずることができる。」","options":["危険物保安監督者","所有者、管理者又は占有者で権原を有する者","危険物保安統括管理者","危険物施設保安員","危険物取扱者"],"correct":[1],"explanation":"技術上の基準に適合するよう命令できる相手は、所有者、管理者又は占有者で権原を有する者です。","source":"法令3.pdf p.9-10","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-019","subject":"法令","category":"共通義務","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の区分及び貯蔵し、又は取り扱う危険物の品名、数量に関係なく、すべての製造所等の所有者等に共通して義務付けられているものは、次のうちどれか。","options":["製造所等に危険物保安監督者を定めなければならない。","製造所等に自衛消防組織を置かなければならない。","製造所等の位置、構造及び設備を技術上の基準に適合するよう維持しなければならない。","製造所等の火災を予防するため、予防規程を定めなければならない。","製造所等に危険物施設保安員を定めなければならない。"],"correct":[2],"explanation":"すべての製造所等に共通する義務は、位置、構造及び設備を技術上の基準に適合するよう維持することです。","source":"法令3.pdf p.10","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-020","subject":"法令","category":"定期点検対象","difficulty":"2","type":"正しいものを選べ","question":"法令上、定期点検が義務づけられている製造所等は、次のうちどれか。","options":["地下タンクを有する製造所","すべての屋外タンク貯蔵所","すべての屋外貯蔵所","簡易タンクのみを有する給油取扱所","すべての屋内タンク貯蔵所"],"correct":[0],"explanation":"地下タンクを有する製造所は、定期点検の対象です。","source":"法令3.pdf p.11","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-021","subject":"法令","category":"定期点検対象","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、次のA〜Eの製造所等のうち、定期点検を行わなければならないもののみを掲げているものはどれか。\n\nA. 指定数量の倍数が10以上の製造所\nB. 屋内タンク貯蔵所\nC. 移動タンク貯蔵所\nD. 地下タンクを有する給油取扱所\nE. 簡易タンク貯蔵所","options":["A、B、E","A、C、D","A、D、E","B、C、D","B、C、E"],"correct":[1],"explanation":"定期点検の対象として、指定数量の倍数が10以上の製造所、移動タンク貯蔵所、地下タンクを有する給油取扱所などがあります。","source":"法令3.pdf p.11","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-022","subject":"法令","category":"定期点検","difficulty":"2","type":"正しいものを選べ","question":"法令上、定期点検に関する説明として、次のうち正しいものはどれか。","options":["点検記録に記載しなければならない事項には、点検した製造所の名称、点検の方法及び結果、点検年月日がある。","危険物施設保安員は、定期点検を行うことができない。","定期点検は、3年に1回以上行わなければならない。","屋内タンク貯蔵所は、定期点検を行わなければならない。","簡易タンク貯蔵所は、定期点検を行わなければならない。"],"correct":[0],"explanation":"定期点検記録には、点検した製造所等の名称、点検の方法及び結果、点検年月日などを記載します。","source":"法令3.pdf p.12","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-023","subject":"法令","category":"定期点検","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所等の定期点検に関する記述について、次のうち誤っているものはどれか。ただし、規則で定める漏れの点検及び固定式の泡消火設備に関する点検を除く。","options":["定期点検は、製造所等の位置、構造及び設備が法に定める技術上の基準に適合しているかどうかについて行うものである。","丙種危険物取扱者は、定期点検を行うことができる。","点検記録の保存期間は、移動貯蔵タンク等の漏れの点検等を除き、3年間である。","地下タンクを有する給油取扱所については、定期点検を行わなければならない。","免状の交付を受けていない危険物施設保安員は、定期点検を行うことができない。"],"correct":[4],"explanation":"危険物施設保安員は、危険物取扱者の免状がなくても定期点検を行うことができます。","source":"法令3.pdf p.12","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-024","subject":"法令","category":"定期点検","difficulty":"2","type":"適切でないものを選べ","question":"法令上、定期点検の実施者として、次のうち適切でないものはどれか。ただし、規則で定める漏れの点検及び固定式の泡消火設備に関する点検を除く。","options":["免状の交付を受けていない当該製造所等の危険物施設保安員","免状の交付を受けていない当該製造所等の所有者","甲種危険物取扱者の立会いを受けた、免状の交付を受けていない者","当該製造所等の危険物を取り扱うことができる乙種危険物取扱者の立会いを受けた、免状の交付を受けていない者","当該製造所等の危険物を取り扱うことができる丙種危険物取扱者の立会いを受けた、免状の交付を受けていない者"],"correct":[1],"explanation":"免状のない所有者だからといって、当然に定期点検の実施者になれるわけではありません。危険物取扱者、危険物施設保安員、又は危険物取扱者の立会いを受けた者などが実施できます。","source":"法令3.pdf p.13","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-025","subject":"法令","category":"定期点検","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の定期点検について、次のうち正しいものはどれか。ただし、規則で定める漏れの点検及び固定式の泡消火設備に関する点検を除く。","options":["定期点検を行うことができる者は、危険物取扱者のみである。","定期点検は、製造所等における危険物の貯蔵または取扱いが技術上の基準に適合しているかどうかについて行う。","定期点検を行わなければならない製造所等の所有者等は、当該製造所等について定期に点検し、その点検記録を作成し、これを保存しなければならない。","製造所、屋内貯蔵所、屋外タンク貯蔵所、屋外貯蔵所及び一般取扱所については、指定数量の倍数にかかわらず、定期点検を行わなければならない。","移動タンク貯蔵所については、定期点検を行わなくてもよい。"],"correct":[2],"explanation":"定期点検が必要な製造所等の所有者等は、定期に点検し、点検記録を作成・保存しなければなりません。","source":"法令3.pdf p.13","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-026","subject":"法令","category":"定期点検","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所等の定期点検について、次のうち誤っているものはどれか。ただし、規則で定める漏れの点検及び固定式の泡消火設備に関する点検を除く。","options":["当該製造所等において危険物を取り扱うことができる丙種危険物取扱者は、この点検を行うことができない。","製造所等の所有者等は、当該製造所等について定期に点検し、その点検記録を作成し、これを一定期間保存しなければならない。","この点検は、製造所等の位置、構造及び設備が技術上の基準に適合しているかどうかについて行う。","危険物施設保安員は、この点検を行うことができる。","当該製造所等において危険物を取り扱うことができる乙種危険物取扱者は、この点検を行うことができる。"],"correct":[0],"explanation":"丙種危険物取扱者であっても、当該製造所等で取り扱うことができる危険物については定期点検を行うことができます。","source":"法令3.pdf p.14","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-027","subject":"法令","category":"移動貯蔵タンクの漏れ点検","difficulty":"2","type":"誤っているものを選べ","question":"法令上、規則で定められた移動貯蔵タンクの漏れの点検について、次のうち誤っているものはどれか。","options":["漏れ点検の時期は、設置の完成検査済証の交付を受けた日または前回の漏れ点検を行った日から5年を経過する日の属する月の末日までの間に1回以上実施する。","点検記録の保存期間は10年間である。","危険物取扱者の立会いがあれば、点検の方法に関する知識及び技能を有していない者でも、漏れ点検を実施することができる。","災害その他非常事態が生じ、定期点検を行うことが困難と認められるときは、市町村長等が点検を行うべき期限を別に定めることができる。","点検記録には、点検をした製造所等の名称、点検の方法及び結果、点検年月日、点検を行った者の氏名を記載する。"],"correct":[2],"explanation":"漏れ点検は、点検の方法に関する知識及び技能を有する者が行う必要があります。危険物取扱者の立会いがあれば誰でもよいわけではありません。","source":"法令3.pdf p.14-15","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-028","subject":"法令","category":"地下貯蔵タンクの漏れ点検","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、製造所等において規則で定める地下貯蔵タンクの漏れの点検について、次のA〜Dのうち正しいもののみを掲げているものはどれか。\n\nA. 危険物取扱者又は危険物施設保安員で、漏れの点検方法に関する知識及び技能を有する者は、点検を行うことができる。\nB. 点検は、タンク容量が10,000L以上のものについて行わなければならない。\nC. 点検記録は、製造所等の名称、点検年月日、点検方法、結果及び実施者等を記載しなければならない。\nD. 点検結果は、市町村長等に報告しなければならない。","options":["AとB","AとC","BとC","BとD","CとD"],"correct":[1],"explanation":"AとCが正しいです。地下貯蔵タンクの漏れ点検は、点検方法に関する知識及び技能を有する者が行い、点検記録を作成・保存します。","source":"法令3.pdf p.15","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-029","subject":"法令","category":"保安検査","difficulty":"2","type":"正しいものを選べ","question":"法令上、市町村長等が行う保安に関する検査の対象となる製造所等として、次のうち正しいものはどれか。","options":["貯蔵する液体の危険物の最大数量が100kLの屋外タンク貯蔵所","危険物を移送するための配管の延長が20kmの移送取扱所","指定数量の倍数が100の製造所","指定数量の倍数が100の屋外貯蔵所","指定数量の倍数が3000の一般取扱所"],"correct":[1],"explanation":"配管の延長が一定以上の移送取扱所は、保安検査の対象となります。","source":"法令3.pdf p.16","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-030","subject":"法令","category":"保安検査","difficulty":"2","type":"正しいものを選べ","question":"法令上、市町村長等が行う保安に関する検査の対象となる製造所等として、次のうち正しいものはどれか。","options":["すべての移動タンク貯蔵所","貯蔵する液体の危険物の最大数量が10,000kL以上の特定屋外タンク貯蔵所","指定数量の倍数が100以上の製造所","指定数量の倍数が100以上の屋外貯蔵所","すべての移送取扱所"],"correct":[1],"explanation":"液体危険物を大量に貯蔵する特定屋外タンク貯蔵所は、保安検査の対象となります。","source":"法令3.pdf p.16","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-031","subject":"法令","category":"保安検査","difficulty":"2","type":"対象とならない組み合わせを選べ","question":"法令上、市町村長等が行う保安に関する検査の対象とならない製造所等の組み合わせは次のうちどれか。\n\nA. 指定数量の倍数が100の製造所\nB. 危険物を移送するための配管の延長が20kmの移送取扱所\nC. 指定数量の倍数が100の屋外貯蔵所\nD. 指定数量の倍数が3,000の一般取扱所\nE. 貯蔵する液体の危険物の最大数量が10,000kLの屋外タンク貯蔵所","options":["A、B、C","A、C、D","A、D、E","B、C、E","C、D、E"],"correct":[1],"explanation":"保安検査の対象となるのは、一定規模以上の特定屋外タンク貯蔵所や一定の移送取扱所などです。A、C、Dは対象外です。","source":"法令3.pdf p.16","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law3-032","subject":"法令","category":"保安距離","difficulty":"2","type":"適合していないものを選べ","question":"法令上、製造所等の位置は、学校、病院等の建築物等から、当該製造所等の外壁又はこれに相当する工作物の外側までの間に、それぞれ定められた距離（保安距離）を保たなければならないが、その距離として、次のうち法令に適合していないものはどれか。ただし、当該建築物等との間に防火上有効な塀はないものとし、特例基準が適用されるものを除く。","options":["製造所の存する敷地の外にある住居から10m","中学校から20m","重要文化財に指定された建造物から60m","高圧ガス保安法により都道府県知事の許可を受けた貯蔵所から30m","病院から40m"],"correct":[1],"explanation":"学校、病院、劇場等からは30m以上の保安距離が必要です。中学校から20mでは不足します。","source":"法令3.pdf p.17","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-033","subject":"法令","category":"保安距離","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の中には、特定の建築物等から一定の距離（保安距離）を保たなければならないものがあるが、その建築物等として次のうち正しいものはどれか。","options":["大学、短期大学","病院","使用電圧が7,000Vの特別高圧埋設電線","重要文化財である絵画を保管する倉庫","製造所等の存する敷地と同一の敷地内に存する住居"],"correct":[1],"explanation":"病院は保安距離を保つべき建築物等に該当します。大学・短期大学、埋設電線、重要文化財である絵画を保管する倉庫、同一敷地内の住居は、この問題の選択肢では該当しません。","source":"法令3.pdf p.17","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-034","subject":"法令","category":"保安距離","difficulty":"2","type":"正しいものを選べ","question":"法令上、学校、病院等の建築物等から、当該製造所の外壁又はこれに相当する工作物の外側までの間に、それぞれ定められた距離（保安距離）を保たなければならない製造所等と建築物等の組み合わせとして、次のうち正しいものはどれか。ただし、当該建築物等との間に防火上有効な塀はないものとし、特例基準が適用されるものを除く。","options":["屋内タンク貯蔵所｜使用電圧66,000Vの特別高圧架空電線","給油取扱所｜重要文化財として指定された建造物","屋外貯蔵所｜屋外貯蔵所の存する敷地内にある住居","一般取扱所｜幼稚園","地下タンク貯蔵所｜高圧ガス保安法により都道府県知事の許可を受けた貯蔵所"],"correct":[3],"explanation":"一般取扱所は保安距離が必要な製造所等に含まれ、幼稚園等の学校・病院・劇場等は保安距離の対象となります。","source":"法令3.pdf p.18","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-035","subject":"法令","category":"保安距離対象施設","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等のうち、学校及び病院等の建築物等から一定の距離（保安距離）を保たなければならない旨の規定が設けられていない施設は、次のうちどれか。ただし、防火上有効な塀等はないものとし、特例基準が適用されるものを除く。","options":["給油取扱所","一般取扱所","屋外タンク貯蔵所","屋外貯蔵所","製造所"],"correct":[0],"explanation":"給油取扱所は、この保安距離の規定が設けられていない施設です。","source":"法令3.pdf p.19","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-036","subject":"法令","category":"保安距離対象物","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、特定の建築物等から一定の距離（保安距離）を保たなければならない製造所等があるが、次のA〜Eのうち、その建築物等に該当するもののみをすべて掲げているものはどれか。\n\nA. 重要文化財を保管する倉庫\nB. 22,000Vの特別高圧架空電線\nC. 大学\nD. 病院\nE. 収容人員300人の劇場","options":["A、B","C、D","A、C、E","B、D、E","A、B、C、E"],"correct":[3],"explanation":"22,000Vの特別高圧架空電線、病院、劇場は保安距離の対象となる建築物等です。重要文化財を保管する倉庫や大学は、この問題では対象外です。","source":"法令3.pdf p.19-20","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-037","subject":"法令","category":"保安距離対象施設","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等の外壁又はこれに相当する工作物の外側から、学校、病院等の建築物等までの間に、それぞれ定められた距離（保安距離）を保たなければならない製造所等は、次のうちどれか。ただし、当該建築物等との間に防火上有効な塀はないものとする。","options":["1,000kL以上の液体の危険物を貯蔵する屋外タンク貯蔵所","メタノール等を取り扱う屋外給油取扱所","引火点が40℃以上の第4類の危険物のみを貯蔵し、又は取り扱うもので、タンク専用室を平家建以外の建築物に設ける屋内タンク貯蔵所","屋内貯蔵所の用に供する部分以外の部分を有する建築物に設ける指定数量の倍数が20以下の危険物を貯蔵する屋内貯蔵所","指定数量の倍数が30の危険物を取り扱う第二種販売取扱所"],"correct":[0],"explanation":"屋外タンク貯蔵所は保安距離を保たなければならない製造所等に該当します。","source":"法令3.pdf p.19-20","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-038","subject":"法令","category":"保有空地","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、危険物を取り扱う建築物等の周囲に、一定の幅の空地を保有しなければならない旨の規定が設けられている製造所等のみを掲げている組み合わせは、次のうちどれか。","options":["販売取扱所｜給油取扱所｜屋外貯蔵所","地下タンク貯蔵所｜屋内タンク貯蔵所｜製造所","屋内タンク貯蔵所｜屋内貯蔵所｜販売取扱所","一般取扱所｜屋外貯蔵所｜屋内貯蔵所","給油取扱所｜製造所｜簡易タンク貯蔵所"],"correct":[3],"explanation":"一般取扱所、屋外貯蔵所、屋内貯蔵所はいずれも、一定の幅の保有空地が必要となる施設に該当します。","source":"法令3.pdf p.21","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-039","subject":"法令","category":"保有空地","difficulty":"2","type":"正しい組み合わせを選べ","question":"法令上、製造所において、次のA〜Eの指定数量の倍数に応じて、必要な空地の幅を満たしているものの組合せはどれか。ただし、高引火点危険物のみ取り扱うもの及び規則で定める防火上有効な隔壁を設けたものを除く。\n\nA. 指定数量の倍数3｜空地の幅1m\nB. 指定数量の倍数5｜空地の幅2m\nC. 指定数量の倍数7｜空地の幅3m\nD. 指定数量の倍数11｜空地の幅3m\nE. 指定数量の倍数15｜空地の幅5m","options":["AとC","AとD","BとD","BとE","CとE"],"correct":[4],"explanation":"製造所の保有空地は、指定数量の倍数が10以下なら3m以上、10を超えると5m以上が原則です。CとEが条件を満たします。","source":"法令3.pdf p.22","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law3-040","subject":"法令","category":"保有空地","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所等において、危険物を貯蔵し、又は取り扱う建築物等の周囲に保有しなければならない空地の幅について、次のうち正しいものはどれか。","options":["屋外貯蔵所の空地の幅は、貯蔵する危険物の類に応じて定められている。","屋内貯蔵所の空地の幅は、軒高に応じて定められている。","一般取扱所の空地の幅は、取り扱う危険物の品名に応じて定められている。","製造所の空地の幅は、取り扱う危険物の指定数量の倍数に応じて定められている。","屋外タンク貯蔵所の空地の幅は、屋外貯蔵タンクの容量に応じて定められている。"],"correct":[3],"explanation":"製造所の保有空地の幅は、取り扱う危険物の指定数量の倍数に応じて定められています。","source":"法令3.pdf p.22","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-carry-law3-001","subject":"法令","category":"保有空地・ページまたぎ回収","difficulty":"2","type":"設けられていないものを選べ","question":"法令上、次に掲げる製造所等のうち、危険物を取り扱う建築物の周囲に、一定の幅の空地を保有しなければならない旨の規定が設けられていないものはどれか。","options":["屋内貯蔵所","屋内タンク貯蔵所","屋外貯蔵所","屋外タンク貯蔵所","簡易タンク貯蔵所（屋外に設けるもの）"],"correct":[1],"explanation":"屋内タンク貯蔵所には、危険物を取り扱う建築物の周囲に一定幅の空地を保有する旨の規定はありません。屋内貯蔵所・屋外貯蔵所・屋外タンク貯蔵所・屋外設置の簡易タンク貯蔵所には保有空地等の規定があります。","source":"法令4.pdf p.1（法令3からのページまたぎ）","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law4-001","subject":"法令","category":"保安距離③組み合わせ","difficulty":"2","type":"正しいものを選べ","question":"法令上、学校、病院等の建築物等から、当該製造所の外壁又はこれに相当する工作物の外側までの間に、それぞれ定められた距離（保安距離）を保たなければならない製造所等と建築物等の組み合わせとして、次のうち正しいものはどれか。","options":["屋内タンク貯蔵所　／　使用電圧66,000Vの特別高圧架空電線","給油取扱所　／　重要文化財として指定された建造物","屋外貯蔵所　／　屋外貯蔵所の存する敷地内にある住居","一般取扱所　／　幼稚園","地下タンク貯蔵所　／　高圧ガス保安法により都道府県知事の許可を受けた貯蔵所"],"correct":[3],"explanation":"保安距離が必要な施設：製造所・屋外タンク貯蔵所・屋内貯蔵所・屋外貯蔵所・一般取扱所の5種類。一般取扱所は保安距離が必要で、幼稚園は学校に含まれ保安距離の対象です。給油取扱所・地下タンク貯蔵所・屋内タンク貯蔵所には保安距離の規定はありません。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13","lawRevision":true,"revisionNote":"2026年6月30日施行の保有空地・保安距離に関する特例拡大を確認済み。問題は原則基準または問題文の除外条件に従って判定。"},{"id":"法令-law4-002","subject":"法令","category":"製造所の技術基準①誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。ただし、当該建築物等との間に防火上有効な塀は無いものとし、特例基準が適用されるものを除く。","options":["製造所の位置は、学校や病院等の建築物等から当該製造所の外壁又はこれに相当する工作物の外側までの間に、それぞれ当該建築物等について定める距離を保つこと。","危険物を取り扱う建築物その他の工作物（危険物を移送するための配管その他これに準ずる工作物を除く。）の周囲に、指定数量の倍数に応じそれぞれ定める幅の空地を保有すること。","危険物を取り扱う建築物の窓又は出入口にガラスを用いる場合は、網入りガラスとすること。","可燃性の蒸気又は可燃性の微粉が滞留するおそれのある建築物には、床面に側溝を設け、その蒸気又は微粉を屋外の低所に排出する設備を設けること。","危険物を取り扱うにあたって静電気が発生するおそれのある設備には、当該設備に蓄積される静電気を有効に除去する装置を設けること。"],"correct":[3],"explanation":"可燃性蒸気・微粉が滞留するおそれのある建築物には、床面に側溝を設けて「屋外の低所」ではなく「屋外の高所」に排出する設備が必要です。低所では蒸気が滞留する危険があります。よって選択肢4が誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-003","subject":"法令","category":"製造所の技術基準②正しいもの","difficulty":"2","type":"正しいものを選べ","question":"法令上、製造所の位置、構造及び設備の技術上の基準について、次のうち正しいものはどれか。ただし、特例基準が適用されるものを除く。","options":["危険物を取り扱う建築物は、地階を有することができる。","危険物を取り扱う建築物の延焼のおそれのある部分以外の窓にガラスを用いている場合は、網入りガラスにしないことができる。","指定数量の倍数が５以上の製造所には、周囲の状況によって安全上支障がない場合を除き、規則で定める避雷設備を設けなければならない。","危険物を取り扱う建築物の壁及び屋根は、耐火構造とするとともに、天井を設けなければならない。","電動機及び危険物を取り扱う設備のポンプ、弁、接手等は、火災の予防上支障のない位置に取り付けなければならない。"],"correct":[4],"explanation":"電動機及び危険物を取り扱う設備のポンプ・弁・接手等は「火災の予防上支障のない位置」に取り付けなければなりません（正しい）。製造所の建築物は地階を有してはなりません（選択肢1誤）。窓にガラスを使う場合は延焼のおそれのある部分に限らず網入りガラス（選択肢2誤）。避雷設備は倍数10以上（選択肢3誤）。屋根は不燃材料で天井は設けてはなりません（選択肢4誤）。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-004","subject":"法令","category":"配管の技術基準①","difficulty":"2","type":"定められていないものを選べ","question":"法令上、製造所の危険物を取り扱う配管について、位置、構造及び設備の技術上の基準に定められていないものは、次のうちどれか。","options":["配管は、その設置される条件及び使用される状況に照らして十分な強度を有するものとし、かつ、当該配管に係る最大常用圧力の1.5倍以上の圧力で水圧試験を行ったとき、漏えいその他の異常がないものでなければならない。","配管を地上に設置する場合には、地盤面に接しないようにするとともに、外面の腐食を防止するための塗装を行わなければならない。","配管は、取り扱う危険物により容易に劣化するおそれのないものでなければならない。","配管を地下に設置する場合には、その上部の地盤面を車両等が通行しない位置としなければならない。","地下の電気的腐食のおそれのある場所に設置する配管にあっては、外面の腐食を防止するための塗覆装またはコーティング及び電気防食を行わなければならない。"],"correct":[3],"explanation":"配管を地下に設置する場合に「車両等が通行しない位置」とする規定はありません。むしろ地下に設置する場合は適切な防護措置を行えば車両通行箇所でも可能です。よって選択肢4が定められていない事項です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-005","subject":"法令","category":"配管の技術基準②誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、製造所において危険物を取り扱う配管の位置、構造及び設備の基準として、次のうち誤っているものはどれか。","options":["配管を地下に設置する場合には、配管は接合部分のない構造とすること。","配管は、火災等による熱によって容易に変形するおそれのないものであること。ただし、当該配管が地下その他の火災等による熱により悪影響を受けるおそれのない場所に設置される場合にあっては、この限りでない。","配管は、その設置される条件及び使用される状況に照らして十分な強度を有するものであること。","配管には、外面の腐食を防止するための措置を講ずること。ただし、当該配管が設置される条件の下で腐食するおそれのないものである場合にあっては、この限りでない。","配管は、取り扱う危険物により容易に劣化するおそれのないものであること。"],"correct":[0],"explanation":"配管を地下に設置する場合に「接合部分のない構造」とする規定はありません。地下配管でも接合部分を設けることは可能で、ただし漏れ防止のための適切な措置が必要です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-006","subject":"法令","category":"屋内貯蔵所①誤り","difficulty":"2","type":"誤っているものを選べ","question":"引火点が70℃未満の第４類の危険物を貯蔵する屋内貯蔵所（独立平家建）の基準として、法令上、誤っているものは次のうちどれか。","options":["「屋内貯蔵所」と記載した標識と、「火気厳禁」と記載した注意事項の掲示板を、それぞれ見やすい箇所に掲げなければならない。","壁、柱及び床を耐火構造とし、はりを不燃材料で造ること。","窓、出入口にガラスを用いる場合は、網入りガラスとすること。","貯蔵倉庫には、採光、照明及び換気の設備を設けるとともに、滞留した可燃性蒸気を床下に排出する装置を設けること。","貯蔵倉庫の床は、危険物が浸透しない構造とするとともに、適当な傾斜をつけ、かつ、貯留設備を設けること。"],"correct":[3],"explanation":"可燃性蒸気は「床下」ではなく「屋外の高所（床面より高い位置の外部）」に排出する設備が必要です。床下に排出すると蒸気が床下に滞留し危険です。よって選択肢4が誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-007","subject":"法令","category":"屋内貯蔵所②誤り","difficulty":"2","type":"誤っているものを選べ","question":"指定数量の倍数が50を超えるガソリンを貯蔵する屋内貯蔵所（高層タイプを除く）の位置、構造及び設備の技術上の基準について、法令上、誤っているものは次のうちどれか。","options":["地盤面から軒までの高さが10m未満の平家建とし、床は地盤面より低くしなければならない。","壁、柱及び床を耐火構造とし、かつ、はりを不燃材料で造らなければならない。","架台を設ける場合には、不燃材料で造るとともに、堅固な基礎に固定しなければならない。","床は、危険物が浸透しない構造とし、適当な傾斜を付け、かつ、貯留設備を設けなければならない。","屋根を不燃材料で造るとともに、金属板等の軽量な不燃材料でふき、かつ、天井を設けてはならない。"],"correct":[0],"explanation":"屋内貯蔵所の床は「地盤面より低く」するのではなく「地盤面と同じかそれ以上の高さ」または適切な構造とします。床を地盤面より低くすると危険物が外部から流入する危険があります。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-008","subject":"法令","category":"防油堤①容量計算","difficulty":"1","type":"正しいものを選べ","question":"灯油、軽油を貯蔵している３基の屋外貯蔵タンクで、それぞれの容量が10,000L、30,000L、60,000Lのものを同一敷地内に隣接して設置する場合、この３基が共用する防油堤の最低限必要な容量として、法令上、正しいものは次のうちどれか。","options":["10,000L","30,000L","60,000L","66,000L","90,000L"],"correct":[3],"explanation":"防油堤の容量は「防油堤内の最大タンク容量の110%以上」が必要です。最大タンクは60,000Lなので60,000L×110%＝66,000Lが最低限必要な容量です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-009","subject":"法令","category":"防油堤②容量計算","difficulty":"2","type":"正しいものを選べ","question":"製造所等において次の４基の屋外貯蔵タンクを屋外の防油堤の一箇所にまとめて貯蔵する場合、法令上、必要最小限の容量は次のうちどれか。\n\n１号タンク：重油300kL　２号タンク：軽油500kL　３号タンク：ガソリン100kL　４号タンク：灯油200kL","options":["100kL","500kL","550kL","800kL","1,100kL"],"correct":[2],"explanation":"防油堤の容量は「防油堤内の最大タンク容量の110%以上」です。最大タンクは２号タンク（軽油500kL）なので、500kL×110%＝550kLが必要最小限の容量です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-010","subject":"法令","category":"防油堤③設置義務","difficulty":"1","type":"正しいものを選べ","question":"法令上、次の屋外貯蔵タンクのうち、防油堤を設けなければならないものはどれか。","options":["液体の危険物（二硫化炭素を除く）を貯蔵するすべての屋外タンク貯蔵所","第４類の危険物のみを貯蔵する屋外タンク貯蔵所","引火点を有する危険物のみを貯蔵する屋外タンク貯蔵所","第４類の危険物で、引火点の低い危険物のみを貯蔵する屋外タンク貯蔵所","引火点を有しない危険物のみを貯蔵する屋外タンク貯蔵所"],"correct":[0],"explanation":"防油堤は「液体の危険物（二硫化炭素を除く）を貯蔵する屋外タンク貯蔵所」に設けなければなりません。二硫化炭素は水没貯蔵のため除外されています。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-011","subject":"法令","category":"防油堤④基準の誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、液体の危険物（二硫化炭素を除く。）を貯蔵する屋外タンク貯蔵所の防油堤の基準について、次のうち誤っているものはどれか。","options":["防油堤の高さは、0.5m以上としなければならない。","防油堤は、鉄筋コンクリート又は土で造り、かつ、その中に収納された危険物が当該防油堤の外に流出しない構造としなければならない。","防油堤の容量は、当該タンク容量の100%以上とし、２以上の屋外貯蔵タンクの周囲に設ける防油堤の容量は、屋外貯蔵タンクの容量の合計の110%以上としなければならない。","防油堤には、その内部の滞水を外部に排出するための水抜口を設けなければならない。","高さが1mを超える防油堤には、おおむね30mごとに堤内に出入りするための階段を設置し、又は土砂の盛上げ等を行わなければならない。"],"correct":[2],"explanation":"選択肢3には2つの誤りがあります。①「100%以上」→正しくは「110%以上」。②「複数タンクは容量の合計の110%以上」→正しくは「最大タンク容量の110%以上」です。単独・複数どちらの場合も基準は「最大タンク容量の110%以上」です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-012","subject":"法令","category":"地下タンク貯蔵所①誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、地下タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["地下貯蔵タンク（二重殻タンクを除く。）又はその周囲には、当該タンクからの液体の危険物の漏れを検知する設備を設けなければならない。","地下貯蔵タンクは、外面にさびどめのための塗装をして、地盤面下に直接埋設しなければならない。","液体の危険物の地下貯蔵タンクの注入口は、屋外に設けなければならない。","地下貯蔵タンクには、通気管又は安全装置を設けなければならない。","地下タンク貯蔵所には、見やすい箇所に地下タンク貯蔵所である旨を表示した標識及び防火に関し、必要な事項を掲示した掲示板を設けなければならない。"],"correct":[1],"explanation":"地下貯蔵タンクは外面にさびどめ塗装をして地盤面下に直接埋設するのではなく、「タンク室に設けるか、地盤面下に直接埋設する場合は腐食防止措置を講じる」必要があります。直接埋設の場合は追加の防護措置が必要です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-013","subject":"法令","category":"地下タンク貯蔵所②誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、地下タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["地下タンク貯蔵所には規則で定めるところにより、見やすい箇所に地下タンク貯蔵所である旨を表示した標識及び防火に関し必要な事項を掲示した掲示板を設けなければならない。","地下貯蔵タンクには、規則で定めるところにより、通気管又は安全装置を設けなければならない。","液体の危険物の地下貯蔵タンクには、危険物の量を自動的に表示する装置を設けなければならない。","地下貯蔵タンクの配管は、当該タンクの頂部以外に取り付けなければならない。","液体の危険物の地下貯蔵タンクの注入口は、屋外に設けなければならない。"],"correct":[3],"explanation":"地下貯蔵タンクの配管は「頂部以外に取り付けてはならない」ではなく「頂部に取り付けなければならない」です。配管を頂部以外（側面や底部など）に設けると危険物が漏洩しやすくなります。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-014","subject":"法令","category":"地下タンク貯蔵所③誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、地下タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["地下貯蔵タンクの頂部は、0.6m以上地盤面から下にあること。","地下タンク貯蔵所には、見やすい箇所に地下タンク貯蔵所である旨を表示した標識及び防火に関し必要な事項を掲示した掲示板を設けること。","一の地下タンク貯蔵所に設置する地下貯蔵タンクは、その数を３以内とし、かつ、同一品質の危険物の地下貯蔵タンクを２以上設置しないこと。","液体の危険物の地下貯蔵タンクには、危険物の量を自動的に表示する装置を設けること。","地下貯蔵タンクには、通気管又は安全装置を設けること。"],"correct":[2],"explanation":"一の地下タンク貯蔵所に設置できるタンク数は「原則として１基」です。「３以内、同一品質は２以上不可」という規定は誤りです。地下タンク貯蔵所の原則は１施設１タンクです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-015","subject":"法令","category":"屋内タンク貯蔵所①正しいもの","difficulty":"1","type":"正しいものを選べ","question":"法令上、平家建としなければならない屋内タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち正しいものはどれか。","options":["タンク専用室の窓又は出入口にガラスを用いる場合は、網入りガラスにしなければならない。","屋内貯蔵タンクには、容量制限が定められていない。","屋内貯蔵タンクは建物内に設置されるため、タンクの外面にはさびどめのための塗装をしないことができる。","タンク専用室の出入口のしきいは、床面と段差が生じないように設けなければならない。","第２石油類の危険物を貯蔵するタンク専用室には、不燃材料で造った天井を設けることができる。"],"correct":[0],"explanation":"タンク専用室の窓・出入口にガラスを用いる場合は網入りガラスとしなければなりません（正しい）。屋内貯蔵タンクには容量制限あり（選択肢2誤）。外面にはさびどめ塗装が必要（選択肢3誤）。出入口のしきいは段差を設けなければならない（選択肢4誤）。天井は設けてはならない（選択肢5誤）。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-016","subject":"法令","category":"屋内タンク貯蔵所②誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、屋内タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。ただし、タンク専用室を平家建以外の建築物に設けるものを除く。","options":["液体の危険物の屋内貯蔵タンクには、危険物の量を自動的に表示する装置を設けなければならない。","引火点が40℃以上の第４類の危険物のみを貯蔵する場合、屋内貯蔵タンクの容量の上限は30,000Lである。","タンク専用室の壁との間及び同一のタンク専用室内に屋内貯蔵タンクを２以上設置する場合は、それらのタンクの相互間に0.5m以上の間隔を保つこと。","タンク専用室の窓または出入口にガラスを用いる場合は、網入りガラスとしなければならない。","タンク専用室は、屋根を不燃材料で造り、かつ、天井を設けないこと。"],"correct":[1],"explanation":"引火点40℃以上の第４類危険物のみを貯蔵する屋内貯蔵タンクの容量制限は「20,000L以下」です。30,000Lという数値は誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-017","subject":"法令","category":"タンクの容量制限","difficulty":"2","type":"正しいものを選べ","question":"法令上、危険物を貯蔵し、又は取り扱うタンクの容量制限について、次のうち正しいものはどれか。","options":["第２石油類を貯蔵する屋内タンク貯蔵所の屋内貯蔵タンクの容量制限は、20,000L以下である。","第３石油類を貯蔵する地下タンク貯蔵所の地下貯蔵タンクの容量制限は、50,000L以下である。","第２石油類を貯蔵する簡易タンク貯蔵所の簡易貯蔵タンクの容量制限は、1,000L以下である。","第１石油類を貯蔵する屋外タンク貯蔵所の屋外貯蔵タンクの容量制限は、10,000L以下である。","アルコール類を貯蔵する移動タンク貯蔵所の移動貯蔵タンクの容量制限は、6,000L以下である。"],"correct":[0],"explanation":"第２石油類を貯蔵する屋内タンク貯蔵所の容量上限は20,000Lです（正しい）。地下タンクに容量制限はない（選択肢2誤）。簡易タンクの容量制限は600L以下（選択肢3誤）。屋外貯蔵タンクの容量制限は種別ごとではなく規模による（選択肢4誤）。移動タンクは30,000L以下（選択肢5誤）。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-018","subject":"法令","category":"容量上限なしの施設","difficulty":"1","type":"上限が定められていないものを選べ","question":"法令上、貯蔵し、または取り扱う危険物の数量または指定数量の倍数に上限が定められていないものは、次のうちどれか。","options":["屋内タンク貯蔵所","地下タンク貯蔵所","簡易タンク貯蔵所","移動タンク貯蔵所","第一種販売取扱所"],"correct":[1],"explanation":"地下タンク貯蔵所の地下貯蔵タンクには容量の上限規定がありません。屋内タンク貯蔵所（種別に応じた上限）、簡易タンク貯蔵所（600L以下）、移動タンク貯蔵所（30,000L以下）、第一種販売取扱所（倍数15以下）にはそれぞれ上限があります。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-019","subject":"法令","category":"簡易タンク貯蔵所①誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、簡易タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["１つの簡易タンク貯蔵所には、同一品質の危険物の簡易貯蔵タンクを３基まで設けることができる。","屋外に簡易貯蔵タンクを設ける場合は、当該タンクの周囲に１m以上の幅の空地を保有しなければならない。","簡易貯蔵タンクの容量は、600L以下としなければならない。","簡易貯蔵タンクは、厚さ3.2mm以上の鋼板で気密に造るとともに、70kPaの圧力で10分間行う水圧試験において、漏れや変形がないものでなければならない。","簡易貯蔵タンクには、外面にさびどめの塗装をし、通気管を設けなければならない。"],"correct":[0],"explanation":"簡易タンク貯蔵所には同一品質の簡易貯蔵タンクを「２基以上設置してはならない」という規定があります。全体で３基まで設けられますが、同一品質は１基のみです。「３基まで」という記述自体は正しいですが、「同一品質を３基まで」は誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-020","subject":"法令","category":"簡易タンク貯蔵所②誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、簡易タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["簡易貯蔵タンクは、容易な移動を防ぐため、地盤面、架台等に固定するとともに、タンク専用室に設ける場合は、タンクと専用室の壁との間に0.5m以上の間隔を保たなければならない。","ひとつの簡易タンク貯蔵所に設置する簡易貯蔵タンクは、３基までとし、同一品質の危険物は２以上設置してはならない。","簡易貯蔵タンクは、さびを防ぐためその表面を塗装しなければならない。","簡易タンク貯蔵所は、簡易タンク貯蔵所である旨を表示した標識及び防火に関する必要な事項を掲示した掲示板を設置しなければならない。","第４類の危険物を貯蔵した簡易貯蔵タンクのうち、圧力タンク以外の屋外に設置した簡易貯蔵タンクには、通気管を設ける必要はない。"],"correct":[4],"explanation":"圧力タンク以外の屋外設置の簡易貯蔵タンクには通気管を設けなければなりません。「設ける必要はない」という記述が誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-021","subject":"法令","category":"貯蔵の技術基準","difficulty":"2","type":"誤っているものを選べ","question":"法令上、危険物の貯蔵の技術上の基準について、次のうち誤っているものはどれか。","options":["屋外貯蔵タンクに設けてある防油堤の水抜口は、通常は閉鎖しておかなければならない。","屋外貯蔵タンクの元弁は、危険物を入れ、又は出すとき以外は、閉鎖しておかなければならない。","地下貯蔵タンクの計量口は、計量するとき以外は閉鎖しておかなければならない。","簡易貯蔵タンクの通気管は、危険物を入れ、又は出すとき以外は閉鎖しておかなければならない。","移動貯蔵タンクの底弁は、使用時以外は閉鎖しておかなければならない。"],"correct":[3],"explanation":"簡易貯蔵タンクの通気管は「常時開放」しておかなければなりません。通気管を閉鎖すると内部圧力が変化してタンクが変形する危険があります。「危険物を入れ、又は出すとき以外は閉鎖」という記述が誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-022","subject":"法令","category":"移動タンク貯蔵所①誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、移動タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["第３種及び第４種の消火設備を移動貯蔵タンクに２個以上設けなければならない。","移動貯蔵タンクの底弁を閉鎖することができる手動閉鎖装置のレバーは、手前に引き倒すことにより閉鎖装置を作動させるものでなければならない。","移動貯蔵タンクの外面には、さびどめのための塗装をしなければならない。","静電気による災害が発生するおそれのある液体の危険物の移動貯蔵タンクには、接地導線を設けなければならない。","屋外の防火上安全な場所、または壁、床、はり及び屋根を耐火構造とし、若しくは不燃材料で造った建築物の１階に常置しなければならない。"],"correct":[0],"explanation":"移動タンク貯蔵所に設ける消火設備は「第４種（自動車用消火器等）及び第５種（小型消火器）の消火設備」を設けなければなりません。「第３種及び第４種」という記述が誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-023","subject":"法令","category":"移動タンク貯蔵所②誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、移動タンク貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。ただし、特例基準が適用されるものを除く。","options":["屋外の防火上安全な場所、または壁、床、はり及び屋根を耐火構造とし、もしくは不燃材料で造った建築物の１階に常置しなければならない。","移動貯蔵タンクの配管は、先端部に弁等を設けなければならない。","静電気による災害が発生するおそれのある液体の危険物の移動貯蔵タンクには、接地導線を設けなければならない。","移動貯蔵タンクの底弁手動閉鎖装置のレバーは、手前に引き倒すことにより閉鎖装置を作動させるものでなければならない。","移動貯蔵タンクの容量は、10,000L以下としなければならない。"],"correct":[4],"explanation":"移動貯蔵タンクの容量制限は「30,000L以下」です。10,000Lという数値は誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-024","subject":"法令","category":"移動タンク貯蔵所③備付書類","difficulty":"1","type":"正しいものを選べ","question":"法令上、移動タンク貯蔵所に備え付けておかなければならない書類は、次のＡ〜Ｅのうちいくつあるか。\n\nＡ．完成検査済証　Ｂ．予防規程　Ｃ．製造所等の譲渡引渡届出書　Ｄ．危険物施設保安員選任・解任届出書　Ｅ．貯蔵する危険物の品名、数量又は指定数量の倍数変更の届出書","options":["１つ","２つ","３つ","４つ","５つ"],"correct":[0],"explanation":"移動タンク貯蔵所に備え付けが必要な書類は「完成検査済証」のみです（Ａのみ）。予防規程は移動タンク貯蔵所には不要、その他の書類も備え付け義務はありません。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-025","subject":"法令","category":"移動タンク貯蔵所④移送基準","difficulty":"2","type":"正しいものを選べ","question":"法令上、移動タンク貯蔵所による危険物の移送、貯蔵及び取扱いの基準について、次のうち正しいものはどれか。","options":["移動貯蔵タンクから重油を容器に詰め替えてはならない。","定期的に危険物を移送する場合は、移送経路その他必要な事項を事前に、経路を管轄する消防署に届け出なければならない。","すべての移動貯蔵タンクには、接地導線を設けなければならない。","移動貯蔵タンクの底弁その他の弁、マンホール及び注入口のふた、消火器等の点検は、移送の終了後に行わなければならない。","移動タンク貯蔵所には完成検査済証及び定期点検記録等を備え付けておかなければならない。"],"correct":[4],"explanation":"移動タンク貯蔵所には「完成検査済証」及び「定期点検記録等」を備え付けておかなければなりません（正しい）。重油は容器への詰め替え可（選択肢1誤）。移送前の届出は不要（選択肢2誤）。接地導線は静電気のおそれのある液体危険物タンクのみ（選択肢3誤）。点検は移送開始前（選択肢4誤）。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-026","subject":"法令","category":"移動タンク貯蔵所⑤引火点温度","difficulty":"2","type":"当てはまるものを選べ","question":"危険物の取扱いの技術上の基準について、次の文の（　）内に当てはまる法令に定められている温度はどれか。\n\n「移動貯蔵タンクから危険物を貯蔵し、又は取り扱うタンクに引火点が（　）の危険物を注入するときは、移動タンク貯蔵所の原動機を停止させること。」","options":["30℃未満","35℃未満","40℃未満","45℃未満","50℃未満"],"correct":[2],"explanation":"引火点が「40℃未満」の危険物を注入するときは移動タンク貯蔵所の原動機を停止させなければなりません。これは法令で定められた基準です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-027","subject":"法令","category":"移動タンク貯蔵所⑥移送規制","difficulty":"2","type":"誤っているものを選べ","question":"法令上、移動タンク貯蔵所によるガソリンの移送、貯蔵及び取扱いについて、次のうち誤っているものはどれか。","options":["移動貯蔵タンクから危険物を貯蔵し、又は取り扱うタンクに危険物を注入するときは、注入ホースを注入口に緊結すること。","移動貯蔵タンクから直接容器に詰め替えてはならない。","移動貯蔵タンクから、危険物を貯蔵し、又は取り扱うタンクに注入するときは、移動タンク貯蔵所の原動機を停止しなければならない。","移動貯蔵タンクにその上部から注入する場合、注入管を用いるとともに、当該注入管の先端を移動貯蔵タンクの上部のマンホールに固定しなければならない。","静電気による災害が発生するおそれのある液体の危険物を移動貯蔵タンクに入れ、又は移動貯蔵タンクから出すときは、当該移動貯蔵タンクを接地しなければならない。"],"correct":[3],"explanation":"選択肢4「移動貯蔵タンクにその上部から注入する場合、注入管の先端をマンホールに固定しなければならない」が誤りです。上部から注入する場合、注入管の先端はマンホールではなく「タンクの底部付近まで延ばして底部近くから注入する」ことが求められます（静電気による引火防止）。選択肢3（引火点40℃未満の危険物注入時に原動機停止）は正しい記述です。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-028","subject":"法令","category":"移送時の免状携帯義務","difficulty":"1","type":"携帯義務があるものを選べ","question":"法令上、危険物取扱者がその免状に指定された危険物の取扱作業に従事している場合、免状の携帯が義務付けられているものは、次のうちどれか。","options":["製造所等で、危険物取扱者でない者の危険物の取扱いに立ち会っている場合","指定数量以上の危険物を車両で運搬している場合","製造所等で、定期点検の実施又は立会いをしている場合","危険物保安監督者として選任され、製造所等で危険物を取り扱っている場合","危険物の移送のため、移動タンク貯蔵所に乗車している場合"],"correct":[4],"explanation":"危険物取扱者の免状携帯が義務付けられているのは「危険物の移送のため移動タンク貯蔵所に乗車しているとき」のみです。他の作業（立会い、点検、通常の取扱い等）では携帯義務はありません。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-029","subject":"法令","category":"移動タンク移送の正しいもの","difficulty":"2","type":"正しいものを選べ","question":"法令上、危険物の移送について、次のうち正しいものはどれか。","options":["危険物を移送するために移動タンク貯蔵所に乗車している危険物取扱者の免状は、当該移動タンク貯蔵所の常置場所に保管しておかなければならない。","移動タンク貯蔵所で危険物を移送する者は、移動貯蔵タンクの底弁その他の弁、マンホール及び注入口のふた、消火器等の点検を１か月に１回以上行わなければならない。","消防吏員又は警察官は、火災の防止のため特に必要と認める場合、走行する移動タンク貯蔵所を停止させることができる。","移動タンク貯蔵所を休憩等のため一時停止させるときは、最寄りの消防署に通報しなければならない。","移動タンク貯蔵所で危険物を移送する者は、10日前までにその計画を所轄消防署長に届け出なければならない。"],"correct":[2],"explanation":"消防吏員又は警察官は、火災の防止のため特に必要と認める場合、走行する移動タンク貯蔵所を停止させ、乗車している危険物取扱者に対し免状の提示を求めることができます（正しい）。免状は乗車中に携帯（選択肢1誤）。点検は移送開始前（選択肢2誤）。一時停止の通報義務なし（選択肢4誤）。届出義務なし（選択肢5誤）。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"法令-law4-030","subject":"法令","category":"屋外貯蔵所①誤り","difficulty":"2","type":"誤っているものを選べ","question":"法令上、第４類の危険物のうちアルコール類のみを貯蔵し、又は取り扱う屋外貯蔵所の位置、構造及び設備の技術上の基準について、次のうち誤っているものはどれか。","options":["架台を設ける場合は、不燃材料で造るとともに、堅固な地盤面に固定すること。","屋外貯蔵所は、湿潤でなく、かつ、排水のよい場所に設置すること。","架台は、架台及びその附属設備の自重、貯蔵する危険物の重量、風荷重、地震の影響等の荷重によって生じる応力に対して安全なものであること。","屋外貯蔵所の柵等の周囲には、指定数量の倍数にかかわらず、２mの幅の空地（保安空地）を保有すること。","架台には、危険物を収納した容器が容易に落下しない措置を講ずること。"],"correct":[0],"explanation":"架台を設ける場合の固定先は「堅固な地盤面」ではなく「堅固な基礎」です。地盤面に固定するという記述が誤りです。","source":"法令4.pdf p.2以降（既存HTMLデータと照合）","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-001","subject":"物理・化学","category":"動植物油類","difficulty":"3","type":"妥当でないものを選べ","question":"動植物油類について、次のうち妥当でないものはどれか。","options":["引火点以上に熱すると、火花等による引火の危険性を生じる。","乾性油は、ぼろ布等に染み込ませ積み重ねておくと自然発火することがある。","水に溶けない。","容器の中で燃焼しているものに注水すると、燃えている油が飛散する。","引火点は、300℃程度である。"],"correct":[4],"explanation":"動植物油類は、1気圧において引火点が250℃未満の動植物由来の油類（総務省令で定めるところにより貯蔵保管されているものを除く）です。したがって「引火点は300℃程度」は妥当ではありません。乾性油の自然発火、水への不溶性、燃焼中の油への注水で飛散する危険についての記述は適切です。","source":"物理化学1 / 危険物の性質・消火","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-002","subject":"物理・化学","category":"有機物の燃焼","difficulty":"2","type":"誤っているものを選べ","question":"有機物の燃焼に関する一般的な説明として、次のうち誤っているものはどれか。","options":["蒸発または分解して生成する気体が炎をあげて燃えるものが多い。","燃焼に伴う明るい炎は、主として高温の炭素粒子が光っているものである。","空気の量が不足すると、すすの出る量が多くなる。","分子中の炭素数が多い物質ほど、すすの出る量が多くなる。","不完全燃焼すると、二酸化炭素の発生量が多くなる。"],"correct":[4],"explanation":"不完全燃焼すると二酸化炭素ではなく「一酸化炭素（CO）」の発生量が多くなります。完全燃焼の場合はCO₂が生成されますが、不完全燃焼ではCOやすすが生成されます。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-003","subject":"物理・化学","category":"燃焼の三要素","difficulty":"1","type":"正しいものを選べ","question":"次のうち、燃焼の三要素がそろっている組合せとして、正しいものはどれか。","options":["ナトリウム　水素　炎","過酸化水素　酸素　反応熱","アマニ油　酸素　酸化熱","硝酸銀　空気　紫外線","ガソリン　窒素　電気火花"],"correct":[2],"explanation":"燃焼の三要素は「可燃物・酸素供給源・点火源」です。アマニ油（可燃物）・酸素（酸素供給源）・酸化熱（点火源となる熱）の組み合わせが正しいです。炎は三要素ではなく燃焼の結果です。窒素は支燃性がありません。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-004","subject":"物理・化学","category":"可燃物・酸素供給源","difficulty":"2","type":"該当しないものを選べ","question":"燃焼の三要素の可燃物または酸素供給源に該当しないものは、次のうちどれか。","options":["過酸化水素","窒素","水素","メタン","一酸化炭素"],"correct":[1],"explanation":"窒素（N₂）は不活性気体で、可燃物でも酸素供給源でもありません。過酸化水素は酸素を放出する酸素供給源。水素・メタン・一酸化炭素は可燃性気体（可燃物）です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-005","subject":"物理・化学","category":"20℃・1気圧で燃焼するもの","difficulty":"2","type":"正しいものを選べ","question":"次の物質のうち、20℃、１気圧の空気中で燃焼するものはどれか。","options":["ヘリウム","硫化水素","二酸化炭素","三酸化硫黄","五酸化リン"],"correct":[1],"explanation":"硫化水素（H₂S）は可燃性気体で、空気中で燃焼します。ヘリウムは希ガス（不燃）。二酸化炭素・三酸化硫黄・五酸化リンはすでに酸化されており燃焼しません。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-006","subject":"物理・化学","category":"炎色反応","difficulty":"2","type":"誤っているものを選べ","question":"炎色反応の組合せとして、次のうち誤っているものはどれか。","options":["リチウム……赤色","ナトリウム……青紫色","カリウム……赤紫色","バリウム……黄緑色","銅……青緑色"],"correct":[1],"explanation":"ナトリウムの炎色反応は「黄色（橙黄色）」です。青紫色はカリウムの炎色反応です。炎色反応の覚え方：リチウム→赤、ナトリウム→黄、カリウム→紫（赤紫）、バリウム→黄緑、銅→青緑。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-007","subject":"物理・化学","category":"燃焼の形態①誤り","difficulty":"2","type":"誤っているものを選べ","question":"燃焼について、次のうち誤っているものはどれか。","options":["メタンが燃焼して完全に二酸化炭素と水になることを完全燃焼という。","ニトロセルロースのように、分子内に酸素を含有し、その酸素が燃焼に使われることを内部（自己）燃焼という。","ガソリンは、液体のまま空気と接触している表面が燃焼する。これを表面燃焼という。","木材のように、熱分解生成ガスがまず燃焼することを分解燃焼という。","灯油のように、発生した蒸気が燃焼することを蒸発燃焼という。"],"correct":[2],"explanation":"ガソリンは液面から蒸発した可燃性蒸気が燃焼する「蒸発燃焼」です。表面燃焼は固体表面がそのまま燃焼するもので、木炭・コークス・金属粉などが該当します。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-008","subject":"物理・化学","category":"燃焼の形態②分解燃焼と表面燃焼","difficulty":"2","type":"正しいものを選べ","question":"次の文の（　）内のＡ及びＢに当てはまる物質の燃焼の仕方として、正しいものはどれか。\n\n「木材、紙などの可燃性固体が加熱されて、このとき発生する可燃性ガスが燃焼することを（Ａ）といい、木炭、コークスなどの可燃性固体が加熱されて、赤熱しながら燃焼することを（Ｂ）という。」","options":["Ａ：蒸発燃焼　　Ｂ：表面燃焼","Ａ：表面燃焼　　Ｂ：分解燃焼","Ａ：分解燃焼　　Ｂ：表面燃焼","Ａ：分解燃焼　　Ｂ：蒸発燃焼","Ａ：表面燃焼　　Ｂ：蒸発燃焼"],"correct":[2],"explanation":"木材・紙などが加熱されて発生した可燃性ガスが燃焼するのは「分解燃焼（Ａ）」。木炭・コークスが赤熱しながら燃焼するのは「表面燃焼（Ｂ）」です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-009","subject":"物理・化学","category":"燃焼の形態③物質と燃焼形態","difficulty":"1","type":"誤っているものを選べ","question":"次に掲げる物質と主な燃焼の形態の組合せとして、誤っているものはどれか。","options":["石炭→分解燃焼","エタノール→蒸発燃焼","灯油→蒸発燃焼","重油→表面燃焼","硫黄→蒸発燃焼"],"correct":[3],"explanation":"重油は第４類危険物（第３石油類）で、燃焼形態は「蒸発燃焼」です。第４類危険物はすべて蒸発燃焼です。「表面燃焼」という記述が誤りです。表面燃焼は木炭・コークス・金属粉など固体が直接赤熱しながら燃焼するものです。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-010","subject":"物理・化学","category":"燃焼の形態④表面燃焼の物質","difficulty":"1","type":"正しいものを選べ","question":"次の物質のうち、主な燃焼の方法が表面燃焼であるものはどれか。","options":["プロパンガス","木炭","固形アルコール","木材","ニトロセルロース"],"correct":[1],"explanation":"表面燃焼は固体表面がそのまま赤熱しながら燃焼する形態で、木炭・コークス・金属粉などが該当します。プロパンガスは拡散燃焼、固形アルコール・硫黄は蒸発燃焼、木材は分解燃焼、ニトロセルロースは内部（自己）燃焼です。","source":"物理化学1 / 基礎化学①","render":"text","verified":"audited-2026-08-13"},{"id":"物理・化学-pc-011","subject":"物理・化学","category":"燃焼の形態⑤蒸発燃焼の物質","difficulty":"1","type":"正しいものを選べ","question":"主な燃焼の仕方が蒸発燃焼に該当するものは、次のうちどれか。","options":["アルミニウム箔","石炭","木炭","ニトロセルロース","硫黄"],"correct":[4],"explanation":"硫黄は加熱すると蒸発し、その蒸気が燃焼する「蒸発燃焼」です。アルミニウム箔は表面燃焼、石炭は分解燃焼、木炭は表面燃焼、ニトロセルロースは内
